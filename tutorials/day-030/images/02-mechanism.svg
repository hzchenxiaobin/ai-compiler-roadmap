<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">删除的移位术与混读的冲刷术</text>
    <path d="M 320,58 Q 480,52 640,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,300 Q 470,294 44,299 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 200)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">删除王五：移位覆盖三步走（实测）</text>
    <rect x="90" y="150" width="160" height="44" fill="#fffdf7" stroke="#5b8db8" stroke-width="2"/>
    <text x="170" y="176" text-anchor="middle" font-size="10.5" fill="#3b3a36">[0] 张三</text>
    <rect x="254" y="150" width="160" height="44" fill="#fffdf7" stroke="#5b8db8" stroke-width="2"/>
    <text x="334" y="176" text-anchor="middle" font-size="10.5" fill="#3b3a36">[1] 李四</text>
    <rect x="418" y="150" width="160" height="44" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.4" transform="rotate(-1.5 498 172)"/>
    <text x="498" y="176" text-anchor="middle" font-size="10.5" fill="#a33f2e">[2] 王五（删除）</text>
    <rect x="582" y="150" width="120" height="44" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="642" y="176" text-anchor="middle" font-size="10" fill="#8a8578">[3] 空位</text>
    <path d="M 500,202 Q 470,220 350,222" fill="none" stroke="#c96a5a" stroke-width="2.2" stroke-dasharray="7 5"/>
    <path d="M 358,216 Q 348,222 358,230" fill="none" stroke="#c96a5a" stroke-width="2.2"/>
    <text x="470" y="242" text-anchor="middle" font-size="12" fill="#a33f2e">没有后卡可移（王五是最后一张）→ 直接 count 3→2</text>
    <text x="70" y="272" font-size="12.5" fill="#3b3a36">通用规则：删 [i] → [i+1..count-1] 各前移一格 → count--；删除中间人时后面排队前移（图示末位最简单）</text>

    <path d="M 40,324 Q 470,318 905,325 L 901,460 Q 470,454 44,459 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.2 472 392)"/>
    <text x="472" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">菜单数字与整行名字的混读</text>
    <rect x="90" y="370" width="800" height="72" fill="#33413a"/>
    <text x="106" y="394" font-size="11.5" fill="#9fb8a8">cin &gt;&gt; choice;　　　　　　　　// 吃掉 1，换行符留在带上</text>
    <text x="106" y="414" font-size="11.5" fill="#f0c9c0">cin.ignore(10000, '\n');　　　// 冲掉换行（漏了这行，getline 拿到空名！）</text>
    <text x="106" y="434" font-size="11.5" fill="#cfe8c6">getline(cin, name);　　　　　　// 现在拿到真正的整行</text>

    <path d="M 40,484 Q 470,478 905,485 L 901,576 Q 470,570 44,575 Z" fill="#fdf6dd" stroke="#d9b23a" stroke-width="2.8" transform="rotate(-0.2 472 530)"/>
    <text x="472" y="514" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d1a">count 的三条军规</text>
    <text x="70" y="546" font-size="13" fill="#3b3a36">①新增先检查 count &lt; 100　　②删除后立刻 --　　③一切遍历只走 [0, count)</text>
    <text x="70" y="570" font-size="12.5" fill="#6b675e">（定长数组的"有效长度"全靠它维护——第 14 周 vector 把 count 也包进容器里）</text>
  </g>
</svg>
