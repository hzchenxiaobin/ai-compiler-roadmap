<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 30 项目日：通讯录 v1 总装图</text>
    <path d="M 330,60 Q 480,52 630,61" fill="none" stroke="#e0955f" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">第 5 周收官：卡片（Day 29）+ 定长数组（Day 13）+ 多文件（Day 25）+ 菜单循环（Day 8）——增删改查一次装齐</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,240 520,364 Q 280,370 42,364 Q 36,240 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 240)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">数据区：一叠卡片</text>
    <rect x="80" y="164" width="180" height="52" fill="#fffdf7" stroke="#9db8cf" stroke-width="2"/>
    <text x="170" y="186" text-anchor="middle" font-size="10.5" fill="#3b3a36">张三 | 138…001</text>
    <text x="170" y="203" text-anchor="middle" font-size="10" fill="#8a8578">contacts[0]</text>
    <rect x="264" y="164" width="180" height="52" fill="#fffdf7" stroke="#9db8cf" stroke-width="2"/>
    <text x="354" y="186" text-anchor="middle" font-size="10.5" fill="#3b3a36">李四 | 138…002</text>
    <text x="354" y="203" text-anchor="middle" font-size="10" fill="#8a8578">contacts[1]</text>
    <rect x="80" y="220" width="180" height="52" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="170" y="250" text-anchor="middle" font-size="10" fill="#8a8578">空位（到 100 张）</text>
    <text x="280" y="296" text-anchor="middle" font-size="12.5" fill="#45703a">count = 2：有效卡数（长随行计数）</text>
    <text x="280" y="322" text-anchor="middle" font-size="12.5" fill="#6b675e">容量 MAX_CONTACTS=100 定死；</text>
    <text x="280" y="344" text-anchor="middle" font-size="12.5" fill="#6b8578">增删改查全部只动前 count 张</text>

    <path d="M 550,116 Q 730,110 905,116 Q 908,240 905,364 Q 730,370 552,364 Q 547,240 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 240)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">代码区：三文件分工</text>
    <text x="572" y="178" font-size="12.5" fill="#3b3a36">contact.h：Contact 卡片 + 五项操作名片</text>
    <text x="572" y="204" font-size="12.5" fill="#3b3a36">contact.cpp：增删改查列表的机器</text>
    <text x="572" y="230" font-size="12.5" fill="#3b3a36">main.cpp：菜单循环调度（enum 选项）</text>
    <text x="572" y="264" font-size="12.5" fill="#45703a">编译：g++ -Wall main.cpp contact.cpp</text>
    <text x="572" y="290" font-size="12.5" fill="#6b675e">（漏一个文件就 Undefined——Day 27 套路备用）</text>
    <text x="572" y="326" font-size="12.5" fill="#6b675e">菜单选项用 enum（Exit/Add/Remove…）</text>
    <text x="572" y="348" font-size="12.5" fill="#6b675e">switch 分发零魔法数字</text>

    <path d="M 40,388 Q 470,382 905,389 L 901,476 Q 470,470 44,475 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 429)"/>
    <text x="472" y="416" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">今天的两个技术看点</text>
    <text x="70" y="442" font-size="13" fill="#3b3a36">①删除 = 移位覆盖：后面卡片整体前移一格，count 减一（定长数组的经典操作）</text>
    <text x="70" y="462" font-size="13" fill="#3b3a36">②数字与整行混读：&gt;&gt; 读菜单后 ignore 冲换行，getline 才读得到名字（Day 17 的坑实战版）</text>

    <path d="M 60,494 Q 480,488 905,495" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="494" r="5" fill="#8a94a3"/>
    <text x="250" y="514" text-anchor="middle" font-size="12" fill="#3b3a36">Day 25~29 ✓</text>
    <circle cx="440" cy="494" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="494" r="5" fill="#5b8db8"/>
    <text x="440" y="514" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 30（今天）</text>
    <circle cx="640" cy="494" r="5" fill="#5b8db8"/>
    <text x="640" y="514" text-anchor="middle" font-size="12" fill="#3b3a36">第 6 周 文件 I/O</text>
    <circle cx="820" cy="494" r="5" fill="#e0955f"/>
    <text x="820" y="514" text-anchor="middle" font-size="12" fill="#3b3a36">Day 36 里程碑</text>

    <rect x="140" y="524" width="680" height="26" fill="#f7e8a0" opacity="0.5" transform="rotate(-0.3 480 537)"/>
    <text x="480" y="542" text-anchor="middle" font-size="13" fill="#8a6d1a">里程碑预告：Day 31 学文件 I/O，Day 32 通讯录 v2 就能把数据存盘——今天的版本身故后数据即散</text>
  </g>
</svg>
