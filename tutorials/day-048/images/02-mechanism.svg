<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">扫描器的分诊流程与五维白板的证据链</text>
    <path d="M 250,58 Q 480,52 710,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,330 Q 470,324 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 215)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">scan_all.sh 的四步分诊</text>
    <rect x="90" y="146" width="180" height="60" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="180" y="170" text-anchor="middle" font-size="10.5" fill="#45703a">①-Wall 编译</text>
    <text x="180" y="188" text-anchor="middle" font-size="9.5" fill="#8a8578">（警告=分诊起点）</text>
    <rect x="300" y="146" width="180" height="60" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="390" y="170" text-anchor="middle" font-size="10.5" fill="#9c5a22">②教学白名单？</text>
    <text x="390" y="188" text-anchor="middle" font-size="9.5" fill="#8a8578">（18 个教学预期与跳过）</text>
    <rect x="510" y="146" width="180" height="60" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2"/>
    <text x="600" y="170" text-anchor="middle" font-size="10.5" fill="#a33f2e">③多文件项目？</text>
    <text x="600" y="188" text-anchor="middle" font-size="9.5" fill="#8a8578">（22 个需联合编译）</text>
    <rect x="720" y="146" width="150" height="60" fill="#eef5e8" stroke="#7aa663" stroke-width="2"/>
    <text x="795" y="170" text-anchor="middle" font-size="10.5" fill="#45703a">④ASan 运行</text>
    <text x="795" y="188" text-anchor="middle" font-size="9.5" fill="#8a8578">（stdin 饿死交互）</text>
    <text x="472" y="238" text-anchor="middle" font-size="12.5" fill="#3b3a36">分诊价值：把"报错"分成三类——真问题（要修）、教学预期（内容本身）、</text>
    <text x="472" y="262" text-anchor="middle" font-size="12.5" fill="#3b3a36">多文件局限（换联合编译复验）——不做一刀切的"全绿"假账</text>
    <text x="472" y="298" text-anchor="middle" font-size="12" fill="#8a8578">（实测抓到 day-074 未用变量——修了；多文件抽样联合编译通过——复验了）</text>

    <path d="M 40,354 Q 280,348 520,354 Q 524,470 520,576 Q 280,582 42,576 Q 36,470 40,354 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 465)"/>
    <text x="280" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">五维白板的程序化证据</text>
    <text x="64" y="418" font-size="12" fill="#3b3a36">申请/回收：栈变量声明即现、出块即没（实测地址）；</text>
    <text x="64" y="440" font-size="12" fill="#3b3a36">　堆 new 才有、delete 才还</text>
    <text x="64" y="470" font-size="12" fill="#3b3a36">大小：vector 100 万元素（4MB）在堆——栈放不下</text>
    <text x="64" y="500" font-size="12" fill="#3b3a36">生命期：栈地址返回后悬空（教学 pragma 演示）；</text>
    <text x="64" y="522" font-size="12" fill="#3b3a36">　堆指针跨块存活等 delete</text>
    <text x="64" y="552" font-size="11.5" fill="#8a8578">（每个维度都是本周某天的课——白板=复述证据链）</text>

    <path d="M 550,354 Q 730,348 905,354 Q 908,470 905,576 Q 730,582 552,576 Q 547,470 550,354 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 465)"/>
    <text x="727" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">阶段二的技能清单</text>
    <text x="572" y="418" font-size="12" fill="#3b3a36">第 7 周：布局/new-delete/ASan/</text>
    <text x="572" y="438" font-size="12" fill="#3b3a36">　二维数组/深浅拷贝/动态数组 v1</text>
    <text x="572" y="468" font-size="12" fill="#3b3a36">第 8 周：string/view/对齐字节序/</text>
    <text x="572" y="488" font-size="12" fill="#3b3a36">　错误四案/auto 范围 for/v2/自测</text>
    <text x="572" y="520" font-size="12" fill="#45703a">阶段成果：手写 vector 级的容器 +</text>
    <text x="572" y="540" font-size="12" fill="#45703a">　四案全绿的代码资产</text>
    <text x="572" y="566" font-size="11.5" fill="#8a8578">（明天进阶段三：面向对象）</text>
  </g>
</svg>
