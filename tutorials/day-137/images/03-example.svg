    <path d="M 24,516 Q 470,510 905 517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">全绿的心情</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">28 行 [ OK ] 刷过——十天的解析器在一分钟内被反复审了 28 遍；这份"任何时刻可重验"的确定性，就是测试给开发者的礼物</text>

