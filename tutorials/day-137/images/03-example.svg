    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./jt　（c++20 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== ParseTest ×12 ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c8">EmptyObject/EmptyArray/null ✔</text>
    <text x="54" y="242" font-size="11.5" fill="#cfe8c8">数字四态（int/neg/sci/frac）✔</text>
    <text x="54" y="262" font-size="11.5" fill="#f0c9c0">DeepNesting 7 层 ✔</text>
    <text x="54" y="282" font-size="11.5" fill="#cfe8c8">MultiLine/Whitespace ✔</text>
    <text x="54" y="308" font-size="12" fill="#9fb8a8">== ParseErrorTest ×4 ==</text>
    <text x="54" y="330" font-size="11.5" fill="#cfe8c8">空串→"空输入" ✔</text>
    <text x="54" y="350" font-size="11.5" fill="#cfe8c8">@→"意外字符 '@'" ✔ 等</text>
    <text x="54" y="374" font-size="12" fill="#9fb8a8">== DumpTest ×4 ==</text>
    <text x="54" y="396" font-size="11.5" fill="#cfe8c8">RoundTrip/键序/转义/幂等 ✔</text>
    <text x="54" y="420" font-size="12" fill="#9fb8a8">== AccessTest×6 + Unicode×2 ==</text>
    <text x="54" y="442" font-size="11.5" fill="#cfe8c8">下钻/下标/size/两抛 ✔</text>
    <text x="54" y="462" font-size="11.5" fill="#cfe8c8">码点 "A"/CJK 3 字节 ✔</text>

