<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 102 里程碑：阶段四毕业考——脱稿重写 + 白板讲差异</text>
    <path d="M 230,60 Q 480,52 730,61" fill="none" stroke="#c96a5a" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定两题：从零重写 LRU 缓存（不看 Day 89）+ 讲清 map 与 unordered_map 底层差异——阶段四（STL 与泛型）的毕业礼</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">题一：脱稿重写 LRU</text>
    <text x="64" y="180" font-size="12.5" fill="#45703a">骨架四句话（面试答案）：</text>
    <text x="64" y="208" font-size="12" fill="#3b3a36">　list 管序（头=最近）+ map 管查</text>
    <text x="64" y="228" font-size="12" fill="#3b3a36">　　（值是链表迭代器）</text>
    <text x="64" y="256" font-size="12" fill="#3b3a36">　get：find → splice 移头 → 返回</text>
    <text x="64" y="278" font-size="12" fill="#3b3a36">　put：已有则更新；满则删尾</text>
    <text x="64" y="298" font-size="12" fill="#3b3a36">　　（两处同步删！）+ 新项进头</text>
    <text x="64" y="332" font-size="12.5" fill="#45703a">实测（容量 3）六步全对 ✔</text>
    <text x="64" y="356" font-size="11.5" fill="#8a8578">（get(1) 命中移头/put(4) 淘汰 2/</text>
    <text x="64" y="376" font-size="11.5" fill="#8a8578">　get(2)=-1/更新不占名额）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">题二：底层差异四层讲稿</text>
    <text x="572" y="180" font-size="12" fill="#3b3a36">结构层：红黑树 vs 哈希桶数组</text>
    <text x="572" y="202" font-size="11.5" fill="#8a8578">（sizeof：24 vs 40 实测）</text>
    <text x="572" y="230" font-size="12" fill="#3b3a36">序层：中序=字典序 vs 桶位无语义</text>
    <text x="572" y="252" font-size="11.5" fill="#8a8578">（实测对照遍历）</text>
    <text x="572" y="280" font-size="12" fill="#3b3a36">复杂度层：O(log n) vs 平均 O(1)</text>
    <text x="572" y="308" font-size="12" fill="#3b3a36">选型层：要序 map / 要快 um</text>
    <text x="572" y="330" font-size="11.5" fill="#8a8578">（自定义 key：&lt; vs hash+equal）</text>
    <text x="572" y="360" font-size="11.5" fill="#8a8578">（四层都有机器证据——白板讲稿）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">诚实注脚：桶序的巧合</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">本次 um 遍历碰巧打出 apple banana cherry（像字典序）——但这是桶位的巧合不是保证！换数据/编译器就变（Day 86 实测过反向例子）</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（看到"像有序"别被骗——语义层面 unordered 就是无序）</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#c96a5a"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 102（阶段四毕业）</text>
    <circle cx="690" cy="514" r="5" fill="#5b8db8"/>
    <text x="690" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">第 18 周 现代特性</text>
    <circle cx="870" cy="514" r="5" fill="#e0955f"/>
    <text x="870" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">JSON 项目</text>
  </g>
</svg>
