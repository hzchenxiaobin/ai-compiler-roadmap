<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">双题战报与阶段四毕业档案</text>
    <path d="M 380,58 Q 480,52 580,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21 -std=c++17；-Wall 零警告 + ASan 零报错）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,490 Q 248,495 26,490 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 296)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出（节选）</text>
    <rect x="38" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./ms　（-Wall 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== 题一：脱稿 LRU ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c6">put(1,2,3)：[3 2 1]</text>
    <text x="54" y="242" font-size="11.5" fill="#cfe8c8">get(1)=100 → [1 3 2]</text>
    <text x="54" y="262" font-size="11.5" fill="#f0c9c0">put(4) 淘汰 2 → [4 1 3]</text>
    <text x="54" y="282" font-size="11.5" fill="#cfe8c6">get(2)=-1；get(4)=400 ✔</text>
    <text x="54" y="302" font-size="11.5" fill="#cfe8c8">put(1,111) → get(1)=111</text>
    <text x="54" y="322" font-size="11.5" fill="#cfe8c6">　[1 4 3]（更新不占名额）✔</text>
    <text x="54" y="352" font-size="12" fill="#9fb8a8">== 题二：底层差异 ==</text>
    <text x="54" y="374" font-size="11.5" fill="#cfe8c6">sizeof：map 24 vs um 40</text>
    <text x="54" y="394" font-size="11.5" fill="#cfe8c6">map 序：字典序 ✔</text>
    <text x="54" y="414" font-size="11.5" fill="#f0c9c0">um 序：碰巧像序（无保证！）</text>
    <text x="54" y="440" font-size="11.5" fill="#cfe8c6">复杂度/选型层：白板讲稿 ✔</text>
    <text x="54" y="466" font-size="11" fill="#9fb8a8">（ASan 零报错）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,490 Q 712,495 490,490 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 296)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">阶段四毕业档案（Day 79~102）</text>
    <rect x="502" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">第 14 周：顺序容器</text>
    <text x="514" y="196" font-size="11.5" fill="#cfe8c6">vector 曲线/迭代器/失效/五容器/适配器</text>
    <text x="514" y="224" font-size="12" fill="#9fb8a8">第 15 周：关联容器</text>
    <text x="514" y="246" font-size="11.5" fill="#cfe8c6">map/unordered/multimap/迭代器分类/LRU</text>
    <text x="514" y="274" font-size="12" fill="#9fb8a8">第 16 周：算法库</text>
    <text x="514" y="296" font-size="11.5" fill="#cfe8c6">只读/修改/sort/二分堆/数值/成绩系统</text>
    <text x="514" y="324" font-size="12" fill="#9fb8a8">第 17 周：模板与泛型</text>
    <text x="514" y="346" font-size="11.5" fill="#cfe8c6">函数模板/MyVector/非类型/lambda/function</text>
    <text x="514" y="378" font-size="12.5" fill="#45703a">（102/144 = 70.8%）</text>
    <text x="514" y="408" font-size="12" fill="#9fb8a8">阶段五（剩 42 天）：</text>
    <text x="514" y="430" font-size="11.5" fill="#cfe8c6">现代特性/移动/智能指针/现代库</text>
    <text x="514" y="450" font-size="11.5" fill="#cfe8c8">→ 综合项目（JSON 解析器）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">毕业考的意义</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">"脱稿重写"证明知识内化了（不是背的）；"白板讲差异"证明理解结构了（不是用的）——两关都过才算真的拥有</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 103——阶段五开篇：auto / decltype——规则与陷阱</text>
  </g>
</svg>
