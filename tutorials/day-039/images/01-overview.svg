<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 39 全貌：泄漏与悬空——给静默错误装雷达</text>
    <path d="M 290,60 Q 480,52 670,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">昨天的三种错误"都不当场爆炸"——今天用 ASan 让它们全部现形（计划指定练习：写泄漏程序并用工具定位）</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#a33f2e">泄漏的两种形态（实测）</text>
    <text x="64" y="180" font-size="12.5" fill="#3b3a36">形态一：固定大小——每次调 leak_fixed_size()</text>
    <text x="64" y="202" font-size="12" fill="#8a8578">　漏 400 字节；1000 次 = 400KB（实测跑完 exit=0）</text>
    <text x="64" y="232" font-size="12.5" fill="#3b3a36">形态二：越漏越大——leak_growing() 的 n *= 2</text>
    <text x="64" y="254" font-size="12" fill="#8a8578">　10 次漏 2+4+…+1024 ≈ 2046 个 int</text>
    <text x="64" y="288" font-size="12.5" fill="#a33f2e">共同点：零报错、正常退出——</text>
    <text x="64" y="310" font-size="12.5" fill="#a33f2e">　"程序没崩"和"没问题"是两回事</text>
    <text x="64" y="348" font-size="12" fill="#8a8578">（长跑服务的泄漏才致命：一天 400KB，一个月 120MB）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">ASan 的现形报告（实测）</text>
    <rect x="572" y="164" width="320" height="110" fill="#33413a"/>
    <text x="732" y="188" font-size="10.5" fill="#ffd7d0">ERROR: heap-use-after-free</text>
    <text x="732" y="206" font-size="10" fill="#9fb8a8">READ of size 4 at 0x…09d0</text>
    <text x="732" y="226" font-size="10" fill="#9fb8a8">SUMMARY: in main+0x198</text>
    <text x="732" y="250" font-size="10" fill="#9fb8a8">（行号直接指到悬空读取处）</text>
    <text x="727" y="300" font-size="12.5" fill="#45703a">普通版同款代码打出 *d = 3/4</text>
    <text x="727" y="322" font-size="12" fill="#8a8578">（旧值的假象——"能读"不等于"合法"）</text>
    <text x="727" y="356" font-size="12.5" fill="#6b675e">macOS 限制：LeakSanitizer 不可用</text>
    <text x="727" y="374" font-size="12" fill="#8a8578">（泄漏检测在 Linux/valgrind 补——诚实记录）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">根治方案：RAII（修复版实测零泄漏）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">IntBuffer 类：构造拿、析构还——1000 次分配 ASan 全程零报告；"忘了 delete"从语法上不存在</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（第 9 周 Day 51 RAII 思想的前菜——工具抓错是治标，RAII 是治本）</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 37~38 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 39（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 40~41</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 42 项目日</text>
  </g>
</svg>
