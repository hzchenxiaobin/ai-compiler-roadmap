<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">静默泄漏、悬空现形与 RAII 零报告战报</text>
    <path d="M 330,58 Q 480,52 630,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,270 470,440 Q 248,445 26,440 Q 20,270 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 271)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">实验 1：泄漏 + 悬空</text>
    <rect x="38" y="146" width="420" height="280" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./ll　（普通编译）</text>
    <text x="54" y="198" font-size="12.5" fill="#cfe8c6">跑完 1010 次分配，全部没还</text>
    <text x="54" y="218" font-size="12.5" fill="#cfe8c6">——程序正常退出 exit=0</text>
    <text x="54" y="248" font-size="12" fill="#f0c9c0">（没有任何报错——静默的可怕）</text>
    <text x="54" y="280" font-size="12" fill="#9fb8a8">悬空部分：</text>
    <text x="54" y="302" font-size="12.5" fill="#cfe8c6">d = 0x104f01300（值还在）</text>
    <text x="54" y="326" font-size="12.5" fill="#f0c9c0">*d = 3（垃圾值——UB）</text>
    <text x="54" y="360" font-size="12" fill="#9fb8a8">ASan 版：</text>
    <text x="54" y="382" font-size="11" fill="#ffd7d0">ERROR: heap-use-after-free</text>
    <text x="54" y="400" font-size="11" fill="#9fb8a8">READ of size 4 + SUMMARY 定位行号</text>
    <text x="54" y="422" font-size="11.5" fill="#9fb8a8">（同一段悬空代码两种命运）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,270 934,440 Q 712,445 490,440 Q 484,270 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 271)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">实验 2：RAII 修复版</text>
    <rect x="502" y="146" width="420" height="280" rx="6" fill="#33413a"/>
    <text x="514" y="172" font-size="11.5" fill="#9fb8a8">$ ./fr　（ASan 编译）</text>
    <text x="514" y="200" font-size="12.5" fill="#cfe8c6">1000 次分配全部经析构归还</text>
    <text x="514" y="222" font-size="12.5" fill="#cfe8c6">——零泄漏（ASan 全程无报告）</text>
    <text x="514" y="254" font-size="12" fill="#9fb8a8">IntBuffer 类的机制：</text>
    <text x="514" y="276" font-size="11.5" fill="#9fb8a8">　构造 new[]、析构 delete[]</text>
    <text x="514" y="296" font-size="11.5" fill="#9fb8a8">　（出块自动触发——Day 51 前菜）</text>
    <text x="514" y="330" font-size="12.5" fill="#f0c9c0">RAII 是根治："忘了 delete"</text>
    <text x="514" y="350" font-size="12.5" fill="#9fb8a8">　从语法上不存在</text>
    <text x="514" y="390" font-size="12" fill="#9fb8a8">（泄漏的 400KB vs 归还的 400KB</text>
    <text x="514" y="408" font-size="12" fill="#9fb8a8">　——同规模对照）</text>

    <path d="M 24,466 Q 470,460 905,467 L 901,540 Q 470,534 26,539 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 503)"/>
    <text x="46" y="492" font-size="15.5" font-weight="bold" fill="#9c5a22">本周的防线升级</text>
    <text x="46" y="520" font-size="12.5" fill="#3b3a36">Day 38 配对纪律（自律）→ 今天 ASan（雷达）→ Day 40 二维数组的正确释放 → Day 41 深浅拷贝 → RAII 根治</text>

    <path d="M 24,556 Q 470,550 905,557 L 901,640 Q 470,634 26,639 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 598)"/>
    <text x="480" y="586" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#55606e">明天预告</text>
    <text x="480" y="614" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 40：new[]/delete[] 与二维动态数组——矩阵的创建、乘法与正确释放（Day 14 二维数组的堆版）</text>
  </g>
</svg>
