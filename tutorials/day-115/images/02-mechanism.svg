<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">所有权交接图与裸指针时代的对照</text>
    <path d="M 300,58 Q 480,52 660,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">move 的交接仪式（时间线）</text>
    <rect x="120" y="146" width="280" height="60" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="260" y="170" font-size="10.5" fill="#45703a">①auto a = make_unique(资源)</text>
    <text x="260" y="190" font-size="9.5" fill="#8a8578">（a 拥有——箭头 a → 资源）</text>
    <rect x="440" y="146" width="280" height="60" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="580" y="170" font-size="10.5" fill="#9c5a22">②auto b = move(a)</text>
    <text x="580" y="190" font-size="9.5" fill="#8a8578">（箭头改挂：b → 资源；a → null）</text>
    <path d="M 402,176 Q 420,176 438,176" fill="none" stroke="#3b3a36" stroke-width="2"/>
    <rect x="120" y="222" width="280" height="60" fill="#f1f4f7" stroke="#8a94a3" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="260" y="246" font-size="10.5" fill="#8a94a3">a 现在是 nullptr（空把手）</text>
    <text x="260" y="266" font-size="9.5" fill="#8a94a3">（可以重新赋值或等析构——安全）</text>
    <rect x="440" y="222" width="280" height="60" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="580" y="246" font-size="10.5" fill="#45703a">b 拥有资源（唯一主人）</text>
    <text x="580" y="266" font-size="9.5" fill="#45703a">（出 b 的作用域 → 自动 delete）</text>
    <text x="472" y="314" font-size="11.5" fill="#8a8578">（独占不变式：任何时刻只有一个主人——move 是交接不是复制）</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">裸指针时代 vs 今天</text>
    <rect x="64" y="412" width="430" height="150" fill="#33413a"/>
    <text x="279" y="438" font-size="10.5" fill="#9fb8a8">裸时代：Resource* p = new R(...);</text>
    <text x="279" y="460" font-size="10.5" fill="#f0c9c0">　delete p; ← 忘了=泄漏 双删=崩溃</text>
    <text x="279" y="484" font-size="10.5" fill="#cfe8c8">今天：auto p = make_unique&lt;R&gt;(...);</text>
    <text x="279" y="506" font-size="10.5" fill="#cfe8c8">　（没有 delete——作用域自动管）</text>
    <text x="279" y="534" font-size="10" fill="#8a8578">（五周的裸指针训练换来今天的'不用管'）</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">历史用对的时刻</text>
    <text x="572" y="428" font-size="12" fill="#3b3a36">Day 76 图形库 v2：</text>
    <text x="572" y="452" font-size="11.5" fill="#6b675e">vector&lt;unique_ptr&lt;LabeledShape&gt;&gt;</text>
    <text x="572" y="480" font-size="12" fill="#3b675e">Day 77 工厂返回 unique_ptr</text>
    <text x="572" y="504" font-size="11.5" fill="#8a8578">（当时的'先进写法'——今天讲透原理）</text>
    <text x="572" y="534" font-size="11.5" fill="#6b675e">（五法则内建于类型——零法则的</text>
    <text x="572" y="554" font-size="11.5" fill="#6b675e">　容器版实现）</text>
  </g>
</svg>
