<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">编译期货 vs 运行期货的对照与实例的独立性</text>
    <path d="M 230,58 Q 480,52 730,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,330 Q 470,324 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 215)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">两条路线的内存布局</text>
    <rect x="110" y="146" width="340" height="150" fill="#d8ecce" stroke="#7aa663" stroke-width="2.2"/>
    <text x="280" y="174" font-size="11" fill="#45703a">非类型参数版（FixedStack）：栈上</text>
    <rect x="170" y="188" width="220" height="34" fill="#d8ecce" stroke="#7aa663" stroke-width="1.6"/>
    <text x="280" y="210" font-size="10" fill="#45703a">data_[100]（404 字节连排）</text>
    <text x="280" y="248" font-size="10" fill="#8a8578">（零 new/delete——析构免费）</text>
    <text x="280" y="272" font-size="10" fill="#8a8578">（容量定死——满了只能拒绝）</text>
    <rect x="510" y="146" width="340" height="150" fill="#f9d9b8" stroke="#e0955f" stroke-width="2.2"/>
    <text x="680" y="174" font-size="11" fill="#9c5a22">运行期版（Day 98 MyVector）：堆上</text>
    <rect x="570" y="188" width="220" height="34" fill="#f9d9b8" stroke="#e0955f" stroke-width="1.6"/>
    <text x="680" y="210" font-size="10" fill="#9c5a22">data_ → new T[cap]（24 字节把手）</text>
    <text x="680" y="248" font-size="10" fill="#8a8578">（要管内存（三法则）——但可增长）</text>
    <text x="680" y="272" font-size="10" fill="#8a8578">（满了扩容搬家（倍增））</text>
    <text x="472" y="320" font-size="11.5" fill="#8a8578">（选型：容量编译期已知选前者（快）；要动态选后者（活））</text>

    <path d="M 40,354 Q 280,348 520,354 Q 524,470 520,576 Q 280,582 42,576 Q 36,470 40,354 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 465)"/>
    <text x="280" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">满栈执法（实测）</text>
    <rect x="64" y="402" width="430" height="150" fill="#33413a"/>
    <text x="279" y="428" font-size="11" fill="#9fb8a8">FixedStack&lt;int, 3&gt; s3;</text>
    <text x="279" y="452" font-size="11" fill="#cfe8c6">push 1：成功　push 2：成功　push 3：成功</text>
    <text x="279" y="476" font-size="11" fill="#f0c9c0">push 4：失败（满了！）</text>
    <text x="279" y="498" font-size="10.5" fill="#9fb8a8">full() = true</text>
    <text x="279" y="528" font-size="10.5" fill="#cfe8c6">（push 返回 bool——调用方检查）</text>

    <path d="M 550,354 Q 730,348 905,354 Q 908,470 905,576 Q 730,582 552,576 Q 547,470 550,354 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 465)"/>
    <text x="727" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">身边的非类型参数</text>
    <text x="572" y="418" font-size="12" fill="#3b3a36">std::array&lt;int, 5&gt;：N=5</text>
    <text x="572" y="442" font-size="11.5" fill="#8a8578">（sizeof=20——5 个 int 本体（Day 82））</text>
    <text x="572" y="472" font-size="12" fill="#3b3a36">std::bitset&lt;32&gt;：位数</text>
    <text x="572" y="496" font-size="11.5" fill="#8a8578">（标志位的紧凑打包）</text>
    <text x="572" y="526" font-size="11.5" fill="#6b675e">（C++20 的 string_literal 参数——进阶）</text>
  </g>
</svg>
