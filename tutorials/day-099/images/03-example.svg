    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./fs　（-Wall 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== Stack&lt;int,100&gt;（计划指定） ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c6">capacity = 100 ✔</text>
    <text x="54" y="242" font-size="11.5" fill="#cfe8c6">push 5 个 top=55；pop 后 44 ✔</text>
    <text x="54" y="270" font-size="12" fill="#9fb8a8">== 满栈执法 ==</text>
    <text x="54" y="292" font-size="11.5" fill="#cfe8c6">容量 3：push 1/2/3 成功</text>
    <text x="54" y="312" font-size="11.5" fill="#f0c9c0">push 4：失败（满了！）✔</text>
    <text x="54" y="332" font-size="11.5" fill="#cfe8c6">full() = true ✔</text>
    <text x="54" y="360" font-size="12" fill="#9fb8a8">== 默认参数 ==</text>
    <text x="54" y="382" font-size="11.5" fill="#cfe8c6">FixedStack&lt;string&gt; 容量 100 ✔</text>
    <text x="54" y="402" font-size="11.5" fill="#cfe8c6">top = 参数 ✔</text>
    <text x="54" y="430" font-size="12" fill="#9fb8a8">== sizeof ==</text>
    <text x="54" y="452" font-size="11.5" fill="#f0c9c0">&lt;int,3&gt; = 16；&lt;int,100&gt; = 404</text>
    <text x="54" y="472" font-size="11" fill="#9fb8a8">（差 97 个 int——容量进类型）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,490 Q 712,495 490,490 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 296)"/>
