    <rect x="502" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">本周攒下的模板参数库：</text>
    <text x="514" y="198" font-size="11.5" fill="#cfe8c6">typename T（Day 97/98）——类型</text>
    <text x="514" y="218" font-size="11.5" fill="#cfe8c6">int MaxSize = 100（今天）——非类型</text>
        <text x="514" y="238" font-size="11.5" fill="#cfe8c8">　+ 默认值</text>
    <text x="514" y="268" font-size="12" fill="#9fb8a8">身边的组合：</text>
    <text x="514" y="290" font-size="11.5" fill="#cfe8c6">std::map&lt;K, V, Cmp = less&lt;K&gt;&gt;（Day 85）</text>
    <text x="514" y="310" font-size="11" fill="#9fb8a8">　（类型 + 类型 + 默认比较器）</text>
    <text x="514" y="338" font-size="11.5" fill="#cfe8c6">std::stack&lt;T, Container = deque&lt;T&gt;&gt;（83）</text>
    <text x="514" y="358" font-size="11" fill="#9fb8a8">　（默认底座——适配器的秘密）</text>
    <text x="514" y="392" font-size="12.5" fill="#45703a">（99/144 = 68.8%）</text>
    <text x="514" y="424" font-size="11.5" fill="#9fb8a8">本周剩：100 lambda 深入 →</text>
