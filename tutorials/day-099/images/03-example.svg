    <text x="514" y="474" font-size="11" fill="#9fb8a8">（里程碑要脱稿重写 LRU——</text>
    <text x="514" y="492" font-size="11" fill="#9fb8a8">　Day 89 的代码今天起要能默写）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">编译期力量的边界</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">容量进类型换来零分配和满栈检查的确定性——代价是每种容量一份代码；"编译期权衡"从今天起是一句有实例的话</text>

