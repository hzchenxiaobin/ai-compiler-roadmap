<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 124 全貌：C++20 三大件——concepts / ranges / 协程（认知级）</text>
    <path d="M 290,60 Q 480,52 670,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划要求"跑通示例即可"——concepts（模板要求显式化）和 ranges（管道+惰性）本机跑通；协程诚实标注"工具链未熟、认知即可"</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">concepts：要求写在脸上</text>
    <rect x="64" y="164" width="440" height="80" fill="#33413a"/>
    <text x="284" y="190" font-size="11" fill="#9fb8a8">template &lt;Numeric T&gt;</text>
    <text x="284" y="212" font-size="11" fill="#cfe8c8">T add20(T a, T b) { return a + b; }</text>
    <text x="284" y="234" font-size="10" fill="#8a8578">（Day 97 duck typing 的显式升级）</text>
    <text x="64" y="272" font-size="12.5" fill="#45703a">int/double 过 ✔；string 被拦 ✘</text>
    <text x="64" y="294" font-size="12" fill="#8a8578">（报错直指"不满足 constraint"——不再长篇大论）</text>
    <text x="64" y="326" font-size="12.5" fill="#45703a">requires 表达式：能力检查</text>
    <text x="64" y="348" font-size="12" fill="#8a8578">（Printable = requires { os &lt;&lt; v; }）</text>
    <text x="64" y="376" font-size="11.5" fill="#8a8578">（自 Day 97 预告的 C++20 改进——兑现）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">ranges：管道 + 惰性</text>
    <rect x="572" y="164" width="320" height="80" fill="#33413a"/>
    <text x="732" y="190" font-size="10.5" fill="#9fb8a8">v | filter(&gt;3) | transform(×2)</text>
    <text x="732" y="212" font-size="10.5" fill="#9fb8a8">　| take(3)　← 一个管道</text>
    <text x="732" y="234" font-size="10" fill="#8a8578">（实测：8..2 → 16 20 14）</text>
    <text x="572" y="272" font-size="12.5" fill="#45703a">惰性：views 不产中间容器</text>
    <text x="572" y="300" font-size="12.5" fill="#45703a">无穷序列也能玩（iota）</text>
    <text x="572" y="322" font-size="12" fill="#8a8578">（实测：前 5 偶数 2 4 6 8 10）</text>
    <text x="572" y="354" font-size="12" fill="#6b675e">（Day 91 的迭代器对 → 管道组合）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">协程的诚实注脚</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">co_await/co_yield 的挂起恢复是异步的未来——但本编译器支持有限、生态未熟；今天认知级了解（知道它是什么、解决什么），实战等工具链</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（"知道边界"和"学会"同样重要——本教程一贯的诚实）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 121~123 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 124（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 125 重读</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 126 里程碑</text>
  </g>
</svg>
