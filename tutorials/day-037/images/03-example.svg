<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">地址实测与栈向实测战报</text>
    <path d="M 390,58 Q 480,52 570,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,270 470,440 Q 248,445 26,440 Q 20,270 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 271)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">实验 1：地址分区</text>
    <rect x="38" y="146" width="420" height="280" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./ml</text>
    <text x="54" y="198" font-size="12" fill="#9fb8a8">== 栈区 ==</text>
    <text x="54" y="220" font-size="11.5" fill="#cfe8c6">&amp;stack_var　 = 0x16f7fad60</text>
    <text x="54" y="240" font-size="11.5" fill="#cfe8c6">&amp;stack_arr[0]= 0x16f7fad68（差 8）</text>
    <text x="54" y="266" font-size="12" fill="#9fb8a8">== 静态区 ==</text>
    <text x="54" y="288" font-size="11.5" fill="#cfe8c6">&amp;global_var = 0x10060c000</text>
    <text x="54" y="308" font-size="11.5" fill="#cfe8c6">&amp;func_static= 0x10060c010（紧挨！）</text>
    <text x="54" y="332" font-size="12" fill="#9fb8a8">== 常量区 ==</text>
    <text x="54" y="354" font-size="11.5" fill="#cfe8c6">"hello" = 0x10060545c</text>
    <text x="54" y="378" font-size="11.5" fill="#f0c9c0">"hello" 再取 = 同址（合并 ✔）</text>
    <text x="54" y="408" font-size="12" fill="#9fb8a8">（三区数量级分明；静态区内部</text>
    <text x="54" y="424" fill="#9fb8a8" font-size="12">　紧挨排列）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,270 934,440 Q 712,445 490,440 Q 484,270 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 271)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">实验 2：栈生长方向</text>
    <rect x="502" y="146" width="420" height="280" rx="6" fill="#33413a"/>
    <text x="514" y="172" font-size="11.5" fill="#9fb8a8">$ ./sd</text>
    <text x="514" y="198" font-size="12" fill="#9fb8a8">递归三层：</text>
    <text x="514" y="222" font-size="11.5" fill="#cfe8c6">depth 1 → 0x16b066d18</text>
    <text x="514" y="242" font-size="11.5" fill="#cfe8c6">depth 2 → 0x16b066cf8（−0x20）</text>
    <text x="514" y="262" font-size="11.5" fill="#cfe8c6">depth 3 → 0x16b066cd8（−0x20）</text>
    <text x="514" y="294" font-size="12" fill="#9fb8a8">同函数内：</text>
    <text x="514" y="316" font-size="11.5" fill="#cfe8c6">&amp;a = …d78 &gt; &amp;b = …d74</text>
    <text x="514" y="336" font-size="11.5" fill="#cfe8c6">（a 先声明地址高；差 4 = sizeof(int)）</text>
    <text x="514" y="372" font-size="12" fill="#9fb8a8">结论：栈向下生长（地址递减）</text>
    <text x="514" y="394" font-size="12" fill="#9fb8a8">　每层帧固定 0x20 字节（本例）</text>

    <path d="M 24,466 Q 470,460 905,467 L 901,540 Q 470,534 26,539 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 503)"/>
    <text x="46" y="492" font-size="15" font-weight="bold" fill="#9c5a22">阶段二的第一块地图</text>
    <text x="46" y="520" font-size="12.5" fill="#3b3a36">今天认楼层；明天进堆（new/delete）；后天抓泄漏——六天后手写动态数组 v1（Day 42 项目日）</text>

    <path d="M 24,556 Q 470,550 905,557 L 901,640 Q 470,634 26,639 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 598)"/>
    <text x="480" y="586" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#55606e">明天预告</text>
    <text x="480" y="614" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 38：new / delete 基础——堆的钥匙：动态 int、动态数组的申请与释放（配对纪律的起点）</text>
  </g>
</svg>
