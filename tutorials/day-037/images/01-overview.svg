<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="568" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 37 全貌：程序内存布局——四层楼层图</text>
    <path d="M 330,60 Q 480,52 630,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">阶段二开篇：栈/堆/静态区/常量区各住什么变量——打印地址亲眼看见区域的差异（本机实测）</text>

    <path d="M 40,116 Q 470,110 905,117 L 901,406 Q 470,400 44,405 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 253)"/>
    <text x="472" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">进程地址空间（从高到低的楼层）</text>
    <rect x="80" y="162" width="800" height="44" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.2"/>
    <text x="480" y="182" text-anchor="middle" font-size="12" fill="#a33f2e">栈区（高地址）——0x16f7…（本机实测）</text>
    <text x="480" y="198" text-anchor="middle" font-size="10.5" fill="#8a8578">局部变量、函数参数、返回地址（自动回收、后进先出）</text>
    <rect x="80" y="214" width="800" height="44" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.2"/>
    <text x="480" y="234" text-anchor="middle" font-size="12" fill="#55606e">（空隙——栈向下长、堆向上长，中间是未用地带）</text>
    <rect x="80" y="266" width="800" height="44" fill="#f9d9b8" stroke="#e0955f" stroke-width="2.2"/>
    <text x="480" y="286" text-anchor="middle" font-size="12" fill="#9c5a22">堆区——new/delete 的地盘（Day 38 主角，今天留白）</text>
    <text x="480" y="302" text-anchor="middle" font-size="10.5" fill="#8a8578">（手动管理、大小运行期定）</text>
    <rect x="80" y="318" width="800" height="44" fill="#d8ecce" stroke="#7aa663" stroke-width="2.2"/>
    <text x="480" y="338" text-anchor="middle" font-size="12" fill="#45703a">静态区——0x10060c0xx（本机实测，紧挨常量区）</text>
    <text x="480" y="354" text-anchor="middle" font-size="10.5" fill="#8a8578">全局变量、static（进程结束才回收；BSS 是它的未初始化段）</text>
    <rect x="80" y="368" width="800" height="30" fill="#fdf6dd" stroke="#d9b23a" stroke-width="1.6"/>
    <text x="480" y="387" text-anchor="middle" font-size="11" fill="#8a6d1a">常量区（只读）——0x1006054xx："hello" 字面量住这里（写入会崩）</text>

    <path d="M 40,428 Q 470,422 905,429 L 901,516 Q 470,510 44,515 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.2 472 456)"/>
    <text x="472" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">本机实测的三个证据</text>
    <text x="70" y="486" font-size="13" fill="#3b3a36">①栈 0x16f7…、静态 0x1006…、常量 0x1006…——三个数量级分得开开的；②递归栈帧地址递减（0x…d18→cd8）</text>
    <text x="70" y="508" font-size="13" fill="#3b3a36">③两个 "hello" 地址相同——编译器合并了相同字面量（常量区去重）</text>

    <path d="M 60,530 Q 480,524 905,531" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="530" r="5" fill="#8a94a3"/>
    <text x="250" y="550" text-anchor="middle" font-size="12" fill="#3b3a36">Day 1~36 ✓</text>
    <circle cx="440" cy="530" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="530" r="5" fill="#5b8db8"/>
    <text x="440" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 37（今天）</text>
    <circle cx="650" cy="530" r="5" fill="#5b8db8"/>
    <text x="650" y="550" text-anchor="middle" font-size="12" fill="#3b3a36">Day 38~41 内存</text>
    <circle cx="850" cy="530" r="5" fill="#e0955f"/>
    <text x="850" y="550" text-anchor="middle" font-size="12" fill="#3b3a36">Day 42 项目日</text>
  </g>
</svg>
