<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">修饰名解剖与三病因对照</text>
    <path d="M 330,58 Q 480,52 630,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,230 Q 470,224 44,229 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 165)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">__Z4calcdcd 是什么？（C++ 名字修饰）</text>
    <rect x="120" y="146" width="90" height="36" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="165" y="169" text-anchor="middle" font-size="11" fill="#45703a">__Z4</text>
    <rect x="210" y="146" width="90" height="36" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2"/>
    <text x="255" y="169" text-anchor="middle" font-size="11" fill="#2c5a82">calc</text>
    <rect x="300" y="146" width="60" height="36" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="330" y="169" text-anchor="middle" font-size="11" fill="#9c5a22">d</text>
    <rect x="360" y="146" width="60" height="36" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="390" y="169" text-anchor="middle" font-size="11" fill="#9c5a22">c</text>
    <rect x="420" y="146" width="60" height="36" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="450" y="169" text-anchor="middle" font-size="11" fill="#9c5a22">d</text>
    <text x="520" y="162" font-size="11.5" fill="#6b675e">4 = 名字长度；d c d = 参数缩写</text>
    <text x="520" y="182" font-size="11.5" fill="#a33f2e">参数进修饰名，返回类型不进！（今天的陷阱）</text>

    <path d="M 40,254 Q 470,248 905,255 L 901,420 Q 470,414 44,419 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 472 337)"/>
    <text x="472" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">三病因对照表（要 vs 供，全部本机实测）</text>
    <rect x="70" y="300" width="820" height="26" fill="#fffdf7" stroke="#8a94a3" stroke-width="1.5"/>
    <text x="86" y="318" font-size="11.5" fill="#3b3a36">①漏文件　要：U __Z4calcdcd　　　供：（缺席）　　　　　　　　　→ Undefined symbols</text>
    <rect x="70" y="328" width="820" height="26" fill="#f9e9e5" stroke="#c96a5a" stroke-width="1.5"/>
    <text x="86" y="346" font-size="11.5" fill="#a33f2e">②参数变　要：U __Z4calcdcd　　　供：T __Z4calcdci（b 改 int）→ 修饰名差一位，对不上</text>
    <rect x="70" y="356" width="820" height="26" fill="#fffdf7" stroke="#8a94a3" stroke-width="1.5"/>
    <text x="86" y="374" font-size="11.5" fill="#a33f2e">③拼错名　要：U __Z4calcdcd　　　供：T __Z4clacdcd（clac）　→ 差之毫厘谬以千里</text>
    <text x="70" y="404" font-size="12.5" fill="#55606e">排查三步（Day 25 套路升级）：读符号全名 → nm 看两边 → 指出对不上的那一位</text>

    <path d="M 40,444 Q 470,438 905,445 L 901,576 Q 470,570 44,575 Z" fill="#fdf6dd" stroke="#d9b23a" stroke-width="2.8" transform="rotate(-0.2 472 510)"/>
    <text x="472" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d1a">今天的意外收获：两种"改返回类型"的命运</text>
    <text x="70" y="506" font-size="13" fill="#3b3a36">calc.cpp 包含自己的 calc.h + 只改返回类型 → 编译期就报错（cannot overload，安全拦截 ✔）</text>
    <text x="70" y="534" font-size="13" fill="#a33f2e">不包含头文件 + 只改返回类型 → 修饰名相同、链接成功但契约已破（静默错误，最危险 ✘）</text>
    <text x="70" y="562" font-size="12.5" fill="#6b675e">结论：源文件永远包含自己的头文件——让编译器替你核对名片与机器（Day 25 埋的"核对"伏笔）</text>
  </g>
</svg>
