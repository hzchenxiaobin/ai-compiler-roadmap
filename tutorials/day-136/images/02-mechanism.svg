<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">EXPECT 与 ASSERT 的分岔和失败报告的解剖</text>
    <path d="M 280,58 Q 480,52 680,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">同一次失败的两种处理</text>
    <rect x="150" y="146" width="330" height="170" fill="#33413a"/>
    <text x="315" y="172" font-size="10.5" fill="#9fb8a8">EXPECT_NE(p, nullptr);</text>
    <text x="315" y="196" font-size="10" fill="#8a8578">失败 ↓</text>
    <text x="315" y="218" font-size="10.5" fill="#cfe8c8">标记失败，继续跑 ↓</text>
    <text x="315" y="240" font-size="10.5" fill="#cfe8c8">EXPECT_EQ(*p, 42); 照样执行</text>
    <text x="315" y="262" font-size="10.5" fill="#8a8578">delete p; 照样执行（清理不漏）</text>
    <text x="315" y="296" font-size="10" fill="#8a8578">（适合：多项独立检查都想看）</text>
    <rect x="510" y="146" width="340" height="170" fill="#33413a"/>
    <text x="680" y="172" font-size="10.5" fill="#9fb8a8">ASSERT_NE(p, nullptr);</text>
    <text x="680" y="196" font-size="10" fill="#8a8578">失败 ↓</text>
    <text x="680" y="218" font-size="10.5" fill="#f0c9c0">立即 return（本用例终止）↓</text>
    <text x="680" y="240" font-size="10.5" fill="#f0c9c0">EXPECT_EQ(*p, 42); 不执行</text>
    <text x="680" y="262" font-size="10.5" fill="#45703a">（避免空指针解引用！）</text>
    <text x="680" y="296" font-size="10" fill="#8a8578">（适合：后续依赖此前提）</text>
    <text x="472" y="334" font-size="11.5" fill="#8a8578">（口诀：前提用 ASSERT、检查用 EXPECT——失败能不能继续是判断标准）</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">失败报告的解剖（实测）</text>
    <rect x="64" y="412" width="430" height="150" fill="#33413a"/>
    <text x="279" y="436" font-size="10" fill="#9fb8a8">first_test.cpp:55: Failure</text>
    <text x="279" y="458" font-size="10" fill="#cfe8c8">Expected equality of these values:</text>
    <text x="279" y="478" font-size="10" fill="#cfe8c8">　add(2, 2)　Which is: 4　←实际</text>
    <text x="279" y="498" font-size="10" fill="#cfe8c8">　5　　　　　　　　　　　←期望</text>
    <text x="279" y="526" font-size="10" fill="#8a8578">（文件:行号 + 期望/实际——直达病灶）</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">测试的组织层级</text>
    <rect x="572" y="412" width="320" height="150" fill="#33413a"/>
    <text x="732" y="436" font-size="10.5" fill="#9fb8a8">套件（Suite）：AddTest（3 用例）</text>
    <text x="732" y="458" font-size="10.5" fill="#cfe8c8">用例（Case）：TwoPlusTwo 等</text>
    <text x="732" y="480" font-size="10.5" fill="#9fb8a8">断言（Assert）：EXPECT_EQ 等</text>
    <text x="732" y="510" font-size="10.5" fill="#8a8578">（--gtest_filter="套件.*" 按套件跑）</text>
    <text x="732" y="536" font-size="10" fill="#8a8578">（明天 JSON 测试按模块分套件）</text>
  </g>
</svg>
