<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">双输出实录与第 14 周战绩</text>
    <path d="M 400,58 Q 480,52 560,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21 -std=c++17；-Wall 零警告）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,480 Q 248,485 26,480 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 291)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出</text>
    <rect x="38" y="146" width="420" height="320" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./wf　（-Wall 零警告）</text>
    <text x="54" y="198" font-size="11.5" fill="#cfe8c6">读了 24 个词，去重后 13 个</text>
    <text x="54" y="226" font-size="12" fill="#9fb8a8">== 按字典序 ==</text>
    <text x="54" y="248" font-size="11.5" fill="#cfe8c6">a×2 and×1 barks×1 brown×2</text>
    <text x="54" y="268" font-size="11.5" fill="#cfe8c6">dog×3 fox×3 jumps×1 lazy×2</text>
    <text x="54" y="288" font-size="11.5" fill="#cfe8c6">meets×1 over×1 quick×2 runs×1</text>
    <text x="54" y="308" font-size="11.5" fill="#f0c9c0">the×4（13 词 a→the 有序 ✔）</text>
    <text x="54" y="338" font-size="12" fill="#9fb8a8">== 按频次 Top 5 ==</text>
    <text x="54" y="360" font-size="11.5" fill="#cfe8c6">1. the×4　2. dog×3　3. fox×3</text>
    <text x="54" y="380" font-size="11.5" fill="#cfe8c6">4. a×2　5. brown×2 ✔</text>
    <text x="54" y="410" font-size="11.5" fill="#9fb8a8">ASan：零报错 ✔</text>
    <text x="54" y="438" font-size="11.5" fill="#9fb8a8">（手数核对：the 在三行里出现</text>
    <text x="54" y="456" font-size="11.5" fill="#9fb8a8">　4 次；dog 3 次——全对）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,480 Q 712,485 490,480 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 291)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">第 14 周战绩（Day 79~84）</text>
    <rect x="502" y="146" width="420" height="320" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">顺序容器周的六天：</text>
    <text x="514" y="198" font-size="11.5" fill="#cfe8c6">79 vector 深入（增长曲线/emplace）</text>
    <text x="514" y="218" font-size="11.5" fill="#cfe8c6">80 迭代器（四遍历/通用语言）</text>
    <text x="514" y="238" font-size="11.5" fill="#cfe8c6">81 失效规则（三事故/接力修正）</text>
    <text x="514" y="258" font-size="11.5" fill="#cfe8c6">82 五容器动物园（结构定能力）</text>
    <text x="514" y="278" font-size="11.5" fill="#cfe8c6">83 决策树+适配器（括号匹配）</text>
    <text x="514" y="298" font-size="11.5" fill="#cfe8c6">84 词频统计 v1（今天）✔</text>
    <text x="514" y="330" font-size="12" fill="#9fb8a8">从手写到看懂官方再到用官方：</text>
    <text x="514" y="352" font-size="11" fill="#9fb8a8">（42/47 的 IntArray → 79 的曲线</text>
    <text x="514" y="370" font-size="11" fill="#9fb8a8">　→ 本周各容器的熟练使用）</text>
    <text x="514" y="402" font-size="12.5" fill="#45703a">（84/144 = 58.3%——</text>
    <text x="514" y="422" font-size="12.5" fill="#45703a">　13 个项目日全胜）</text>
    <text x="514" y="452" font-size="11.5" fill="#9fb8a8">（下周关联容器：map/set 的正课</text>
    <text x="514" y="470" font-size="11.5" fill="#9fb8a8">　——今天的 ++freq[w] 先尝甜头）</text>

    <path d="M 24,506 Q 470,500 905,507 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 543)"/>
    <text x="46" y="532" font-size="15.5" font-weight="bold" fill="#9c5a22">词频统计的意义</text>
    <text x="46" y="560" font-size="12.5" fill="#3b3a36">搜索引擎的倒排索引、编译器的符号表、数据分析的 group-by——全是"键→计数"模式的变体（今天是最小可行版）</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 85 map 与 set——红黑树、有序性（今天 ++freq[w] 的原理课）</text>
  </g>
</svg>
