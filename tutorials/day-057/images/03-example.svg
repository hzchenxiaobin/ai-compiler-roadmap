<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">三件套全登场与两种控制的战报</text>
    <path d="M 350,58 Q 480,52 610,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,260 470,420 Q 248,425 26,420 Q 20,260 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 261)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">实验 1：三件套全登场</text>
    <rect x="38" y="146" width="420" height="260" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./rot</text>
    <text x="54" y="198" font-size="12.5" fill="#cfe8c6">[构造] hello</text>
    <text x="54" y="222" font-size="12.5" fill="#cfe8c6">[拷贝构造] hello　←①（b = a）</text>
    <text x="54" y="242" font-size="12.5" fill="#cfe8c6">[构造] world</text>
    <text x="54" y="262" font-size="12.5" fill="#cfe8c6">[拷贝赋值] hello　←②（c = a）</text>
    <text x="54" y="296" font-size="12.5" fill="#f0c9c0">[析构] 释放 0x…92e0 ←③</text>
    <text x="54" y="316" font-size="12.5" fill="#f0c9c0">[析构] 释放 0x…92d0</text>
    <text x="54" y="336" font-size="12.5" fill="#f0c9c0">[析构] 释放 0x…92c0（逆序）</text>
    <text x="54" y="376" font-size="12" fill="#9fb8a8">三个地址全不同（深拷贝 ✔）</text>
    <text x="54" y="396" font-size="12" fill="#9fb8a8">三次析构各释放各的（无泄漏 ✔）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,260 934,420 Q 712,425 490,420 Q 484,260 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 261)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">实验 2：两种控制</text>
    <rect x="502" y="146" width="420" height="260" rx="6" fill="#33413a"/>
    <text x="514" y="172" font-size="11.5" fill="#9fb8a8">$ ./dd</text>
    <text x="514" y="196" font-size="12" fill="#9fb8a8">Widget（=default 全家桶）：</text>
    <text x="514" y="218" font-size="12.5" fill="#cfe8c6">　普通 #1（拷贝默认版正常）</text>
    <text x="514" y="250" font-size="12" fill="#9fb8a8">NoCopy（=delete 禁拷贝）：</text>
    <text x="514" y="272" font-size="12.5" fill="#cfe8c6">　secret!（构造和 print 正常）</text>
    <text x="514" y="304" font-size="11.5" fill="#9fb8a8">n2 = n1（取消注释）→</text>
    <text x="514" y="326" font-size="11" fill="#ffd7d0">error: call to deleted constructor</text>
    <text x="514" y="352" font-size="11.5" fill="#9fb8a8">n3 = n1（取消注释）→</text>
    <text x="514" y="374" font-size="11" fill="#ffd7d0">no matching constructor</text>
    <text x="514" y="398" font-size="12" fill="#9fb8a8">（两条执法线实测归档）</text>

    <path d="M 24,446 Q 470,440 905,447 L 901,530 Q 470,524 26,529 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 488)"/>
    <text x="46" y="474" font-size="15.5" font-weight="bold" fill="#9c5a22">本周战役图</text>
    <text x="46" y="504" font-size="12.5" fill="#3b3a36">Day 55 拷贝构造（出生）→ Day 56 拷贝赋值（翻新）→ 今天三法则（打包 + 精确控制）→ Day 66 项目日总装</text>

    <path d="M 24,550 Q 470,544 905,551 L 901,630 Q 470,624 26,629 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 590)"/>
    <text x="480" y="580" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#55606e">明天预告</text>
    <text x="480" y="608" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 58：=delete 的设计应用——不可拷贝的单例雏形（计划指定练习；FileGuard 的正式武器化）</text>
    <text x="480" y="626" text-anchor="middle" font-size="12.5" fill="#6b675e">（禁止拷贝的类怎么用、怎么传——引用和指针登场）</text>
  </g>
</svg>
