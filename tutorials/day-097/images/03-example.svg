    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,490 Q 248,495 26,480 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 296)"/>
