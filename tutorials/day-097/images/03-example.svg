    <text x="514" y="218" font-size="11.5" fill="#cfe8c6">stack/queue 适配器（Day 83）</text>
    <text x="514" y="238" font-size="11.5" fill="#cfe8c6">map&lt;K,V&gt; 三参数（Day 85）</text>
    <text x="514" y="258" font-size="11.5" fill="#cfe8c6">算法的 It 参数（Day 91 起）</text>
    <text x="514" y="278" font-size="11.5" fill="#cfe8c6">advance 的标签分发（Day 88）</text>
    <text x="514" y="306" font-size="12" fill="#9fb8a8">今天起自己写：</text>
    <text x="514" y="328" font-size="11.5" fill="#cfe8c8">template &lt;typename T&gt; 从使用者变作者</text>
    <text x="514" y="360" font-size="12.5" fill="#45703a">（97/144 = 67.4%）</text>
    <text x="514" y="392" font-size="11.5" fill="#9fb8a8">第 17 周路线：97 函数模板（今天）</text>
    <text x="514" y="412" font-size="11.5" fill="#9fb8a8">　→ 类模板 → 特化 → 综合项目</text>
    <text x="514" y="444" font-size="11" fill="#9fb8a8">（Day 88 的 iterator_traits + if constexpr</text>
    <text x="514" y="464" font-size="11" fill="#9fb8a8">　今天能看懂一半——下周全懂）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">模板与虚函数的分界</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">模板 = 编译期多态（类型不同代码不同——快但代码膨胀）；virtual = 运行期多态（一套代码查虚表——活但有一次间接）——两条路各管一头的"多态"</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 98 类模板——Stack&lt;T&gt; 的实现（手写泛型容器）</text>
