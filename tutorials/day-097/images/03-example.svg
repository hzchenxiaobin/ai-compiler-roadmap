    <text x="54" y="200" font-size="12" fill="#9fb8a8">== 推导 ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c6">myMax(3,7)=7（int）✔</text>
    <text x="54" y="242" font-size="11.5" fill="#cfe8c6">myMax(2.5,1.5)=2.5（double）✔</text>
    <text x="54" y="262" font-size="11.5" fill="#cfe8c6">myMax('a','z')=z（char）✔</text>
    <text x="54" y="290" font-size="12" fill="#9fb8a8">== 推导失败与两解 ==</text>
    <text x="54" y="312" font-size="11.5" fill="#f0c9c0">myMax(3, 7.5) → 编译错 ✔</text>
    <text x="54" y="332" font-size="11.5" fill="#cfe8c6">myMax2(3,7.5)=7（int 版——7.5 截！）</text>
