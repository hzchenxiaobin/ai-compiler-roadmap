<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 97 全貌：函数模板——写一次，处处实例化</text>
    <path d="M 310,60 Q 480,52 650,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"泛型 myMax/mySum"——Day 88 起多处预告的模板今天开课：T 是占位符、推导是自动化、实例化是代码生成</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">模板三板斧</text>
    <text x="64" y="180" font-size="12.5" fill="#45703a">定义：template &lt;typename T&gt; 打头</text>
    <text x="64" y="202" font-size="12" fill="#8a8578">（T 是类型的占位符）</text>
    <text x="64" y="232" font-size="12.5" fill="#45703a">推导：myMax(3, 7) → T=int 自动定</text>
    <text x="64" y="254" font-size="12" fill="#8a8578">（不用写 &lt;int&gt;——编译器看实参）</text>
    <text x="64" y="284" font-size="12.5" fill="#45703a">实例化：用到才生成（按需刻版）</text>
    <text x="64" y="306" font-size="12" fill="#8a8578">（myMax(3,7) 和 (2.5,1.5) 是两份）</text>
    <text x="64" y="344" font-size="12.5" fill="#6b675e">历史伏笔全兑现：vector&lt;int&gt;/</text>
    <text x="64" y="364" font-size="12.5" fill="#6b675e">　stack/算法的 It 参数——全是模板</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">两个经典坑（实测）</text>
    <text x="572" y="180" font-size="12.5" fill="#a33f2e">坑①：myMax(3, 7.5) 编译错</text>
    <text x="572" y="202" font-size="12" fill="#8a8578">（T 要唯一——3 说 int、7.5 说 double）</text>
    <text x="572" y="230" font-size="12" fill="#45703a">　解①：显式 myMax&lt;double&gt;(3, 7.5)</text>
    <text x="572" y="250" font-size="12" fill="#45703a">　解②：双参版 myMax2（T/U 各推）</text>
    <text x="572" y="284" font-size="12.5" fill="#a33f2e">坑②：myMax2 返回 T 时 7.5 被截成 7</text>
    <text x="572" y="306" font-size="12" fill="#8a8578">（返回类型选了 T=int——窄化的老坑）</text>
    <text x="572" y="344" font-size="12" fill="#8a8578">（C++14 的 auto 返回推导是后话——第 17 周内）</text>
  </g>
</svg>
