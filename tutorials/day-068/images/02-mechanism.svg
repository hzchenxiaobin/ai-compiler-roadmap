<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">虚表：每个对象自带的一张函数表</text>
    <path d="M 330,58 Q 480,52 630,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,300 Q 470,294 44,299 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 200)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">调用 shapes[i]-&gt;area() 时发生了什么</text>
    <rect x="70" y="146" width="180" height="60" fill="#d8ecce" stroke="#7aa663" stroke-width="2.2"/>
    <text x="160" y="172" text-anchor="middle" font-size="11.5" fill="#45703a">Circle 对象 c</text>
    <text x="160" y="192" text-anchor="middle" font-size="10" fill="#8a8578">radius_ = 2 + vptr→圆版 area</text>
    <rect x="70" y="220" width="180" height="60" fill="#f9d9b8" stroke="#e0955f" stroke-width="2.2"/>
    <text x="160" y="246" text-anchor="middle" font-size="11.5" fill="#9c5a22">Rect 对象 r</text>
    <text x="160" y="266" text-anchor="middle" font-size="10" fill="#8a8578">w_=3,h_=4 + vptr→矩形版 area</text>
    <path d="M 254,176 Q 400,160 520,170" fill="none" stroke="#45703a" stroke-width="2.2"/>
    <path d="M 512,162 Q 522,168 514,178" fill="none" stroke="#45703a" stroke-width="2.2"/>
    <path d="M 254,250 Q 400,260 520,250" fill="none" stroke="#e0955f" stroke-width="2.2"/>
    <path d="M 512,242 Q 522,248 514,258" fill="none" stroke="#e0955f" stroke-width="2.2"/>
    <rect x="530" y="140" width="200" height="60" fill="#33413a"/>
    <text x="630" y="164" text-anchor="middle" font-size="10.5" fill="#cfe8c6">圆的虚表：</text>
    <text x="630" y="182" text-anchor="middle" font-size="10" fill="#cfe8c6">area → Circle::area()</text>
    <rect x="530" y="220" width="200" height="60" fill="#33413a"/>
    <text x="630" y="244" text-anchor="middle" font-size="10.5" fill="#cfe8c6">矩形的虚表：</text>
    <text x="630" y="262" text-anchor="middle" font-size="10" fill="#cfe8c6">area → Rect::area()</text>
    <text x="760" y="170" font-size="11" fill="#6b675e">编译器给每个带虚</text>
    <text x="760" y="188" font-size="11" fill="#6b675e">函数的类造一张表，</text>
    <text x="760" y="206" font-size="11" fill="#6b675e">对象里藏个指针（vptr）</text>
    <text x="472" y="286" text-anchor="middle" font-size="12" fill="#9fb8a8">调用时顺着 vptr 找到表、再取函数地址——一次间接跳转让"指谁调谁"成立</text>

    <path d="M 40,324 Q 280,318 520,324 Q 524,430 520,504 Q 280,510 42,504 Q 36,430 40,324 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 414)"/>
    <text x="280" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">多态容器的现代姿势</text>
    <rect x="64" y="370" width="430" height="100" fill="#33413a"/>
    <text x="279" y="396" font-size="11" fill="#9fb8a8">std::vector&lt;std::unique_ptr&lt;Shape&gt;&gt; zoo;</text>
    <text x="279" y="416" font-size="11" fill="#cfe8c6">zoo.push_back(make_unique&lt;Circle&gt;(2));</text>
    <text x="279" y="436" font-size="11" fill="#cfe8c6">zoo.push_back(make_unique&lt;Rect&gt;(3, 4));</text>
    <text x="279" y="456" font-size="11" fill="#cfe8c6">（智能指针 Day 71 正式学——今天看懂形状即可）</text>
    <text x="280" y="494" font-size="10.5" fill="#45703a">总面积循环零改动</text>
    <text x="572" y="494" font-size="10.5" fill="#8a8578">（Day 73 回来对账）</text>

    <path d="M 550,324 Q 730,318 905,324 Q 908,430 905,504 Q 730,510 552,504 Q 547,430 550,324 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(0.3 727 414)"/>
    <text x="727" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">成本账本（诚实记录）</text>
    <text x="572" y="388" font-size="12.5" fill="#3b3a36">空间：每个对象多一个 vptr（8 字节）</text>
    <text x="572" y="414" font-size="12.5" fill="#3b3a36">时间：每次虚调用多一次表查找</text>
    <text x="572" y="446" font-size="12.5" fill="#6b675e">（换来的是灵活性——绝大多数场景</text>
    <text x="572" y="466" font-size="12.5" fill="#6b675e">这笔开销微不足道；实时热路径再权衡）</text>
  </g>
</svg>
