    <text x="510" y="470" font-size="12" fill="#8a8578">下周预告：虚表机制、cast 三兄弟、坏例重构——</text>
    <text x="510" y="490" font-size="12" fill="#8a8578">图形库 v2/v3，Day 78 阶段大自测收官</text>
  </g>
