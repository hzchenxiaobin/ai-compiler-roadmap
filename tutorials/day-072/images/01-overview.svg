<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 72 项目日：图形库 v1——第 12 周总装大考</text>
    <path d="M 300,60 Q 480,52 660,61" fill="none" stroke="#e0955f" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">五天零件（继承/多态/虚析构/抽象/多态容器）一次装齐——计划第 12 周的收官验收</text>

    <path d="M 40,116 Q 470,110 905,117 L 901,310 Q 470,304 44,309 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 213)"/>
    <text x="472" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">零件清单（每天一件，今天全用上）</text>
    <text x="70" y="178" font-size="13" fill="#3b3a36">Shape 抽象基类（三纯虚 area/perimeter/name）　　　← Day 70 接口</text>
    <text x="70" y="204" font-size="13" fill="#3b3a36">report() 杠杆（非虚公共逻辑吃虚函数的饭）　　　　← Day 70 杠杆</text>
    <text x="70" y="230" font-size="13" fill="#3b3a36">virtual ~Shape() = default;（delete 完整收摊）　　← Day 69 虚析构</text>
    <text x="70" y="256" font-size="13" fill="#3b3a36">Circle/Rect/Square/Triangle/Ellipse 五种实现　　　← Day 67~68 继承多态</text>
    <text x="70" y="282" font-size="13" fill="#3b3a36">vector&lt;unique_ptr&lt;Shape&gt;&gt; + sort（多态容器）　　← Day 68 动物园升级</text>
    <text x="70" y="306" font-size="12.5" fill="#6b675e">（Square : Rect——is-a 的活用：正方形是矩形；复用 area/perimeter 只改 name）</text>

    <path d="M 40,334 Q 280,328 520,334 Q 524,430 520,504 Q 280,510 42,504 Q 36,430 40,334 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 419)"/>
    <text x="280" y="364" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">实测战报（全过）</text>
    <text x="64" y="394" font-size="12.5" fill="#3b3a36">排序前插入序：圆→矩形→正方形→三角形→椭圆</text>
    <text x="64" y="418" font-size="12.5" fill="#45703a">排序后面积升序：三角形(6)→矩形(12)→圆(12.57)→</text>
    <text x="64" y="438" font-size="12.5" fill="#45703a">　正方形(25)→椭圆(25.13)</text>
    <text x="64" y="466" font-size="12.5" fill="#3b3a36">总面积 80.6991（手算逐项核对 ✔）</text>
    <text x="64" y="490" font-size="12" fill="#8a8578">（-Wall 零警告）</text>

    <path d="M 550,334 Q 730,328 905,334 Q 908,430 905,504 Q 730,510 552,504 Q 547,430 550,334 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(0.3 727 419)"/>
    <text x="727" y="364" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">里程碑自测</text>
    <text x="572" y="394" font-size="12.5" fill="#3b3a36">□ 独立复现五形状 + 排序</text>
    <text x="572" y="418" font-size="12.5" fill="#3b3a36">□ 面积公式逐一手算核对</text>
    <text x="572" y="442" font-size="12.5" fill="#3b3a36">□ 能指认每个零件的出处</text>
    <text x="572" y="470" font-size="12.5" fill="#3b3a36">□ 加新形状零改 sort/循环</text>
    <text x="572" y="494" font-size="12" fill="#8a8578">（全勾 = 第 12 周收官）</text>

    <path d="M 60,520 Q 480,514 905,521" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="440" cy="520" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="520" r="5" fill="#e0955f"/>
    <text x="440" y="540" text-anchor="middle" font-size="12" font-weight="bold" fill="#9c5a22">Day 72（第 12 周收官）</text>
    <circle cx="680" cy="520" r="5" fill="#5b8db8"/>
    <text x="680" y="540" text-anchor="middle" font-size="12" fill="#3b3a36">第 13 周 虚表机制</text>
    <circle cx="860" cy="520" r="5" fill="#5b8db8"/>
    <text x="860" y="540" text-anchor="middle" font-size="12" fill="#3b3a36">……Day 78 里程碑</text>
  </g>
