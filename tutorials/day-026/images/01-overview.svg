<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 26 全貌：命名空间——给名片加姓氏</text>
    <path d="M 310,60 Q 480,52 650,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">多文件时代名片满天飞，同名怎么办？加姓氏：my_utils::clamp 一叫一个准</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,220 520,324 Q 280,330 42,324 Q 36,220 40,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 220)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">namespace my_utils { … }</text>
    <text x="64" y="178" font-size="12.5" fill="#3b3a36">姓氏一加：clamp、to_percent 都姓 my_utils</text>
    <text x="64" y="204" font-size="12.5" fill="#6b675e">头文件里声明穿姓，源文件里定义穿姓</text>
    <text x="64" y="230" font-size="12.5" fill="#6b675e">（昨天的三文件结构原样适用）</text>
    <text x="64" y="262" font-size="12.5" fill="#45703a">std 其实就是个命名空间——</text>
    <text x="64" y="286" font-size="12.5" fill="#45703a">std::cout 读了 25 天"全限定"，今天认亲</text>
    <text x="64" y="312" font-size="11.5" fill="#8a8578">（连 :: 都是老朋友：Day 11 的作用域解析运算符）</text>

    <path d="M 550,116 Q 730,110 905,116 Q 908,220 905,324 Q 730,330 552,324 Q 547,220 550,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(0.3 727 220)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">三种用法（宽松度递增）</text>
    <text x="572" y="178" font-size="12.5" fill="#3b3a36">全限定：my_utils::clamp(150, 0, 100)</text>
    <text x="572" y="202" font-size="12" fill="#8a8578">最啰嗦、最安全</text>
    <text x="572" y="228" font-size="12.5" fill="#3b3a36">using 声明：using my_utils::clamp;</text>
    <text x="572" y="252" font-size="12" fill="#8a8578">只放行一个名字</text>
    <text x="572" y="278" font-size="12.5" fill="#3b3a36">using 指令：using namespace my_utils;</text>
    <text x="572" y="302" font-size="12" fill="#8a8578">整扇门敞开（同名风险随之来）</text>

    <path d="M 40,350 Q 470,344 905,351 L 901,470 Q 470,464 44,469 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 410)"/>
    <text x="472" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">今天的撞名事故（实测）</text>
    <text x="70" y="412" font-size="13" fill="#3b3a36">两个命名空间各有一个 print_value，全限定调用相安无事；</text>
    <text x="70" y="440" font-size="13" fill="#a33f2e">两个都 using 进来再裸调 → error: call to 'print_value' is ambiguous</text>
    <text x="70" y="462" font-size="12.5" fill="#6b675e">收回一个 using → 编译通过（[A] 1 / [B] 2 / [A] 3，实测）</text>

    <path d="M 60,494 Q 480,488 905,495" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="240" cy="494" r="5" fill="#8a94a3"/>
    <text x="240" y="514" text-anchor="middle" font-size="12" fill="#3b3a36">Day 25 ✓</text>
    <circle cx="430" cy="494" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="430" cy="494" r="5" fill="#5b8db8"/>
    <text x="430" y="514" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 26（今天）</text>
    <circle cx="620" cy="494" r="5" fill="#5b8db8"/>
    <text x="620" y="514" text-anchor="middle" font-size="12" fill="#3b3a36">Day 27 链接</text>
    <circle cx="800" cy="494" r="5" fill="#e0955f"/>
    <text x="800" y="514" text-anchor="middle" font-size="12" fill="#3b3a36">Day 30 项目日</text>

    <rect x="140" y="524" width="680" height="26" fill="#f7e8a0" opacity="0.5" transform="rotate(-0.3 480 537)"/>
    <text x="480" y="542" text-anchor="middle" font-size="13" fill="#8a6d1a">铁则预告：using namespace 绝不写进头文件——受害者是所有包含它的人（明天细说）</text>
  </g>
</svg>
