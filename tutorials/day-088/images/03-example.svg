<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">六容器检测、能力实测与分类总表战报</text>
    <path d="M 320,58 Q 480,52 640,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21 -std=c++17；-Wall 零警告）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,490 Q 248,495 26,490 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 296)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出（节选）</text>
    <rect x="38" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./cp　（-Wall 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== 编译期检测 ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c6">vector：随机访问 ✔</text>
    <text x="54" y="240" font-size="11.5" fill="#cfe8c6">deque：随机访问 ✔</text>
    <text x="54" y="258" font-size="11.5" fill="#cfe8c6">list：双向　map：双向</text>
    <text x="54" y="276" font-size="11.5" fill="#cfe8c6">forward_list：前向</text>
    <text x="54" y="294" font-size="11.5" fill="#cfe8c6">istream：输入</text>
    <text x="54" y="322" font-size="12" fill="#9fb8a8">== 能力阶梯 ==</text>
    <text x="54" y="344" font-size="11.5" fill="#cfe8c6">vector：+=2→30；it[1]=40；</text>
    <text x="54" y="362" font-size="11.5" fill="#cfe8c6">　end-begin=4（三项全能）</text>
    <text x="54" y="386" font-size="11.5" fill="#cfe8c6">list：++ 后 -- 回来→10 ✔</text>
    <text x="54" y="408" font-size="11.5" fill="#cfe8c6">forward_list：++→20（-- 不可）</text>
    <text x="54" y="434" font-size="12" fill="#9fb8a8">== advance 万金油 ==</text>
    <text x="54" y="456" font-size="11.5" fill="#cfe8c6">list 上 advance(it,2)→30 ✔</text>
    <text x="54" y="480" font-size="11" fill="#9fb8a8">执法：list+=、flist-- 均编译错</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,490 Q 712,495 490,490 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 296)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">两周容器的收官拼图</text>
    <rect x="502" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">第 14 周（顺序容器）：</text>
    <text x="514" y="196" font-size="11.5" fill="#cfe8c6">五容器的结构 → 迭代器能力（80/82 埋）</text>
    <text x="514" y="224" font-size="12" fill="#9fb8a8">第 15 周（关联容器）：</text>
    <text x="514" y="246" font-size="11.5" fill="#cfe8c6">map/set 树族 + 哈希族 + multi 族</text>
    <text x="514" y="274" font-size="12" fill="#9fb8a8">今天（分类表）：</text>
    <text x="514" y="296" font-size="11.5" fill="#cfe8c6">把"哪个容器什么能力"收进一张表</text>
    <text x="514" y="326" font-size="12" fill="#9fb8a8">第 16 周（算法）的入场券：</text>
    <text x="514" y="348" font-size="11.5" fill="#cfe8c6">sort 要随机访问 / find 只要输入——</text>
    <text x="514" y="368" font-size="11.5" fill="#cfe8c6">　算法签名里的 It 名字就是要求</text>
    <text x="514" y="400" font-size="12.5" fill="#45703a">（88/144 = 61.1%——明天项目日</text>
    <text x="514" y="420" font-size="12.5" fill="#45703a">　LRU 缓存实战）</text>
    <text x="514" y="452" font-size="11.5" fill="#9fb8a8">（iterator_traits + if constexpr 是</text>
    <text x="514" y="470" font-size="11.5" fill="#9fb8a8">　第 17 周模板的先行预告）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">分类的本质</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">迭代器类别 = 能力的契约——容器结构决定它能提供哪级；算法按需索取最低级——两头解耦（STL 的设计之美）</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 89（项目日）——LRU 缓存项目（list + unordered_map 综合实战）</text>
  </g>
</svg>
