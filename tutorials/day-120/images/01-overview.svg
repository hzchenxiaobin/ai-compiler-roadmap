    <text x="70" y="468" font-size="13" fill="#3b3a36">day-076/077 图形库：已是 unique_ptr ✔｜day-055/057 三法则课：裸的是教具（白名单保留）｜MyString/IntArray：手写容器教学（同理）</text>
