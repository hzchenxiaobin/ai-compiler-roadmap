    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 120 项目日：全面智能指针化 + ASan 复查（第 20 周收官）</text>
    <path d="M 240,60 Q 480,52 720,61" fill="none" stroke="#e0955f" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"所有旧项目替换裸 new/delete + ASan 复查"——218 个源文件全量复扫：零警告零报错；改造模板用前后对照实证</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">改造的四行对照（实测）</text>
    <text x="64" y="180" font-size="11.5" fill="#a33f2e">Shape* shapes[3]; →</text>
    <text x="84" y="200" font-size="11.5" fill="#45703a">vector&lt;unique_ptr&lt;Shape&gt;&gt;</text>
    <text x="64" y="228" font-size="11.5" fill="#a33f2e">return new Circle(r); →</text>
    <text x="84" y="248" font-size="11.5" fill="#45703a">return make_unique&lt;Circle&gt;(r);</text>
    <text x="64" y="276" font-size="11.5" fill="#a33f2e">for … delete s; →</text>
    <text x="84" y="296" font-size="11.5" fill="#45703a">（删除——出作用域自动）</text>
    <text x="64" y="324" font-size="11.5" fill="#6b675e">虚析构 virtual ~Shape() 照留</text>
    <text x="64" y="344" font-size="11.5" fill="#6b675e">（= default——多态底线不动）</text>
    <text x="64" y="374" font-size="11" fill="#8a8578">（两版行为一致：总面积都 43 ✔）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
