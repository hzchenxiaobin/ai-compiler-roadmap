<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">同频 tie-break 与两版排序的对照</text>
    <path d="M 300,58 Q 480,52 660,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,330 Q 470,324 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 215)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">复合比较器：两级裁判</text>
    <rect x="110" y="146" width="740" height="150" fill="#33413a"/>
    <text x="480" y="176" font-size="12" fill="#9fb8a8">std::sort(items.begin(), items.end(),</text>
    <text x="480" y="200" font-size="12" fill="#cfe8c6">　[](const WordCount&amp; a, const WordCount&amp; b) {</text>
    <text x="480" y="224" font-size="12" fill="#cfe8c6">　　if (a.count != b.count) { return a.count &gt; b.count; }　←主裁：频次降序</text>
    <text x="480" y="248" font-size="12" fill="#cfe8c6">　　return a.word &lt; b.word;　　　　　　　　　　　 ←副裁：同频字典序</text>
    <text x="480" y="272" font-size="12" fill="#9fb8a8">　});</text>
    <text x="472" y="316" font-size="12" fill="#45703a">实测：dog×4 和 fox×4 同频 → 副裁出场 → dog 排前（d &lt; f）✔</text>

    <path d="M 40,354 Q 280,348 520,354 Q 524,470 520,576 Q 280,582 42,576 Q 36,470 40,354 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 465)"/>
    <text x="280" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">两版排序的语义</text>
    <text x="64" y="418" font-size="12" fill="#3b3a36">频序版：the×7 → dog×4 → fox×4 → a×3…</text>
    <text x="64" y="440" font-size="12" fill="#8a8578">（"谁最热"——排行榜的视角）</text>
    <text x="64" y="472" font-size="12" fill="#3b3a36">字典序版：a → and → barks → brown…</text>
    <text x="64" y="494" font-size="12" fill="#8a8578">（"字典怎么排"——检索的视角）</text>
    <text x="64" y="528" font-size="11.5" fill="#45703a">（同一份数据、两个 lambda——</text>
    <text x="64" y="548" font-size="11.5" fill="#45703a">　Day 84 教训"协作不竞争"的升级版）</text>

    <path d="M 550,354 Q 730,348 905,354 Q 908,470 905,576 Q 730,582 552,576 Q 547,470 550,354 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 465)"/>
    <text x="727" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">Top-N 的实现选择</text>
    <text x="572" y="418" font-size="12" fill="#3b3a36">今天：全排序后取前 N（O(n log n)）</text>
    <text x="572" y="440" font-size="11.5" fill="#8a8578">（17 词全排——简单够用）</text>
    <text x="572" y="472" font-size="12" fill="#3b3a36">大数据的进阶：partial_sort /</text>
    <text x="572" y="494" font-size="12" fill="#3b675e">　nth_element（O(n + N log N)）</text>
    <text x="572" y="526" font-size="11.5" fill="#8a8578">（第 16 周算法课的正式话题——今天埋钩）</text>
  </g>
</svg>
