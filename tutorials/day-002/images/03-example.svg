<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">未初始化的盒子：里面装的是运气</text>
    <path d="M 300,58 Q 480,52 660,59" fill="none" stroke="#c96a5a" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21）</text>

    <path d="M 24,102 Q 249,97 470,102 Q 474,238 470,372 Q 249,377 26,372 Q 20,238 24,102 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="3" transform="rotate(-0.4 247 237)"/>
    <text x="46" y="132" font-size="17" font-weight="bold" fill="#a33f2e">✘ int score;（只声明，未初始化）</text>
    <path d="M 60,158 Q 160,152 262,158 Q 266,208 262,258 Q 160,264 62,258 Q 56,208 60,158 Z" fill="#fffdf7" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.8 160 208)"/>
    <text x="160" y="188" text-anchor="middle" font-size="13" fill="#8a8578">盒子里不是空的，是</text>
    <text x="160" y="210" text-anchor="middle" font-size="13" fill="#8a8578">上一位使用者留下的值</text>
    <text x="160" y="238" text-anchor="middle" font-size="17" font-weight="bold" fill="#a33f2e">149946584</text>
    <path d="M 84,168 q 14,6 4,14 q -12,6 2,12" fill="none" stroke="#dda79b" stroke-width="2"/>
    <path d="M 216,164 q 10,8 2,14 q -10,8 4,14" fill="none" stroke="#dda79b" stroke-width="2"/>
    <rect x="46" y="282" width="424" height="40" rx="6" fill="#33413a"/>
    <text x="58" y="307" font-size="13" fill="#cfe8c6">$ ./uninit</text>
    <text x="58" y="323" font-size="12.5" fill="#f0c9c0">未初始化的 score = 149946584</text>
    <path d="M 46,332 Q 247,326 470,334 L 467,366 Q 247,360 49,365 Z" fill="#fffdf7" stroke="#c96a5a" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="56" y="352" font-size="11.5" fill="#a33f2e">-Wall 提前警告：uninitialized when used here，还附了 = 0 的修复提示</text>

    <path d="M 488,102 Q 713,97 934,102 Q 938,238 934,372 Q 713,377 490,372 Q 484,238 488,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(0.4 711 237)"/>
    <text x="510" y="132" font-size="17" font-weight="bold" fill="#45703a">✔ int safe_score = 0;（声明即初始化）</text>
    <path d="M 524,158 Q 624,152 726,158 Q 730,208 726,258 Q 624,264 526,258 Q 520,208 524,158 Z" fill="#fffdf7" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.8 624 208)"/>
    <text x="624" y="188" text-anchor="middle" font-size="13" fill="#8a8578">盒子在生成的那一刻</text>
    <text x="624" y="210" text-anchor="middle" font-size="13" fill="#8a8578">就被你亲手放进了确定的值</text>
    <text x="624" y="238" text-anchor="middle" font-size="17" font-weight="bold" fill="#45703a">0</text>
    <rect x="510" y="282" width="424" height="40" rx="6" fill="#33413a"/>
    <text x="522" y="307" font-size="13" fill="#cfe8c6">$ ./uninit（同一个程序的后半段）</text>
    <text x="522" y="323" font-size="12.5" fill="#cfe8c6">初始化后的 safe_score = 0</text>
    <path d="M 510,332 Q 711,326 934,334 L 931,366 Q 711,360 513,365 Z" fill="#fffdf7" stroke="#a8c494" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="520" y="352" font-size="11.5" fill="#45703a">无警告；每次运行都是 0，行为可预测</text>

    <text x="46" y="412" font-size="16" font-weight="bold" fill="#3b3a36">三条要点</text>
    <text x="46" y="442" font-size="14" fill="#3b3a36">1. 规则很简单：声明的同时就初始化，让盒子从第一秒起就有主</text>
    <text x="46" y="470" font-size="14" fill="#3b3a36">2. 昨天养成 的 -Wall 习惯，今天第一次救了你：警告连修复代码都给好了</text>
    <text x="46" y="498" font-size="14" fill="#3b3a36">3. 本机两次运行都恰好是 149946584——稳定只是巧合，换个环境就可能变</text>
    <path d="M 480,406 Q 710,400 906,407 L 903,506 Q 710,500 483,505 Z" fill="#fdf6dd" stroke="#d9b23a" stroke-width="2.2" transform="rotate(-0.3 695 456)"/>
    <text x="694" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1a">为什么不该读未初始化的值？</text>
    <text x="694" y="466" text-anchor="middle" font-size="12.5" fill="#6b675e">语言标准根本没有规定它是什么，</text>
    <text x="694" y="486" text-anchor="middle" font-size="12.5" fill="#6b675e">读它是"未定义行为"：结果可以是任何值</text>
  </g>
</svg>
