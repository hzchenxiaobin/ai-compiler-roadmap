<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 128 全貌：JsonValue——variant + 递归的六值模型</text>
    <path d="M 290,60 Q 480,52 670,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"variant + 递归结构"——两难题：六选一（variant 解）与自引用（unique_ptr 间接）——Day 121 选型原则兑现</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">两个设计难题与解法</text>
    <text x="64" y="180" font-size="12.5" fill="#45703a">难题一：六选一 → variant</text>
    <text x="64" y="202" font-size="12" fill="#8a8578">（类型安全联合——visit 穷尽）</text>
    <text x="64" y="232" font-size="12.5" fill="#a33f2e">难题二：自引用（值装值）→</text>
    <text x="64" y="254" font-size="12.5" fill="#a33f2e">　前向声明 + unique_ptr 间接</text>
    <text x="64" y="276" font-size="12" fill="#8a8578">（vector&lt;unique_ptr&lt;JsonValue&gt;&gt;）</text>
    <text x="64" y="310" font-size="12.5" fill="#6b675e">为什么不直接 vector&lt;JsonValue&gt;？</text>
    <text x="64" y="332" font-size="12" fill="#8a8578">（类型还没定义完就要用自己——无限大）</text>
    <text x="64" y="360" font-size="11.5" fill="#8a8578">（指针的大小固定 8 字——间接解环）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">variant vs 继承的选型（实测对照）</text>
    <rect x="572" y="164" width="320" height="90" fill="#33413a"/>
    <text x="732" y="188" font-size="10.5" fill="#cfe8c8">variant：封闭六选一 + visit</text>
    <text x="732" y="208" font-size="10" fill="#8a8578">（值语义/无堆分配/穷尽检查）</text>
    <text x="732" y="230" font-size="10.5" fill="#45703a">（JSON 值集合封闭 → 选它 ✔）</text>
    <rect x="572" y="266" width="320" height="90" fill="#33413a"/>
    <text x="732" y="290" font-size="10.5" fill="#9fb8a8">继承：开放 + 虚函数</text>
    <text x="732" y="310" font-size="10" fill="#8a8578">（Day 76 图形库风格——可加新形状）</text>
    <text x="732" y="332" font-size="10.5" fill="#8a8578">（要开放扩展的场景选它）</text>
    <text x="572" y="374" font-size="11.5" fill="#8a8578">（Day 121 的"封闭 variant 开放继承"——今天的实证）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">实测的面积账本</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">sizeof(JsonValue) = 32（variant 最大成员+标签）｜unique_ptr = 8（间接的代价）｜值语义的 variant 比"六派生各一次堆分配"的继承版省</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（monostate 当 null、map 保序键——每处选型都有数）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 127 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 128（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 129~131</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 144 终点</text>
  </g>
</svg>
