<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">单步跟踪实录与抓虫时间线</text>
    <path d="M 350,58 Q 480,52 610,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64，lldb-2103）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,230 470,360 Q 248,365 26,360 Q 20,230 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 231)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">实验 1：单步看变量跳舞</text>
    <rect x="38" y="146" width="420" height="204" rx="6" fill="#33413a"/>
    <text x="54" y="170" font-size="11.5" fill="#9fb8a8">断点停在第 9 行（sum += i 尚未执行）：</text>
    <text x="54" y="192" font-size="11.5" fill="#f0c9c0">-&gt; 9　sum += i;　(int) sum = 0，i = 1</text>
    <text x="54" y="216" font-size="11.5" fill="#9fb8a8">step-over 一步（第 9 行执行完，停第 10 行）：</text>
    <text x="54" y="238" font-size="11.5" fill="#cfe8c6">-&gt; 10　product *= i;　(int) sum = 1</text>
    <text x="54" y="266" font-size="11.5" fill="#9fb8a8">对照程序正常输出的第一行：</text>
    <text x="54" y="288" font-size="11.5" fill="#cfe8c6">i = 1，sum = 1，product = 1</text>
    <text x="54" y="318" font-size="12" fill="#9fb8a8">调试器看到的与 cout 打印的完全一致——</text>
    <text x="54" y="336" font-size="12" fill="#9fb8a8">但调试器不用改一行代码</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,230 934,360 Q 712,365 490,360 Q 484,230 488,102 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="3" transform="rotate(0.3 711 231)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#a33f2e">实验 2：抓虫时间线</text>
    <rect x="502" y="146" width="420" height="204" rx="6" fill="#33413a"/>
    <text x="514" y="170" font-size="11.5" fill="#9fb8a8">现象：想算 1+…+10，输出 total = 45（应 55）</text>
    <text x="514" y="196" font-size="11.5" fill="#cfe8c6">条件断点 --condition 'i == 9' 一击命中：</text>
    <text x="514" y="218" font-size="11.5" fill="#cfe8c6">-&gt; 8　total += i;　(int) i = 9，total = 36</text>
    <text x="514" y="240" font-size="11.5" fill="#f0c9c0">step-over 后：total = 45，i 仍是 9</text>
    <text x="514" y="266" font-size="11.5" fill="#9fb8a8">→ 再走一步就出循环：10 从未被加过！</text>
    <text x="514" y="292" font-size="11.5" fill="#cfe8c6">修复：i &lt; 10 改成 i &lt;= 10 → total = 55 ✔</text>
    <text x="514" y="322" font-size="12" fill="#9fb8a8">全程没加过一行打印语句</text>

    <path d="M 24,386 Q 470,380 905,387 L 901,480 Q 470,474 26,479 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 464 434)"/>
    <text x="46" y="414" font-size="15.5" font-weight="bold" fill="#2c5a82">命令速查卡（lldb ↔ gdb 对照）</text>
    <text x="46" y="446" font-size="12.5" fill="#3b3a36">设断点：breakpoint set --line N（gdb: break N）　　运行：run　　继续：continue</text>
    <text x="46" y="470" font-size="12.5" fill="#3b3a36">单步：thread step-over（gdb: next）　　查变量：frame variable（gdb: print x）　　退出：quit</text>

    <path d="M 24,500 Q 470,494 905,501 L 901,610 Q 470,604 26,609 Z" fill="#fdf6dd" stroke="#d9b23a" stroke-width="2.8" transform="rotate(0.2 464 555)"/>
    <text x="46" y="528" font-size="14" font-weight="bold" fill="#8a6d1a">调试思维两条公理</text>
    <text x="46" y="558" font-size="12.5" fill="#3b3a36">① 观察，不猜：先停下来看真实状态，再谈"我觉得"</text>
    <text x="46" y="584" font-size="12.5" fill="#3b3a36">② 二分定位：断点放中间，坏了往前挪、好了往后挪——每停一次砍掉一半怀疑范围</text>
  </g>
</svg>
