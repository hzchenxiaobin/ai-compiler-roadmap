<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 86 全貌：unordered 族——哈希的速度与代价</text>
    <path d="M 290,60 Q 480,52 670,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"性能对比实验"——实测 3.17 倍速度差；桶和 load_factor 亲手摸到；有序是 map 不可替代的护城河</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">哈希原理（桶模型）</text>
    <text x="64" y="180" font-size="12.5" fill="#3b3a36">键 → 哈希函数 → 桶编号 → 桶内比对</text>
    <text x="64" y="208" font-size="12.5" fill="#45703a">实测：apple→桶 1，banana→桶 4</text>
    <text x="64" y="230" font-size="12" fill="#8a8578">（banana 和 cherry 同桶——冲突！</text>
    <text x="64" y="250" font-size="12" fill="#8a8578">　桶内链表/探测解决）</text>
    <text x="64" y="284" font-size="12.5" fill="#45703a">load_factor = size/bucket_count</text>
    <text x="64" y="306" font-size="12" fill="#8a8578">（实测 0.6——超阈值自动扩桶重分布）</text>
    <text x="64" y="344" font-size="12.5" fill="#6b675e">O(1) 的来源：一次哈希计算直达桶——</text>
    <text x="64" y="366" font-size="12.5" fill="#6b675e">　不用像树那样一层层走</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">性能对决（计划指定实验）</text>
    <text x="572" y="180" font-size="12.5" fill="#3b3a36">10 万键的插入+全量查找：</text>
    <text x="572" y="208" font-size="12.5" fill="#6b675e">map（红黑树）：209 ms</text>
    <text x="572" y="232" font-size="12.5" fill="#45703a">unordered（哈希）：66 ms</text>
    <text x="572" y="262" font-size="13" fill="#45703a">→ 3.17 倍速度优势！</text>
    <text x="572" y="296" font-size="12" fill="#8a8578">（校验和双 ✔——正确性同分）</text>
    <text x="572" y="330" font-size="12.5" fill="#a33f2e">但：unordered 遍历无序</text>
    <text x="572" y="352" font-size="12" fill="#8a8578">（实测 cherry banana apple——</text>
    <text x="572" y="372" font-size="12" fill="#8a8578">　按桶位置不按字典序）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">两族的选型（速度换秩序）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">要快（计数/缓存/查存在）→ unordered　｜要有序遍历/范围查询（前缀/区间）→ map　｜自定义类型做键 → 哈希函数或比较器</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（两族 API 几乎同构——切换成本一行类型名）</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 85 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 86（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 87~88</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 89 项目日</text>
  </g>
</svg>
