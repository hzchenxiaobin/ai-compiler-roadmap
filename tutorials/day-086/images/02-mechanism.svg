<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">桶的地图、冲突与两族的结构对照</text>
    <path d="M 280,58 Q 480,52 680,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,339 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">5 个桶的地图（实测 bucket()）</text>
    <rect x="140" y="146" width="70" height="34" fill="#f1f4f7" stroke="#8a94a3" stroke-width="1.8"/>
    <text x="175" y="168" font-size="9.5" fill="#8a94a3">桶0</text>
    <rect x="220" y="146" width="70" height="34" fill="#d8ecce" stroke="#7aa663" stroke-width="2.2"/>
    <text x="255" y="168" font-size="9.5" fill="#45703a">桶1:apple</text>
    <rect x="300" y="146" width="70" height="34" fill="#f1f4f7" stroke="#8a94a3" stroke-width="1.8"/>
    <text x="335" y="168" font-size="9.5" fill="#8a94a3">桶2</text>
    <rect x="380" y="146" width="70" height="34" fill="#f1f4f7" stroke="#8a94a3" stroke-width="1.8"/>
    <text x="415" y="168" font-size="9.5" fill="#8a94a3">桶3</text>
    <rect x="460" y="146" width="140" height="56" fill="#f9d9b8" stroke="#e0955f" stroke-width="2.2"/>
    <text x="530" y="168" font-size="9.5" fill="#9c5a22">桶4:banana→cherry</text>
    <text x="530" y="186" font-size="8.5" fill="#8a8578">（冲突链！）</text>
    <text x="472" y="234" font-size="11.5" fill="#3b3a36">哈希函数：hash("apple")%5=1、hash("banana")%5=4、hash("cherry")%5=4（冲突）</text>
    <text x="472" y="260" font-size="11.5" fill="#6b675e">冲突处理：桶内挂链（banana → cherry 串一起）——查找时桶内逐个比对</text>
    <text x="472" y="290" font-size="11.5" fill="#45703a">load_factor 0.6 = 3 键/5 桶——超过 ~1.0 自动扩桶（rehash 重分布）</text>
    <text x="472" y="320" font-size="11" fill="#8a8578">（遍历顺序 = 桶号顺序——今天实测 cherry banana apple 的来源）</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,470 520,576 Q 280,582 42,576 Q 36,470 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">两族结构对照</text>
    <text x="64" y="428" font-size="12" fill="#3b3a36">map：树节点（键+值+三指针）</text>
    <text x="64" y="450" font-size="11.5" fill="#6b675e">（每个键一个节点——红黑规则维持）</text>
    <text x="64" y="480" font-size="12" fill="#3b3a36">unordered：桶数组+桶内链</text>
    <text x="64" y="502" font-size="11.5" fill="#6b675e">（哈希直达桶——树高消失）</text>
    <text x="64" y="536" font-size="11.5" fill="#8a8578">（map/set 的迭代器双向、unordered 是前向——</text>
    <text x="64" y="556" font-size="11.5" fill="#8a8578">　只能 ++ 不能 --，序没有意义）</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,470 905,576 Q 730,582 552,576 Q 547,470 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">自定义 key 的两条路</text>
    <text x="572" y="428" font-size="12" fill="#3b3a36">unordered 用自定义类：要传</text>
    <text x="572" y="450" font-size="11.5" fill="#6b675e">　hash 函数 + equal（判等）</text>
    <text x="572" y="480" font-size="12" fill="#3b3a36">map 用自定义类：只要</text>
    <text x="572" y="502" font-size="11.5" fill="#6b675e">　operator&lt;（能比序就行）</text>
    <text x="572" y="536" font-size="11.5" fill="#45703a">（string/int 这些标准类型两族都自带——</text>
    <text x="572" y="556" font-size="11.5" fill="#45703a">　自定义时 map 的门槛更低）</text>
  </g>
</svg>
