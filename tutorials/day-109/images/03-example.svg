<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">地址判定、日志实录与消除惊喜战报</text>
    <path d="M 370,58 Q 480,52 590,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21 -std=c++17；-Wall 零警告）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,490 Q 248,495 26,490 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 296)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出（节选）</text>
    <rect x="38" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./lr　（-Wall 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== 地址判定 ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c6">&amp;a ✔｜&amp;(10) ✘｜a+1 右值</text>
    <text x="54" y="248" font-size="12" fill="#9fb8a8">== 临时观察（计划指定） ==</text>
    <text x="54" y="270" font-size="11.5" fill="#cfe8c8">t2 = t1：[拷贝][析构]（左值源）</text>
    <text x="54" y="292" font-size="11.5" fill="#f0c9c0">t3 = Traced(3)：只 1 次构造！</text>
    <text x="54" y="310" font-size="10.5" fill="#9fb8a8">　（C++17 拷贝消除 ✔）</text>
    <text x="54" y="336" font-size="12" fill="#9fb8a8">== 返回临时 ==</text>
    <text x="54" y="358" font-size="11.5" fill="#cfe8c8">make_traced(4)：直接构造（NRVO）</text>
    <text x="54" y="382" font-size="12" fill="#9fb8a8">== 生死线 ==</text>
    <text x="54" y="404" font-size="11.5" fill="#cfe8c8">take(Traced(5))：构造→用→析构 ✔</text>
    <text x="54" y="428" font-size="12" fill="#9fb8a8">== const&amp; 延长 ==</text>
    <text x="54" y="450" font-size="11.5" fill="#cfe8c8">临时串活到作用域 ✔</text>
    <text x="54" y="474" font-size="12" fill="#9fb8a8">== 三分法 ==</text>
    <text x="54" y="496" font-size="11" fill="#9fb8a8">（lvalue/prvalue/xvalue 打印 ✔）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,490 Q 712,495 490,490 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 296)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">移动语义周的路标</text>
    <rect x="502" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">第 19 周（移动语义）：六天</text>
    <text x="514" y="198" font-size="11.5" fill="#cfe8c8">109 值类别（今天——地基）</text>
    <text x="514" y="218" font-size="11.5" fill="#cfe8c8">110 右值引用 + std::move 本质</text>
    <text x="514" y="238" font-size="11.5" fill="#cfe8c8">111 移动构造/赋值 + noexcept</text>
    <text x="514" y="258" font-size="11.5" fill="#cfe8c8">112 五法则 + =default/=delete</text>
    <text x="514" y="278" font-size="11.5" fill="#cfe8c8">113 完美转发 + forward</text>
    <text x="514" y="298" font-size="11.5" fill="#cfe8c8">114 项目日：移动 vs 拷贝基准</text>
    <text x="514" y="330" font-size="12" fill="#9fb8a8">历史伏笔的兑现清单：</text>
    <text x="514" y="352" font-size="11.5" fill="#cfe8c8">Day 79 扩容"搬新家"——111 讲怎么</text>
    <text x="514" y="372" font-size="11" fill="#9fb8a8">　搬得快（偷指针不拷数据）</text>
    <text x="514" y="400" font-size="11.5" fill="#cfe8c8">Day 92 vector 的 emplace_back——</text>
    <text x="514" y="420" font-size="11" fill="#9fb8a8">　113 完美转发的原型</text>
    <text x="514" y="452" font-size="12.5" fill="#45703a">（109/144 = 75.7%）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">值类别的意义</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">"这个值会不会马上消失"是编译器能回答的问题——回答了就能安全偷资源；移动语义的整座大厦建在今天的分类上</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 110 右值引用与 std::move——它只是类型转换、不移动任何东西（打日志验证）</text>
  </g>
</svg>
