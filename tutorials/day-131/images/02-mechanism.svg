<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">strtod 的"吃了多少"与 JSON 的额外四禁</text>
    <path d="M 290,58 Q 480,52 670,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">"1.2.3" 的两段命运（strtod 视角）</text>
    <rect x="110" y="146" width="360" height="170" fill="#33413a"/>
    <text x="290" y="172" font-size="11" fill="#9fb8a8">输入："1.2.3"</text>
    <text x="290" y="196" font-size="10.5" fill="#cfe8c8">strtod(&quot;1.2.3&quot;, &amp;end)：</text>
    <text x="290" y="220" font-size="10.5" fill="#cfe8c8">　解析 "1.2" → 值 1.2</text>
    <text x="290" y="244" font-size="10.5" fill="#f0c9c0">　end 停在第二个 '.' → 剩 ".3"</text>
    <text x="290" y="268" font-size="10.5" fill="#f0c9c0">　吃 3/5 ≠ 全吃 → 拒收！</text>
    <text x="290" y="296" font-size="10" fill="#8a8578">（consumed 字段是判据）</text>
    <rect x="510" y="146" width="340" height="170" fill="#33413a"/>
    <text x="680" y="172" font-size="11" fill="#9fb8a8">对照"3.14"：</text>
    <text x="680" y="196" font-size="10.5" fill="#cfe8c8">strtod 解析全部 → end 指结尾</text>
    <text x="680" y="220" font-size="10.5" fill="#cfe8c8">　吃 4/4 == 全吃 ✔</text>
    <text x="680" y="248" font-size="10.5" fill="#45703a">（consumed == size → 合法）</text>
    <text x="680" y="276" font-size="10" fill="#8a8578">（end 指针是 strtod 的"吃到了哪"）</text>
    <text x="680" y="300" font-size="10" fill="#8a8578">（ errno==ERANGE 查溢出）</text>
    <text x="472" y="334" font-size="11.5" fill="#8a8578">（一个指标判合法：吃没吃全——简单而完备）</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">JSON 的额外四禁</text>
    <rect x="64" y="412" width="430" height="150" fill="#33413a"/>
    <text x="279" y="436" font-size="10.5" fill="#f0c9c0">01 → 前导零（历史：C 的八进制）</text>
    <text x="279" y="458" font-size="10.5" fill="#f0c9c0">+1 → 加号开头（要 -1 不能 +1）</text>
    <text x="279" y="480" font-size="10.5" fill="#f0c9c0">.5 → 点开头（要 0.5）</text>
    <text x="279" y="502" font-size="10.5" fill="#f0c9c0">5. → 点结尾（要 5.0）</text>
    <text x="279" y="530" font-size="10" fill="#8a8578">（json_extra_check 的四条——比 strtod 更严）</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">2^53 的精度悬崖</text>
    <rect x="572" y="412" width="320" height="150" fill="#33413a"/>
    <text x="732" y="436" font-size="10.5" fill="#9fb8a8">double 的尾数 52 位：</text>
    <text x="732" y="458" font-size="10.5" fill="#cfe8c8">≤ 2^53（9.007e15）：整数无损</text>
    <text x="732" y="482" font-size="10.5" fill="#f0c9c0">2^53+1 → 9007199254740993</text>
    <text x="732" y="502" font-size="10.5" fill="#f0c9c0">　解析成 9.0072e15（损 1！）</text>
    <text x="732" y="530" font-size="10" fill="#8a8578">（实测对照——double 的诚实边界）</text>
  </g>
</svg>
