<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">九合法、五畸形、七分歧与溢出战报</text>
    <path d="M 370,58 Q 480,52 590,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21 -std=c++20 -Wall -Wextra；ASan 零报错）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,490 Q 248,495 26,490 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 296)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出（节选）</text>
    <rect x="38" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./ns　（c++20 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== 九合法 ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c8">0/-1/3.14/1e5/2.5E-3/42 ✔</text>
    <text x="54" y="242" font-size="11.5" fill="#cfe8c8">-0.5/1.602e-19/6.02e23 ✔</text>
    <text x="54" y="266" font-size="12" fill="#9fb8a8">== 五畸形（吃一半） ==</text>
    <text x="54" y="288" font-size="11.5" fill="#f0c9c0">1.2.3 剩 .3｜1e 剩 e ✔</text>
    <text x="54" y="308" font-size="11.5" fill="#f0c9c0">12abc 剩 abc｜3.14.15 ✔</text>
    <text x="54" y="332" font-size="12" fill="#9fb8a8">== 七分歧 ==</text>
    <text x="54" y="354" font-size="11.5" fill="#cfe8c8">01/+1/.5/5. → JSON 拒 ✔</text>
    <text x="54" y="374" font-size="11.5" fill="#cfe8c8">0x1A/infinity/nan → 没有 ✔</text>
    <text x="54" y="398" font-size="12" fill="#9fb8a8">== 溢出 ==</text>
    <text x="54" y="420" font-size="11.5" fill="#f0c9c0">1e400→inf｜-1e400→-inf ✔</text>
    <text x="54" y="440" font-size="11.5" fill="#cfe8c8">1e-400→0（下溢）✔</text>
    <text x="54" y="464" font-size="11.5" fill="#9fb8a8">2^53+1 → 9.0072e15（损 1）✔</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,490 Q 712,495 490,490 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 296)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">Tokenizer 的三栈完成</text>
    <rect x="502" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">词法层的三块拼图：</text>
    <text x="514" y="198" font-size="11.5" fill="#cfe8c8">符号（127 原型）✔</text>
    <text x="514" y="218" font-size="11.5" fill="#cfe8c8">字符串（129 五转义→130 全量）✔</text>
    <text x="514" y="238" font-size="11.5" fill="#f0c9c0">数字（今天 strtod 严格）✔</text>
    <text x="514" y="268" font-size="12" fill="#9fb8a8">明天（132）：Parser 骨架</text>
    <text x="514" y="290" font-size="11" fill="#9fb8a8">　（object/array 的递归下降</text>
    <text x="514" y="308" font-size="11" fill="#9fb8a8">　　——记号流 → JsonValue 树）</text>
    <text x="514" y="338" font-size="12" fill="#9fb8a8">Day 129 遗留的正式关闭：</text>
    <text x="514" y="360" font-size="11" fill="#9fb8a8">　（"1.2.3" 放行 → 今天拒收</text>
    <text x="514" y="378" font-size="11" fill="#9fb8a8">　　——渐进完整的又一兑现）</text>
    <text x="514" y="410" font-size="12.5" fill="#45703a">（131/144 = 91%）</text>
    <text x="514" y="440" font-size="11" fill="#9fb8a8">（剩 13 天：Parser×2 + 打通 +</text>
    <text x="514" y="458" font-size="11" fill="#9fb8a8">　访问/序列化 + 测试 + 终验收）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">strtod 的哲学</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">"吃到哪"（end 指针）和"吃没吃全"（consumed == size）——两个朴素的问题就完成了严格验证；站在标准库的肩膀上比手写文法机稳一百倍</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 132 Parser 骨架——object/array 的递归下降（记号流 → 树）</text>
  </g>
</svg>
