<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">降序二分的方向修正与头文件的职责边界</text>
    <path d="M 240,58 Q 480,52 720,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,339 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">降序数组的 lower_bound（今天新招）</text>
    <rect x="110" y="146" width="740" height="120" fill="#33413a"/>
    <text x="480" y="176" font-size="11.5" fill="#9fb8a8">排序（降序）：Grace(95) Alice(92) David(92) Charlie(85) Frank(85) Bob(78)…</text>
    <text x="480" y="206" font-size="11.5" fill="#cfe8c6">lower_bound(begin, end, 85,</text>
    <text x="480" y="226" font-size="11.5" fill="#cfe8c6">　[](const Student&amp; s, int val) { return s.score &gt; val; });</text>
    <text x="480" y="252" font-size="11" fill="#f0c9c0">→ 下标 3（Charlie 85——第一个"不再 >85"的位置，含边界）</text>
    <text x="472" y="296" font-size="12" fill="#3b3a36">升序默认用 &lt;；降序必须给反向比较器（&gt;）——否则二分方向错乱（自信错误）</text>
    <text x="472" y="322" font-size="11.5" fill="#8a8578">（Day 94 的"有序前提"升级为"有序 + 方向匹配"）</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">头文件的职责边界</text>
    <text x="64" y="428" font-size="12" fill="#3b3a36">student.h：纯数据（无逻辑）</text>
    <text x="64" y="452" font-size="11.5" fill="#8a8578">（改字段只动一处——所有包含者重编）</text>
    <text x="64" y="482" font-size="12" fill="#3b3a36">stats.h：接口（承诺不给实现）</text>
    <text x="64" y="506" font-size="11.5" fill="#8a8578">（调用方只看声明——Day 53 暴露面最小化）</text>
    <text x="64" y="536" font-size="12" fill="#3b3a36">stats.cpp：实现（可换不动接口）</text>
    <text x="64" y="558" font-size="11.5" fill="#8a8578">（改算法调用方零改动——解耦红利）</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">编译与链接</text>
    <rect x="572" y="412" width="320" height="130" fill="#33413a"/>
    <text x="732" y="438" font-size="11" fill="#9fb8a8">g++ -Wall -std=c++17 \</text>
    <text x="732" y="458" font-size="11" fill="#cfe8c6">　main.cpp stats.cpp -o sms</text>
    <text x="732" y="486" font-size="10.5" fill="#9fb8a8">（两个 .cpp 分别编译成 .o</text>
    <text x="732" y="504" font-size="10.5" fill="#9fb8a8">　再链接成可执行）</text>
    <text x="732" y="530" font-size="10.5" fill="#8a8578">#pragma once 防重复包含</text>
  </g>
</svg>
