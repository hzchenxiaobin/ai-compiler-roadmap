<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">instance() 的唯一性原理与守卫的移交</text>
    <path d="M 290,58 Q 480,52 670,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,300 Q 470,294 44,299 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 200)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">函数内 static 的唯一性（Day 11 伏笔回收）</text>
    <rect x="180" y="146" width="600" height="120" fill="#33413a"/>
    <text x="480" y="172" font-size="11.5" fill="#cfe8c6">static Logger&amp; instance() {</text>
    <text x="480" y="194" font-size="11.5" fill="#cfe8c6">　　static Logger the_one;　←首次调用初始化（仅一次）</text>
    <text x="480" y="216" font-size="11.5" fill="#cfe8c6">　　return the_one;　　　　　←之后每次都返回同一个</text>
    <text x="480" y="238" font-size="11.5" fill="#cfe8c6">}</text>
    <text x="472" y="286" font-size="12" fill="#9fb8a8">（C++11 起线程安全——并发下也只建一次）</text>

    <path d="M 40,324 Q 280,318 520,324 Q 524,440 520,556 Q 280,562 42,556 Q 36,440 40,324 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 440)"/>
    <text x="280" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">守卫的两条路线</text>
    <text x="64" y="390" font-size="12.5" fill="#45703a">引用路线：process(f)</text>
    <text x="64" y="412" font-size="12" fill="#6b675e">　f 借出使用权 → 用完归还</text>
    <text x="64" y="432" font-size="12" fill="#6b675e">　→ f 出块自己关（唯一不变）</text>
    <text x="64" y="468" font-size="12.5" fill="#45703a">移动路线：g = std::move(f)</text>
    <text x="64" y="490" font-size="12" fill="#6b675e">　守卫权转给 g，f.fd_ = -1（失活）</text>
    <text x="64" y="510" font-size="12" fill="#6b675e">　→ g 出块关；f 析构判空守卫不重复关</text>
    <text x="64" y="542" font-size="12" fill="#8a8578">（移动是 Day 111 正课——今天看懂</text>
    <text x="64" y="560" font-size="12" fill="#8a8578">　"所有权转移"这四个字即可）</text>

    <path d="M 550,324 Q 730,318 905,324 Q 908,440 905,556 Q 730,562 552,556 Q 547,440 550,324 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(0.3 727 440)"/>
    <text x="727" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">两条执法线（实测）</text>
    <rect x="572" y="372" width="320" height="80" fill="#33413a"/>
    <text x="732" y="396" font-size="10.5" fill="#9fb8a8">Logger l;（私有构造）</text>
    <text x="732" y="416" font-size="10.5" fill="#ffd7d0">error: calling a private constructor</text>
    <text x="732" y="436" font-size="10.5" fill="#9fb8a8">　of class 'Logger'</text>
    <rect x="572" y="466" width="320" height="66" fill="#33413a"/>
    <text x="732" y="490" font-size="10.5" fill="#9fb8a8">Logger l2 = instance();（=delete）</text>
    <text x="732" y="510" font-size="10.5" fill="#ffd7d0">error: call to deleted constructor</text>
    <text x="732" y="544" font-size="12" fill="#a33f2e">两道门各拦一条——单例的铜墙铁壁</text>
  </g>
</svg>
