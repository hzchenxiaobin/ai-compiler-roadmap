<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">换行残留：>> 和 getline 混用的那颗雷</text>
    <path d="M 300,58 Q 480,52 660,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 460,94 905,100 Q 909,230 905,360 Q 460,366 44,361 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(-0.2 472 230)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">传送带上发生了什么（本机实测的两条命运）</text>
    <text x="70" y="162" font-size="12.5" fill="#3b3a36">喂入内容：『20⏎ Xiao Ming⏎』（⏎ 是换行符）</text>
    <text x="70" y="192" font-size="12.5" fill="#3b3a36">① cin &gt;&gt; age：吃掉 20，看到 ⏎ 停下——『⏎ Xiao Ming⏎』留在带上</text>
    <text x="70" y="222" font-size="12.5" fill="#a33f2e">② getline(name)：从 ⏎ 开始读——立刻撞到行尾，抱回一个空串！</text>
    <rect x="70" y="240" width="380" height="44" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2" transform="rotate(-0.4 260 262)"/>
    <text x="260" y="258" text-anchor="middle" font-size="12" fill="#a33f2e">坑版输出：读到的 name 是【】，长度 0</text>
    <text x="260" y="276" text-anchor="middle" font-size="11" fill="#8a8578">（Xiao Ming 还在带上，没被读到）</text>
    <rect x="480" y="240" width="400" height="44" fill="#eef5e8" stroke="#7aa663" stroke-width="2" transform="rotate(0.4 680 262)"/>
    <text x="680" y="258" text-anchor="middle" font-size="12" fill="#45703a">修复版输出：读到的 name 是【Xiao Ming】，长度 9</text>
    <text x="680" y="276" text-anchor="middle" font-size="11" fill="#8a8578">（差异只有一行：cin.ignore(10000, '\n')）</text>
    <text x="70" y="316" font-size="12.5" fill="#3b3a36">规则：&gt;&gt; 之后要 getline，中间必须先冲掉残留换行</text>
    <text x="70" y="344" font-size="12.5" fill="#6b675e">（Day 4 抢救三件套的 ignore 在这里华丽转身：从"救火"变"日常"）</text>

    <path d="M 40,390 Q 280,384 520,390 Q 524,470 520,556 Q 280,562 42,556 Q 36,470 40,390 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 473)"/>
    <text x="280" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">切词流水线（实测 6 词）</text>
    <rect x="70" y="436" width="420" height="34" fill="#33413a"/>
    <text x="280" y="458" text-anchor="middle" font-size="11.5" fill="#cfe8c6">the quick··brown→fox→jumps over</text>
    <text x="280" y="496" text-anchor="middle" font-size="12.5" fill="#45703a">while (ss &gt;&gt; word)：跳过任意空白取一词</text>
    <text x="280" y="524" text-anchor="middle" font-size="12" fill="#6b675e">多空格、制表符全自动——手工 find/substr 的</text>
    <text x="280" y="544" text-anchor="middle" font-size="12" fill="#6b675e">"连续空格"边界问题今天自动免疫</text>

    <path d="M 550,390 Q 740,384 930,390 Q 934,470 930,556 Q 740,562 552,556 Q 546,470 550,390 Z" fill="#fdf6dd" stroke="#d9b23a" stroke-width="2.8" transform="rotate(0.3 740 473)"/>
    <text x="740" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d1a">黄金搭档（明天的主循环）</text>
    <text x="570" y="452" font-size="12.5" fill="#3b3a36">while (getline(cin, line)) {</text>
    <text x="590" y="476" font-size="12.5" fill="#3b3a36">istringstream ss(line);</text>
    <text x="590" y="500" font-size="12.5" fill="#3b3a36">while (ss &gt;&gt; word) { … }</text>
    <text x="570" y="524" font-size="12.5" fill="#3b3a36">}</text>
    <text x="740" y="550" text-anchor="middle" font-size="12" fill="#8a8578">外层读行、内层切词——文本统计器的骨架</text>
  </g>
</svg>
