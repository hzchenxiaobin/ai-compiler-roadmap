<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 40 全貌：const 的对象级升级、mutable 后门与 static 共享</text>
    <path d="M 250,60 Q 480,52 710,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">Day 22 的 const 锁从指针/引用升级到整个对象；mutable 给缓存开合法后门；static 让全类共享一份账本</text>

    <path d="M 40,116 Q 250,110 460,116 Q 464,240 460,376 Q 250,382 42,376 Q 36,240 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 250 246)"/>
    <text x="250" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">const 对象 = 冻结</text>
    <text x="64" y="180" font-size="13" fill="#3b3a36">const Rectangle frozen(10, 20);</text>
    <text x="64" y="208" font-size="13" fill="#45703a">✔ frozen.area()　（const 成员函数）</text>
    <text x="64" y="236" font-size="13" fill="#a33f2e">✘ frozen.scale(2)（非 const，编译拦截）</text>
    <text x="64" y="274" font-size="12.5" fill="#6b675e">实测报错：'this' argument … has type</text>
    <text x="64" y="296" font-size="12.5" fill="#6b675e">'const Rectangle', but function is not marked const</text>
    <text x="64" y="334" font-size="12.5" fill="#6b675e">const 成员函数 = 承诺不改成员（Day 37 在用，</text>
    <text x="64" y="356" font-size="12.5" fill="#6b675e">今天补上"为什么"和"const 对象的强制力"）</text>

    <path d="M 490,116 Q 700,110 910,116 Q 913,240 910,376 Q 700,382 492,376 Q 487,240 490,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 700 246)"/>
    <text x="700" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">mutable：const 里的合法后门</text>
    <text x="514" y="180" font-size="13" fill="#3b3a36">mutable int area_calls_;（计数器）</text>
    <text x="514" y="208" font-size="13" fill="#3b3a36">mutable double cached_area_;（缓存）</text>
    <text x="514" y="242" font-size="12.5" fill="#45703a">area() const 里照样 ++ / 写缓存 ✔</text>
    <text x="514" y="276" font-size="12.5" fill="#6b675e">适用边界：逻辑状态（radius_）不许改；</text>
    <text x="514" y="298" font-size="12.5" fill="#6b675e">实现细节（计数/缓存）可以改——</text>
    <text x="514" y="320" font-size="12.5" fill="#6b675e">观察行为不变，const 承诺就没破</text>
    <text x="514" y="356" font-size="12" fill="#8a8578">（实测：调 3 次只算 1 遍，缓存生效）</text>

    <path d="M 40,400 Q 470,394 905,401 L 901,494 Q 470,488 44,493 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 447)"/>
    <text x="472" y="430" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#a33f2e">static：全类一份的共享账本</text>
    <text x="70" y="460" font-size="13" fill="#3b3a36">static int alive_：不属于任何对象——类外定义（int Widget::alive_ = 0;），静态成员函数 Widget::alive() 免对象调用</text>
    <text x="70" y="484" font-size="12.5" fill="#6b675e">实测：构造 ++ / 析构 --，进出块数字精确呼应 Day 39 的逆序销毁</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 37~39 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 40（今天）</text>
    <circle cx="640" cy="514" r="5" fill="#5b8db8"/>
    <text x="640" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 41 组合</text>
    <circle cx="840" cy="514" r="5" fill="#e0955f"/>
    <text x="840" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 42 项目日</text>
  </g>
</svg>
