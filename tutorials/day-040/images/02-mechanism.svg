<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">两种布局的内存图与拆除的逆依赖序</text>
    <path d="M 250,58 Q 480,52 710,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,324 Q 470,318 44,323 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 210)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">锯齿阵 vs 一维折叠（实测地址）</text>
    <rect x="80" y="146" width="360" height="150" fill="#fffdf7" stroke="#5b8db8" stroke-width="2"/>
    <text x="260" y="170" text-anchor="middle" font-size="11.5" fill="#2c5a82">锯齿阵（3 次分配）：</text>
    <rect x="100" y="182" width="90" height="30" fill="#d8ecce" stroke="#7aa663" stroke-width="1.8"/>
    <text x="145" y="202" text-anchor="middle" font-size="9" fill="#45703a">m: [→,→]</text>
    <rect x="210" y="182" width="100" height="30" fill="#f9d9b8" stroke="#e0955f" stroke-width="1.8"/>
    <text x="260" y="202" text-anchor="middle" font-size="9" fill="#9c5a22">行0: 1 2 3</text>
    <rect x="330" y="182" width="100" height="30" fill="#f9d9b8" stroke="#e0955f" stroke-width="1.8"/>
    <text x="380" y="202" text-anchor="middle" font-size="9" fill="#9c5a22">行1: 4 5 6</text>
    <path d="M 190,197 Q 200,197 208,197" fill="none" stroke="#3b3a36" stroke-width="1.6"/>
    <path d="M 190,210 Q 240,240 328,205" fill="none" stroke="#3b3a36" stroke-width="1.6"/>
    <text x="260" y="238" text-anchor="middle" font-size="10" fill="#8a8578">0x…52c0 / 52d0 / 52e0（三块独立）</text>
    <text x="260" y="262" text-anchor="middle" font-size="10.5" fill="#6b675e">行间缝 4 字节（52dc→52e0）</text>
    <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#6b675e">释放：delete[] 行0、行1、m（3 次）</text>
    <rect x="480" y="146" width="400" height="150" fill="#fffdf7" stroke="#7aa663" stroke-width="2"/>
    <text x="680" y="170" text-anchor="middle" font-size="11.5" fill="#45703a">一维折叠（1 次分配）：</text>
    <rect x="500" y="182" width="360" height="30" fill="#d8ecce" stroke="#7aa663" stroke-width="1.8"/>
    <text x="680" y="202" text-anchor="middle" font-size="9.5" fill="#45703a">flat: 1 2 3 4 5 6（一整块）</text>
    <text x="680" y="238" text-anchor="middle" font-size="10" fill="#8a8578">0x…52f0 起连续 24 字节</text>
    <text x="680" y="262" text-anchor="middle" font-size="10.5" fill="#6b675e">at(1,2) = flat[1*3+2] = flat[5] = 6</text>
    <text x="680" y="284" text-anchor="middle" font-size="10.5" fill="#6b675e">行行无缝（…f8→…fc）｜释放：delete[] flat</text>
    <text x="472" y="312" text-anchor="middle" font-size="12" fill="#9fb8a8">（锯齿支持每行不同长；折叠强制矩形、泄漏面小——Day 65 Matrix 选折叠）</text>

    <path d="M 40,344 Q 470,338 905,345 L 901,576 Q 470,570 44,575 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.2 472 460)"/>
    <text x="472" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">free_matrix 的逆依赖序（实测 5 次全对）</text>
    <rect x="150" y="392" width="660" height="120" fill="#33413a"/>
    <text x="170" y="420" font-size="12" fill="#cfe8c6">void free_matrix(int** m, int rows) {</text>
    <text x="170" y="444" font-size="12" fill="#cfe8c6">　for (i &lt; rows) delete[] m[i];　←先还每行（住户先走）</text>
    <text x="170" y="468" font-size="12" fill="#cfe8c6">　delete[] m;　　　　　　　　　 ←再还指针数组（最后拆楼板）</text>
    <text x="170" y="492" font-size="11.5" fill="#9fb8a8">}</text>
    <text x="472" y="540" text-anchor="middle" font-size="12.5" fill="#45703a">顺序反了：先 delete[] m → m[i] 全悬空 → 逐行释放读悬空（ASan 立刻抓）</text>
    <text x="472" y="564" text-anchor="middle" font-size="12" fill="#8a8578">（"依赖谁就后拆谁"——和 Day 50 逆序销毁、Day 51 析构顺序是同一条工程原则）</text>
  </g>
</svg>
