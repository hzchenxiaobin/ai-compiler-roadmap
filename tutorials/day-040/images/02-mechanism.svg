<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">const 的三级火箭与 static 的共享屋</text>
    <path d="M 320,58 Q 480,52 640,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,260 Q 470,254 44,259 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 180)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">const 的成长史（三级火箭）</text>
    <rect x="70" y="144" width="250" height="44" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="195" y="162" text-anchor="middle" font-size="11" fill="#45703a">Day 22：const 修饰变量/指针</text>
    <text x="195" y="180" text-anchor="middle" font-size="11" fill="#8a8578">（锁单个名字）</text>
    <rect x="350" y="144" width="250" height="44" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="475" y="162" text-anchor="middle" font-size="11" fill="#9c5a22">Day 37~38：const 成员函数</text>
    <text x="475" y="180" text-anchor="middle" font-size="11" fill="#8a8578">（锁成员函数的 this）</text>
    <rect x="630" y="144" width="250" height="44" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2"/>
    <text x="755" y="162" text-anchor="middle" font-size="11" fill="#a33f2e">Day 40：const 对象</text>
    <text x="755" y="180" text-anchor="middle" font-size="11" fill="#8a8578">（冻结整个对象）</text>
    <text x="472" y="222" text-anchor="middle" font-size="12.5" fill="#3b3a36">三级联动：const 对象 → 只能调 const 成员函数 → 函数内 this 是 const → 改成员即编译错</text>
    <text x="472" y="246" text-anchor="middle" font-size="12.5" fill="#6b675e">（mutable 是唯一出口——但只放行"实现细节"不放行"逻辑状态"）</text>

    <path d="M 40,284 Q 280,278 520,284 Q 524,420 520,556 Q 280,562 42,556 Q 36,420 40,284 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 420)"/>
    <text x="280" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">static 的共享屋</text>
    <rect x="80" y="332" width="150" height="56" fill="#fffdf7" stroke="#7aa663" stroke-width="2.2"/>
    <text x="155" y="356" text-anchor="middle" font-size="10.5" fill="#3b3a36">对象 a</text>
    <text x="155" y="374" text-anchor="middle" font-size="9.5" fill="#8a8578">name_ = "甲"</text>
    <rect x="250" y="332" width="150" height="56" fill="#fffdf7" stroke="#7aa663" stroke-width="2.2"/>
    <text x="325" y="356" text-anchor="middle" font-size="10.5" fill="#3b3a36">对象 b</text>
    <text x="325" y="374" text-anchor="middle" font-size="9.5" fill="#8a8578">name_ = "乙"</text>
    <rect x="130" y="410" width="220" height="52" fill="#f9d9b8" stroke="#e0955f" stroke-width="2.4"/>
    <text x="240" y="432" text-anchor="middle" font-size="10.5" fill="#9c5a22">static int alive_（全类一份）</text>
    <text x="240" y="450" text-anchor="middle" font-size="9.5" fill="#8a8578">类外定义：int Widget::alive_ = 0;</text>
    <path d="M 155,390 Q 190,400 220,410" fill="none" stroke="#e0955f" stroke-width="2"/>
    <path d="M 325,390 Q 290,400 260,410" fill="none" stroke="#e0955f" stroke-width="2"/>
    <text x="280" y="490" font-size="12" fill="#45703a">static 成员函数 Widget::alive()：</text>
    <text x="280" y="510" font-size="12" fill="#45703a">没有对象也能调（不吃 this）</text>
    <text x="280" y="542" font-size="11.5" fill="#8a8578">（实测开局就能调：存活数 = 0）</text>

    <path d="M 550,284 Q 740,278 930,284 Q 933,420 930,556 Q 740,562 552,556 Q 547,420 550,284 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 740 420)"/>
    <text x="740" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">选型速查</text>
    <text x="572" y="348" font-size="12.5" fill="#3b3a36">成员函数要不要 const？</text>
    <text x="572" y="370" font-size="12" fill="#6b675e">不改成员就标上（const 正确性，</text>
    <text x="572" y="390" font-size="12" fill="#6b675e">　const 对象才调得了）</text>
    <text x="572" y="424" font-size="12.5" fill="#3b3a36">成员要不要 mutable？</text>
    <text x="572" y="446" font-size="12" fill="#6b675e">仅限计数器/缓存这类实现细节</text>
    <text x="572" y="480" font-size="12.5" fill="#3b3a36">成员要不要 static？</text>
    <text x="572" y="502" font-size="12" fill="#6b675e">全类共享且不属于个体时</text>
    <text x="572" y="522" font-size="12" fill="#6b675e">　（计数器/总数/共享配置）</text>
  </g>
</svg>
