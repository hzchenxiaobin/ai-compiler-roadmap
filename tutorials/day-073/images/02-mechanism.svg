<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">p-&gt;who() 的四步走白板图（实测地址填充）</text>
    <path d="M 250,58 Q 480,52 710,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,350 Q 470,344 44,349 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 225)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">Derived d；Base* p = &amp;d；p-&gt;who();</text>
    <rect x="80" y="146" width="200" height="60" fill="#d8ecce" stroke="#7aa663" stroke-width="2.2"/>
    <text x="180" y="170" font-size="11" fill="#45703a">①对象 d（栈）</text>
    <text x="180" y="190" font-size="9.5" fill="#8a8578">头 8 字节 = vptr</text>
    <rect x="380" y="146" width="200" height="60" fill="#f9d9b8" stroke="#e0955f" stroke-width="2.2"/>
    <text x="480" y="170" font-size="11" fill="#9c5a22">②虚表 @ 0x102e20010</text>
    <text x="480" y="190" font-size="9.5" fill="#8a8578">（Derived 的表——只读数据段）</text>
    <rect x="680" y="146" width="200" height="60" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.2"/>
    <text x="780" y="170" font-size="11" fill="#a33f2e">④Derived::who 代码</text>
    <text x="780" y="190" font-size="9.5" fill="#8a8578">（@ 0x102e1ca48 附近）</text>
    <path d="M 282,176 Q 330,176 378,176" fill="none" stroke="#3b3a36" stroke-width="2.2"/>
    <text x="330" y="166" font-size="9" fill="#8a8578">①读 vptr</text>
    <path d="M 582,176 Q 630,176 678,176" fill="none" stroke="#3b3a36" stroke-width="2.2"/>
    <text x="630" y="166" font-size="9" fill="#8a8578">③取槽[0]</text>
    <rect x="380" y="230" width="200" height="90" fill="#fffdf7" stroke="#e0955f" stroke-width="1.8"/>
    <text x="480" y="254" font-size="10" fill="#9c5a22">虚表内容（目击三）：</text>
    <text x="480" y="274" font-size="9.5" fill="#6b675e">[0] → Derived::who</text>
    <text x="480" y="290" font-size="9.5" fill="#6b675e">[1] → Derived::extra</text>
    <text x="480" y="306" font-size="9.5" fill="#6b675e">[2] → 析构等</text>
    <text x="472" y="348" font-size="11" fill="#9fb8a8">（Derived 覆盖了 who——它的表里槽[0]填的是派生版地址——"覆盖"的物理含义）</text>

    <path d="M 40,374 Q 280,368 520,374 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,374 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 475)"/>
    <text x="280" y="404" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">虚调用 vs 静态调用</text>
    <text x="64" y="438" font-size="12.5" fill="#45703a">虚（p-&gt;who()）：四步（读表+取槽+跳转）</text>
    <text x="64" y="462" font-size="12" fill="#8a8578">（运行期才定去哪——多态的来源）</text>
    <text x="64" y="492" font-size="12.5" fill="#3b3a36">静态（d.who()）：一步直达</text>
    <text x="64" y="516" font-size="12" fill="#8a8578">（编译期已知对象类型）</text>
    <text x="64" y="548" font-size="12" fill="#8a8578">（目击二：两者输出相同但路径不同）</text>

    <path d="M 550,374 Q 730,368 905,374 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,374 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 475)"/>
    <text x="727" y="404" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">标准只定行为，不定实现</text>
    <text x="572" y="438" font-size="12.5" fill="#3b3a36">"指谁调谁"是标准保证的；</text>
    <text x="572" y="460" font-size="12.5" fill="#3b3a36">　vptr/槽位是 Itanium ABI 的做法</text>
    <text x="572" y="490" font-size="12" fill="#8a8578">（MSVC 的布局可以不同）</text>
    <text x="572" y="520" font-size="12.5" fill="#45703a">今天摸的是"本机实现"——</text>
    <text x="572" y="542" font-size="12.5" fill="#45703a">　理解机制 ≠ 依赖布局写代码</text>
  </g>
</svg>
