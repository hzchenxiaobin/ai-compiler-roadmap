<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">三目击完整实录与探针代码解密</text>
    <path d="M 350,58 Q 480,52 610,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21；-Wall 零警告）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,480 Q 248,485 26,480 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 291)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出</text>
    <rect x="38" y="146" width="420" height="320" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./vw</text>
    <text x="54" y="198" font-size="12" fill="#9fb8a8">== 目击一：共享虚表 ==</text>
    <text x="54" y="220" font-size="11.5" fill="#cfe8c6">d1/d2/d3 的 vptr</text>
    <text x="54" y="238" font-size="11.5" fill="#f0c9c0">　全是 0x102e20010（相同！）</text>
    <text x="54" y="260" font-size="11.5" fill="#cfe8c6">b 的 = 0x102e20068（异类异表）</text>
    <text x="54" y="290" font-size="12" fill="#9fb8a8">== 目击二：分发 ==</text>
    <text x="54" y="312" font-size="11.5" fill="#cfe8c6">p-&gt;who() → Derived::who ✔</text>
    <text x="54" y="330" font-size="11.5" fill="#cfe8c6">（指谁调谁）</text>
    <text x="54" y="360" font-size="12" fill="#9fb8a8">== 目击三：槽位 ==</text>
    <text x="54" y="382" font-size="11.5" fill="#cfe8c6">虚表 = 0x102e20010</text>
    <text x="54" y="402" font-size="11.5" fill="#cfe8c6">[0]=0x…1ca48 [1]=0x…1cd6c</text>
    <text x="54" y="422" font-size="11.5" fill="#cfe8c6">[2]=0x…1c974（连续的代码段）</text>
    <text x="54" y="452" font-size="11.5" fill="#9fb8a8">四步走：①vptr ②表 ③槽 ④跳 ✔</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,480 Q 712,485 490,480 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 291)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">探针怎么写的（解密）</text>
    <rect x="502" y="146" width="420" height="320" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="11" fill="#9fb8a8">读 vptr（对象的头 8 字节）：</text>
    <text x="514" y="196" font-size="10.5" fill="#cfe8c6">auto vptr_of = [](const void* obj) {</text>
    <text x="514" y="214" font-size="10.5" fill="#cfe8c6">　return *reinterpret_cast&lt;const void*</text>
    <text x="514" y="232" font-size="10.5" fill="#cfe8c6">　　const*&gt;(obj); };</text>
    <text x="514" y="260" font-size="11" fill="#9fb8a8">（把对象首地址当"指针的指针"读）</text>
    <text x="514" y="290" font-size="11" fill="#9fb8a8">读槽位（虚表当数组）：</text>
    <text x="514" y="312" font-size="10.5" fill="#cfe8c6">void* const* vt = *reinterpret_cast&lt;</text>
    <text x="514" y="330" font-size="10.5" fill="#cfe8c6">　void* const**&gt;(p);</text>
    <text x="514" y="350" font-size="10.5" fill="#cfe8c6">vt[0]、vt[1]、vt[2]…</text>
    <text x="514" y="380" font-size="11" fill="#9fb8a8">诚实边界：</text>
    <text x="514" y="402" font-size="11" fill="#9fb8a8">（多继承下槽位可能含 this 调整——</text>
    <text x="514" y="420" font-size="11" fill="#9fb8a8">　探针只证明"表存在且连续"，</text>
    <text x="514" y="438" font-size="11" fill="#9fb8a8">　本例单继承，槽位即函数本体）</text>
    <text x="514" y="460" font-size="11" fill="#9fb8a8">（UB 警告：探针仅教学！）</text>

    <path d="M 24,506 Q 470,500 905,507 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 543)"/>
    <text x="46" y="532" font-size="15.5" font-weight="bold" fill="#9c5a22">第 13 周进行时</text>
    <text x="46" y="560" font-size="12.5" fill="#3b3a36">明天 cast 三兄弟（Day 74）→ 后天坏例重构（75）→ 周四图形库 v2 项目日（76）——OOP 收尾周</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 74 类型转换——static_cast/dynamic_cast/const_cast 的场景与风险（虚多态是 dynamic_cast 的前提）</text>
  </g>
</svg>
