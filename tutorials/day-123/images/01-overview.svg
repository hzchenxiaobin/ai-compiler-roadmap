<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 123 全貌：&lt;filesystem&gt;——目录树的现代遍历</text>
    <path d="M 310,60 Q 480,52 650,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"递归遍历目录统计文件大小"——C++17 终于有官方的路径/目录库：跨平台、异常安全、迭代器风格（老 C 的 dirent 手工时代结束）</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">计划指定：递归统计（实测）</text>
    <rect x="64" y="164" width="440" height="120" fill="#33413a"/>
    <text x="284" y="190" font-size="11" fill="#9fb8a8">for (recursive_directory_iterator it(root);</text>
    <text x="284" y="212" font-size="11" fill="#9fb8a8">　it != end; ++it)</text>
    <text x="284" y="236" font-size="11" fill="#cfe8c8">　if (file) total += it-&gt;file_size();</text>
    <text x="284" y="266" font-size="10" fill="#8a8578">（一棵循环统计整棵树——五文件 1101 字节）</text>
    <text x="64" y="312" font-size="12.5" fill="#45703a">造场：create_directories 三层 + 造五个文件</text>
    <text x="64" y="334" font-size="12" fill="#8a8578">（100/500/200/300/1 字节——含隐藏文件）</text>
    <text x="64" y="366" font-size="11.5" fill="#8a8578">（收尾 remove_all——教学不留垃圾）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">库的全家福</text>
    <text x="572" y="180" font-size="12" fill="#45703a">path：路径对象（拼接/父/文件名）</text>
    <text x="572" y="208" font-size="12" fill="#45703a">directory_iterator：单层遍历</text>
    <text x="572" y="230" font-size="11.5" fill="#8a8578">（实测：根下列出 a/ top.txt b/）</text>
    <text x="572" y="260" font-size="12" fill="#45703a">recursive_：递归（今天的扫描器）</text>
    <text x="572" y="288" font-size="12" fill="#45703a">操作：exists/copy/remove_all…</text>
    <text x="572" y="310" font-size="11.5" fill="#8a8578">（今天的速览段全过）</text>
    <text x="572" y="344" font-size="12" fill="#6b675e">entry：目录项（is_dir/file_size 多态）</text>
    <text x="572" y="366" font-size="11.5" fill="#8a8578">（一个对象答所有问题）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">和手写时代的对照</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">老 C：opendir/readdir/closedir + 手拼路径 + 平台分支（POSIX/Windows 两套）→ C++17：一个头文件、跨平台、迭代器风格——十年祈愿的落地</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（错误处理：默认抛 filesystem_error；无抛版传 error_code——Day 126 前的预告）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 121~122 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 123（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 124~125</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 126 里程碑</text>
  </g>
</svg>
