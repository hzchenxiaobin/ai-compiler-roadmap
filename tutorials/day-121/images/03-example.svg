    <text x="54" y="222" font-size="11.5" fill="#cfe8c8">"42"→42；"-7"→-7 ✔</text>
    <text x="54" y="242" font-size="11.5" fill="#f0c9c0">"3.14"/"abc"/""/"12x"→失败 ✔</text>
