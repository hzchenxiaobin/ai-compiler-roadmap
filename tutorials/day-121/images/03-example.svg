    <text x="46" y="568" font-size="12.5" fill="#3b3a36">返回 -1 表示失败、find 返回 end()、空串表示没有——种种"约定俗成"的哨兵今天有了类型级的替身；错误不可能被忽略（编译器盯着你判空）</text>

