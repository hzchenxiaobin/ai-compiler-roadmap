<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">for 的执行时序：先判后做，步进在最后</text>
    <path d="M 290,58 Q 480,52 670,59" fill="none" stroke="#5b8db8" stroke-width="3"/>

    <rect x="60" y="92" width="220" height="52" fill="#f7e8a0" opacity="0.8" stroke="#d9b23a" stroke-width="2.5"/>
    <text x="170" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1a">① int i = 1</text>
    <text x="170" y="136" text-anchor="middle" font-size="11.5" fill="#8a8578">只执行一次，发令枪</text>

    <path d="M 170,148 Q 170,168 170,184" fill="none" stroke="#3b3a36" stroke-width="2.8"/>
    <path d="M 162,178 Q 170,188 179,179" fill="none" stroke="#3b3a36" stroke-width="2.8"/>

    <path d="M 80,190 L 260,252 L 80,314 Z" fill="#d8ecce" stroke="#7aa663" stroke-width="3" transform="rotate(-1 170 252)"/>
    <text x="130" y="248" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#45703a">② i &lt;= 9 ?</text>
    <text x="130" y="272" text-anchor="middle" font-size="11.5" fill="#45703a">每轮开头都先问</text>

    <path d="M 268,252 Q 330,244 392,252" fill="none" stroke="#7aa663" stroke-width="2.8"/>
    <path d="M 384,244 Q 393,250 385,260" fill="none" stroke="#7aa663" stroke-width="2.8"/>
    <text x="330" y="236" text-anchor="middle" font-size="12" fill="#45703a">真</text>

    <rect x="400" y="200" width="230" height="64" fill="#eef5e8" stroke="#7aa663" stroke-width="2.6"/>
    <text x="515" y="226" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#45703a">③ 循环体（干正事）</text>
    <text x="515" y="250" text-anchor="middle" font-size="11.5" fill="#6b675e">打印一行星号 / 一行乘法</text>

    <path d="M 515,268 Q 515,290 515,306" fill="none" stroke="#3b3a36" stroke-width="2.8"/>
    <path d="M 507,300 Q 515,310 524,301" fill="none" stroke="#3b3a36" stroke-width="2.8"/>

    <rect x="400" y="312" width="230" height="52" fill="#f9d9b8" stroke="#e0955f" stroke-width="2.6"/>
    <text x="515" y="336" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9c5a22">④ ++i（步进）</text>
    <text x="515" y="356" text-anchor="middle" font-size="11.5" fill="#6b675e">身体做完才轮到它</text>

    <path d="M 638,338 Q 700,338 700,290 Q 700,252 170,252" fill="none" stroke="#8a94a3" stroke-width="2.4" stroke-dasharray="7 5"/>
    <path d="M 178,244 Q 168,252 179,261" fill="none" stroke="#8a94a3" stroke-width="2.4"/>
    <text x="640" y="360" font-size="11.5" fill="#8a8578">↺ 回到 ② 再判</text>

    <path d="M 100,322 Q 60,360 100,396" fill="none" stroke="#c96a5a" stroke-width="2.8"/>
    <path d="M 92,390 Q 102,400 111,391" fill="none" stroke="#c96a5a" stroke-width="2.8"/>
    <text x="44" y="340" font-size="12" fill="#a33f2e">假</text>
    <rect x="46" y="404" width="190" height="46" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.5"/>
    <text x="141" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33f2e">⑤ 出口，往下走</text>

    <path d="M 560,410 Q 730,404 905,410 Q 909,510 905,564 Q 730,570 564,564 Q 558,510 560,410 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 732 487)"/>
    <text x="732" y="442" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c5a82">嵌套循环：时针与分针</text>
    <text x="732" y="476" text-anchor="middle" font-size="13" fill="#3b3a36">外层 row 像时针：走 1 格</text>
    <text x="732" y="498" text-anchor="middle" font-size="13" fill="#3b3a36">内层 col 像分针：转完一整圈</text>
    <text x="732" y="530" text-anchor="middle" font-size="12.5" fill="#6b675e">乘法表内层总共执行</text>
    <text x="732" y="552" text-anchor="middle" font-size="12.5" fill="#6b675e">1+2+…+9 = 45 次（不是 81 次）</text>

    <path d="M 60,472 Q 340,466 620,472 Q 623,530 620,576 Q 340,581 62,576 Q 57,530 60,472 Z" fill="#fdf6dd" stroke="#d9b23a" stroke-width="2.5" transform="rotate(-0.3 340 524)"/>
    <text x="340" y="504" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d1a">边界：差一个等号，差一次执行</text>
    <text x="340" y="534" text-anchor="middle" font-size="13" fill="#6b675e">i &lt; 9：i 走到 9 就停（执行 8 次）</text>
    <text x="340" y="558" text-anchor="middle" font-size="13" fill="#6b675e">i &lt;= 9：9 也算上（执行 9 次）——金字塔矮一层、乘法表少一行，多半是它</text>
  </g>
</svg>
