<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 133 全貌：解析全流程打通——一条 API 从文本到树</text>
    <path d="M 250,60 Q 480,52 710,61" fill="none" stroke="#e0955f" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"全流程打通+错误处理"——七天的零件（Tokenizer/Value/Parser）合体：json::parse(src, err) → optional&lt;JsonValue&gt;——词法语法错统一报</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">用户视角的 API</text>
    <rect x="64" y="164" width="440" height="70" fill="#33413a"/>
    <text x="284" y="190" font-size="11" fill="#9fb8a8">auto v = json::parse(src, err);</text>
    <text x="284" y="212" font-size="11" fill="#cfe8c8">if (v) 用 *v; else 打 err.str();</text>
    <text x="64" y="262" font-size="12.5" fill="#45703a">一个函数搞定——内部分三层</text>
    <text x="64" y="290" font-size="12" fill="#8a8578">（词法错/语法错用户不用管哪层）</text>
    <text x="64" y="320" font-size="12.5" fill="#45703a">失败的完整表达：optional 空</text>
    <text x="64" y="342" font-size="12" fill="#8a8578">　+ err 的"第N行+原因"（Day 121 的实战）</text>
    <text x="64" y="372" font-size="11.5" fill="#8a8578">（五个月"类型说话"的终点形态）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">十天零件的合体清单</text>
    <text x="572" y="180" font-size="11.5" fill="#cfe8c8">127 设计+原型 ✔</text>
    <text x="572" y="202" font-size="11.5" fill="#cfe8c8">128 Value（variant+递归）✔</text>
    <text x="572" y="224" font-size="11.5" fill="#cfe8c8">129-130 字符串（八转义+\u+代理）✔</text>
    <text x="572" y="246" font-size="11.5" fill="#cfe8c8">131 数字（strtod 严格）✔</text>
    <text x="572" y="268" font-size="11.5" fill="#cfe8c8">132 Parser（递归下降）✔</text>
    <text x="572" y="290" font-size="11.5" fill="#f0c9c0">133 今天：合体+统一错误 ✔</text>
    <text x="572" y="322" font-size="12.5" fill="#45703a">错误的双通道：词法收集式/</text>
    <text x="572" y="344" font-size="12.5" fill="#45703a">　语法中断式——统一到 Error</text>
    <text x="572" y="374" font-size="11.5" fill="#8a8578">（明天起：序列化/访问/测试…）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">错误处理的行号实测（多行场景）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">"{\n  \"a\" 1\n}" 的缺冒号报 [第2行]——行号追踪从 tokenizer 的 ++line 一路传到用户的眼前（每层都不丢）</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（十组实测：四合法（含 emoji/转义/多行）+ 六错（词法三/语法三）全过）</text>

