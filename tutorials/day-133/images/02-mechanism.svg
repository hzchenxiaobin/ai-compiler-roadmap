<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">一条数据的旅程与错误的两通道</text>
    <path d="M 330,58 Q 480,52 630,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">"{\"name\": \"Ada\"}" 的三段旅程</text>
    <rect x="110" y="146" width="240" height="170" fill="#33413a"/>
    <text x="230" y="172" font-size="10.5" fill="#9fb8a8">①Tokenizer：</text>
    <text x="230" y="194" font-size="10" fill="#cfe8c8">{ str(name) : str(Ada)</text>
    <text x="230" y="212" font-size="10" fill="#cfe8c8">　} EOF（6 个记号）</text>
    <text x="230" y="240" font-size="10" fill="#8a8578">（字符 → 记号）</text>
    <text x="230" y="264" font-size="10" fill="#8a8578">（每个带行号）</text>
    <text x="230" y="296" font-size="10" fill="#8a8578">（Day 129-131 的合并）</text>
    <rect x="370" y="146" width="240" height="170" fill="#33413a"/>
    <text x="490" y="172" font-size="10.5" fill="#9fb8a8">②Parser：</text>
    <text x="490" y="194" font-size="10" fill="#cfe8c8">value→object：</text>
    <text x="490" y="214" font-size="10" fill="#cfe8c8">　吃{ 读键 吃:</text>
    <text x="490" y="234" font-size="10" fill="#cfe8c8">　value（str）吃}</text>
    <text x="490" y="262" font-size="10" fill="#8a8578">（记号 → 树的搭建）</text>
    <text x="490" y="296" font-size="10" fill="#8a8578">（Day 132 的递归下降）</text>
    <rect x="630" y="146" width="220" height="170" fill="#33413a"/>
    <text x="740" y="172" font-size="10.5" fill="#9fb8a8">③Value：</text>
    <text x="740" y="194" font-size="10" fill="#cfe8c8">object</text>
    <text x="740" y="214" font-size="10" fill="#cfe8c8">└ name→string("Ada")</text>
    <text x="740" y="244" font-size="10" fill="#8a8578">（variant 六格之一）</text>
    <text x="740" y="296" font-size="10" fill="#8a8578">（Day 128 的结构）</text>
    <path d="M 352,230 Q 360,230 368,230" fill="none" stroke="#3b3a36" stroke-width="2"/>
    <path d="M 612,230 Q 620,230 628,230" fill="none" stroke="#3b3a36" stroke-width="2"/>
    <text x="472" y="334" font-size="11.5" fill="#8a8578">（三段各一周+的沉淀——今天一次走通）</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">错误的两通道（统一出 API）</text>
    <rect x="64" y="412" width="430" height="150" fill="#33413a"/>
    <text x="279" y="436" font-size="10.5" fill="#9fb8a8">词法层（tokenizer）：</text>
    <text x="279" y="458" font-size="10.5" fill="#f0c9c0">@ → "意外字符"（立即返回）</text>
    <text x="279" y="478" font-size="10.5" fill="#f0c9c0">1.2.3 → "畸形数字"（strtod）</text>
    <text x="279" y="506" font-size="10" fill="#8a8578">（Day 129 的收集式简化为首错返回</text>
    <text x="279" y="524" font-size="10" fill="#8a8578">　——合成后首错即停更合理）</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">语法层（parser）</text>
    <rect x="572" y="412" width="320" height="150" fill="#33413a"/>
    <text x="732" y="436" font-size="10.5" fill="#9fb8a8">{"a" 1} → "期望':'，遇 number"</text>
    <text x="732" y="458" font-size="10.5" fill="#9fb8a8">[1,2,] → "此处应是值，遇 ]"</text>
    <text x="732" y="486" font-size="10.5" fill="#cfe8c8">统一 Error{msg, line} → err.str()</text>
    <text x="732" y="510" font-size="10" fill="#8a8578">（第N行——多行实测 第2行 ✔）</text>
    <text x="732" y="540" font-size="10" fill="#8a8578">（用户不管哪层——API 内部分诊）</text>
  </g>
</svg>
