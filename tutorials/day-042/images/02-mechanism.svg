<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">size 与 capacity 的关系和扩容的四步解剖</text>
    <path d="M 250,58 Q 480,52 710,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,330 Q 470,324 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 215)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">push 第 5 个时：size(4) == capacity(4) 触发扩容</text>
    <rect x="90" y="146" width="330" height="60" fill="#fffdf7" stroke="#5b8db8" stroke-width="2"/>
    <text x="255" y="170" text-anchor="middle" font-size="11" fill="#2c5a82">旧块（容量 4）：[10][20][30][40]</text>
    <text x="255" y="190" text-anchor="middle" font-size="9.5" fill="#8a8578">（size=4 住满了）</text>
    <path d="M 430,176 Q 490,176 540,176" fill="none" stroke="#3b3a36" stroke-width="2.4"/>
    <text x="487" y="166" font-size="10" fill="#8a8578">扩容</text>
    <rect x="550" y="146" width="330" height="60" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="715" y="170" text-anchor="middle" font-size="10" fill="#45703a">新块（容量 8）：[10][20][30][40][][][][]</text>
    <text x="715" y="190" text-anchor="middle" font-size="9.5" fill="#8a8578">（旧四个搬来 + 空四个等新客）</text>
    <text x="472" y="234" text-anchor="middle" font-size="12.5" fill="#3b3a36">四步：①new int[8]{}　②逐个搬旧　③delete[] 旧块　④data_ 换新指针</text>
    <text x="472" y="262" text-anchor="middle" font-size="12.5" fill="#a33f2e">顺序不能乱：③在②后（先搬完才放旧——Day 41 深拷贝的同款纪律）</text>
    <text x="472" y="290" text-anchor="middle" font-size="12" fill="#8a8578">（然后 data_[size_++] = 50——新客住进 4 号房；实测 [扩容] 4 → 8）</text>

    <path d="M 40,354 Q 280,348 520,354 Q 524,470 520,576 Q 280,582 42,576 Q 36,470 40,354 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 465)"/>
    <text x="280" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">size vs capacity</text>
    <text x="64" y="418" font-size="12.5" fill="#3b3a36">capacity = 租下的房间数（分配器给的）</text>
    <text x="64" y="442" font-size="12.5" fill="#3b3a36">size = 实际住了多少人（push_back 计数）</text>
    <text x="64" y="466" font-size="12" fill="#8a8578">（at(i) 只查 size 不查 capacity——</text>
    <text x="64" y="486" font-size="12" fill="#8a8578">　空房间对用户"不存在"）</text>
    <text x="64" y="520" font-size="12.5" fill="#45703a">实测：push 5 个后 size=5、capacity=8</text>
    <text x="64" y="544" font-size="12" fill="#8a8578">（差值 3 是"余量"——下次扩容前的缓冲）</text>

    <path d="M 550,354 Q 730,348 905,354 Q 908,470 905,576 Q 730,582 552,576 Q 547,470 550,354 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 465)"/>
    <text x="727" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">v1 的边界诚实账本</text>
    <text x="572" y="418" font-size="12.5" fill="#3b3a36">at() 越界：打印 + exit(1)</text>
    <text x="572" y="440" font-size="12" fill="#8a8578">（教学版简洁；真实做法抛异常——如 vector::at）</text>
    <text x="572" y="474" font-size="12.5" fill="#3b3a36">operator[] 未提供</text>
    <text x="572" y="496" font-size="12" fill="#8a8578">（v2 补——带读写下标是 Day 63 的课）</text>
    <text x="572" y="530" font-size="12" fill="#8a8578">（拷贝被禁——第 10 周三法则后解禁）</text>
  </g>
</svg>
