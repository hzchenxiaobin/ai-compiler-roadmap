    <text x="54" y="200" font-size="12" fill="#9fb8a8">== 基本流程 ==</text>
    <text x="54" y="222" font-size="12.5" fill="#cfe8c6">[构造] 容量 4 起步</text>
    <text x="54" y="246" font-size="12.5" fill="#f0c9c0">[扩容] 4 → 8　（第 5 个 push 触发）</text>
    <text x="54" y="268" font-size="12.5" fill="#cfe8c6">size = 5，capacity = 8 ✔</text>
    <text x="54" y="292" font-size="12.5" fill="#cfe8c6">at(0)=10 … at(4)=50 ✔</text>
    <text x="54" y="324" font-size="12" fill="#9fb8a8">== 越界被拦 ==</text>
    <text x="54" y="346" font-size="12" fill="#9fb8a8">尝试 at(99)……</text>
    <text x="54" y="370" font-size="12" fill="#f0c9c0">[at 越界] index 99 &gt;= size 5</text>
    <text x="54" y="392" font-size="11.5" fill="#9fb8a8">exit=1（可检查的失败 ✔）</text>
    <text x="54" y="424" font-size="12" fill="#9fb8a8">（去掉越界行后 ASan 全场景：</text>
    <text x="54" y="444" font-size="12" fill="#9fb8a8">　零报错——构造/扩容/析构链全对）</text>

