<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">两根指针一块内存 vs 两块内存各一根</text>
    <path d="M 250,58 Q 480,52 710,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,320 Q 470,314 44,319 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 210)"/>
    <text x="472" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">浅拷贝的内存图（实测地址）</text>
    <rect x="110" y="148" width="150" height="50" fill="#fffdf7" stroke="#5b8db8" stroke-width="2"/>
    <text x="185" y="170" text-anchor="middle" font-size="11" fill="#2c5a82">struct a</text>
    <text x="185" y="188" text-anchor="middle" font-size="9.5" fill="#8a8578">data = 0x…12c0</text>
    <rect x="330" y="148" width="150" height="50" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2"/>
    <text x="405" y="170" text-anchor="middle" font-size="11" fill="#55606e">struct b（= a）</text>
    <text x="405" y="188" text-anchor="middle" font-size="9.5" fill="#a33f2e">data = 0x…12c0</text>
    <rect x="570" y="156" width="300" height="36" fill="#f9d9b8" stroke="#e0955f" stroke-width="2.2"/>
    <text x="720" y="179" text-anchor="middle" font-size="10.5" fill="#9c5a22">堆内存 0x…12c0："hello"（只有一块！）</text>
    <path d="M 262,160 Q 415,110 568,160" fill="none" stroke="#c96a5a" stroke-width="2.2"/>
    <path d="M 482,192 Q 530,186 568,180" fill="none" stroke="#c96a5a" stroke-width="2.2"/>
    <text x="472" y="230" font-size="12.5" fill="#a33f2e">改 b.data[0]='X' → a.data 也变 "Xello"（共享的直接证据）</text>
    <text x="472" y="258" font-size="12.5" fill="#a33f2e">delete[] a.data → b.data 悬空；再 delete[] b.data → double free</text>
    <text x="472" y="292" font-size="12" fill="#8a8578">（ASan 实测：attempting double-free on 0x…09f0）</text>

    <path d="M 40,344 Q 470,338 905,345 L 901,576 Q 470,570 44,575 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.2 472 460)"/>
    <text x="472" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">深拷贝的内存图（实测地址）</text>
    <rect x="110" y="392" width="150" height="50" fill="#fffdf7" stroke="#5b8db8" stroke-width="2"/>
    <text x="185" y="414" text-anchor="middle" font-size="11" fill="#2c5a82">struct a</text>
    <text x="185" y="432" text-anchor="middle" font-size="9.5" fill="#8a8578">data = 0x…12c0</text>
    <rect x="330" y="392" width="150" height="50" fill="#fffdf7" stroke="#5b8db8" stroke-width="2"/>
    <text x="405" y="414" text-anchor="middle" font-size="11" fill="#2c5a82">struct b（clone）</text>
    <text x="405" y="432" text-anchor="middle" font-size="9.5" fill="#45703a">data = 0x…12d0</text>
    <rect x="550" y="386" width="160" height="32" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="630" y="406" text-anchor="middle" font-size="9.5" fill="#9c5a22">0x…12c0："hello"</text>
    <rect x="550" y="428" width="160" height="32" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="630" y="448" text-anchor="middle" font-size="9.5" fill="#45703a">0x…12d0："hello"</text>
    <path d="M 262,404 Q 405,352 548,400" fill="none" stroke="#8a94a3" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M 482,442 Q 515,444 548,442" fill="none" stroke="#8a94a3" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="762" y="410" font-size="10.5" fill="#6b675e">内容相同</text>
    <text x="762" y="428" font-size="10.5" fill="#6b675e">地址独立</text>
    <text x="472" y="490" font-size="12.5" fill="#45703a">改 b 后 a 仍 "hello"、b 为 "Xello"——互不影响 ✔</text>
    <text x="472" y="518" font-size="12.5" fill="#45703a">各自 delete[] 各自的块——无 double free、无泄漏（ASan 零报错）</text>
    <text x="472" y="552" font-size="12" fill="#8a8578">（"复印文件"而非"共用原件"——Day 55 拷贝构造的先声）</text>
  </g>
</svg>
