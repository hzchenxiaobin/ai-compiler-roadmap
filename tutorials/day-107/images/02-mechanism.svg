<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">分支裁剪的展开图与编译期测试的形态</text>
    <path d="M 260,58 Q 480,52 700,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,330 Q 470,334 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 215)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">describe(int) 的实例化（裁剪图）</text>
    <rect x="110" y="148" width="360" height="150" fill="#33413a"/>
    <text x="290" y="176" font-size="11" fill="#9fb8a8">template &lt;typename T&gt; auto describe(const T&amp; v) {</text>
    <text x="290" y="200" font-size="11" fill="#cfe8c6">　if constexpr (is_integral_v&lt;T&gt;) { return v + 1; }</text>
    <text x="290" y="224" font-size="11" fill="#9fb8a8">　else { return v + 0.5; }</text>
    <text x="290" y="248" font-size="11" fill="#cfe8c6">}</text>
    <text x="290" y="278" font-size="10" fill="#8a8578">（模板原文——两个分支都在）</text>
    <rect x="510" y="148" width="340" height="66" fill="#d8ecce" stroke="#7aa663" stroke-width="2.2"/>
    <text x="680" y="176" font-size="10.5" fill="#45703a">describe&lt;int&gt; 实例：只有 return v + 1;</text>
    <text x="680" y="196" font-size="10" fill="#8a8578">（+0.5 分支被裁掉——不存在！）</text>
    <rect x="510" y="230" width="340" height="66" fill="#f9d9b8" stroke="#e0955f" stroke-width="2.2"/>
    <text x="680" y="258" font-size="10.5" fill="#9c5a22">describe&lt;double&gt; 实例：只有 v + 0.5</text>
    <text x="680" y="278" font-size="10" fill="#8a8578">（+1 分支被裁掉）</text>
    <text x="472" y="322" font-size="11.5" fill="#8a8578">（两个实例各自干净——不带的代码连编译都不参与）</text>

    <path d="M 40,354 Q 280,348 520,354 Q 524,470 520,576 Q 280,582 42,576 Q 36,470 40,354 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 465)"/>
    <text x="280" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">编译期测试三件套</text>
    <rect x="64" y="402" width="430" height="150" fill="#33413a"/>
    <text x="279" y="428" font-size="10.5" fill="#9fb8a8">constexpr int factorial(int n) { … }</text>
    <text x="279" y="452" font-size="10.5" fill="#cfe8c6">static_assert(factorial(5) == 120, "…");</text>
    <text x="279" y="478" font-size="10.5" fill="#45703a">→ 编译成功 = 测试通过（零运行时）</text>
    <text x="279" y="504" font-size="10.5" fill="#f0c9c0">→ 断言写错 → 编译失败（左边实测！）</text>
    <text x="279" y="530" font-size="10" fill="#8a8578">（"测试不过就不许发布"的终极形态）</text>

    <path d="M 550,354 Q 730,348 905,354 Q 908,470 905,576 Q 730,582 552,576 Q 547,470 550,354 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 465)"/>
    <text x="727" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">Day 88 的标签分发对照</text>
    <text x="572" y="418" font-size="11.5" fill="#6b675e">Day 88：iterator_traits 读标签 →</text>
    <text x="572" y="440" font-size="11.5" fill="#6b675e">　重载选实现（库的老写法）</text>
    <text x="572" y="470" font-size="11.5" fill="#45703a">今天：if constexpr (is_integral_v) →</text>
    <text x="572" y="492" font-size="11.5" fill="#45703a">　一处写完（语言的现代写法）</text>
    <text x="572" y="522" font-size="11" fill="#8a8578">（效果同——advance 的按能力选路）</text>
    <text x="572" y="546" font-size="10.5" fill="#8a8578">（C++17 的 if constexpr 读起来直白得多）</text>
  </g>
</svg>
