<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">双实例、深拷贝与九周闭环战报</text>
    <path d="M 370,58 Q 480,52 590,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21 -std=c++17；-Wall 零警告 + ASan 零报错）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,490 Q 248,495 26,490 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 296)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出</text>
    <rect x="38" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./mv　（-Wall 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== MyVector&lt;int&gt; ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c6">vi：10 20 30 40 50 ✔</text>
    <text x="54" y="242" font-size="11.5" fill="#cfe8c6">vi[2] = 30（下标）✔</text>
    <text x="54" y="270" font-size="12" fill="#9fb8a8">== MyVector&lt;string&gt; ==</text>
    <text x="54" y="292" font-size="11.5" fill="#cfe8c6">vs：hello template world ✔</text>
    <text x="54" y="312" font-size="11" fill="#9fb8a8">（同款代码！）</text>
    <text x="54" y="340" font-size="12" fill="#9fb8a8">== 三法则拷贝 ==</text>
    <text x="54" y="362" font-size="11.5" fill="#f0c9c0">vi 追加 999 后 vc 仍 5 个 ✔</text>
    <text x="54" y="382" font-size="11.5" fill="#cfe8c6">（深拷贝——各自独立）</text>
    <text x="54" y="408" font-size="11.5" fill="#cfe8c6">va = vi 赋值 ✔（6 个）</text>
    <text x="54" y="436" font-size="12" fill="#9fb8a8">== 迭代器 ==</text>
    <text x="54" y="458" font-size="11.5" fill="#cfe8c6">范围 for 10..50 ✔</text>
    <text x="54" y="478" font-size="11.5" fill="#cfe8c6">*(begin()+2) = 30 ✔</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,490 Q 712,495 490,490 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 296)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">九周的闭环</text>
    <rect x="502" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">手写动态数组三部曲：</text>
    <text x="514" y="198" font-size="11.5" fill="#cfe8c6">Day 42 IntArray v1（五件套）</text>
    <text x="514" y="218" font-size="11.5" fill="#cfe8c8">　→ int 写死</text>
    <text x="514" y="242" font-size="11.5" fill="#cfe8c6">Day 47 IntArray v2（倍增+reserve）</text>
    <text x="514" y="262" font-size="11" fill="#9fb8a8">　→ 还是 int</text>
    <text x="514" y="286" font-size="11.5" fill="#cfe8c6">Day 98 MyVector&lt;T&gt;（今天）✔</text>
    <text x="514" y="306" font-size="11" fill="#9fb8a8">　→ T 任意——官方版的结构</text>
    <text x="514" y="338" font-size="12" fill="#9fb8a8">对照官方 vector：</text>
    <text x="514" y="360" font-size="11.5" fill="#cfe8c6">push_back/size/[]/begin/end 同款</text>
    <text x="514" y="380" font-size="11" fill="#9fb8a8">（官方多的 emplace/异常——工程打磨）</text>
    <text x="514" y="412" font-size="12.5" fill="#45703a">（98/144 = 68.1%）</text>
    <text x="514" y="444" font-size="11.5" fill="#9fb8a8">本周路线：97 函数模板 ✓</text>
    <text x="514" y="464" font-size="11.5" fill="#9fb8a8">　→ 98 类模板（今天）→ 99 非类型参数</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">模板类的意义</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">"类型的参数化"——容器只写一次、元素类型开放；这是 STL 六件套（vector/string/map…）共同的底层秘密，今天亲手揭开了</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 99 非类型模板参数与默认模板参数——FixedStack&lt;T, MaxSize&gt;</text>
  </g>
</svg>
