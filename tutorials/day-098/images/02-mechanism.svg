<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">实例化的雕刻过程与函数模板的配合</text>
    <path d="M 280,58 Q 480,52 680,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,339 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">MyVector&lt;int&gt; 和 &lt;string&gt; 的两个实例</text>
    <rect x="110" y="148" width="340" height="160" fill="#d8ecce" stroke="#7aa663" stroke-width="2.2"/>
    <text x="280" y="176" font-size="11" fill="#45703a">MyVector&lt;int&gt; 实例：</text>
    <text x="280" y="198" font-size="10.5" fill="#45703a">data_ 是 int*（4 字节元素）</text>
    <text x="280" y="218" font-size="10.5" fill="#45703a">push_back(const int&amp;)</text>
    <text x="280" y="238" font-size="10.5" fill="#45703a">operator[] 返回 int&amp;</text>
    <text x="280" y="264" font-size="10" fill="#8a8578">（vi = 10 20 30 40 50）</text>
    <rect x="510" y="148" width="340" height="160" fill="#f9d9b8" stroke="#e0955f" stroke-width="2.2"/>
    <text x="680" y="176" font-size="11" fill="#9c5a22">MyVector&lt;string&gt; 实例：</text>
    <text x="680" y="198" font-size="10.5" fill="#9c5a22">data_ 是 string*（24 字节元素）</text>
    <text x="680" y="218" font-size="10.5" fill="#9c5a22">push_back(const string&amp;)</text>
    <text x="680" y="238" font-size="10.5" fill="#9c5a22">operator[] 返回 string&amp;</text>
    <text x="680" y="264" font-size="10" fill="#8a8578">（vs = hello template world）</text>
    <text x="472" y="334" font-size="11.5" fill="#8a8578">（两个类实例各自独立编译——成员函数用到的才生成（惰性实例化））</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">与函数模板的配合</text>
    <rect x="64" y="412" width="430" height="140" fill="#33413a"/>
    <text x="279" y="438" font-size="10.5" fill="#9fb8a8">template &lt;typename T&gt;</text>
    <text x="279" y="460" font-size="10.5" fill="#cfe8c6">void dump(const char* label, MyVector&lt;T&gt;&amp; v) {</text>
    <text x="279" y="480" font-size="10.5" fill="#cfe8c6">　for (const auto&amp; x : v) …</text>
    <text x="279" y="504" font-size="10" fill="#8a8578">}</text>
    <text x="279" y="534" font-size="10.5" fill="#9fb8a8">（dump(vi) → T=int；dump(vs) → T=string）</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">迭代器的零成本方案</text>
    <rect x="572" y="412" width="320" height="140" fill="#33413a"/>
    <text x="732" y="438" font-size="10.5" fill="#9fb8a8">using iterator = T*;　// 裸指针</text>
    <text x="732" y="462" font-size="10.5" fill="#cfe8c6">begin() → data_</text>
    <text x="732" y="482" font-size="10.5" fill="#cfe8c6">end() → data_ + size_</text>
    <text x="732" y="510" font-size="10" fill="#8a8578">（连续内存 → 指针即迭代器）</text>
    <text x="732" y="534" font-size="10" fill="#9fb8a8">（范围 for 直接能跑 ✔）</text>
  </g>
</svg>
