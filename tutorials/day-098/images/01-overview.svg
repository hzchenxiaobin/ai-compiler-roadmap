<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 98 全貌：类模板——MyVector&lt;T&gt; 的手写</text>
    <path d="M 310,60 Q 480,52 650,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"动态数组改写为模板类"——Day 47 的 IntArray 抹掉 int 换上 T：一份代码两种实例（int/string 双跑）</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">类模板的骨架</text>
    <rect x="64" y="164" width="440" height="80" fill="#33413a"/>
    <text x="284" y="190" font-size="11" fill="#9fb8a8">template &lt;typename T&gt;</text>
    <text x="284" y="212" font-size="11" fill="#cfe8c6">class MyVector {</text>
    <text x="284" y="232" font-size="10.5" fill="#9fb8a8">　T* data_; size_t size_, cap_;　…</text>
    <text x="64" y="270" font-size="12.5" fill="#45703a">T 贯穿全部成员：数据是 T*、</text>
    <text x="64" y="292" font-size="12.5" fill="#45703a">　push_back 收 const T&amp;、[] 返回 T&amp;</text>
    <text x="64" y="322" font-size="12.5" fill="#6b675e">Day 47 IntArray → 今天的 MyVector：</text>
    <text x="64" y="344" font-size="12.5" fill="#6b675e">　int 抹掉换 T——九周闭环</text>
    <text x="64" y="372" font-size="12" fill="#8a8578">（三法则照写：拷贝构造/赋值/析构）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">类外定义的语法（重头戏）</text>
    <rect x="572" y="164" width="320" height="110" fill="#33413a"/>
    <text x="732" y="190" font-size="10.5" fill="#9fb8a8">template &lt;typename T&gt;</text>
    <text x="732" y="212" font-size="10.5" fill="#cfe8c6">void MyVector&lt;T&gt;::push_back(</text>
    <text x="732" y="232" font-size="10.5" fill="#cfe8c6">　　const T&amp; value) { … }</text>
    <text x="732" y="260" font-size="10" fill="#8a8578">（每个函数都要这套前缀！）</text>
    <text x="572" y="298" font-size="12" fill="#45703a">三件套：template 头 + MyVector&lt;T&gt;:: + T 参数</text>
    <text x="572" y="326" font-size="12" fill="#6b675e">短小函数类内定义更省（size/[]）</text>
    <text x="572" y="358" font-size="12" fill="#8a8578">（漏 template 头 = 编译错的头号原因）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">双实例验证（一份代码）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">MyVector&lt;int&gt;：10~50 ✔｜MyVector&lt;string&gt;："hello template world" ✔｜三法则深拷贝 ✔｜ASan 零报错 ✔</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（vi 追加 999 后 vc 不动——拷贝独立性实证）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 97 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 98（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 99~101</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 102 项目日</text>
  </g>
</svg>
