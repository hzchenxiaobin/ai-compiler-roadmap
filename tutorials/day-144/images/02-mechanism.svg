<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">三条主线的交织与知识地图的六区</text>
    <path d="M 320,58 Q 480,52 640,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">三条主线（技术/方法/心态）</text>
    <rect x="110" y="146" width="250" height="170" fill="#33413a"/>
    <text x="235" y="172" font-size="10.5" fill="#9fb8a8">技术线：约定进类型</text>
    <text x="235" y="196" font-size="10" fill="#cfe8c8">注释里的"记得删"</text>
    <text x="235" y="214" font-size="10" fill="#cfe8c8">→ RAII 的作用域</text>
    <text x="235" y="232" font-size="10" fill="#cfe8c8">→ 智能指针的类型</text>
    <text x="235" y="250" font-size="10" fill="#cfe8c8">→ optional 的失败</text>
    <text x="235" y="268" font-size="10" fill="#cfe8c8">→ concepts 的要求</text>
    <text x="235" y="296" font-size="10" fill="#8a8578">（越来越安全省心）</text>
    <rect x="380" y="146" width="250" height="170" fill="#33413a"/>
    <text x="505" y="172" font-size="10.5" fill="#9fb8a8">方法线：探针先行</text>
    <text x="505" y="196" font-size="10" fill="#cfe8c8">Day 39 的第一次 ASan</text>
    <text x="505" y="216" font-size="10" fill="#cfe8c8">→ 每个声称都验证</text>
    <text x="505" y="236" font-size="10" fill="#cfe8c8">→ 140 的探针验柜</text>
    <text x="505" y="260" font-size="10" fill="#cfe8c8">（测试/基准/San 的</text>
    <text x="505" y="278" font-size="10" fill="#cfe8c8">　三件套习惯）</text>
    <rect x="650" y="146" width="200" height="170" fill="#33413a"/>
    <text x="750" y="172" font-size="10.5" fill="#9fb8a8">心态线：教学从简</text>
    <text x="750" y="196" font-size="10" fill="#cfe8c8">不追大而全</text>
    <text x="750" y="216" font-size="10" fill="#cfe8c8">（300 行的解析器</text>
    <text x="750" y="234" font-size="10" fill="#cfe8c8">　胜过看不懂的 2 万行）</text>
    <text x="750" y="260" font-size="10" fill="#cfe8c8">诚实记录坑和边界</text>
    <text x="750" y="284" font-size="10" fill="#8a8578">（承认局限的自信）</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">知识地图（自查六区）</text>
    <rect x="64" y="412" width="430" height="150" fill="#33413a"/>
    <text x="279" y="436" font-size="10.5" fill="#cfe8c8">✔ 扎实：RAII/智能指针/移动/递归/variant</text>
    <text x="279" y="458" font-size="10.5" fill="#9fb8a8">△ 需深：并发实战/模板元/CMake 高级</text>
    <text x="279" y="480" font-size="10.5" fill="#8a8578">○ 边界：2^53/深度500/错误恢复（取舍）</text>
    <text x="279" y="508" font-size="10" fill="#8a8578">（查漏的诚实分法：能徒手写=✔；</text>
    <text x="279" y="526" font-size="10" fill="#8a8578">　用过要深=△；明确取舍=○——不是失败）</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">下一阶段（四目标）</text>
    <rect x="572" y="412" width="320" height="150" fill="#33413a"/>
    <text x="732" y="436" font-size="10.5" fill="#cfe8c8">① 并发实战（项目级 thread/mutex）</text>
    <text x="732" y="458" font-size="10.5" fill="#cfe8c8">② 开源阅读（nlohmann 对照）</text>
    <text x="732" y="480" font-size="10.5" fill="#cfe8c8">③ 项目二（HTTP 或解释器）</text>
    <text x="732" y="502" font-size="10.5" fill="#cfe8c8">④ CI/CD（Actions 上云）</text>
    <text x="732" y="530" font-size="10" fill="#8a8578">（Effective 43~55 随项目读）</text>
  </g>
</svg>
