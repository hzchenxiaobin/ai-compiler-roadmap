    <path d="M 320,60 Q 480,52 640,61" fill="none" stroke="#e0955f" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划第一阶段的里程碑产出正式交付——外加 git 管理和一份诚实的复盘</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,240 520,364 Q 280,370 42,364 Q 36,240 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 240)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">最终版构成（约 220 行）</text>
