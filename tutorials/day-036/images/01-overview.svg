    <text x="64" y="348" font-size="12" fill="#8a8578">（局限清单同步更新：容量/查找仍是路标）</text>

    <path d="M 550,116 Q 730,110 905,116 Q 908,240 905,364 Q 730,370 552,364 Q 547,240 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 240)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">git 管理（真实演示输出）</text>
    <rect x="572" y="162" width="320" height="130" fill="#33413a"/>
    <text x="588" y="188" font-size="11.5" fill="#9fb8a8">$ git init &amp;&amp; git add *.h *.cpp main.cpp</text>
    <text x="588" y="210" font-size="11.5" fill="#9fb8a8">$ git commit -m "通讯录最终版……"</text>
    <text x="588" y="234" font-size="11.5" fill="#cfe8c6">68ccb28 通讯录最终版：持久化+</text>
    <text x="588" y="252" font-size="11.5" fill="#cfe8c6">　　　　输入校验+增删改查</text>
    <text x="588" y="276" font-size="11.5" fill="#cfe8c6">status 0 行（工作区干净）</text>
    <text x="727" y="316" text-anchor="middle" font-size="12.5" fill="#45703a">第 1 周的提交好习惯，今天落地</text>
    <text x="727" y="342" text-anchor="middle" font-size="12" fill="#8a8578">（毕业时它就是你的作品集第一条）</text>

    <path d="M 40,388 Q 470,382 905,389 L 901,490 Q 470,484 44,489 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 438)"/>
    <text x="472" y="418" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">复盘：3 个收获 + 3 个疑问（模板见 examples/RETROSPECTIVE.md）</text>
    <text x="70" y="450" font-size="13" fill="#3b3a36">收获格式："我原来以为……现在明白……"（写出认知变化，不是知识点抄写）</text>
    <text x="70" y="476" font-size="13" fill="#3b3a36">疑问格式：具体场景 + 下一步计划（挂账到对应的周，不悬空）</text>

