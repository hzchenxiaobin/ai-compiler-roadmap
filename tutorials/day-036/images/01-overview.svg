    <text x="64" y="208" font-size="13" fill="#3b3a36">contact.cpp：五项操作 + 存读盘 + 安检</text>
    <text x="64" y="236" font-size="13" fill="#3b3a36">main.cpp：菜单循环 + 出口汇流</text>
