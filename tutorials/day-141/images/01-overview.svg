<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 141 全貌：代码整理——功能之外的可维护性</text>
    <path d="M 320,60 Q 480,52 640,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"README、目录结构、注释规范"——14 天 1717 行的 JSON 项目做发布前的整理：三层注释的示范、文件清单的审视、"给未来的自己写"</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">三层注释的规范（示范）</text>
    <text x="64" y="180" font-size="12.5" fill="#45703a">文件头：模块/特性/限制/天数</text>
    <text x="64" y="202" font-size="12" fill="#8a8578">（四行说清"这是什么、能干嘛、不能干嘛"）</text>
    <text x="64" y="232" font-size="12.5" fill="#45703a">节注释：==== 分隔 + 一句设计</text>
    <text x="64" y="254" font-size="12" fill="#8a8578">（JsonValue：variant+unique_ptr 的理由）</text>
    <text x="64" y="284" font-size="12.5" fill="#45703a">行内：只注"为什么"不注"是什么"</text>
    <text x="64" y="306" font-size="12" fill="#8a8578">（代码说是什么——注释说为什么）</text>
    <text x="64" y="340" font-size="12.5" fill="#6b675e">规范的核心：给未来的自己写</text>
    <text x="64" y="362" font-size="12" fill="#8a8578">（六个月后再打开也能三分钟上手）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">项目文件清单（14 天的成果）</text>
    <rect x="572" y="164" width="320" height="190" fill="#33413a"/>
    <text x="732" y="188" font-size="10" fill="#9fb8a8">133 json_full.cpp　282 行</text>
    <text x="732" y="208" font-size="10" fill="#9fb8a8">134 dump_demo.cpp　176 行</text>
    <text x="732" y="228" font-size="10" fill="#9fb8a8">135 access_demo.cpp　231 行</text>
    <text x="732" y="248" font-size="10" fill="#9fb8a8">136 first_test.cpp　　59 行</text>
    <text x="732" y="268" font-size="10" fill="#9fb8a8">137 json_test.cpp　　291 行</text>
    <text x="732" y="288" font-size="10" fill="#9fb8a8">138 run_suite.cpp　　259 行</text>
    <text x="732" y="308" font-size="10" fill="#9fb8a8">139 bench.cpp　　　 191 行</text>
    <text x="732" y="328" font-size="10" fill="#cfe8c8">140 sanitizer_check.cpp 228 行</text>
    <text x="732" y="350" font-size="10.5" fill="#45703a">合计 1717 行（每天一个自包含主题）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">整理的判断：什么值得做</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">不合并八文件成"一个大文件"（教学仓库的"每天自包含"是特性不是乱）；做的是：注释规范示范（今天的 tidy_check）+ 二进制清理 + 限制的醒目化</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（整理不是重新组织——是让现有的组织被人看得见）</text>

