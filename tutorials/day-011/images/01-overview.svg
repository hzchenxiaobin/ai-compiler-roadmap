<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 11 全貌：谁能看见谁，谁能活多久</text>
    <path d="M 310,60 Q 480,52 650,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">作用域管"名字的可见范围"，生命周期管"对象的存活时间"——两个问题，两把尺子</text>

    <path d="M 40,110 Q 460,104 905,110 Q 909,170 905,230 Q 460,236 42,230 Q 36,170 40,110 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(-0.2 472 170)"/>
    <text x="80" y="140" font-size="15" font-weight="bold" fill="#2c5a82">作用域：{} 就是一圈围栏</text>
    <rect x="80" y="156" width="340" height="56" fill="#fffdf7" stroke="#5b8db8" stroke-width="2.2" transform="rotate(-0.3 250 184)"/>
    <text x="92" y="178" font-size="12.5" fill="#3b3a36">main 围栏：x 在整个 main 里被叫得应</text>
    <text x="92" y="198" font-size="12.5" fill="#6b675e">内层小围栏：y、inner_x 只在自家栏里有效</text>
    <text x="500" y="178" font-size="12.5" fill="#3b3a36">出栏再叫 y？编译器：查无此人</text>
    <text x="500" y="198" font-size="12.5" fill="#a33f2e">error: use of undeclared identifier 'y'</text>
    <text x="472" y="222" text-anchor="middle" font-size="12" fill="#8a8578">（本机实测报错，一字未改）</text>

    <path d="M 40,254 Q 460,248 905,255 L 901,360 Q 460,354 44,359 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(0.2 472 305)"/>
    <text x="80" y="286" font-size="15" font-weight="bold" fill="#45703a">生命周期：从出生到谢幕的时间轴</text>
    <path d="M 90,330 Q 480,322 890,331" fill="none" stroke="#8a94a3" stroke-width="2.6"/>
    <circle cx="140" cy="330" r="6" fill="#7aa663"/>
    <text x="140" y="352" text-anchor="middle" font-size="11.5" fill="#6b675e">x 出生（定义处）</text>
    <circle cx="400" cy="329" r="6" fill="#c96a5a"/>
    <text x="400" y="352" text-anchor="middle" font-size="11.5" fill="#6b675e">y 出生</text>
    <circle cx="560" cy="329" r="6" fill="#c96a5a"/>
    <text x="560" y="352" text-anchor="middle" font-size="11.5" fill="#6b675e">y 谢幕（} 处）</text>
    <circle cx="860" cy="330" r="6" fill="#c96a5a"/>
    <text x="860" y="352" text-anchor="middle" font-size="11.5" fill="#6b675e">x 谢幕（main 结束）</text>

    <path d="M 40,384 Q 460,378 905,385 L 901,452 Q 460,446 44,451 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 472 416)"/>
    <text x="472" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#9c5a22">static：住在特殊房间的局部变量</text>
    <text x="472" y="440" text-anchor="middle" font-size="12.5" fill="#6b675e">只在第一次调用时出生一次，之后一直活着——调用计数器的秘密武器</text>

    <path d="M 60,486 Q 480,480 905,487" fill="none" stroke="#8a8578" stroke-width="3"/>
    <circle cx="160" cy="486" r="6" fill="#8a94a3"/>
    <text x="160" y="512" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 9~10 ✓</text>
    <circle cx="330" cy="487" r="13" fill="none" stroke="#c96a5a" stroke-width="2.2"/>
    <circle cx="330" cy="487" r="6" fill="#5b8db8"/>
    <text x="330" y="512" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c96a5a">Day 11（今天）</text>
    <circle cx="500" cy="486" r="6" fill="#e0955f"/>
    <text x="500" y="512" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 12 项目日</text>
    <circle cx="670" cy="487" r="6" fill="#5b8db8"/>
    <text x="670" y="512" text-anchor="middle" font-size="12.5" fill="#3b3a36">第 3 周 数组</text>
    <circle cx="840" cy="486" r="6" fill="#5b8db8"/>
    <text x="840" y="512" text-anchor="middle" font-size="12.5" fill="#3b3a36">第 4 周 指针</text>

    <rect x="120" y="528" width="720" height="26" fill="#f7e8a0" opacity="0.5" transform="rotate(-0.3 480 541)"/>
    <text x="480" y="546" text-anchor="middle" font-size="13" fill="#8a6d1a">明天项目日：计算器 v1——今天的作用域知识决定"函数之间谁也看不见谁"的拆分边界</text>
  </g>
</svg>
