<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">手写循环 → 算法调用的翻译与谓词的解剖</text>
    <path d="M 260,58 Q 480,52 700,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,339 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">手写 find_if 的展开（糖衣的反向）</text>
    <rect x="90" y="146" width="380" height="170" fill="#33413a"/>
    <text x="280" y="176" font-size="11" fill="#9fb8a8">手写版：</text>
    <text x="280" y="198" font-size="11" fill="#cfe8c6">for (auto it = v.begin(); it != v.end(); ++it) {</text>
    <text x="280" y="218" font-size="11" fill="#cfe8c6">　if (*it &gt; 6) { 找到了; break; }</text>
    <text x="280" y="238" font-size="11" fill="#cfe8c6">}</text>
    <text x="280" y="266" font-size="11" fill="#8a8578">（6 行：循环+条件+break 三件套）</text>
    <rect x="490" y="146" width="380" height="170" fill="#33413a"/>
    <text x="680" y="176" font-size="11" fill="#9fb8a8">算法版：</text>
    <text x="680" y="198" font-size="11" fill="#cfe8c6">auto it = std::find_if(v.begin(), v.end(),</text>
    <text x="680" y="218" font-size="11" fill="#cfe8c6">　[](int x) { return x &gt; 6; });</text>
    <text x="680" y="246" font-size="11" fill="#45703a">（2 行：说"要什么"不说"怎么找"）</text>
    <text x="680" y="272" font-size="10.5" fill="#9fb8a8">（迭代器循环的 Day 80 展开图反向使用——</text>
    <text x="680" y="290" font-size="10.5" fill="#9fb8a8">　范围 for 是糖、算法也是糖）</text>
    <text x="472" y="334" font-size="11.5" fill="#9fb8a8">（两者都是 O(n) 遍历——算法版意图更清晰、且能换容器零改动）</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">lambda 的解剖</text>
    <rect x="64" y="412" width="430" height="130" fill="#33413a"/>
    <text x="279" y="438" font-size="11" fill="#9fb8a8">[threshold](int x) { return x &gt; threshold; }</text>
    <text x="279" y="462" font-size="10.5" fill="#cfe8c6">　↑捕获　　↑参数　　↑bool 返回</text>
    <text x="279" y="486" font-size="10.5" fill="#9fb8a8">（捕获列表 [] 是 lambda 的标志——</text>
    <text x="279" y="504" font-size="10.5" fill="#9fb8a8">　空 [] 表示不用外部变量）</text>
    <text x="280" y="566" font-size="11" fill="#8a8578">（"匿名函数对象"——编译器造一个类、()是 operator()）</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">all_of 三兄弟的语义</text>
    <text x="572" y="428" font-size="12" fill="#45703a">all_of：全部满足？（空容器 → true！）</text>
    <text x="572" y="452" font-size="12" fill="#45703a">any_of：至少一个满足？（空 → false）</text>
    <text x="572" y="476" font-size="12" fill="#45703a">none_of：全不满足？（空 → true）</text>
    <text x="572" y="510" font-size="11.5" fill="#8a8578">（空容器的约定是逻辑学惯例——</text>
    <text x="572" y="530" font-size="11.5" fill="#8a8578">　"空集的全称命题为真"）</text>
  </g>
</svg>
