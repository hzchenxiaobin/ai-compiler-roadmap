<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 91 全貌：非修改算法——查找、计数与整体判断</text>
    <path d="M 290,60 Q 480,52 670,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"全部配合 lambda"——find/find_if/count_if/all_of：手写循环的四个高频模式今天全部标准化</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">四组算法的分工</text>
    <text x="64" y="180" font-size="12.5" fill="#3b3a36">find：找特定值（== 比较的快捷方式）</text>
    <text x="64" y="208" font-size="12.5" fill="#45703a">find_if：找满足条件的第一个（lambda 定条件）</text>
    <text x="64" y="236" font-size="12.5" fill="#45703a">count_if：数满足条件的有多少</text>
    <text x="64" y="264" font-size="12.5" fill="#45703a">all_of/any_of/none_of：整体判断三兄弟</text>
    <text x="64" y="296" font-size="12.5" fill="#6b675e">"非修改"：不改动容器内容——</text>
    <text x="64" y="316" font-size="12.5" fill="#6b675e">　只读遍历（明天才是修改家族）</text>
    <text x="64" y="352" font-size="12" fill="#8a8578">（手写 for + if + break/count 的四个高频模式）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">lambda 捕获：条件可参数化</text>
    <text x="572" y="180" font-size="12.5" fill="#45703a">[threshold](int x) { return x &gt; threshold; }</text>
    <text x="572" y="202" font-size="12" fill="#8a8578">（外部变量捕获进 lambda——条件随上下文变）</text>
    <text x="572" y="232" font-size="12.5" fill="#3b3a36">实测：阈值 5 → 3 个；改 8 → 1 个</text>
    <text x="572" y="254" font-size="12" fill="#8a8578">（同一模板、不同捕获值——谓词的参数化）</text>
    <text x="572" y="288" font-size="12.5" fill="#6b675e">谓词（predicate）：返回 bool 的 callable</text>
    <text x="572" y="308" font-size="12" fill="#8a8578">（find_if/count_if/all_of 的第三参都是它）</text>
    <text x="572" y="352" font-size="12" fill="#8a8578">（Day 77 工厂的函数指针是它的远亲）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">"没找到"的约定：end()</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">find 族失败返回 end()——判空是标配（it != v.end()）；找到时随机访问迭代器可减出下标（Day 88 能力兑现）</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（这个约定和 Day 80 的 [begin,end) 半开区间一脉相承）</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 85~90 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 91（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 92~95</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 96 项目日</text>
  </g>
</svg>
