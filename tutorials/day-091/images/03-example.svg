<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">四组算法、捕获实战与字符串版战报</text>
    <path d="M 350,58 Q 480,52 610,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21 -std=c++17；-Wall 零警告）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,480 Q 248,485 26,480 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 291)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出</text>
    <rect x="38" y="146" width="420" height="320" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./nm　（-Wall 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== find ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c6">find(9) → 位置 3</text>
    <text x="54" y="240" font-size="11.5" fill="#f0c9c0">find(100) → end()（没找到）</text>
    <text x="54" y="268" font-size="12" fill="#9fb8a8">== find_if ==</text>
    <text x="54" y="290" font-size="11.5" fill="#cfe8c6">第一个 >6 的：7（位置 1）✔</text>
    <text x="54" y="318" font-size="12" fill="#9fb8a8">== count_if ==</text>
    <text x="54" y="340" font-size="11.5" fill="#cfe8c6">偶数 3 个；>=7 的 3 个 ✔</text>
    <text x="54" y="368" font-size="12" fill="#9fb8a8">== 三兄弟 ==</text>
    <text x="54" y="390" font-size="11.5" fill="#cfe8c6">全正？是｜有 10？没有｜无负？是</text>
    <text x="54" y="418" font-size="12" fill="#9fb8a8">== 捕获实战 ==</text>
    <text x="54" y="440" font-size="11.5" fill="#cfe8c6">阈值 5 → 3 个；改 8 → 1 个 ✔</text>
    <text x="54" y="468" font-size="12" fill="#9fb8a8">== 字符串版 ==</text>
    <text x="54" y="490" font-size="11.5" fill="#cfe8c6">首个 a 开头：apple；</text>
    <text x="54" y="510" font-size="11.5" fill="#cfe8c6">长度>=6 的 3 个 ✔</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,480 Q 712,485 490,480 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 291)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">第 16 周开篇的定位</text>
    <rect x="502" y="146" width="420" height="320" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">Day 88 迭代器分类表的兑现：</text>
    <text x="514" y="198" font-size="11.5" fill="#cfe8c6">find 族只要输入迭代器——所有容器通吃</text>
    <text x="514" y="218" font-size="11" fill="#9fb8a8">（find(v) 和 find(l) 同一个函数模板）</text>
    <text x="514" y="248" font-size="12" fill="#9fb8a8">Day 90 的钩子回收：</text>
    <text x="514" y="270" font-size="11.5" fill="#cfe8c6">昨天 sort 的 lambda 比较器——</text>
    <text x="514" y="290" font-size="11.5" fill="#cfe8c6">　今天的 find_if/count_if 是同族（谓词）</text>
    <text x="514" y="320" font-size="12" fill="#9fb8a8">向后的路线：</text>
    <text x="514" y="342" font-size="11.5" fill="#cfe8c6">92 修改算法 → 93 sort 家族 →</text>
    <text x="514" y="362" font-size="11.5" fill="#cfe8c6">94 二分/堆 → 95 数值 → 96 项目日</text>
    <text x="514" y="394" font-size="12.5" fill="#45703a">（91/144 = 63.2%——阶段四过半）</text>
    <text x="514" y="426" font-size="11.5" fill="#9fb8a8">（谓词思维是本周的主线——</text>
    <text x="514" y="446" font-size="11.5" fill="#9fb8a8">　Day 89 LRU 的比较器、Day 90 的两级</text>
    <text x="514" y="464" font-size="11.5" fill="#9fb8a8">　裁判、今天的 find_if 全是它）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">算法的思维转换</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">从"怎么遍历"（for+if+break）到"要什么"（find/count/judge）——意图直接写在函数名里；这是函数式思维的第一课</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 92 修改算法——copy/transform/remove/unique 与 erase-remove 惯用法</text>
  </g>
</svg>
