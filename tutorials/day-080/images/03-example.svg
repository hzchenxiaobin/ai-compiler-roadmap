<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">四遍历实录、通用语言与能力执法战报</text>
    <path d="M 340,58 Q 480,52 620,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21；-Wall 零警告）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,490 Q 248,495 26,490 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 296)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">两实验完整输出（节选）</text>
    <rect x="38" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./fw　（四遍历）</text>
    <text x="54" y="196" font-size="11.5" fill="#cfe8c6">①下标：v[0]=10 … v[4]=50</text>
    <text x="54" y="218" font-size="11.5" fill="#cfe8c6">②迭代器：*it=10…50</text>
    <text x="54" y="240" font-size="11.5" fill="#cfe8c6">③范围 for：x=10…50</text>
    <text x="54" y="262" font-size="11.5" fill="#cfe8c6">④cbegin：*it=10…50（只读）</text>
    <text x="54" y="292" font-size="12" fill="#9fb8a8">身份与算术：</text>
    <text x="54" y="314" font-size="11.5" fill="#cfe8c6">begin→10；end 尾后不 deref</text>
    <text x="54" y="336" font-size="11.5" fill="#f0c9c0">end-begin=5；*(end-1)=50</text>
    <text x="54" y="364" font-size="11.5" fill="#cfe8c6">it+=2→30；it[1]=40；</text>
    <text x="54" y="384" font-size="11.5" fill="#cfe8c6">end-it=3（随机访问 ✔）</text>
    <text x="54" y="416" font-size="11.5" fill="#9fb8a8">$ ./iu　（通用语言）</text>
    <text x="54" y="438" font-size="11.5" fill="#cfe8c6">vector 求和=15，list 求和=15</text>
    <text x="54" y="458" font-size="11" fill="#9fb8a8">（循环一字不改）</text>
    <text x="54" y="486" font-size="11" fill="#9fb8a8">list 随机跳（取消注释）：</text>
    <text x="54" y="506" font-size="10.5" fill="#ffd7d0">error: no viable overloaded '+='</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,490 Q 712,495 490,490 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 296)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">知识网络的连接点</text>
    <rect x="502" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">向后的连接：</text>
    <text x="514" y="198" font-size="11.5" fill="#cfe8c6">Day 81 迭代器失效（扩容/erase）——</text>
    <text x="514" y="218" font-size="11" fill="#9fb8a8">　今天的 begin/end 是明天失效的主角</text>
    <text x="514" y="246" font-size="11.5" fill="#cfe8c6">Day 84 项目日：适配器不提供迭代器</text>
    <text x="514" y="266" font-size="11" fill="#9fb8a8">　（stack 只能 top/pop——为什么？）</text>
    <text x="514" y="294" font-size="11.5" fill="#cfe8c6">第 16 周：std::sort(v.begin(), v.end())</text>
    <text x="514" y="314" font-size="11" fill="#9fb8a8">　——算法只认迭代器（通用语言的回报）</text>
    <text x="514" y="344" font-size="12" fill="#9fb8a8">向前的回收：</text>
    <text x="514" y="366" font-size="11.5" fill="#cfe8c6">Day 46 范围 for 的展开原理——</text>
    <text x="514" y="386" font-size="11" fill="#9fb8a8">　今天用方式②亲手写出糖衣下的代码</text>
    <text x="514" y="414" font-size="11.5" fill="#cfe8c6">Day 19 指针算术（p+1/解引用）——</text>
    <text x="514" y="434" font-size="11" fill="#9fb8a8">　vector 迭代器常就是指针的封装</text>
    <text x="514" y="466" font-size="12.5" fill="#45703a">（80/144 = 55.6%——阶段四第二课）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">选型的三问</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">要下标？→①；只遍历？→③（最简）；要传给算法/要删元素？→②；只读保证？→④——四问覆盖日常 95% 的选择</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 81 迭代器失效规则——扩容与 erase 的悬空事故（复现并修正）</text>
  </g>
</svg>
