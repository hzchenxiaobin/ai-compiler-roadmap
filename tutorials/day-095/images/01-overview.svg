<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 95 全貌：数值算法——accumulate 的三副面孔</text>
    <path d="M 290,60 Q 480,52 670,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"统计计算小程序"——求和/乘积/点积/方差：accumulate 一个算法的第四参就能全变出来</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">accumulate：折叠机</text>
    <text x="64" y="180" font-size="12.5" fill="#45703a">求和：accumulate(v, 0)（初值 0）</text>
    <text x="64" y="208" font-size="12.5" fill="#45703a">乘积：第四参换 lambda（初值 1）</text>
    <text x="64" y="230" font-size="12" fill="#8a8578">（实测 1×2×3×4×5 = 120）</text>
    <text x="64" y="260" font-size="12.5" fill="#45703a">字符串拼接：也不止数字！</text>
    <text x="64" y="282" font-size="12" fill="#8a8578">（实测 "1-2-3-4-5"）</text>
    <text x="64" y="316" font-size="12.5" fill="#a33f2e">初值坑：0 vs 0.0</text>
    <text x="64" y="338" font-size="12" fill="#8a8578">（实测：0.0 得 7.5；0 得 6——截断！）</text>
    <text x="64" y="368" font-size="12" fill="#8a8578">（初值的类型 = 累加器的类型）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">iota 与 inner_product</text>
    <text x="572" y="180" font-size="12.5" fill="#45703a">iota：批量编号 1,2,3,…</text>
    <text x="572" y="202" font-size="12" fill="#8a8578">（循环编号的 for 一行替）</text>
    <text x="572" y="232" font-size="12.5" fill="#45703a">inner_product：两列配对乘再加</text>
    <text x="572" y="254" font-size="12" fill="#8a8578">（实测 1×10+2×20+3×30 = 140）</text>
    <text x="572" y="288" font-size="12.5" fill="#6b675e">加权和/点积/协方差的共同内核</text>
    <text x="572" y="310" font-size="12" fill="#8a8578">（绩点计算：学分×成绩的加权和）</text>
    <text x="572" y="350" font-size="12" fill="#8a8578">（头文件 &lt;numeric&gt; 不是 &lt;algorithm&gt;）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">统计小程序（计划指定）：方差两算式</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">定义式 E[(x-μ)²] vs E[x²]-μ²——实测双双 23.84 ✔（μ=86.6、σ≈4.88）——两种算法一条曲线</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（定义式稳、平方差式快但有数值精度坑——进阶话题注脚）</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 91~94 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 95（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#e0955f"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 96 项目日</text>
    <circle cx="850" cy="514" r="5" fill="#5b8db8"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">第 17 周 模板</text>
  </g>
</svg>
