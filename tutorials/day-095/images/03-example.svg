<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">求和、点积与方差两算式战报</text>
    <path d="M 390,58 Q 480,52 570,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21 -std=c++17；-Wall 零警告）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,490 Q 248,495 26,490 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 296)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出</text>
    <rect x="38" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./na　（-Wall 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== accumulate ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c6">sum=15 avg=3 ✔</text>
    <text x="54" y="244" font-size="11.5" fill="#cfe8c6">double 版（0.0）= 7.5 ✔</text>
    <text x="54" y="264" font-size="11.5" fill="#f0c9c0">初值 0 版 = 6（截断坑！）</text>
    <text x="54" y="292" font-size="12" fill="#9fb8a8">== 第四参 ==</text>
    <text x="54" y="314" font-size="11.5" fill="#cfe8c6">乘积 = 120（1×2×3×4×5）✔</text>
    <text x="54" y="334" font-size="11.5" fill="#cfe8c6">拼接 = "1-2-3-4-5" ✔</text>
    <text x="54" y="362" font-size="12" fill="#9fb8a8">== iota / inner_product ==</text>
    <text x="54" y="384" font-size="11.5" fill="#cfe8c6">iota(1) → 1 2 3 4 5 ✔</text>
    <text x="54" y="404" font-size="11.5" fill="#cfe8c6">a·w = 140 ✔（加权和）</text>
    <text x="54" y="424" font-size="11.5" fill="#cfe8c6">x·y = 32 ✔（点积）</text>
    <text x="54" y="452" font-size="12" fill="#9fb8a8">== 统计（计划指定） ==</text>
    <text x="54" y="474" font-size="11.5" fill="#cfe8c6">μ=86.6；方差两式都 23.84 ✔</text>
    <text x="54" y="494" font-size="11" fill="#9fb8a8">σ≈4.88（sqrt 手查）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,490 Q 712,495 490,490 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 296)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">算法周收官与知识串联</text>
    <rect x="502" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">第 16 周（算法库）六天：</text>
    <text x="514" y="198" font-size="11.5" fill="#cfe8c6">91 只读 → 92 修改 → 93 sort</text>
    <text x="514" y="218" font-size="11.5" fill="#cfe8c6">→ 94 二分/堆 → 95 数值（今天）</text>
    <text x="514" y="238" font-size="11.5" fill="#cfe8a8">→ 96 项目日（明天收官）</text>
    <text x="514" y="268" font-size="12" fill="#9fb8a8">本周的谓词谱系完整体：</text>
    <text x="514" y="290" font-size="11.5" fill="#cfe8c6">查找（91）/删除（92）/比较（93）</text>
    <text x="514" y="310" font-size="11.5" fill="#cfe8c6">/无（94 定位）/折叠（95 的 acc）</text>
    <text x="514" y="342" font-size="12" fill="#9fb8a8">Day 8/20 的相遇：</text>
    <text x="514" y="364" font-size="11.5" fill="#cfe8c6">while/指针版的求和循环——今天一行</text>
    <text x="514" y="384" font-size="11" fill="#9fb8a8">　accumulate 替代（手写循环的终点站）</text>
    <text x="514" y="416" font-size="12.5" fill="#45703a">（95/144 = 66%——明天项目日</text>
    <text x="514" y="436" font-size="12.5" fill="#45703a">　收官第 16 周）</text>
    <text x="514" y="468" font-size="11" fill="#9fb8a8">（&lt;numeric&gt; 头文件——不是 algorithm）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">折叠的通用性</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">求和/乘积/最大值/字符串拼接/方差——全是"acc 与元素做运算"的变体；map-reduce 的大数据思想就是它（今天是最小版）</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 96（项目日）——第 16 周收官：算法库综合实战（详细需求明天揭晓）</text>
  </g>
