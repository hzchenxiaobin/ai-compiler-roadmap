<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">折叠的逐步执行与初值的类型魔咒</text>
    <path d="M 300,58 Q 480,52 660,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,320 Q 470,314 44,319 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 210)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">accumulate({1,2,3,4,5}, 0) 的折叠轨迹</text>
    <rect x="110" y="146" width="80" height="36" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="150" y="169" font-size="10.5" fill="#9c5a22">acc=0</text>
    <rect x="210" y="146" width="70" height="36" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="245" y="169" font-size="10.5" fill="#45703a">+1→1</text>
    <rect x="300" y="146" width="70" height="36" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="335" y="169" font-size="10.5" fill="#45703a">+2→3</text>
    <rect x="390" y="146" width="70" height="36" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="425" y="169" font-size="10.5" fill="#45703a">+3→6</text>
    <rect x="480" y="146" width="70" height="36" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="515" y="169" font-size="10.5" fill="#45703a">+4→10</text>
    <rect x="570" y="146" width="80" height="36" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.4"/>
    <text x="610" y="169" font-size="10.5" fill="#a33f2e">+5→15</text>
    <text x="720" y="160" font-size="10.5" fill="#6b675e">每次："acc 与</text>
    <text x="720" y="178" font-size="10.5" fill="#6b675e">　下一个做运算"</text>
    <text x="472" y="216" font-size="12" fill="#3b3a36">第四参换成 lambda 就变乘积/拼接/平方差——同一骨架、不同运算（折叠的通用性）</text>
    <text x="472" y="244" font-size="12" fill="#6b675e">（reduce/map-reduce 的 reduce——函数式的"汇总"原语；C++17 的 std::reduce 是并行版）</text>
    <text x="472" y="288" font-size="11.5" fill="#8a8578">（fold 左侧：acc 在左、元素在右——lambda 参数序 (acc, x)）</text>

    <path d="M 40,344 Q 280,338 520,344 Q 524,470 520,576 Q 280,582 42,576 Q 36,470 40,344 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 460)"/>
    <text x="280" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">初值的类型魔咒（实测）</text>
    <rect x="64" y="392" width="430" height="150" fill="#33413a"/>
    <text x="279" y="418" font-size="11" fill="#9fb8a8">accumulate(d, 0.0) → 7.5 ✔</text>
    <text x="279" y="442" font-size="11" fill="#9fb8a8">accumulate(d, 0)　 → 6 ✘</text>
    <text x="279" y="470" font-size="10.5" fill="#f0c9c0">（0 是 int——1.5 加进 int 被截成 1）</text>
    <text x="279" y="492" font-size="10.5" fill="#f0c9c0">（1.5+2.5+3.5 = 7.5 变 1+2+3 = 6）</text>
    <text x="279" y="522" font-size="11" fill="#cfe8c6">（初值类型 = 累加器类型！）</text>

    <path d="M 550,344 Q 730,338 905,344 Q 908,470 905,576 Q 730,582 552,576 Q 547,470 550,344 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 460)"/>
    <text x="727" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">inner_product 的解剖</text>
    <rect x="572" y="392" width="320" height="150" fill="#33413a"/>
    <text x="732" y="418" font-size="10.5" fill="#9fb8a8">a = {1, 2, 3}　w = {10, 20, 30}</text>
    <text x="732" y="442" font-size="11" fill="#cfe8c6">1×10 + 2×20 + 3×30</text>
    <text x="732" y="462" font-size="11" fill="#cfe8c6">= 10 + 40 + 90 = 140 ✔</text>
    <text x="732" y="492" font-size="10.5" fill="#9fb8a8">（两列对齐——第二列只要 begin）</text>
    <text x="732" y="516" font-size="10.5" fill="#9fb8a8">（加权和：学分×成绩；点积；Σxy）</text>
  </g>
</svg>
