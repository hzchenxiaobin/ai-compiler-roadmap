<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">四段证据实录与三阶段总表</text>
    <path d="M 390,58 Q 480,52 570,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21；-Wall 零警告 + ASan 零报错）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,480 Q 248,485 26,480 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 291)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">四段证据（节选）</text>
    <rect x="38" y="146" width="420" height="320" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./me　（-Wall 零警告）</text>
    <text x="54" y="198" font-size="12" fill="#9fb8a8">== 概念一：三法则 ==</text>
    <text x="54" y="220" font-size="11.5" fill="#cfe8c6">b=hello c=hello（各自独立）✔</text>
    <text x="54" y="248" font-size="12" fill="#9fb8a8">== 概念二：虚析构 ==</text>
    <text x="54" y="270" font-size="11.5" fill="#f0c9c0">~DerivedV（派生先拆）</text>
    <text x="54" y="288" font-size="11.5" fill="#f0c9c0">~BaseV（拆到基类层）✔</text>
    <text x="54" y="316" font-size="12" fill="#9fb8a8">== 概念三：RAII ==</text>
    <text x="54" y="338" font-size="11.5" fill="#cfe8c6">[打开] data.txt</text>
    <text x="54" y="356" font-size="11.5" fill="#f0c9c0">[关闭] data.txt（出块自动）✔</text>
    <text x="54" y="384" font-size="12" fill="#9fb8a8">== 概念四：深浅拷贝 ==</text>
    <text x="54" y="406" font-size="11.5" fill="#cfe8c6">浅：s1.p == s2.p 同址 ✔</text>
    <text x="54" y="424" font-size="11.5" fill="#cfe8c6">深：d1/d2 各自独立 ✔</text>
    <text x="54" y="454" font-size="11" fill="#9fb8a8">（ASan 全场景零报错）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,480 Q 712,485 490,480 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 291)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">三阶段总表（78/144）</text>
    <rect x="502" y="146" width="420" height="320" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">阶段一（第 1~6 周）：基础</text>
    <text x="514" y="196" font-size="11.5" fill="#cfe8c6">语法/函数/数组/指针入门/文件/通讯录</text>
    <text x="514" y="224" font-size="12" fill="#9fb8a8">阶段二（第 7~8 周）：指针与内存</text>
    <text x="514" y="246" font-size="11.5" fill="#cfe8c6">内存模型/ASan/深浅拷贝/动态数组×2</text>
    <text x="514" y="274" font-size="12" fill="#9fb8a8">阶段三（第 9~13 周）：面向对象</text>
    <text x="514" y="296" font-size="11.5" fill="#cfe8c6">类五件套/继承多态/拷贝控制/虚表/</text>
    <text x="514" y="316" font-size="11.5" fill="#cfe8c6">　图形库三部曲——今天毕业 ✔</text>
    <text x="514" y="348" font-size="12" fill="#9fb8a8">阶段四（第 14~17 周）：STL 与泛型</text>
    <text x="514" y="370" font-size="11.5" fill="#cfe8c6">顺序容器/迭代器/关联容器/算法/模板</text>
    <text x="514" y="398" font-size="12" fill="#9fb8a8">阶段五（第 18~22 周）：进阶实战</text>
    <text x="514" y="420" font-size="11.5" fill="#cfe8c6">智能指针/异常/并发/性能/项目</text>
    <text x="514" y="456" font-size="12.5" fill="#45703a">（54.2%——还有 66 天，</text>
    <text x="514" y="476" font-size="12.5" fill="#45703a">　每周节奏已成惯性）</text>

    <path d="M 24,506 Q 470,500 905,507 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 543)"/>
    <text x="46" y="532" font-size="15.5" font-weight="bold" fill="#9c5a22">毕业礼的意义</text>
    <text x="46" y="560" font-size="12.5" fill="#3b3a36">四概念不是四个孤岛——是一条"资源安全"的完整防线；脱稿讲清它们 = 你已经是能对代码内存行为负责的 C++ 程序员</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 79 vector 深入——扩容/reserve/emplace_back + capacity 增长曲线（手写过 v1/v2 再看官方版）</text>
  </g>
</svg>
