<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">推导规则、代理陷阱与重写战报</text>
    <path d="M 390,58 Q 480,52 570,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21 -std=c++17；-Wall 零警告）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,490 Q 248,495 26,490 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 296)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出（节选）</text>
    <rect x="38" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./ad　（-Wall 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== auto 推导 ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c6">i=42→int(4B)；d=3.14→double(8B)</text>
    <text x="54" y="246" font-size="12" fill="#9fb8a8">== 拷贝语义坑 ==</text>
    <text x="54" y="268" font-size="11.5" fill="#f0c9c0">auto x=v[0]；x=999 后 v[0] 仍 1</text>
    <text x="54" y="288" font-size="11.5" fill="#cfe8c6">auto&amp; r；r=777 后 v[0]=777 ✔</text>
    <text x="54" y="312" font-size="12" fill="#9fb8a8">== 代理陷阱 ==</text>
    <text x="54" y="334" font-size="11.5" fill="#f0c9c0">auto f=flags[0] → 代理非 bool</text>
    <text x="54" y="354" font-size="11.5" fill="#cfe8c6">bool real_b = flags[0] ✔</text>
    <text x="54" y="378" font-size="12" fill="#9fb8a8">== decltype ==</text>
    <text x="54" y="400" font-size="11.5" fill="#cfe8c6">another=20；sum_type=30 ✔</text>
    <text x="54" y="424" font-size="12" fill="#9fb8a8">== 尾置返回 ==</text>
    <text x="54" y="446" font-size="11.5" fill="#cfe8c6">add(3,4.5)=7.5 ✔（混合型加法）</text>
    <text x="54" y="470" font-size="12" fill="#9fb8a8">== 重写旧代码 ==</text>
    <text x="54" y="492" font-size="11.5" fill="#cfe8c8">迭代器声明短 30 字符 ✔</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,490 Q 712,495 490,490 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 296)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">阶段五开篇 + 知识回响</text>
    <rect x="502" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">阶段五（现代 C++，4 周）：</text>
    <text x="514" y="198" font-size="11.5" fill="#cfe8c6">语言核心改进 → 移动语义 →</text>
    <text x="514" y="218" font-size="11.5" fill="#cfe8c8">　智能指针 → 并发/性能 → 项目</text>
    <text x="514" y="248" font-size="12" fill="#9fb8a8">同步阅读：《Effective Modern C++》</text>
    <text x="514" y="270" font-size="11" fill="#9fb8a8">　（每天 1~2 条款——计划原文要求）</text>
    <text x="514" y="300" font-size="12" fill="#9fb8a8">今天的知识回响：</text>
    <text x="514" y="322" font-size="11.5" fill="#cfe8c6">Day 97 myMax2 窄化 → 尾置返回解</text>
    <text x="514" y="342" font-size="11.5" fill="#cfe8c6">Day 88 iterator_traits → decltype 前辈</text>
    <text x="514" y="362" font-size="11.5" fill="#cfe8c8">Day 84/85 的长迭代器声明 → auto 解放</text>
    <text x="514" y="394" font-size="12.5" fill="#45703a">（103/144 = 71.5%）</text>
    <text x="514" y="426" font-size="11.5" fill="#9fb8a8">本周路线：103 auto ✓ → 104 移动语义</text>
    <text x="514" y="446" font-size="11.5" fill="#9fb8a8">　→ 105 完美转发 → …… → 109 项目日</text>
    <text x="514" y="476" font-size="11" fill="#9fb8a8">（Effective 同步：条款 1~6 的 auto 部分</text>
    <text x="514" y="494" font-size="11" fill="#9fb8a8">　——今天涉及条款 6）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">auto 的哲学</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">"类型显然时让它自己说"（省字符+重构友好）vs "类型重要时自己写"（接口边界+代理场景）——工具服务可读性不是反过来</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 104 右值引用与移动语义——偷资源为什么比抄资源快</text>
  </g>
</svg>
