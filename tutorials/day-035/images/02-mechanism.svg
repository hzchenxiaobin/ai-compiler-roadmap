<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">参考实现的结构解剖（约 90 行单文件）</text>
    <path d="M 300,58 Q 480,52 660,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 240,94 440,100 Q 444,210 440,320 Q 240,326 42,320 Q 36,210 40,100 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 240 210)"/>
    <text x="240" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">数据层（三件套）</text>
    <text x="64" y="162" font-size="12.5" fill="#3b3a36">struct Contact：name + phone</text>
    <text x="64" y="188" font-size="12.5" fill="#3b3a36">Contact contacts[100]：定长数组</text>
    <text x="64" y="214" font-size="12.5" fill="#3b3a36">int count：有效长度军规</text>
    <path d="M 64,236 Q 240,230 416,237 L 413,308 Q 240,302 67,307 Z" fill="#fffdf7" stroke="#9db8cf" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="240" y="260" text-anchor="middle" font-size="11.5" fill="#2c5a82">文件的"姓名,电话"每行一条 → 卡片</text>
    <text x="240" y="282" text-anchor="middle" font-size="11.5" fill="#6b675e">getline(ss, name, ',') + getline(ss, phone)</text>
    <text x="240" y="304" text-anchor="middle" font-size="11.5" fill="#8a8578">（卡在这里就去回炉 Day 31）</text>

    <path d="M 470,100 Q 690,94 910,100 Q 913,210 910,320 Q 690,326 472,320 Q 466,210 470,100 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 690 210)"/>
    <text x="690" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">操作层（四函数）</text>
    <text x="492" y="162" font-size="12.5" fill="#3b3a36">load_contacts：读盘重建（守门+上限）</text>
    <text x="492" y="188" font-size="12.5" fill="#3b3a36">save_contacts：全量覆盖写</text>
    <text x="492" y="214" font-size="12.5" fill="#3b3a36">add_contact：查重 → 满员 → 入册</text>
    <text x="492" y="240" font-size="12.5" fill="#3b3a36">find_contact：返回下标或 -1</text>
    <text x="492" y="272" font-size="12" fill="#6b675e">签名对照：增带 int&amp; count（要改数量），</text>
    <text x="492" y="292" font-size="12" fill="#6b675e">查找只读（const 数组 + int count）——</text>
    <text x="492" y="312" font-size="12" fill="#6b675e">Day 21/22 的选型直接写进参数表</text>

    <path d="M 40,344 Q 470,338 905,345 L 901,470 Q 470,464 44,469 Z" fill="#fdf6dd" stroke="#d9b23a" stroke-width="2.8" transform="rotate(-0.2 472 407)"/>
    <text x="472" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d1a">main 的闭环骨架（背下来）</text>
    <rect x="180" y="390" width="600" height="66" fill="#33413a"/>
    <text x="480" y="412" text-anchor="middle" font-size="11.5" fill="#cfe8c6">count = load(...) → while（菜单 + 混读冲刷）→ break 汇流</text>
    <text x="480" y="434" text-anchor="middle" font-size="11.5" fill="#cfe8c6">→ save(...) → 告别　　（argv[1] 接文件名：Day 23 学以致用）</text>
    <text x="480" y="458" text-anchor="middle" font-size="11" fill="#9fb8a8">EOF 与选 0 都汇到 save——数据在任何正常出口不丢</text>

    <path d="M 40,490 Q 470,484 905,491 L 901,576 Q 470,570 44,575 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 472 533)"/>
    <text x="472" y="520" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#55606e">自测后的对照动作</text>
    <text x="70" y="550" font-size="12.5" fill="#3b3a36">逐段对照参考实现：结构对不对（三件套/四函数/闭环）比代码字对字更重要——写法允许不同，闭环不能缺角</text>
  </g>
</svg>
