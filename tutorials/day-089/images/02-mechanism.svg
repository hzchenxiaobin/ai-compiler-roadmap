<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">LRU 的链表快照与 splice 的一步移头</text>
    <path d="M 270,58 Q 480,52 690,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,350 Q 470,344 44,349 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 225)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">容量 2 的四步演变（实测快照）</text>
    <rect x="90" y="146" width="280" height="40" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="230" y="171" font-size="11" fill="#45703a">①put(1) put(2)：[2 → 1]（2 最新）</text>
    <rect x="400" y="146" width="280" height="40" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="540" y="171" font-size="11" fill="#9c5a22">②get(1)：splice 移头 [1 → 2]</text>
    <rect x="90" y="200" width="280" height="40" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2"/>
    <text x="230" y="225" font-size="11" fill="#a33f2e">③put(3)：满 → 淘汰尾 2 → [3 → 1]</text>
    <rect x="400" y="200" width="280" height="40" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="540" y="225" font-size="11" fill="#45703a">④get(2)：-1（已被淘汰）</text>
    <text x="720" y="171" font-size="10.5" fill="#6b675e">头 = 最近使用</text>
    <text x="720" y="191" font-size="10.5" fill="#6b675e">尾 = 淘汰候选</text>
    <text x="720" y="211" font-size="10.5" fill="#6b675e">（尾删 = LRU 策略）</text>
    <text x="472" y="272" font-size="12" fill="#3b3a36">淘汰规则的全貌：满时删链表尾（最久未用）——get/put 都算"用"（都移头）</text>
    <text x="472" y="300" font-size="12" fill="#45703a">"用一次就刷新 freshness"——浏览器的缓存页、CPU 的缓存行同款策略</text>
    <text x="472" y="332" font-size="11" fill="#8a8578">（dump() 让每步的链表视图可复核——教学版的调试红利）</text>

    <path d="M 40,374 Q 280,368 520,374 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,374 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 475)"/>
    <text x="280" y="404" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">splice：为什么是 O(1)</text>
    <rect x="64" y="422" width="430" height="130" fill="#33413a"/>
    <text x="279" y="448" font-size="10.5" fill="#9fb8a8">items_.splice(items_.begin(), items_, it);</text>
    <text x="279" y="472" font-size="11" fill="#cfe8c6">（把 it 指的节点摘下来接到链表头）</text>
    <text x="279" y="496" font-size="11" fill="#9fb8a8">实现：改三个指针（前驱/后继/头）</text>
    <text x="279" y="516" font-size="11" fill="#45703a">——不搬数据、不重排序：纯接线 O(1)</text>
    <text x="280" y="570" font-size="11" fill="#8a8578">（vector 做同样的事要 O(n) 搬移——Day 82 的结构决定能力）</text>

    <path d="M 550,374 Q 730,368 905,374 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,374 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 475)"/>
    <text x="727" y="404" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">为什么不用单容器</text>
    <text x="572" y="438" font-size="12" fill="#3b3a36">单用 list：查找 O(n)（get 慢）</text>
    <text x="572" y="462" font-size="12" fill="#3b3a36">单用 map：移头/删尾 O(n)（序难维护）</text>
    <text x="572" y="496" font-size="12" fill="#45703a">双结构：查（哈希）+ 序（链表）</text>
    <text x="572" y="518" font-size="12" fill="#45703a">　各取所长 → 全操作 O(1)</text>
    <text x="572" y="552" font-size="11" fill="#8a8578">（这是面试的标准答案骨架）</text>
  </g>
</svg>
