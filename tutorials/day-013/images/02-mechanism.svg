<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">下标是偏移量；越界是闯进邻居家</text>
    <path d="M 300,58 Q 480,52 660,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <text x="120" y="110" font-size="15" font-weight="bold" fill="#2c5a82">为什么下标从 0 开始？</text>
    <rect x="60" y="126" width="130" height="46" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.5"/>
    <text x="125" y="154" text-anchor="middle" font-size="14" fill="#3b3a36">scores</text>
    <text x="200" y="122" font-size="12" fill="#8a8578">← 数组名记住的是"起点地址"</text>
    <path d="M 196,146 q 20,6 40,0" fill="none" stroke="#8a94a3" stroke-width="2"/>
    <rect x="240" y="126" width="100" height="46" fill="#eef5e8" stroke="#7aa663" stroke-width="2.5"/>
    <text x="290" y="150" text-anchor="middle" font-size="13" fill="#3b3a36">12</text>
    <text x="290" y="166" text-anchor="middle" font-size="10.5" fill="#8a8578">起点+0 格</text>
    <rect x="340" y="126" width="100" height="46" fill="#eef5e8" stroke="#7aa663" stroke-width="2.5"/>
    <text x="390" y="150" text-anchor="middle" font-size="13" fill="#3b3a36">25</text>
    <text x="390" y="166" text-anchor="middle" font-size="10.5" fill="#8a8578">起点+4 字节</text>
    <rect x="440" y="126" width="100" height="46" fill="#eef5e8" stroke="#7aa663" stroke-width="2.5"/>
    <text x="490" y="150" text-anchor="middle" font-size="13" fill="#3b3a36">9</text>
    <text x="490" y="166" text-anchor="middle" font-size="10.5" fill="#8a8578">起点+8 字节</text>
    <text x="580" y="140" font-size="13" fill="#3b3a36">下标 i 的真实含义：</text>
    <text x="580" y="162" font-size="13" fill="#2c5a82">"从起点往前数 i 个盒子"</text>
    <text x="580" y="184" font-size="12" fill="#8a8578">第 0 个=不偏移——所以从 0 起</text>

    <text x="120" y="240" font-size="15" font-weight="bold" fill="#a33f2e">scores[8] = 999 时发生了什么？</text>
    <rect x="60" y="256" width="100" height="46" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.5"/>
    <text x="110" y="278" text-anchor="middle" font-size="11" fill="#8a8578">[5] 27</text>
    <rect x="160" y="256" width="100" height="46" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.5"/>
    <text x="210" y="278" text-anchor="middle" font-size="11" fill="#8a8578">[6] 22</text>
    <rect x="260" y="256" width="100" height="46" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.5"/>
    <text x="310" y="278" text-anchor="middle" font-size="11" fill="#45703a">[7] 35</text>
    <text x="310" y="292" text-anchor="middle" font-size="10" fill="#45703a">最后合法成员</text>
    <rect x="360" y="256" width="100" height="46" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.6" stroke-dasharray="8 5" transform="rotate(1.2 410 279)"/>
    <text x="410" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33f2e">999</text>
    <text x="410" y="294" text-anchor="middle" font-size="10" fill="#a33f2e">[8] 邻居地盘</text>
    <text x="500" y="272" font-size="12.5" fill="#3b3a36">越界的 999 落在数组外的内存里——</text>
    <text x="500" y="292" font-size="12.5" fill="#3b3a36">那里可能是另一个变量、函数记录，</text>
    <text x="500" y="312" font-size="12.5" fill="#a33f2e">踩坏什么全凭运气：未定义行为</text>

    <path d="M 40,340 Q 460,334 905,341 L 901,468 Q 460,462 44,467 Z" fill="#fdf6dd" stroke="#d9b23a" stroke-width="2.8" transform="rotate(-0.2 472 396)"/>
    <text x="472" y="372" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#8a6d1a">三道防线（全部本机实测）</text>
    <text x="70" y="404" font-size="13" fill="#3b3a36">防线一（编译期）：-Wall 对常量下标给 [-Warray-bounds] 警告，</text>
    <text x="70" y="426" font-size="13" fill="#6b675e">　　　　　　　　　当场点名"array index 8 is past the end"</text>
    <text x="70" y="450" font-size="13" fill="#3b3a36">防线二（运行期）：-fsanitize=address 把踩踏现场拍下来（exit≠0）</text>
    <text x="500" y="404" font-size="13" fill="#3b3a36">防线三（习惯）：循环边界写 i &lt; WEEKS，</text>
    <text x="500" y="426" font-size="13" fill="#6b675e">长度交给常量管，绝不写魔法数字 8</text>
    <text x="500" y="450" font-size="12.5" fill="#a33f2e">注意：下标来自变量时，防线一会失明——防线三才是根本</text>

    <path d="M 40,494 Q 460,488 905,495 L 901,592 Q 460,586 44,591 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 472 543)"/>
    <text x="472" y="526" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#55606e">数组与函数（第 4 周的预习课）</text>
    <text x="70" y="558" font-size="13" fill="#3b3a36">把统计四件套装进函数时，长度不能自动带过去——</text>
    <text x="70" y="582" font-size="13" fill="#3b3a36">要么再加一个 int count 参数（今天的写法），要么等第 4 周指针/第 14 周 vector 讲"自带长度"的集装箱</text>
  </g>
</svg>
