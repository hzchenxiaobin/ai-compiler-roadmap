<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 55 全貌：拷贝构造——复制对象的正确姿势</text>
    <path d="M 300,60 Q 480,52 660,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">Day 9 值传递的"复印件"今天有了正式名字——含指针成员时，浅拷贝是 double free 的导火索</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">拷贝构造的触发时机（实测 5 场景）</text>
    <text x="64" y="180" font-size="12.5" fill="#45703a">①Logger b = a;（初始化）✔ 触发</text>
    <text x="64" y="204" font-size="12.5" fill="#45703a">②take_by_value(a)（值传参）✔ 触发</text>
    <text x="64" y="228" font-size="12.5" fill="#a33f2e">③take_by_ref(a)（引用传参）✘ 不触发</text>
    <text x="64" y="252" font-size="12.5" fill="#8a8578">④return local（RVO 省略，本机实测零拷贝）</text>
    <text x="64" y="276" font-size="12.5" fill="#8a8578">⑤d = a（赋值）✘ 不触发——那是 Day 62 的拷贝赋值</text>
    <text x="64" y="316" font-size="12.5" fill="#6b675e">签名：T(const T&amp; other)——参数必须是引用：</text>
    <text x="64" y="338" font-size="12.5" fill="#6b675e">　T(T other) 会无限递归（传值又要拷贝→死循环）</text>
    <text x="64" y="366" font-size="12" fill="#8a8578">（Day 9 的"复印件"今日正式命名）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#a33f2e">浅拷贝的事故链</text>
    <text x="572" y="180" font-size="12.5" fill="#3b3a36">①a.data_ → 0x…92c0（new 的）</text>
    <text x="572" y="204" font-size="12.5" fill="#a33f2e">②b = a 浅拷贝：b.data_ 也指 0x…92c0</text>
    <text x="572" y="228" font-size="12.5" fill="#a33f2e">③析构 b：delete[] 0x…92c0</text>
    <text x="572" y="252" font-size="12.5" fill="#a33f2e">④析构 a：再 delete[] 同一地址 → double free</text>
    <text x="572" y="286" font-size="12" fill="#8a8578">普通编译：静默通过或崩（看运气）</text>
    <text x="572" y="310" font-size="12" fill="#a33f2e">ASan 实测：attempting double-free 现形</text>
    <text x="572" y="344" font-size="12.5" fill="#6b675e">编译器默认生成的就是浅拷贝——</text>
    <text x="572" y="366" font-size="12.5" fill="#6b675e">含指针成员时不写拷贝构造 = 踩雷</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">深拷贝的修复（实测地址分离）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">拷贝构造里两步：①new 同大小新内存 ②memcpy 抄内容——实测 a@…92c0 / b@…92d0 各自安全析构 ✔</text>
    <text x="70" y="492" font-size="12.5" fill="#6b675e">（Day 63 的"三法则"会总结：析构 + 拷贝构造 + 拷贝赋值三者要一起来）</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 67~72 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 55（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 56~58 拷贝控制</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 66 项目日</text>
  </g>
</svg>
