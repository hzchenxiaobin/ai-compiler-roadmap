<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 100 里程碑日：lambda 捕获全家福——十场景</text>
    <path d="M 290,60 Q 480,52 670,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"10 个小场景"——值/引用/混合/全捕/mutable/初始化/this/悬空：Day 91 的 [threshold] 今天讲透每一格</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">捕获的核心二分</text>
    <rect x="64" y="164" width="200" height="60" fill="#d8ecce" stroke="#7aa663" stroke-width="2.2"/>
    <text x="164" y="188" font-size="11" fill="#45703a">[x] 值捕获</text>
    <text x="164" y="206" font-size="10" fill="#8a8578">（拷贝快照——安全）</text>
    <rect x="284" y="164" width="200" height="60" fill="#f9d9b8" stroke="#e0955f" stroke-width="2.2"/>
    <text x="384" y="188" font-size="11" fill="#9c5a22">[&amp;x] 引用捕获</text>
    <text x="384" y="206" font-size="10" fill="#8a8578">（别名——活但会悬空）</text>
    <text x="64" y="252" font-size="12.5" fill="#45703a">实测对照：捕获后 x=999</text>
    <text x="64" y="274" font-size="12.5" fill="#3b3a36">　值版仍 10｜引用版跟到 999</text>
    <text x="64" y="304" font-size="12.5" fill="#6b675e">选择直觉：</text>
    <text x="64" y="326" font-size="12" fill="#8a8578">只读小对象→值；要改外部/大对象→引用；</text>
    <text x="64" y="346" font-size="12" fill="#8a8578">lambda 活得比变量久→必须值（防悬空）</text>
    <text x="64" y="372" font-size="12" fill="#8a8578">（[] 不捕获：全局/static 直接可见）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">进阶三件（实测）</text>
    <text x="572" y="180" font-size="12" fill="#45703a">mutable：值拷贝也能改（计数器 3 次涨）</text>
    <text x="572" y="202" font-size="11.5" fill="#8a8578">（改的是拷贝不是原变量）</text>
    <text x="572" y="232" font-size="12" fill="#45703a">初始化捕获 [n = expr]：</text>
    <text x="572" y="252" font-size="11.5" fill="#8a8578">（[sum=x+y] 捕获时刻算好 300）</text>
    <text x="572" y="282" font-size="12" fill="#45703a">[this]：成员场景——对象变它跟着变</text>
    <text x="572" y="302" font-size="11.5" fill="#8a8578">（g.score 改 77 → booster()=154）</text>
    <text x="572" y="334" font-size="12" fill="#a33f2e">悬空红线：局部的引用捕获逃逸 = UB</text>
    <text x="572" y="356" font-size="11.5" fill="#8a8578">（lambda 活得久就值捕获）</text>
  </g>
</svg>
