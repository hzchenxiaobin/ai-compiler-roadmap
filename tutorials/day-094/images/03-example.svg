<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">七档边界、堆四板斧与 equal_range 战报</text>
    <path d="M 320,58 Q 480,52 640,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21 -std=c++17；-Wall 零警告）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,490 Q 248,495 26,490 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 296)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出（节选）</text>
    <rect x="38" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./bh　（-Wall 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== lower/upper ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c6">lower(3)=1（首现）</text>
    <text x="54" y="240" font-size="11.5" fill="#cfe8c6">upper(3)=4（跳过全部）</text>
    <text x="54" y="258" font-size="11.5" fill="#cfe8c6">lower(6)=5（不存在的插入位）</text>
    <text x="54" y="276" font-size="11.5" fill="#cfe8c6">lower(99)=7==end</text>
    <text x="54" y="300" font-size="11.5" fill="#f0c9c0">3 的个数 = upper-lower = 3 ✔</text>
    <text x="54" y="322" font-size="11.5" fill="#cfe8c6">equal_range(3) = [1, 4)</text>
    <text x="54" y="350" font-size="12" fill="#9fb8a8">== 七档边界（计划指定） ==</text>
    <text x="54" y="372" font-size="11.5" fill="#cfe8c6">0→0 1→0 2→1 3→1</text>
    <text x="54" y="392" font-size="11.5" fill="#cfe8c6">4→4 5→4 10→7(end) ✔</text>
    <text x="54" y="420" font-size="12" fill="#9fb8a8">== 堆四板斧 ==</text>
    <text x="54" y="442" font-size="11.5" fill="#cfe8c6">make：h[0]=9 ✔</text>
    <text x="54" y="462" font-size="11.5" fill="#f0c9c0">push 10 → h[0]=10（上浮 ✔）</text>
    <text x="54" y="482" font-size="11.5" fill="#cfe8c6">pop → 取 10、新顶 9 ✔</text>
    <text x="54" y="504" font-size="11.5" fill="#cfe8c6">sort_heap → 1..9 升序 ✔</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,490 Q 712,495 490,490 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 296)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">知识连接与选型</text>
    <rect x="502" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">Day 87 equal_range(multimap)：</text>
    <text x="514" y="196" font-size="11.5" fill="#cfe8c6">今天的 equal_range(有序数组)</text>
    <text x="514" y="216" font-size="11" fill="#9fb8a8">　同名同语义——区间语言统一</text>
    <text x="514" y="246" font-size="12" fill="#9fb8a8">Day 83 priority_queue：</text>
    <text x="514" y="268" font-size="11.5" fill="#cfe8c6">今天见了它的内脏（四板斧）</text>
    <text x="514" y="288" font-size="11" fill="#9fb8a8">　5 4 3 1 1 的秩序同源</text>
    <text x="514" y="318" font-size="12" fill="#9fb8a8">Day 90 Top-N 的三档：</text>
    <text x="514" y="340" font-size="11.5" fill="#cfe8c6">全排（当天用）→ partial_sort</text>
    <text x="514" y="360" font-size="11.5" fill="#cfe8c6">　→ 堆方案（n 大 N 小最优）</text>
    <text x="514" y="392" font-size="12.5" fill="#45703a">（94/144 = 65.3%——</text>
    <text x="514" y="412" font-size="12.5" fill="#45703a">　三分之二处）</text>
    <text x="514" y="444" font-size="11.5" fill="#9fb8a8">明天：accumulate/iota/inner_product</text>
    <text x="514" y="464" font-size="11" fill="#9fb8a8">（数值算法——统计计算小程序）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">二分的思想价值</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">"有序"是资产的利息——排序一次 O(n log n)、之后每次查找 O(log n)（百万数据 20 步）；维护有序插 lower_bound 一步定位</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 95 数值算法——accumulate/iota/inner_product 与统计小程序（计划指定练习）</text>
  </g>
</svg>
