<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">重复元素的边界图与堆的树形状</text>
    <path d="M 300,58 Q 480,52 660,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,330 Q 470,324 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 215)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">{1, 3, 3, 3, 5, 7, 9} 的边界图</text>
    <rect x="100" y="146" width="60" height="40" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="130" y="171" font-size="11" fill="#45703a">1</text>
    <rect x="160" y="146" width="60" height="40" fill="#f9d9b8" stroke="#e0955f" stroke-width="2.4"/>
    <text x="190" y="171" font-size="11" fill="#9c5a22">3</text>
    <rect x="220" y="146" width="60" height="40" fill="#f9d9b8" stroke="#e0955f" stroke-width="2.4"/>
    <text x="250" y="171" font-size="11" fill="#9c5a22">3</text>
    <rect x="280" y="146" width="60" height="40" fill="#f9d9b8" stroke="#e0955f" stroke-width="2.4"/>
    <text x="310" y="171" font-size="11" fill="#9c5a22">3</text>
    <rect x="340" y="146" width="60" height="40" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="370" y="171" font-size="11" fill="#45703a">5</text>
    <rect x="400" y="146" width="60" height="40" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="430" y="171" font-size="11" fill="#45703a">7</text>
    <rect x="460" y="146" width="60" height="40" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="490" y="171" font-size="11" fill="#45703a">9</text>
    <path d="M 190,196 L 190,220" fill="none" stroke="#e0955f" stroke-width="2.4"/>
    <path d="M 310,196 L 310,220" fill="none" stroke="#e0955f" stroke-width="2.4"/>
    <text x="190" y="240" font-size="10.5" fill="#e0955f">↑lower(3)</text>
    <text x="310" y="240" font-size="10.5" fill="#e0955f">↑upper(3)（[1,4) 区间）</text>
    <text x="472" y="280" font-size="12" fill="#3b3a36">lower 指向 3 的首现（下标 1）；upper 指向 3 之后（下标 4）——</text>
    <text x="472" y="304" font-size="12" fill="#45703a">两指针夹出全部 3（4-1=3 个——count 的二分版）</text>
    <text x="620" y="240" font-size="11" fill="#6b675e">插入位的读法：</text>
    <text x="620" y="262" font-size="10.5" fill="#6b675e">　lower(4)=4 → 3 和 5 之间</text>
    <text x="620" y="282" font-size="10.5" fill="#6b675e">　lower(10)=7 → 尾部（end）</text>

    <path d="M 40,354 Q 280,348 520,354 Q 524,470 520,576 Q 280,582 42,576 Q 36,470 40,354 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 465)"/>
    <text x="280" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">make_heap 后的树形状</text>
    <circle cx="280" cy="410" r="24" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.2"/>
    <text x="280" y="415" font-size="10.5" fill="#a33f2e">9</text>
    <circle cx="200" cy="470" r="20" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="200" y="475" font-size="10" fill="#9c5a22">6</text>
    <circle cx="360" cy="470" r="20" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="360" y="475" font-size="10" fill="#9c5a22">4</text>
    <circle cx="160" cy="528" r="17" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="160" y="533" font-size="9.5" fill="#45703a">5</text>
    <circle cx="230" cy="528" r="17" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="230" y="533" font-size="9.5" fill="#45703a">1</text>
    <path d="M 262,428 Q 220,450 208,456" fill="none" stroke="#3b3a36" stroke-width="1.8"/>
    <path d="M 298,428 Q 340,450 352,456" fill="none" stroke="#3b3a36" stroke-width="1.8"/>
    <text x="300" y="470" font-size="10" fill="#6b675e">父 &gt;= 子（堆序）</text>
    <text x="300" y="490" font-size="10" fill="#6b675e">（不要求左 &lt; 右——</text>
    <text x="300" y="508" font-size="10" fill="#6b675e">　只管父子）</text>

    <path d="M 550,354 Q 730,348 905,354 Q 908,470 905,576 Q 730,582 552,576 Q 547,470 550,354 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 465)"/>
    <text x="727" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">priority_queue 的底层</text>
    <text x="572" y="418" font-size="12" fill="#3b3a36">Day 83 的 pq.push/pop/top——</text>
    <text x="572" y="440" font-size="12" fill="#6b675e">　内部就是 push_heap/pop_heap</text>
    <text x="572" y="470" font-size="12" fill="#3b3a36">裸算法版的价值：</text>
    <text x="572" y="492" font-size="11.5" fill="#6b675e">（可以对"数组的一部分"当堆用；</text>
    <text x="572" y="512" font-size="11.5" fill="#6b675e">　pq 做不到——它是完整封装）</text>
    <text x="572" y="546" font-size="11" fill="#8a8578">（Top-N 的堆方案：n 大 N 小时</text>
    <text x="572" y="564" font-size="11" fill="#8a8578">　O(n log N) 优于全排 O(n log n)）</text>
  </g>
</svg>
