<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 94 全貌：二分边界与堆——有序世界的高效操作</text>
    <path d="M 260,60 Q 480,52 700,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"手测二分边界"——lower/upper 的"一言之差"决定插入位；堆的四板斧正是 priority_queue 的底层</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">lower vs upper：一言之差</text>
    <text x="64" y="180" font-size="12.5" fill="#45703a">lower_bound(x)：第一个 &gt;= x 的位置</text>
    <text x="64" y="202" font-size="12" fill="#8a8578">（x 存在 → 首现；不存在 → 插入位）</text>
    <text x="64" y="232" font-size="12.5" fill="#45703a">upper_bound(x)：第一个 &gt; x 的位置</text>
    <text x="64" y="254" font-size="12" fill="#8a8578">（x 存在 → 跳过全部 x；x 是重复时差出个数）</text>
    <text x="64" y="288" font-size="12.5" fill="#45703a">equal_range(x)：一次拿 [lower, upper)</text>
    <text x="64" y="310" font-size="12" fill="#8a8578">（实测 [1,4)——Day 87 的区间语言再现）</text>
    <text x="64" y="344" font-size="12.5" fill="#6b675e">共同前提：区间必须已排序！</text>
    <text x="64" y="366" font-size="12" fill="#8a8578">（乱序数组上二分 = 看运气的乱指）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">堆的四板斧（实测）</text>
    <text x="572" y="180" font-size="12.5" fill="#45703a">make_heap：数组 → 堆（h[0]=最大）</text>
    <text x="572" y="208" font-size="12.5" fill="#45703a">push_back + push_heap：上浮到顶</text>
    <text x="572" y="230" font-size="12" fill="#8a8578">（实测 push 10 → h[0]=10）</text>
    <text x="572" y="262" font-size="12.5" fill="#45703a">pop_heap + pop_back：最大者离场</text>
    <text x="572" y="284" font-size="12" fill="#8a8578">（实测取出 10、新顶 9）</text>
    <text x="572" y="316" font-size="12.5" fill="#45703a">sort_heap：堆 → 升序数组</text>
    <text x="572" y="344" font-size="12" fill="#8a8578">（priority_queue 的底层——</text>
    <text x="572" y="364" font-size="12" fill="#8a8578">　Day 83 的 5 4 3 1 1 同款秩序）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">边界手测表（计划指定——实测）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">x: 0→0｜1→0（首现）｜2→1｜3→1｜4→4（跳过 3×3）｜5→4｜10→7==end——七档边界全过（首/尾/重复/缺失）</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（这组数字值得抄进 notes.md——二分面试题的口算基础）</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 91~93 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 94（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 95~96</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 96 项目日</text>
  </g>
</svg>
