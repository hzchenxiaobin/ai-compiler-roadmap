<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 45 全貌：内存错误博物馆——四大罪状与雷达实录</text>
    <path d="M 260,60 Q 480,52 700,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"每个案例配 ASan 实验一次"——越界/UAF/double-free 三案现形、泄漏案诚实记录 macOS 边界</text>

    <path d="M 40,116 Q 470,110 905,117 L 901,380 Q 470,374 44,379 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 248)"/>
    <text x="472" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">四案的 ASan 判决书（实测原文）</text>
    <rect x="70" y="162" width="820" height="200" fill="#33413a"/>
    <text x="490" y="188" font-size="11.5" fill="#cfe8c6">案例一 堆越界：a[3]（合法到 a[2]）</text>
    <text x="490" y="208" font-size="11" fill="#ffd7d0">ERROR: heap-buffer-overflow on 0x…095c</text>
    <text x="490" y="234" font-size="11.5" fill="#cfe8c6">案例二 UAF：delete 后读 *p</text>
    <text x="490" y="254" font-size="11" fill="#ffd7d0">ERROR: heap-use-after-free + READ of size 4</text>
    <text x="490" y="280" font-size="11.5" fill="#cfe8c6">案例三 double-free：同一块 delete 两次</text>
    <text x="490" y="300" font-size="11" fill="#ffd7d0">ERROR: attempting double-free on 0x…0950</text>
    <text x="490" y="326" font-size="11.5" fill="#cfe8c6">案例四 泄漏：new 了没还</text>
    <text x="490" y="346" font-size="11" fill="#9fb8a8">（macOS ASan 静默——Linux/valgrind 可抓，诚实记录）</text>

    <path d="M 40,404 Q 280,398 520,404 Q 524,450 520,500 Q 280,506 42,500 Q 36,450 40,404 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 452)"/>
    <text x="280" y="432" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">共同点：全都静默</text>
    <text x="64" y="462" font-size="12.5" fill="#3b3a36">普通编译下四案全部 exit=0 或"正常输出"——</text>
    <text x="64" y="486" font-size="12.5" fill="#3b3a36">　没有 ASan 你根本不知道出事了</text>

    <path d="M 550,404 Q 730,398 905,404 Q 908,450 905,500 Q 730,506 552,500 Q 547,450 550,404 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 452)"/>
    <text x="727" y="432" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">本周课的总复习</text>
    <text x="572" y="462" font-size="12" fill="#8a8578">Day 39 工具课的四个面 ——今天一次看全</text>
    <text x="572" y="486" font-size="12" fill="#8a8578">（每个报告的读法都是 Day 39 教的三要素）</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 37~44 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 45（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 46~47</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 48 自测日</text>
  </g>
</svg>
