<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">report 的杠杆与两条执法线</text>
    <path d="M 350,58 Q 480,52 610,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,250 470,400 Q 248,405 26,400 Q 20,250 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 251)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">实验 1：接口类的杠杆</text>
    <rect x="38" y="146" width="420" height="240" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./is</text>
    <text x="54" y="198" font-size="12.5" fill="#cfe8c6">圆(r=2.000000)：面积 12.5664，周长 12.5664</text>
    <text x="54" y="220" font-size="12.5" fill="#cfe8c6">矩形(3.000000×4.000000)：面积 12，周长 14</text>
    <text x="54" y="256" font-size="12" fill="#9fb8a8">report() 是 Shape 的非虚函数——</text>
    <text x="54" y="276" font-size="12" fill="#9fb8a8">里面三行调的全是派生类的实现</text>
    <text x="54" y="304" font-size="12" fill="#9fb8a8">（写一次 report，所有形状复用；</text>
    <text x="54" y="324" font-size="12" fill="#9fb8a8">　新形状只要实现三个纯虚即可入列）</text>
    <text x="54" y="358" font-size="12" fill="#9fb8a8">to_string 显示 6 位小数——</text>
    <text x="54" y="378" font-size="12" fill="#9fb8a8">诚实账本照旧（Day 42 同款问题）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,250 934,400 Q 712,405 490,400 Q 484,250 488,102 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="3" transform="rotate(0.3 711 251)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#a33f2e">实验 2：两条执法线</text>
    <rect x="502" y="146" width="420" height="240" rx="6" fill="#33413a"/>
    <text x="514" y="172" font-size="11.5" fill="#9fb8a8">① Shape s;　（直接实例化抽象类）</text>
    <text x="514" y="196" font-size="11" fill="#ffd7d0">error: variable type 'Shape' is an</text>
    <text x="514" y="214" font-size="11" fill="#ffd7d0">　　　 abstract class</text>
    <text x="514" y="248" font-size="11.5" fill="#9fb8a8">② class Blob : Shape {} + Blob b;</text>
    <text x="514" y="268" font-size="11.5" fill="#9fb8a8">　（漏实现全部三个纯虚）</text>
    <text x="514" y="292" font-size="11" fill="#ffd7d0">error: variable type 'Blob' is an</text>
    <text x="514" y="310" font-size="11" fill="#ffd7d0">　　　 abstract class</text>
    <text x="514" y="348" font-size="12" fill="#9fb8a8">抽象像债务：继承一层、传一层——</text>
    <text x="514" y="368" font-size="12" fill="#9fb8a8">全还清（全部实现）才能当具体类用</text>

    <path d="M 24,426 Q 470,420 905,427 L 901,510 Q 470,504 26,509 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 464 468)"/>
    <text x="46" y="454" font-size="15.5" font-weight="bold" fill="#2c5a82">实验 3：混合设计的分层</text>
    <text x="46" y="484" font-size="12.5" fill="#3b3a36">正方形（面积 25.000000）/ 圆（面积 28.274334）——describe/name 来自 NamedShape，area 来自末梢</text>
    <text x="46" y="504" font-size="12.5" fill="#6b675e">（Square/Circle 各只写了 3 行——公共逻辑一分不重）</text>

    <path d="M 24,530 Q 470,524 905,531 L 901,630 Q 470,624 26,629 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 580)"/>
    <text x="480" y="560" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#55606e">明天预告</text>
    <text x="480" y="590" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 46：虚析构函数为什么必须写——delete 基类指针时，派生类的析构不执行会怎样（真实泄漏实验 + ASan 抓获）</text>
    <text x="480" y="612" text-anchor="middle" font-size="12.5" fill="#6b675e">今天两个示例里照抄的 virtual ~Shape() = default; 明天正式开学</text>
  </g>
</svg>
