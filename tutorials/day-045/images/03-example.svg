<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">四案判决实录与普通版的静默对照</text>
    <path d="M 310,58 Q 480,52 650,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21；ASan 编译 -fsanitize=address）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,480 Q 248,485 26,480 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 291)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">四案判决（各跑一次）</text>
    <rect x="38" y="146" width="420" height="320" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./em 1（越界）</text>
    <text x="54" y="192" font-size="11.5" fill="#cfe8c6">合法：a[2] = 30</text>
    <text x="54" y="214" font-size="11" fill="#ffd7d0">heap-buffer-overflow on 0x…095c</text>
    <text x="54" y="244" font-size="11.5" fill="#9fb8a8">$ ./em 2（UAF）</text>
    <text x="54" y="266" font-size="11" fill="#ffd7d0">heap-use-after-free + READ of size 4</text>
    <text x="54" y="296" font-size="11.5" fill="#9fb8a8">$ ./em 3（double-free）</text>
    <text x="54" y="318" font-size="11" fill="#ffd7d0">attempting double-free on 0x…0950</text>
    <text x="54" y="348" font-size="11.5" fill="#9fb8a8">$ ./em 4（泄漏）</text>
    <text x="54" y="370" font-size="11.5" fill="#cfe8c6">分配后没 delete——静默</text>
    <text x="54" y="390" font-size="11" fill="#9fb8a8">（macOS ASan 无报告——诚实记录）</text>
    <text x="54" y="424" font-size="12" fill="#9fb8a8">（一案一命令——计划指定的</text>
    <text x="54" y="442" font-size="12" fill="#9fb8a8">　"每个案例配 ASan 实验一次"）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,480 Q 712,485 490,480 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 291)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">普通版静默对照</text>
    <rect x="502" y="146" width="420" height="320" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">不加 ASan 直接编译：</text>
    <text x="514" y="202" font-size="11.5" fill="#cfe8c6">案例一：a[3] 打出 0（红区无感）</text>
    <text x="514" y="226" font-size="11.5" fill="#cfe8c6">案例二：*p 打出旧值假象</text>
    <text x="514" y="250" font-size="11.5" fill="#cfe8c6">案例三：可能崩也可能静默</text>
    <text x="514" y="274" font-size="11.5" fill="#cfe8c6">案例四：正常跑完</text>
    <text x="514" y="308" font-size="12.5" fill="#a33f2e">结论：没雷达的内存错误</text>
    <text x="514" y="330" font-size="12.5" fill="#a33f2e">　全都"看起来没事"</text>
    <text x="514" y="366" font-size="12" fill="#9fb8a8">本周系列课的教训汇成一句：</text>
    <text x="514" y="392" font-size="12.5" fill="#45703a">　测试期常开 ASan（代价 ×2</text>
    <text x="514" y="412" font-size="12.5" fill="#45703a">　　但四案三现形）</text>
    <text x="514" y="442" font-size="12.5" fill="#45703a">　生产代码用 RAII（根治）</text>

    <path d="M 24,506 Q 470,500 905,507 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 543)"/>
    <text x="46" y="532" font-size="15.5" font-weight="bold" fill="#9c5a22">错误档案的用法</text>
    <text x="46" y="560" font-size="12.5" fill="#3b3a36">把这四张判决书抄进 notes.md——下次自己代码报同款错时，三要素定位法直接对号入座</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 46 auto 与范围 for——用现代写法重写第 4 周旧代码（计划指定练习）</text>
  </g>
</svg>
