<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 43 全貌：三种字符串——C 串、string 与 view</text>
    <path d="M 300,60 Q 480,52 660,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定练习"三种遍历对比"——同一句 hello world 在三代设施里的家、长度与代价</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">三代的户口与长度</text>
    <text x="64" y="180" font-size="12.5" fill="#3b3a36">C 字符串（const char*）：常量区/栈，'\0' 结尾</text>
    <text x="64" y="202" font-size="12" fill="#a33f2e">　strlen 要走一遍才知道长（O(n)）</text>
    <text x="64" y="230" font-size="12.5" fill="#3b3a36">std::string：自带 size（O(1)）+ 可增长</text>
    <text x="64" y="252" font-size="12" fill="#45703a">　实测 sizeof=24；短串走 SSO（内联不进堆！）</text>
    <text x="64" y="280" font-size="12.5" fill="#3b3a36">string_view（C++17）：指针+长度的"借看"</text>
    <text x="64" y="302" font-size="12" fill="#45703a">　实测 sizeof=16、O(1) 长度</text>
    <text x="64" y="338" font-size="12.5" fill="#6b675e">选型：要改要增长→string；只读参数→view；</text>
    <text x="64" y="358" font-size="12.5" fill="#6b675e">　对接 C 接口→c_str()</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">实测地址大发现</text>
    <text x="572" y="180" font-size="12.5" fill="#3b3a36">cstr → 常量区 0x100b89d94</text>
    <text x="572" y="202" font-size="12.5" fill="#3b3a36">stack_buf → 栈 0x16f276d58</text>
    <text x="572" y="230" font-size="12.5" fill="#45703a">str.data() → 也是栈 0x16f276d30！</text>
    <text x="572" y="252" font-size="12" fill="#8a8578">（"hello world" 11 字节 ≤ 22——SSO 内联）</text>
    <text x="572" y="282" font-size="12.5" fill="#45703a">sv.data() 与 str.data() 同址——纯借看 ✔</text>
    <text x="572" y="316" font-size="12.5" fill="#6b675e">（第 1 周"字面量只读"的常量区、</text>
    <text x="572" y="336" font-size="12.5" fill="#6b675e">　Day 37 楼层图今天全串起来了）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">string_view 的悬空陷阱（实测）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">借了临时 string，temp 析构后 view 还在（size=12 假象）——再读是 UB："只借不管生死"是它的本质也是它的险</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（规则：view 的寿命绝不能超过它借的对象——函数参数是它的主场）</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 37~42 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 43（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 44~47</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 48 自测日</text>
  </g>
</svg>
