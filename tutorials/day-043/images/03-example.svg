<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">is-a 初体验、指针点名与构造链</text>
    <path d="M 360,58 Q 480,52 600,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,230 470,360 Q 248,365 26,360 Q 20,230 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 231)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">实验 1：is-a 初体验</text>
    <rect x="38" y="146" width="420" height="200" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./ib</text>
    <text x="54" y="196" font-size="12.5" fill="#cfe8c6">我是 小明，15 岁。　　←s.introduce()（继承）</text>
    <text x="54" y="218" font-size="12.5" fill="#cfe8c6">小明（9 年级）正在学习 C++ ←s.study()（新增）</text>
    <text x="54" y="240" font-size="12.5" fill="#cfe8c6">我是 王老师，38 岁。</text>
    <text x="54" y="262" font-size="12.5" fill="#cfe8c6">王老师 老师（教 数学）正在上课</text>
    <text x="54" y="296" font-size="12" fill="#9fb8a8">外界私访 name_ →</text>
    <text x="54" y="318" font-size="11" fill="#ffd7d0">error: 'name_' is a protected member of 'Person'</text>
    <text x="54" y="340" font-size="12" fill="#9fb8a8">（保护档：子女看得见、外人看不见）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,230 934,360 Q 712,365 490,360 Q 484,230 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 231)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">实验 2：基类指针点名</text>
    <rect x="502" y="146" width="420" height="200" rx="6" fill="#33413a"/>
    <text x="514" y="172" font-size="11.5" fill="#9fb8a8">$ ./bp</text>
    <text x="514" y="196" font-size="12.5" fill="#cfe8c6">我是 小明 / 我是小红 / 我是王老师</text>
    <text x="514" y="220" font-size="12" fill="#9fb8a8">　（Person* roster[] 统一管理 3 个对象）</text>
    <text x="514" y="252" font-size="12" fill="#9fb8a8">roster[0]->study() →</text>
    <text x="514" y="274" font-size="11" fill="#ffd7d0">error: no member named 'study' in 'Person'</text>
    <text x="514" y="306" font-size="12" fill="#9fb8a8">指针的视野 = 基类接口——</text>
    <text x="514" y="326" font-size="12" fill="#9fb8a8">派生类新增能力被挡在视野外</text>

    <path d="M 24,386 Q 470,380 905,387 L 901,500 Q 470,494 26,499 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 443)"/>
    <text x="46" y="414" font-size="15.5" font-weight="bold" fill="#9c5a22">实验 3：构造链的进与出</text>
    <text x="46" y="444" font-size="12.5" fill="#3b3a36">[Person 构造] → [Student 构造] → 使用 → [Student 析构] → [Person 析构]——祖先先建后拆、后裔后建先拆</text>
    <text x="46" y="468" font-size="12.5" fill="#6b675e">（和组合"零件先就位"是同一套栈规则——继承的"零件"就是基类子对象）</text>

    <path d="M 24,520 Q 470,514 905,521 L 901,630 Q 470,624 26,629 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 575)"/>
    <text x="480" y="550" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#55606e">明天预告</text>
    <text x="480" y="580" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 44：虚函数与动态多态——基类指针调 study() 不再报错，还能自动找到正确的版本（今天被拦的那格解锁）</text>
    <text x="480" y="604" text-anchor="middle" font-size="12.5" fill="#6b675e">（Shape 基类的 area() 被不同派生类覆盖——计划第 12 周的核心戏码明天开演）</text>
  </g>
</svg>
