<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">警告的"利息"与工具两次升级的抓虫实录</text>
    <path d="M 280,58 Q 480,52 680,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">工具升级的两次抓虫（本教程实录）</text>
    <rect x="110" y="146" width="360" height="170" fill="#33413a"/>
    <text x="290" y="172" font-size="11" fill="#9fb8a8">第一次（Day 120）：</text>
    <text x="290" y="194" font-size="10.5" fill="#cfe8c8">scan 加 -std=c++17</text>
    <text x="290" y="216" font-size="10.5" fill="#f0c9c0">抓出：10 个"C++17 扩展"假警告</text>
    <text x="290" y="238" font-size="10.5" fill="#8a8578">（旧脚本没带 std——工具落后于代码）</text>
    <text x="290" y="266" font-size="10" fill="#8a8578">（修复：加参数——归零）</text>
    <text x="290" y="296" font-size="10" fill="#8a8578">（教训：工具随项目演进）</text>
    <rect x="510" y="146" width="340" height="170" fill="#33413a"/>
    <text x="680" y="172" font-size="11" fill="#9fb8a8">第二次（今天 Day 126）：</text>
    <text x="680" y="194" font-size="10.5" fill="#cfe8c8">scan 升 c++20 + -Wextra</text>
    <text x="680" y="216" font-size="10.5" fill="#f0c9c0">抓出：2 个 unused-parameter</text>
    <text x="680" y="238" font-size="10.5" fill="#8a8578">（day-055 计时课/105 重载演示）</text>
    <text x="680" y="266" font-size="10.5" fill="#cfe8c8">（修复：(void)x 显式声明"故意不用"）</text>
    <text x="680" y="296" font-size="10" fill="#8a8578">（教训：更严的档位暴露新盲区）</text>
    <text x="472" y="334" font-size="11.5" fill="#8a8578">（两次都真抓到东西——"工具证明"的价值不是仪式）</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">c++17 → c++20 的兼容性</text>
    <rect x="64" y="412" width="430" height="150" fill="#33413a"/>
    <text x="279" y="436" font-size="10.5" fill="#9fb8a8">223 个源文件升到 c++20 编译：</text>
    <text x="279" y="458" font-size="10.5" fill="#cfe8c8">全部通过（零修改！）</text>
    <text x="279" y="482" font-size="10.5" fill="#8a8578">（C++ 向后兼容——17 的代码</text>
    <text x="279" y="500" font-size="10.5" fill="#8a8578">　在 20 下原样编译）</text>
    <text x="279" y="528" font-size="10" fill="#8a8578">（教学代码用 17 语法——升 20 只是档位）</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">剩 18 天的路</text>
    <rect x="572" y="412" width="320" height="150" fill="#33413a"/>
    <text x="732" y="436" font-size="10.5" fill="#9fb8a8">第 22 周：并发（thread/mutex）</text>
    <text x="732" y="458" font-size="10.5" fill="#9fb8a8">第 23 周起：性能/网络等</text>
    <text x="732" y="480" font-size="10.5" fill="#cfe8c8">Day 127~144：JSON 解析器项目</text>
    <text x="732" y="508" font-size="10" fill="#8a8578">（终点项目——五阶段所学全用上）</text>
    <text x="732" y="534" font-size="10.5" fill="#cfe8c8">（87.5%——冲刺段）</text>
  </g>
</svg>
