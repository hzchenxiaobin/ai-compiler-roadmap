<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 19 全貌：指针——存门牌号的变量</text>
    <path d="M 330,60 Q 480,52 630,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">第 4 周开潜：每个变量都有门牌号（地址），指针就是专门记门牌的便利贴</text>

    <path d="M 40,120 Q 200,114 360,120 Q 364,200 360,280 Q 200,286 42,280 Q 36,200 40,120 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(-0.4 200 200)"/>
    <text x="200" y="150" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">int x = 42</text>
    <rect x="140" y="168" width="120" height="60" fill="#fffdf7" stroke="#5b8db8" stroke-width="2.6"/>
    <text x="200" y="192" text-anchor="middle" font-size="15" fill="#3b3a36">42</text>
    <text x="200" y="212" text-anchor="middle" font-size="11" fill="#8a8578">值住在这</text>
    <path d="M 70,246 Q 200,240 330,247" fill="none" stroke="#8a94a3" stroke-width="2"/>
    <text x="200" y="266" text-anchor="middle" font-size="11.5" fill="#8a8578">门牌：0x16d812d78（本机实测）</text>

    <path d="M 420,120 Q 580,114 740,120 Q 744,200 740,280 Q 580,286 422,280 Q 416,200 420,120 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(0.4 580 200)"/>
    <text x="580" y="150" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">int* p = &amp;x</text>
    <rect x="520" y="168" width="120" height="60" fill="#fffdf7" stroke="#7aa663" stroke-width="2.6"/>
    <text x="580" y="192" text-anchor="middle" font-size="10.5" fill="#45703a">0x16d812d78</text>
    <text x="580" y="212" text-anchor="middle" font-size="11" fill="#8a8578">p 存的是 x 的门牌</text>
    <path d="M 640,198 Q 700,198 760,198" fill="none" stroke="#c96a5a" stroke-width="2.6"/>
    <path d="M 752,190 Q 761,196 753,206" fill="none" stroke="#c96a5a" stroke-width="2.6"/>

    <path d="M 770,120 Q 850,114 930,120 Q 933,200 930,280 Q 850,286 772,280 Q 767,200 770,120 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.4 850 200)"/>
    <text x="850" y="150" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#a33f2e">nullptr</text>
    <rect x="800" y="168" width="100" height="60" fill="#fffdf7" stroke="#c96a5a" stroke-width="2.6" stroke-dasharray="7 5"/>
    <text x="850" y="196" text-anchor="middle" font-size="12" fill="#a33f2e">0</text>
    <text x="850" y="216" text-anchor="middle" font-size="11" fill="#a33f2e">不指任何房间</text>

    <path d="M 40,310 Q 470,304 905,311 L 901,450 Q 470,444 44,449 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(-0.2 472 380)"/>
    <text x="472" y="340" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#55606e">两个方向的操作符（别和乘号、位与搞混）</text>
    <text x="70" y="374" font-size="13.5" fill="#2c5a82">&amp;x　取地址：给我这个房间的门牌</text>
    <text x="70" y="404" font-size="13.5" fill="#45703a">*p　解引用：顺着门牌去那个房间取/放东西</text>
    <text x="510" y="374" font-size="12.5" fill="#6b675e">同一对搭档：*p = 99 改的就是 x 本尊（实测）</text>
    <text x="510" y="404" font-size="12.5" fill="#a33f2e">解引用 nullptr：门牌是 0，去了就踩空（段错误，实测）</text>
    <text x="472" y="434" text-anchor="middle" font-size="12.5" fill="#8a8578">本周路线：Day 19 概念 → Day 20 指针与数组 → Day 21 引用 → Day 24 自测</text>

    <path d="M 60,478 Q 480,472 905,479" fill="none" stroke="#8a8578" stroke-width="3"/>
    <circle cx="200" cy="478" r="6" fill="#8a94a3"/>
    <text x="200" y="504" text-anchor="middle" font-size="12.5" fill="#3b3a36">第 1~3 周 ✓（18 天）</text>
    <circle cx="430" cy="479" r="13" fill="none" stroke="#c96a5a" stroke-width="2.2"/>
    <circle cx="430" cy="479" r="6" fill="#5b8db8"/>
    <text x="430" y="504" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c96a5a">Day 19（今天）</text>
    <circle cx="620" cy="478" r="6" fill="#5b8db8"/>
    <text x="620" y="504" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 20~23</text>
    <circle cx="810" cy="479" r="6" fill="#e0955f"/>
    <text x="810" y="504" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 24 自测日</text>

    <rect x="140" y="518" width="680" height="34" fill="#f7e8a0" opacity="0.5" transform="rotate(-0.3 480 535)"/>
    <text x="480" y="540" text-anchor="middle" font-size="13" fill="#8a6d1a">深水区提示：指针不难，难在"谁指着谁"——每写一行都在纸上画一遍房间和箭头，是本周的护身符</text>
  </g>
</svg>
