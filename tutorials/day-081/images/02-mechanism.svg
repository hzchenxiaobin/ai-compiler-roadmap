<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">失效的内存真相与 erase 返回值的接力</text>
    <path d="M 270,58 Q 480,52 690,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,330 Q 470,324 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 215)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">扩容前后的两块内存（事故一解剖）</text>
    <rect x="100" y="146" width="240" height="60" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="220" y="170" font-size="10.5" fill="#8a94a3">旧块 0x…12c0（已还！）：[1][2][3]</text>
    <text x="220" y="188" font-size="9.5" fill="#a33f2e">（旧迭代器 it 还指这里——悬空）</text>
    <rect x="430" y="146" width="240" height="60" fill="#d8ecce" stroke="#7aa663" stroke-width="2.2"/>
    <text x="550" y="170" font-size="10.5" fill="#45703a">新块 0x…12d0：[1][2][3][4]</text>
    <text x="550" y="188" font-size="9.5" fill="#8a8578">（v.data() 现在指这里）</text>
    <path d="M 220,212 Q 220,232 220,250" fill="none" stroke="#a33f2e" stroke-width="2.2"/>
    <path d="M 550,212 Q 550,232 550,250" fill="none" stroke="#45703a" stroke-width="2.2"/>
    <text x="220" y="270" font-size="10" fill="#a33f2e">*it = 99 → 写已释放内存</text>
    <text x="220" y="288" font-size="10" fill="#a33f2e">（ASan: heap-use-after-free）</text>
    <text x="550" y="270" font-size="10" fill="#45703a">重新 v.begin() 拿新迭代器 → 安全</text>
    <text x="550" y="288" font-size="10" fill="#8a8578">（修正一：操作后重取迭代器）</text>
    <text x="472" y="322" font-size="11.5" fill="#9fb8a8">（这就是"扩容使全部失效"的物理含义——一次搬家全员换址）</text>

    <path d="M 40,354 Q 470,348 905,355 L 901,576 Q 470,570 44,575 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.2 472 465)"/>
    <text x="472" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">修正模式：erase 的返回值接力（事故三的解）</text>
    <rect x="150" y="402" width="660" height="130" fill="#33413a"/>
    <text x="480" y="430" font-size="12" fill="#9fb8a8">for (auto it = s.begin(); it != s.end(); /* 不写 ++ */) {</text>
    <text x="480" y="456" font-size="12" fill="#cfe8c6">　if (*it % 2 == 0) { it = s.erase(it); }　← erase 返回"下一个"，it 已推进</text>
    <text x="480" y="480" font-size="12" fill="#cfe8c6">　else { ++it; }　　　　　　　　　　　　　← 没删才自己走</text>
    <text x="480" y="508" font-size="11.5" fill="#9fb8a8">}</text>
    <text x="480" y="542" font-size="12" fill="#45703a">（实测删偶数：1 2 3 4 5 6 → 1 3 5 ✔——不跳不越界）</text>
  </g>
</svg>
