<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">三版删除器、make 对照与读回战报</text>
    <path d="M 350,58 Q 480,52 610,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21 -std=c++17；-Wall 零警告 + ASan 零报错）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,490 Q 248,495 26,490 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 296)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出</text>
    <rect x="38" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./fr　（-Wall 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== FILE* RAII（计划指定） ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c8">f1 写入 ✔ 出块 [fclose] ✔</text>
    <text x="54" y="242" font-size="11.5" fill="#cfe8c8">f2（函子）写入 ✔ [fclose] ✔</text>
    <text x="54" y="262" font-size="11.5" fill="#cfe8c8">f3（lambda）[fclose-lambda] ✔</text>
    <text x="54" y="288" font-size="12" fill="#9fb8a8">== make vs 裸 new ==</text>
    <text x="54" y="310" font-size="11.5" fill="#cfe8c8">两版都工作 ✔（make 更优）</text>
    <text x="54" y="334" font-size="12" fill="#9fb8a8">== 数组版 ==</text>
    <text x="54" y="356" font-size="11.5" fill="#cfe8c8">arr[0]=42 arr[9]=99 ✔</text>
    <text x="54" y="376" font-size="11" fill="#9fb8a8">（delete[] 删除器——vector 优先）</text>
    <text x="54" y="400" font-size="12" fill="#9fb8a8">== 读回验证 ==</text>
    <text x="54" y="422" font-size="11.5" fill="#cfe8c8">读回：hello RAII ✔</text>
    <text x="54" y="444" font-size="11" fill="#9fb8a8">（忘关不存在——RAII 全自动）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,490 Q 712,495 490,490 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 296)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">RAII 学习史的闭环</text>
    <rect x="502" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">手写 RAII 的历史：</text>
    <text x="514" y="198" font-size="11.5" fill="#cfe8c8">Day 51 FileGuard（手写文件守卫）</text>
    <text x="514" y="218" font-size="11" fill="#9fb8a8">　（三行：构造打开/析构关闭）</text>
    <text x="514" y="246" font-size="11.5" fill="#cfe8c8">Day 78 里程碑讲 RAII（脱稿三件套）</text>
    <text x="514" y="274" font-size="12" fill="#9fb8a8">今天的通用化：</text>
    <text x="514" y="296" font-size="11.5" fill="#cfe8c8">unique_ptr + 删除器 = 一行封装</text>
    <text x="514" y="316" font-size="11" fill="#9fb8a8">　任何"打开-关闭"资源</text>
    <text x="514" y="348" font-size="12" fill="#9fb8a8">删除器的策略库：</text>
    <text x="514" y="370" font-size="11.5" fill="#cfe8c8">FILE*/malloc/socket/mutex/连接</text>
    <text x="514" y="398" font-size="12.5" fill="#45703a">（118/144 = 81.9%）</text>
    <text x="514" y="428" font-size="11" fill="#9fb8a8">（Effective 同步：条款 18/21</text>
    <text x="514" y="446" font-size="11" fill="#9fb8a8">　——独占+删除器/make 系）</text>
    <text x="514" y="476" font-size="11" fill="#9fb8a8">（明天 119：智能指针配容器/多态</text>
    <text x="514" y="494" font-size="11" fill="#9fb8a8">　→ 120 项目日收官周）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">删除器的哲学</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">"怎么关"和"怎么开"一样是资源的一部分——把它写进类型（策略即类型），RAII 就从"管内存"升级成"管一切打开的东西"</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 119 智能指针与容器/多态的配合 + enable_shared_from_this（了解）</text>
  </g>
</svg>
