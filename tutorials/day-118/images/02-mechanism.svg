<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">删除器的解剖与 unique/shared 的删除器差异</text>
    <path d="M 250,58 Q 480,52 710,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">unique_ptr&lt;FILE, FileCloser&gt; 的两件套</text>
    <rect x="150" y="148" width="330" height="150" fill="#33413a"/>
    <text x="315" y="178" font-size="11" fill="#9fb8a8">句柄（栈上）：</text>
    <rect x="190" y="192" width="110" height="34" fill="#d8ecce" stroke="#7aa663" stroke-width="1.8"/>
    <text x="245" y="214" font-size="9.5" fill="#45703a">FILE* ptr</text>
    <rect x="310" y="192" width="110" height="34" fill="#f9d9b8" stroke="#e0955f" stroke-width="1.8"/>
    <text x="365" y="214" font-size="9.5" fill="#9c5a22">FileCloser</text>
    <text x="315" y="252" font-size="10" fill="#8a8578">（指针 + 删除器对象——都在类型里）</text>
    <text x="315" y="278" font-size="10" fill="#8a8578">（析构：closer_(ptr)——即 fclose）</text>
    <rect x="520" y="148" width="290" height="150" fill="#33413a"/>
    <text x="665" y="178" font-size="11" fill="#9fb8a8">生命周期：</text>
    <text x="665" y="202" font-size="10.5" fill="#cfe8c8">构造：fopen 得 FILE* → 封装</text>
    <text x="665" y="224" font-size="10.5" fill="#cfe8c8">使用：f.get() 传给 fprintf</text>
    <text x="665" y="250" font-size="10.5" fill="#cfe8c8">出块：FileCloser(ptr)</text>
    <text x="665" y="272" font-size="10.5" fill="#f0c9c0">　→ fclose(f)——不是 delete！</text>
    <text x="472" y="334" font-size="11.5" fill="#8a8578">（策略进类型：不同删除器 = 不同 unique_ptr 类型——编译期装配零开销）</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">能封装的资源清单</text>
    <text x="64" y="428" font-size="12" fill="#3b3a36">FILE* → fclose（今天——计划指定）</text>
    <text x="64" y="452" font-size="12" fill="#3b3a36">malloc 的指针 → free</text>
    <text x="64" y="476" font-size="12" fill="#3b3a36">socket → closesocket</text>
    <text x="64" y="500" font-size="12" fill="#3b3a36">mutex → pthread_mutex_unlock</text>
    <text x="64" y="524" font-size="12" fill="#3b3a36">数据库连接 → disconnect</text>
    <text x="64" y="552" font-size="11.5" fill="#8a8578">（"打开-使用-关闭"的模式 → 全部 RAII 化）</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">unique vs shared 的删除器</text>
    <rect x="572" y="412" width="320" height="150" fill="#33413a"/>
    <text x="732" y="438" font-size="10.5" fill="#9fb8a8">unique：删除器是类型一部分</text>
    <text x="732" y="460" font-size="10.5" fill="#cfe8c8">（编译期装配——函子可零开销）</text>
    <text x="732" y="488" font-size="10.5" fill="#9fb8a8">shared：删除器是运行期值</text>
    <text x="732" y="510" font-size="10.5" fill="#cfe8c8">（构造时传入——类型统一）</text>
    <text x="732" y="538" font-size="10" fill="#8a8578">（各有适用——重策略用 shared）</text>
  </g>
</svg>
