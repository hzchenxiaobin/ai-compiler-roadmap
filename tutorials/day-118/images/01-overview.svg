<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 118 全貌：make_* 与自定义删除器——RAII 管一切</text>
    <path d="M 290,60 Q 480,52 670,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"RAII 封装 FILE*"——智能指针不只管 new/delete：删除器可换（fclose/free/close……）——任何"要关的东西"都能 RAII</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">计划指定：FILE* 的 RAII</text>
    <rect x="64" y="164" width="440" height="70" fill="#33413a"/>
    <text x="284" y="190" font-size="11" fill="#9fb8a8">unique_ptr&lt;FILE, FileCloser&gt; f(</text>
    <text x="284" y="212" font-size="11" fill="#cfe8c8">　　fopen(path, "w"));　// 打开即封装</text>
    <text x="64" y="260" font-size="12.5" fill="#45703a">出块自动 fclose（不是 delete！）</text>
    <text x="64" y="282" font-size="12" fill="#8a8578">（实测：三版删除器都打了关闭日志）</text>
    <text x="64" y="312" font-size="12.5" fill="#45703a">Day 51 FileTag 手写版 → 今天一行</text>
    <text x="64" y="334" font-size="12" fill="#8a8578">（RAII 的通用化：资源不止内存）</text>
    <text x="64" y="366" font-size="11.5" fill="#8a8578">（读回验证：写完关了再开读 ✔）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">删除器的三种形态</text>
    <text x="572" y="180" font-size="12" fill="#45703a">函数指针：void(*)(FILE*)</text>
    <text x="572" y="202" font-size="11.5" fill="#8a8578">（最直白——类型里带签名）</text>
    <text x="572" y="232" font-size="12" fill="#45703a">函子：struct FileCloser</text>
    <text x="572" y="254" font-size="11.5" fill="#8a8578">（无状态零开销——推荐）</text>
    <text x="572" y="284" font-size="12" fill="#45703a">lambda：就地定义策略</text>
    <text x="572" y="306" font-size="11.5" fill="#8a8578">（可捕获上下文——灵活）</text>
    <text x="572" y="344" font-size="12" fill="#6b675e">make_shared 的删除器是运行期多态</text>
    <text x="572" y="366" font-size="11.5" fill="#8a8578">（类型不因删除器变化——进阶差异）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">make_unique 的两个实质优势</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">①省类型书写（new T(args) 写两遍 T——make 一次）｜②异常安全（C++17 前的 foo(unique_ptr(new T), bar()) 可能泄漏——Effective 条款 21）</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（数组版 make_unique&lt;T[]&gt; 用 delete[]——优先 vector，数组版是特殊场景）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 115~117 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 118（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 119</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 120 项目日</text>
  </g>
</svg>
