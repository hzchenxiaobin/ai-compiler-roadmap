<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 134 全貌：dump()——树回到文本的反方向</text>
    <path d="M 310,60 Q 480,52 650,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"dump 与格式化输出"——解析（文本→树）的镜像：递归下降的逆、转义的编码、紧凑/缩进两种模式、数字的整数化</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">dump 的四件套</text>
    <text x="64" y="180" font-size="12.5" fill="#45703a">递归序列化：dump_to（树的遍历）</text>
    <text x="64" y="202" font-size="12" fill="#8a8578">（对象/数组→子元素递归——镜像 Day 132）</text>
    <text x="64" y="232" font-size="12.5" fill="#45703a">转义编码：\n → \\n（Day 130 的逆）</text>
    <text x="64" y="260" font-size="12.5" fill="#45703a">数字格式化：42.0 → 42（整数化）</text>
    <text x="64" y="288" font-size="12.5" fill="#45703a">两种模式：紧凑（0）/缩进（N）</text>
    <text x="64" y="322" font-size="12.5" fill="#6b675e">键序稳定：map 字典序（Day 128 的</text>
    <text x="64" y="342" font-size="12.5" fill="#6b675e">　选择在序列化兑现——输出可测试）</text>
    <text x="64" y="372" font-size="11.5" fill="#8a8578">（实测：同一棵树两种模式都正确）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">格式化模式的细节</text>
    <rect x="572" y="164" width="320" height="190" fill="#33413a"/>
    <text x="732" y="188" font-size="10.5" fill="#9fb8a8">indent=2 的输出：</text>
    <text x="732" y="210" font-size="10" fill="#cfe8c8">{</text>
    <text x="732" y="228" font-size="10" fill="#cfe8c8">　"name": "测试",</text>
    <text x="732" y="248" font-size="10" fill="#cfe8c8">　"tags": [</text>
    <text x="732" y="266" font-size="10" fill="#cfe8c8">　　　1,</text>
    <text x="732" y="284" font-size="10" fill="#cfe8c8">　　　2.5</text>
    <text x="732" y="302" font-size="10" fill="#cfe8c8">　　]</text>
    <text x="732" y="320" font-size="10" fill="#cfe8c8">}</text>
    <text x="732" y="348" font-size="10" fill="#8a8578">（": "冒号后空格；逗号行尾；嵌套缩进 N×depth）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">往返的闭环（明天的验收基础）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">parse(dump(x)) == x 的往返恒等式——今天有了 dump 的一半；明天访问接口齐了就能完整验证（Day 137 的测试矩阵靠它）</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（序列化不是花瓶——是"解析正确"的可验证证明）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 127~133 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 134（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 135~138</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 144 毕业</text>
  </g>
</svg>
