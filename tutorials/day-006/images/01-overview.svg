<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 6 项目日：小小换算器的全景</text>
    <path d="M 320,60 Q 480,52 640,61" fill="none" stroke="#e0955f" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">第一个"像样的程序"：把前五天的零件组装成一台机器</text>

    <path d="M 360,120 Q 600,112 840,120 Q 846,240 840,356 Q 600,364 364,356 Q 356,240 360,120 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3.2" transform="rotate(-0.3 600 238)"/>
    <text x="600" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c5a82">while (true) 菜单循环</text>
    <text x="600" y="176" text-anchor="middle" font-size="12.5" fill="#6b675e">显示菜单 → 读选择 → 干活 → 回到开头</text>
    <text x="600" y="196" text-anchor="middle" font-size="12.5" fill="#8a8578">（Day 8 正式讲原理，今天是固定句式）</text>

    <rect x="392" y="216" width="130" height="56" fill="#eef5e8" stroke="#7aa663" stroke-width="2.4"/>
    <text x="457" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#45703a">温度换算</text>
    <text x="457" y="259" text-anchor="middle" font-size="11.5" fill="#6b675e">℃ × 9/5 + 32</text>
    <rect x="536" y="216" width="130" height="56" fill="#eef5e8" stroke="#7aa663" stroke-width="2.4"/>
    <text x="601" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#45703a">长度换算</text>
    <text x="601" y="259" text-anchor="middle" font-size="11.5" fill="#6b675e">km × 0.621371</text>
    <rect x="680" y="216" width="130" height="56" fill="#eef5e8" stroke="#7aa663" stroke-width="2.4"/>
    <text x="745" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#45703a">货币换算</text>
    <text x="745" y="259" text-anchor="middle" font-size="11.5" fill="#6b675e">元 ÷ 7.2</text>
    <text x="600" y="308" text-anchor="middle" font-size="13" fill="#2c5a82">switch (choice) 按编号分发到三个单元</text>
    <text x="600" y="334" text-anchor="middle" font-size="12.5" fill="#6b675e">default 接住 9、-2 这类乱选</text>

    <path d="M 340,238 Q 300,230 260,238" fill="none" stroke="#c96a5a" stroke-width="2.8"/>
    <path d="M 268,230 Q 259,236 267,246" fill="none" stroke="#c96a5a" stroke-width="2.8"/>
    <path d="M 120,150 Q 248,144 256,238 Q 246,330 122,326 Q 112,238 120,150 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="3" transform="rotate(0.5 184 238)"/>
    <text x="184" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">0) 退出</text>
    <text x="184" y="210" text-anchor="middle" font-size="12.5" fill="#6b675e">break; 跳出循环</text>
    <text x="184" y="232" text-anchor="middle" font-size="12.5" fill="#6b675e">唯一的正常出口</text>
    <text x="184" y="262" text-anchor="middle" font-size="12.5" fill="#6b675e">输出"再见！"</text>
    <text x="184" y="290" text-anchor="middle" font-size="12" fill="#8a8578">exit=0</text>

    <path d="M 60,410 Q 480,402 905,411" fill="none" stroke="#8a8578" stroke-width="3"/>
    <text x="480" y="396" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b3a36">零件来源清单（组装机器前的备料）</text>
    <circle cx="130" cy="440" r="6" fill="#8a94a3"/>
    <text x="130" y="466" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 1~3</text>
    <text x="130" y="484" text-anchor="middle" font-size="11.5" fill="#8a8578">变量、运算、编译</text>
    <circle cx="330" cy="440" r="6" fill="#5b8db8"/>
    <text x="330" y="466" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 4</text>
    <text x="330" y="484" text-anchor="middle" font-size="11.5" fill="#8a8578">cin 问答 + clear/ignore</text>
    <circle cx="530" cy="440" r="6" fill="#7aa663"/>
    <text x="530" y="466" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 5</text>
    <text x="530" y="484" text-anchor="middle" font-size="11.5" fill="#8a8578">switch 分发 + default</text>
    <circle cx="730" cy="440" r="6" fill="#e0955f"/>
    <text x="730" y="466" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 8（预告）</text>
    <text x="730" y="484" text-anchor="middle" font-size="11.5" fill="#8a8578">while 循环的原理</text>

    <rect x="150" y="502" width="660" height="40" fill="#f7e8a0" opacity="0.5" transform="rotate(-0.3 480 522)"/>
    <text x="480" y="528" text-anchor="middle" font-size="13.5" fill="#8a6d1a">里程碑检查：不看资料，能独立把这个程序从空文件写到跑起来吗？</text>
  </g>
</svg>
