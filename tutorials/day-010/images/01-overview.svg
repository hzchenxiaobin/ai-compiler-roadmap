<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 10 全貌：一个名字的分身，与参数的出厂设置</text>
    <path d="M 260,60 Q 480,52 700,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">昨天的函数一台一名，今天允许同名多台、还允许参数缺省——便利贴到货</text>

    <path d="M 60,130 Q 220,124 380,130 Q 384,200 380,268 Q 220,274 62,268 Q 56,200 60,130 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(-0.4 220 199)"/>
    <text x="220" y="160" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2c5a82">print 的四个分身</text>
    <text x="84" y="192" font-size="12.5" fill="#3b3a36">print(int)　→ [整数]</text>
    <text x="84" y="216" font-size="12.5" fill="#3b3a36">print(double) → [小数]</text>
    <text x="84" y="240" font-size="12.5" fill="#3b3a36">print(char)　→ [字符]</text>
    <text x="84" y="264" font-size="12.5" fill="#3b3a36">print(string) → [文本]</text>

    <path d="M 392,199 Q 416,191 440,199" fill="none" stroke="#3b3a36" stroke-width="2.8"/>
    <path d="M 432,191 Q 441,197 433,207" fill="none" stroke="#3b3a36" stroke-width="2.8"/>

    <path d="M 444,130 Q 600,124 756,130 Q 760,200 756,268 Q 600,274 446,268 Q 440,200 444,130 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(0.4 600 199)"/>
    <text x="600" y="160" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#45703a">谁接单？编译器派单</text>
    <text x="468" y="192" font-size="12.5" fill="#3b3a36">print(42)　→ 整数分身</text>
    <text x="468" y="216" font-size="12.5" fill="#3b3a36">print(3.14) → 小数分身</text>
    <text x="468" y="240" font-size="12.5" fill="#3b3a36">print('A')　→ 字符分身</text>
    <text x="468" y="264" font-size="12.5" fill="#3b3a36">print("Hi") → 文本分身</text>

    <path d="M 60,300 Q 480,292 905,301 L 901,424 Q 480,416 44,423 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 472 360)"/>
    <text x="472" y="332" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#9c5a22">默认参数：greet 的出厂设置</text>
    <rect x="110" y="352" width="340" height="52" fill="#fffdf7" stroke="#e5b28c" stroke-width="2.2" transform="rotate(-0.4 280 378)"/>
    <text x="280" y="374" text-anchor="middle" font-size="12" fill="#3b3a36">greet("小明", "早上好", 2)　三样全给</text>
    <text x="280" y="394" text-anchor="middle" font-size="12" fill="#6b675e">greet("小红", "晚上好")　　　times 补默认 1</text>
    <rect x="510" y="352" width="340" height="52" fill="#fffdf7" stroke="#e5b28c" stroke-width="2.2" transform="rotate(0.4 680 378)"/>
    <text x="680" y="374" text-anchor="middle" font-size="12" fill="#3b3a36">greet("小刚")</text>
    <text x="680" y="394" text-anchor="middle" font-size="12" fill="#6b675e">greeting="你好"、times=1 全用默认</text>

    <path d="M 60,462 Q 480,456 905,463" fill="none" stroke="#8a8578" stroke-width="3"/>
    <circle cx="160" cy="462" r="6" fill="#8a94a3"/>
    <text x="160" y="488" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 9 ✓</text>
    <circle cx="330" cy="463" r="13" fill="none" stroke="#c96a5a" stroke-width="2.2"/>
    <circle cx="330" cy="463" r="6" fill="#5b8db8"/>
    <text x="330" y="488" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c96a5a">Day 10（今天）</text>
    <circle cx="500" cy="462" r="6" fill="#5b8db8"/>
    <text x="500" y="488" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 11 作用域</text>
    <circle cx="660" cy="463" r="6" fill="#5b8db8"/>
    <text x="660" y="488" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 12 项目日</text>
    <circle cx="850" cy="462" r="6" fill="#e0955f"/>
    <text x="850" y="488" text-anchor="middle" font-size="12.5" fill="#3b3a36">第 3 周 数组</text>

    <rect x="120" y="508" width="720" height="36" fill="#f7e8a0" opacity="0.5" transform="rotate(-0.3 480 526)"/>
    <text x="480" y="531" text-anchor="middle" font-size="13.5" fill="#8a6d1a">明天的暗线已经埋好：默认值和局部变量都是"作用域"家族的成员</text>
  </g>
</svg>
