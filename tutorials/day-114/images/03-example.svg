    <text x="514" y="278" font-size="11.5" fill="#cfe8c8">113 完美转发（类别保持）</text>
    <text x="514" y="298" font-size="11.5" fill="#cfe8c8">114 基准测试（今天）✔</text>
    <text x="514" y="330" font-size="12" fill="#9fb8a8">一周五个月前埋的伏笔：</text>
    <text x="514" y="352" font-size="11.5" fill="#cfe8c8">Day 79 扩容"用移动搬家"→ 111</text>
    <text x="514" y="372" font-size="11.5" fill="#cfe8c8">Day 92 emplace 快 → 113 原理</text>
    <text x="514" y="392" font-size="11.5" fill="#cfe8c8">Day 47 三法则 → 112 五法则</text>
    <text x="514" y="424" font-size="12.5" fill="#45703a">（114/144 = 79.2%——近八成！）</text>
    <text x="514" y="454" font-size="11" fill="#9fb8a8">（下周 20：智能指针——RAII 的</text>
    <text x="514" y="472" font-size="11" fill="#9fb8a8">　自动版 + 五法则的官方代驾）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">数字的意义</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">335 倍不是魔法——是"少干 762MB 的活"；性能优化第一课：先看有没有"根本不用做的功"（移动语义是教科书案例）</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 115——第 20 周开篇：unique_ptr 与所有权（=delete 独占语义的完全体）</text>
  </g>
