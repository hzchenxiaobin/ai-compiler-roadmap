<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">三基准完整实录与第 19 周战绩</text>
    <path d="M 370,58 Q 480,52 590,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21 -std=c++17 -O2；-Wall 零警告）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,490 Q 248,495 26,490 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 296)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出</text>
    <rect x="38" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./mb　（-O2 编译）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== 准备 ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c8">2000 个 × 390KB ≈ 762MB</text>
    <text x="54" y="246" font-size="12" fill="#9fb8a8">== 基准一·整批 ==</text>
    <text x="54" y="268" font-size="11.5" fill="#f0c9c0">拷贝整批：335 ms</text>
    <text x="54" y="288" font-size="11.5" fill="#cfe8c8">移动整批：1 ms（335 倍）</text>
    <text x="54" y="312" font-size="12" fill="#9fb8a8">== 基准二·逐个 push ==</text>
    <text x="54" y="334" font-size="11.5" fill="#f0c9c0">拷贝 push：398 ms</text>
    <text x="54" y="354" font-size="11.5" fill="#cfe8c8">移动 push：0 ms（测不出）</text>
    <text x="54" y="378" font-size="12" fill="#9fb8a8">== 基准三·扩容 ==</text>
    <text x="54" y="400" font-size="11.5" fill="#cfe8c8">不 reserve：184 ms</text>
    <text x="54" y="420" font-size="11.5" fill="#cfe8c8">reserve 后：151 ms ✔</text>
    <text x="54" y="448" font-size="11" fill="#9fb8a8">（结论区 + 诚实解读 ✔）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,490 Q 712,495 490,490 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 296)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">第 19 周战绩（Day 109~114）</text>
    <rect x="502" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">移动语义周六天：</text>
    <text x="514" y="198" font-size="11.5" fill="#cfe8c8">109 值类别（认出将亡者）</text>
    <text x="514" y="218" font-size="11.5" fill="#cfe8c8">110 move 本质（贴标签）</text>
    <text x="514" y="238" font-size="11.5" fill="#cfe8c8">111 移动构造+noexcept（偷资源）</text>
