<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">搬运成本柱状图与 BigData 的两种路径</text>
    <path d="M 280,58 Q 480,52 680,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">基准一/二的耗时对照（实测 ms）</text>
    <rect x="150" y="300" width="90" height="0" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <rect x="260" y="150" width="90" height="150" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="305" y="142" font-size="10.5" fill="#45703a">整批移动 1ms</text>
    <text x="195" y="292" font-size="10.5" fill="#45703a">整批拷贝</text>
    <rect x="150" y="146" width="90" height="154" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2"/>
    <text x="195" y="138" font-size="10.5" fill="#a33f2e">335 ms</text>
    <rect x="500" y="302" width="90" height="2" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="545" y="294" font-size="10.5" fill="#45703a">push 移动 0ms</text>
    <rect x="610" y="144" width="90" height="160" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="655" y="136" font-size="10.5" fill="#9c5a22">push 拷贝 398 ms</text>
    <text x="472" y="328" font-size="11.5" fill="#8a8578">（762MB 的搬运：拷贝要分配+逐字节抄；移动只改指针——335 倍的来源）</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">BigData 的两种搬运</text>
    <rect x="64" y="412" width="430" height="150" fill="#33413a"/>
    <text x="279" y="438" font-size="10.5" fill="#9fb8a8">拷贝：new int[100000] + 循环抄 10 万次</text>
    <text x="279" y="462" font-size="10.5" fill="#cfe8c8">　×2000 个元素 = 762MB 的分配+读写</text>
    <text x="279" y="492" font-size="10.5" fill="#9fb8a8">移动：data_(o.data_)（偷指针）+ 掏空</text>
    <text x="279" y="516" font-size="10.5" fill="#cfe8c8">　×2000 = 改 4000 个机器字（几微秒）</text>
    <text x="279" y="544" font-size="10" fill="#8a8578">（这就是 335 倍的算术）</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">基准方法论注脚</text>
    <text x="572" y="428" font-size="12" fill="#3b3a36">-O2 优化编译（无优化的数字失真）</text>
    <text x="572" y="452" font-size="11.5" fill="#8a8578">（steady_clock 单调时钟不受系统调时影响）</text>
    <text x="572" y="482" font-size="12" fill="#3b3a36">严谨版要多次取平均 + 预热</text>
    <text x="572" y="506" font-size="11.5" fill="#8a8578">（今天单轮从简——量级结论已足够）</text>
    <text x="572" y="536" font-size="11.5" fill="#6b675e">（0ms 说明要纳秒级才测得出——</text>
    <text x="572" y="556" font-size="11.5" fill="#6b675e">　或循环放大 100 倍再除）</text>
  </g>
</svg>
