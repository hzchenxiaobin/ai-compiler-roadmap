<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">贴标签验证、掏空检查与两版对照战报</text>
    <path d="M 340,58 Q 480,52 620,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21 -std=c++17；-Wall 零警告）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,490 Q 248,495 26,490 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 296)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出（节选）</text>
    <rect x="38" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./me　（-Wall 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== named rvalue 反直觉 ==</text>
    <text x="54" y="222" font-size="11.5" fill="#f0c9c0">sink(r) → 左值版！（r 有名字）</text>
    <text x="54" y="242" font-size="11.5" fill="#cfe8c8">sink(move(r)) → 右值版 ✔</text>
    <text x="54" y="266" font-size="12" fill="#9fb8a8">== move 零日志（计划指定） ==</text>
    <text x="54" y="288" font-size="11.5" fill="#cfe8c8">b = a → [拷贝] ✔</text>
    <text x="54" y="308" font-size="11.5" fill="#f0c9c0">c = move(a) → [移动] ✔</text>
    <text x="54" y="328" font-size="10.5" fill="#9fb8a8">　（move 本身零记录！）</text>
    <text x="54" y="352" font-size="12" fill="#9fb8a8">== 掏空检查 ==</text>
    <text x="54" y="374" font-size="11.5" fill="#cfe8c8">s2 到手；s1.size()=0 ✔</text>
    <text x="54" y="394" font-size="11.5" fill="#cfe8c8">s1 复活 = "复活" ✔</text>
    <text x="54" y="418" font-size="12" fill="#9fb8a8">== 两版 push_back ==</text>
    <text x="54" y="440" font-size="11.5" fill="#cfe8c8">tmp 拷贝｜move(tmp2) 移动 ✔</text>
    <text x="54" y="460" font-size="11.5" fill="#cfe8c8">tmp2 = ""（空了）✔</text>
    <text x="54" y="484" font-size="11" fill="#9fb8a8">（const move 退回拷贝的警示 ✔）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,490 Q 712,495 490,490 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 296)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">移动语义周的中段路标</text>
    <rect x="502" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">今天（110）：标签（move）</text>
    <text x="514" y="198" font-size="11" fill="#9fb8a8">　（怎么把左值标记为可偷）</text>
    <text x="514" y="226" font-size="12" fill="#9fb8a8">明天（111）：行动（移动构造）</text>
    <text x="514" y="250" font-size="11" fill="#9fb8a8">　（给 MyString 补移动——计划指定）</text>
    <text x="514" y="278" font-size="12" fill="#9fb8a8">112：五法则完整版</text>
    <text x="514" y="302" font-size="11" fill="#9fb8a8">　（三法则 + 移动两件 = 五）</text>
    <text x="514" y="330" font-size="12" fill="#9fb8a8">113：完美转发（forward）</text>
    <text x="514" y="354" font-size="11" fill="#9fb8a8">　（emplace_back 的原理）</text>
    <text x="514" y="382" font-size="12" fill="#9fb8a8">114：项目日基准测试</text>
    <text x="514" y="406" font-size="11" fill="#9fb8a8">　（移动 vs 拷贝的毫秒差）</text>
    <text x="514" y="438" font-size="12.5" fill="#45703a">（110/144 = 76.4%）</text>
    <text x="514" y="468" font-size="11" fill="#9fb8a8">（Effective 同步：条款 23</text>
    <text x="514" y="486" font-size="11" fill="#9fb8a8">　std::move 与 std::forward）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">move 的哲学</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">"我不要它了"是一句声明（move 标记）而不是一个动作（构造函数才动）——声明与执行分离，正是 C++ 零成本抽象的又一例</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 111 移动构造与移动赋值——给 MyString 补移动语义（计划指定）+ noexcept 的重要性</text>
  </g>
</svg>
