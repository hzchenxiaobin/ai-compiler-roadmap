<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 110 全貌：std::move 的本质——只是贴标签</text>
    <path d="M 300,60 Q 480,52 660,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"打日志验证"——move 本身零日志（不移动任何东西）：真正的移动发生在移动构造里；move 只是把值"标记"成右值</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">move 的真身（static_cast）</text>
    <rect x="64" y="164" width="440" height="70" fill="#33413a"/>
    <text x="284" y="190" font-size="11" fill="#9fb8a8">std::move(x) ≈</text>
    <text x="284" y="212" font-size="11" fill="#cfe8c6">　static_cast&lt;T&amp;&amp;&gt;(x)　← 就这些！</text>
    <text x="64" y="260" font-size="12.5" fill="#45703a">它做的事：把表达式标记为"可被移动"（右值）</text>
    <text x="64" y="288" font-size="12.5" fill="#a33f2e">它不做的事：不拷贝、不移动、不释放、零运行时</text>
    <text x="64" y="324" font-size="12.5" fill="#6b675e">实测验证（计划指定）：日志里 move 调用本身</text>
    <text x="64" y="344" font-size="12.5" fill="#6b675e">　零记录——[移动] 日志出现在构造函数里</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">named rvalue 是左值！（反直觉）</text>
    <rect x="572" y="164" width="320" height="170" fill="#33413a"/>
    <text x="732" y="190" font-size="10.5" fill="#9fb8a8">Traced&amp;&amp; r = Traced(42);</text>
    <text x="732" y="214" font-size="10.5" fill="#f0c9c0">sink(r) → [sink&amp;] 左值版！</text>
    <text x="732" y="232" font-size="10" fill="#8a8578">（r 有名字——它本身是左值）</text>
    <text x="732" y="258" font-size="10.5" fill="#cfe8c6">sink(std::move(r)) → [sink&amp;&amp;]</text>
    <text x="732" y="276" font-size="10" fill="#8a8578">（move 重新贴回右值标签）</text>
    <text x="732" y="308" font-size="10" fill="#9fb8a8">（规则：有名字 = 左值——</text>
    <text x="732" y="324" font-size="10" fill="#9fb8a8">　类型是 &amp;&amp; 不代表表达式是右值）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">move 后对象的状态（实测）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">"有效但未指定"：s1 被掏空（size=0）但能赋新值复活（"复活" ✔）——move 后的源只许赋值或析构、不许读</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（const 对象 move 无效：退回拷贝——静默的坑）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 109 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 110（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 111~113</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 114 项目日</text>
  </g>
</svg>
