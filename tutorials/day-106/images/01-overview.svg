<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 106 全貌：结构化绑定——一次声明，直接拆开</text>
    <path d="M 300,60 Q 480,52 660,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"遍历 map 的简化写法"——it->first 时代结束：auto&amp; [k, v] 让键值有名字；pair/tuple/结构体/数组四路全通</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">map 遍历的三代演进（实测同输出）</text>
    <text x="64" y="180" font-size="11.5" fill="#6b675e">第一代：it-&gt;first / it-&gt;second</text>
    <text x="64" y="200" font-size="11" fill="#8a8578">（迭代器时代——Day 85）</text>
    <text x="64" y="228" font-size="11.5" fill="#6b675e">第二代：kv.first / kv.second</text>
    <text x="64" y="248" font-size="11" fill="#8a8578">（范围 for 时代）</text>
    <text x="64" y="276" font-size="11.5" fill="#45703a">第三代：auto&amp; [name, age]</text>
    <text x="64" y="296" font-size="11" fill="#8a8578">（结构化绑定——键值有名字！）</text>
    <text x="64" y="330" font-size="12.5" fill="#45703a">三代输出一字不差——进化的是可读性</text>
    <text x="64" y="366" font-size="11.5" fill="#8a8578">（名字自 documenting——读者不用记</text>
    <text x="64" y="386" font-size="11.5" fill="#8a8578">　first 是键 second 是值）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">四路绑定全通（实测）</text>
    <text x="572" y="180" font-size="12" fill="#45703a">pair：auto [a, b] = make_pair(...)</text>
    <text x="572" y="208" font-size="12" fill="#45703a">tuple：auto [名, 龄, 分] = 三元函数</text>
    <text x="572" y="230" font-size="11.5" fill="#8a8578">（多返回值的优雅接收——get&lt;0&gt; 退场）</text>
    <text x="572" y="260" font-size="12" fill="#45703a">结构体：auto [px, py] = Point{3,4}</text>
    <text x="572" y="288" font-size="12" fill="#45703a">数组：auto [x,y,z] = arr（按位置拆）</text>
    <text x="572" y="316" font-size="12" fill="#45703a">嵌套：map&lt;K, vector&gt; 的双层遍历</text>
    <text x="572" y="352" font-size="11.5" fill="#8a8578">（insert 返回的 pair 也能拆——bool 立判）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">旧式手拆的两种痛（对照）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">tie 版要先声明变量再填充（三行）；get&lt;i&gt;(tuple) 版用序号魔法数（get&lt;1&gt; 是谁？）——绑定版一步 + 有名字</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（本教程从 Day 84 起就在偷偷用——今天正式正名）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 103~105 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 106（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 107~108</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 108 项目日</text>
  </g>
</svg>
