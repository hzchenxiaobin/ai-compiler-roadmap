    <rect x="502" y="146" width="420" height="320" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">第 12 周（继承多态）第五天：</text>
    <text x="514" y="198" font-size="11.5" fill="#cfe8c6">67 继承 → 68 虚函数 → 69 虚析构</text>
