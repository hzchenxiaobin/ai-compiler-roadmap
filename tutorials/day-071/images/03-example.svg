    <text x="514" y="444" font-size="12" fill="#8a8578">（今天的骨架直接复用！）</text>

    <path d="M 24,506 Q 470,500 905,507 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 543)"/>
    <text x="46" y="532" font-size="15.5" font-weight="bold" fill="#9c5a22">选择建议</text>
    <text x="46" y="560" font-size="12.5" fill="#3b3a36">新代码一律 unique_ptr 版（今天的理由：零 delete + 异常安全 + 容器自动收摊）；裸指针版留在对照里理解"它替你做了什么"</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 72（项目日）图形库 v1——5 种图形的多态计算与排序（第 12 周收官）</text>
