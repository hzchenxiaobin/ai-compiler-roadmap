    <text x="54" y="200" font-size="12" fill="#9fb8a8">== 方式一：vector&lt;Shape*&gt; ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c6">圆(r=2)：面积 12.5664</text>
    <text x="54" y="240" font-size="11.5" fill="#cfe8c6">矩形(3×4)：面积 12</text>
    <text x="54" y="258" font-size="11.5" fill="#cfe8c6">三角形(3,4,5)：面积 6</text>
    <text x="54" y="280" font-size="11.5" fill="#cfe8c6">总面积 = 30.5664</text>
    <text x="54" y="302" font-size="11" fill="#f0c9c0">（手动 delete ×3——忘了就泄漏）</text>
    <text x="54" y="332" font-size="12" fill="#9fb8a8">== 方式二：unique_ptr ==</text>
