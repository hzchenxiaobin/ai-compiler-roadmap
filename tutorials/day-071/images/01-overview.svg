<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 71 全貌：多态容器——一族对象住进一个 vector</text>
    <path d="M 270,60 Q 480,52 690,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划："智能指针先会照用"——裸指针版与 unique_ptr 版同台对照：多态分发相同、内存管理天差地别</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#a33f2e">方式一：vector&lt;Shape*&gt;</text>
    <text x="64" y="180" font-size="12.5" fill="#3b3a36">多态分发 ✔（三种 area 各自执行）</text>
    <text x="64" y="208" font-size="12.5" fill="#a33f2e">内存管理：手动 delete ×N</text>
    <text x="64" y="230" font-size="12" fill="#8a8578">（实测忘一行就泄漏 ×3）</text>
    <text x="64" y="262" font-size="12.5" fill="#a33f2e">虚析构是生死线：没有它 delete</text>
    <text x="64" y="284" font-size="12.5" fill="#a33f2e">　基类指针只拆基类（Day 69 的课）</text>
    <text x="64" y="322" font-size="12.5" fill="#6b675e">容器退场（clear/pop_back）时</text>
    <text x="64" y="344" font-size="12.5" fill="#6b675e">　指针数组"只放钥匙不管家"</text>
    <text x="64" y="370" font-size="12" fill="#8a8578">（教学对照用——生产代码见方式二）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">方式二：vector&lt;unique_ptr&lt;Shape&gt;&gt;</text>
    <text x="572" y="180" font-size="12.5" fill="#45703a">多态分发 ✔（和方式一完全相同）</text>
    <text x="572" y="208" font-size="12.5" fill="#45703a">内存管理：零 delete！</text>
    <text x="572" y="230" font-size="12" fill="#8a8578">（实测：容器析构自动逐个收摊）</text>
    <text x="572" y="262" font-size="12.5" fill="#45703a">RAII 的容器版：unique_ptr 的</text>
    <text x="572" y="284" font-size="12.5" fill="#45703a">　析构自动 delete 所指对象</text>
    <text x="572" y="322" font-size="12.5" fill="#6b675e">遍历用 const auto&amp;（Day 46 形态课</text>
    <text x="572" y="344" font-size="12.5" fill="#6b675e">　——unique_ptr 不可拷贝只能引用）</text>
    <text x="572" y="372" font-size="12" fill="#8a8578">（明天图形库 v1 的正式姿势）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">共同点：多态分发的形态</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">两版的循环代码长得几乎一样（s->area() 虚分发）——差别只在"谁管生死"；这就是"智能指针先会照用"的含义</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（Day 68 的多态 + Day 51 的 RAII 在容器里的会师）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 67~70 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 71（今天）</text>
    <circle cx="660" cy="514" r="5" fill="#e0955f"/>
    <text x="660" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 72 项目日</text>
    <circle cx="860" cy="514" r="5" fill="#5b8db8"/>
    <text x="860" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">第 13 周 OOP 收尾</text>
  </g>
</svg>
