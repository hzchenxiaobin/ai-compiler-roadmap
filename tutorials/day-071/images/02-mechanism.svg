<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">容器的第三层 RAII 与 unique_ptr 的照用姿势</text>
    <path d="M 240,58 Q 480,52 720,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,320 Q 470,314 44,319 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 210)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">vector&lt;unique_ptr&lt;Shape&gt;&gt; 的三重收摊</text>
    <rect x="90" y="146" width="240" height="56" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="210" y="170" font-size="11" fill="#45703a">①vector 析构</text>
    <text x="210" y="188" font-size="10" fill="#8a8578">（逐个销毁元素——unique_ptr）</text>
    <rect x="370" y="146" width="240" height="56" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="490" y="170" font-size="11" fill="#9c5a22">②unique_ptr 析构</text>
    <text x="490" y="188" font-size="10" fill="#8a8578">（delete 所指的 Shape*）</text>
    <rect x="650" y="146" width="220" height="56" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2"/>
    <text x="760" y="170" font-size="11" fill="#a33f2e">③Shape 析构（虚）</text>
    <text x="760" y="188" font-size="10" fill="#8a8578">（动态绑定到 Circle/Rect…）</text>
    <path d="M 332,174 Q 350,174 368,174" fill="none" stroke="#3b3a36" stroke-width="2"/>
    <path d="M 612,174 Q 630,174 648,174" fill="none" stroke="#3b3a36" stroke-width="2"/>
    <text x="472" y="234" font-size="12.5" fill="#3b3a36">三重链条环环自动——一行 delete 都不用写；这就是"容器版 RAII"</text>
    <text x="472" y="262" font-size="12.5" fill="#6b675e">（Day 51 的 FileGuard 是"单对象 RAII"；今天是"一族对象的 RAII"）</text>
    <text x="472" y="292" font-size="12" fill="#8a8578">（虚析构在第③环是生死线——Day 69 的课在容器里照样成立）</text>

    <path d="M 40,344 Q 280,338 520,344 Q 524,470 520,576 Q 280,582 42,576 Q 36,470 40,344 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 460)"/>
    <text x="280" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">unique_ptr 的照用清单</text>
    <text x="64" y="408" font-size="12" fill="#3b3a36">创建：std::make_unique&lt;Circle&gt;(2)</text>
    <text x="64" y="430" font-size="12" fill="#8a8578">（比 new 干净——异常安全细节进阶讲）</text>
    <text x="64" y="458" font-size="12" fill="#3b3a36">使用：s-&gt;area()（和裸指针语法一样）</text>
    <text x="64" y="486" font-size="12" fill="#a33f2e">禁区：拷贝（=delete）——</text>
    <text x="64" y="508" font-size="12" fill="#8a8578">（容器里只能移动/传引用）</text>
    <text x="64" y="536" font-size="12" fill="#45703a">遍历：for (const auto&amp; s : shapes)</text>
    <text x="64" y="558" font-size="11" fill="#8a8578">（Day 46 形态课的实战应用）</text>

    <path d="M 550,344 Q 730,338 905,344 Q 908,470 905,576 Q 730,582 552,576 Q 547,470 550,344 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 460)"/>
    <text x="727" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">基类的公共设施</text>
    <text x="572" y="408" font-size="12" fill="#3b3a36">protected 构造 + id_ 标签：</text>
    <text x="572" y="430" font-size="12" fill="#8a8578">（派生类都带名字——数据放基类）</text>
    <text x="572" y="458" font-size="12" fill="#3b3a36">非虚 name() 包虚 name_impl()：</text>
    <text x="572" y="480" font-size="12" fill="#8a8578">（Day 70 的杠杆模式复用）</text>
    <text x="572" y="512" font-size="12" fill="#45703a">明天的图形库 v1 直接套今天的</text>
    <text x="572" y="534" font-size="12" fill="#45703a">　骨架（容器+智能指针+基类设施）</text>
  </g>
</svg>
