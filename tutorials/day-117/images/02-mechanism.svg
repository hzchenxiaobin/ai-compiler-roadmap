<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">强环的死锁账本与 weak 的虚线观察</text>
    <path d="M 300,58 Q 480,52 660,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">强环的计数账本（为什么归不了零）</text>
    <rect x="120" y="148" width="330" height="170" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.2"/>
    <text x="285" y="176" font-size="11" fill="#a33f2e">块的局部（作用域内）：</text>
    <text x="285" y="202" font-size="10.5" fill="#a33f2e">a（栈上）→ 甲：count 甲 = 1</text>
    <text x="285" y="224" font-size="10.5" fill="#a33f2e">b（栈上）→ 乙：count 乙 = 1</text>
    <text x="285" y="252" font-size="10.5" fill="#a33f2e">a->partner_ = b：count 乙 = 2</text>
    <text x="285" y="274" font-size="10.5" fill="#a33f2e">b->partner_ = a：count 甲 = 2</text>
    <text x="285" y="302" font-size="10" fill="#8a8578">（两条成员强引用 + 两条栈引用）</text>
    <rect x="490" y="148" width="340" height="170" fill="#33413a"/>
    <text x="660" y="176" font-size="11" fill="#9fb8a8">块结束时（析构栈变量）：</text>
    <text x="660" y="202" font-size="10.5" fill="#f0c9c0">a 析构 → count 甲 -1 → 1</text>
    <text x="660" y="224" font-size="10.5" fill="#f0c9c0">b 析构 → count 乙 -1 → 1</text>
    <text x="660" y="252" font-size="10.5" fill="#ffd7d0">甲还剩 1（乙的 partner_ 持着）</text>
    <text x="660" y="274" font-size="10.5" fill="#ffd7d0">乙还剩 1（甲的 partner_ 持着）</text>
    <text x="660" y="302" font-size="10" fill="#8a8578">（互相等的死锁——谁也归不了零）</text>
    <text x="472" y="334" font-size="11.5" fill="#8a8578">（环内成员互相保活——堆上孤岛：程序不结束就永远不回收）</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">weak 的虚线（不计数）</text>
    <rect x="64" y="412" width="430" height="150" fill="#33413a"/>
    <text x="279" y="438" font-size="10.5" fill="#9fb8a8">丙 -- - -> 丁（weak 虚线）</text>
    <text x="279" y="462" font-size="10.5" fill="#cfe8c8">a->partner_ = b：count 丁不变 1！</text>
    <text x="279" y="486" font-size="10.5" fill="#cfe8c8">块结束：b 析构 → count 丁 = 0</text>
    <text x="279" y="510" font-size="10.5" fill="#cfe8c8">→ [析构] 丁 ✔ → 丙同理 ✔</text>
    <text x="279" y="538" font-size="10" fill="#8a8578">（虚线不保活——环从根上没形成）</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">lock 的双向语义（实测）</text>
    <rect x="572" y="412" width="320" height="150" fill="#33413a"/>
    <text x="732" y="438" font-size="10.5" fill="#9fb8a8">对象活着时 lock：</text>
    <text x="732" y="460" font-size="10.5" fill="#cfe8c8">→ 返回 shared（临时拥有+1）</text>
    <text x="732" y="488" font-size="10.5" fill="#9fb8a8">对象已死时 lock：</text>
    <text x="732" y="510" font-size="10.5" fill="#f0c9c0">→ nullptr（安全判空）</text>
    <text x="732" y="538" font-size="10" fill="#8a8578">（用时提升——用完自动放手）</text>
  </g>
</svg>
