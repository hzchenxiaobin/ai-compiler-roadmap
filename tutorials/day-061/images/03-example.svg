<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">四则战报、约分实测与对称验证</text>
    <path d="M 370,58 Q 480,52 590,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,260 470,420 Q 248,425 26,420 Q 20,260 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 261)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">实验 1：Fraction 四则</text>
    <rect x="38" y="146" width="420" height="260" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./fr　（-Wall 零警告）</text>
    <text x="54" y="198" font-size="12.5" fill="#cfe8c6">a = 1/2，b = 3/4</text>
    <text x="54" y="226" font-size="12.5" fill="#cfe8c6">a + b = 5/4　（手算 10/8 约分 ✔）</text>
    <text x="54" y="246" font-size="12.5" fill="#cfe8c6">a - b = -1/4　（-2/8 约分 ✔）</text>
    <text x="54" y="266" font-size="12.5" fill="#cfe8c6">a * b = 3/8　✔</text>
    <text x="54" y="286" font-size="12.5" fill="#cfe8c6">a / b = 2/3　（4/6 约分 ✔）</text>
    <text x="54" y="316" font-size="12.5" fill="#f0c9c0">c(2,4) = 1/2（自动约分）</text>
    <text x="54" y="336" font-size="12.5" fill="#cfe8c6">a == c ? 相等（最简保证直比 ✔）</text>
    <text x="54" y="362" font-size="12.5" fill="#f0c9c0">分母为零被拦 ✔ 除以零被拦 ✔</text>
    <text x="54" y="390" font-size="12" fill="#9fb8a8">（每一步输出都经手算核对）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,260 934,420 Q 712,425 490,420 Q 484,260 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 261)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">实验 2：对称性验证</text>
    <rect x="502" y="146" width="420" height="260" rx="6" fill="#33413a"/>
    <text x="514" y="172" font-size="11.5" fill="#9fb8a8">$ ./mvf　（Vec2）</text>
    <text x="514" y="198" font-size="12.5" fill="#cfe8c6">v + v = (2, 4)</text>
    <text x="514" y="224" font-size="12.5" fill="#cfe8c6">v * 3 = (3, 6)　←成员版</text>
    <text x="514" y="246" font-size="12.5" fill="#cfe8c6">3 * v = (3, 6)　←非成员版 ✔</text>
    <text x="514" y="278" font-size="12" fill="#9fb8a8">若只有成员版 operator*：</text>
    <text x="514" y="298" font-size="12" fill="#9fb8a8">　3 * v 编译错误（左边不是 Vec2）</text>
    <text x="514" y="330" font-size="12.5" fill="#45703a">交换律的代码化——</text>
    <text x="514" y="350" font-size="12.5" fill="#45703a">　对称场景要非成员版</text>
    <text x="514" y="386" font-size="12" fill="#9fb8a8">&lt;&lt; 同理：左边是 ostream——</text>
    <text x="514" y="404" font-size="12" fill="#9fb8a8">　friend 非成员是唯一选择</text>

    <path d="M 24,446 Q 470,440 905,447 L 901,510 Q 470,504 26,509 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 478)"/>
    <text x="46" y="474" font-size="15.5" font-weight="bold" fill="#9c5a22">本周路线（第 11 周）</text>
    <text x="46" y="502" font-size="12.5" fill="#3b3a36">今天算术与比较 → Day 62 流运算符深入 → Day 63 下标/调用 → Day 64 类型转换与 explicit → Day 65 Matrix → Day 66 项目日</text>

    <path d="M 24,530 Q 470,524 905,531 L 901,630 Q 470,624 26,629 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 580)"/>
    <text x="480" y="560" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#55606e">明天预告</text>
    <text x="480" y="588" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 62：流运算符 &lt;&lt; &gt;&gt; 深入——今天 friend 版的原理与链式返回明天展开</text>
    <text x="480" y="610" text-anchor="middle" font-size="12.5" fill="#6b675e">（cout &lt;&lt; a &lt;&lt; b 的链式机制——返回 ostream&amp; 是关键）</text>
  </g>
</svg>
