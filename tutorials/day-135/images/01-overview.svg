<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 135 全貌：访问接口——让树用起来顺手</text>
    <path d="M 320,60 Q 480,52 640,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"get/operator[]/迭代"——今天能看（dump）明天能摸：类型安全的取值、链式下钻、对象数组的遍历——解析器的用户端</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">三件访问套件</text>
    <text x="64" y="180" font-size="12.5" fill="#45703a">get&lt;T&gt;()：类型安全取值</text>
    <text x="64" y="202" font-size="12" fill="#8a8578">（错类型抛——Day 121 value() 的风格）</text>
    <text x="64" y="232" font-size="12.5" fill="#45703a">operator[]：键/下标双版本</text>
    <text x="64" y="254" font-size="12" fill="#8a8578">（string 版查对象 / size_t 版查数组）</text>
    <text x="64" y="284" font-size="12.5" fill="#45703a">链式下钻：doc[a][b][c]</text>
    <text x="64" y="306" font-size="12" fill="#8a8578">（实测：address→city、scores→[1]）</text>
    <text x="64" y="336" font-size="12.5" fill="#45703a">迭代：as_object/as_array 暴露内部</text>
    <text x="64" y="358" font-size="12" fill="#8a8578">（对象的键值 / 数组的元素——Day 80 姿势）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">错误的执法（实测四例）</text>
    <text x="572" y="180" font-size="12" fill="#a33f2e">get 类型错："get&lt;d&gt;：实际是 string"</text>
    <text x="572" y="208" font-size="12" fill="#a33f2e">键不存在：'"nope"'</text>
    <text x="572" y="236" font-size="12" fill="#a33f2e">越界：'[99]（size=3）'</text>
    <text x="572" y="264" font-size="12" fill="#a33f2e">非容器[]："实际是 string 不是 array"</text>
    <text x="572" y="300" font-size="12.5" fill="#45703a">设计：抛异常（不返 null）</text>
    <text x="572" y="322" font-size="12" fill="#8a8578">（访问错该被发现——静默 null 是坑）</text>
    <text x="572" y="356" font-size="11.5" fill="#8a8578">（错误消息带"期望/实际"——诊断直白）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">同 nlohmann 的对照（业界标杆）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">nlohmann: j["key"].get&lt;string&gt;() / j[i]——今天的 API 同款形状（差异：它 operator[] 缺键插入 null、我们抛——教学取舍的诚实注）</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（API 形状对齐业界——学完直接能上手真库）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 127~134 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 135（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 136~138</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 144 毕业</text>
  </g>
</svg>
