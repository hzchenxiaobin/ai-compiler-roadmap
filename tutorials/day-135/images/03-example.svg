    <rect x="38" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./ad　（c++20 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== get&lt;T&gt; ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c8">string/double/int/bool 四型 ✔</text>
    <text x="54" y="246" font-size="12" fill="#9fb8a8">== 链式下钻 ==</text>
    <text x="54" y="268" font-size="11.5" fill="#cfe8c8">address→city = Hangzhou ✔</text>
    <text x="54" y="288" font-size="11.5" fill="#cfe8c8">scores→[1] = 88 ✔</text>
    <text x="54" y="312" font-size="12" fill="#9fb8a8">== 迭代 ==</text>
    <text x="54" y="334" font-size="11.5" fill="#cfe8c8">对象：5 键各类型 ✔</text>
    <text x="54" y="354" font-size="11.5" fill="#cfe8c8">数组：95 88 92 ✔</text>
    <text x="54" y="380" font-size="12" fill="#9fb8a8">== 四错执法 ==</text>
    <text x="54" y="402" font-size="11.5" fill="#f0c9c0">get 类型错 ✔｜键不存在 ✔</text>
