    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">API 的手感</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">j["key"][i].get&lt;string&gt;() 一行拿到深处的值——Day 84 词频的 map 下钻、Day 96 成绩系统的逐层访问……五个月的"用容器"经验全在这套 API 里通了</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 136 GoogleTest 入门——安装、写第一个测试用例（质量周开篇）</text>
