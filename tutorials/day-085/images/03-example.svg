    <text x="514" y="374" font-size="11.5" fill="#cfe8c6">85 map/set（今天）→ 86 哈希族</text>
    <text x="514" y="394" font-size="11.5" fill="#cfe8c6">→ 87 multimap → 88 迭代器分类</text>
    <text x="514" y="414" font-size="11.5" fill="#cfe8c6">→ 89 LRU → 90 项目日</text>
    <text x="514" y="448" font-size="12.5" fill="#45703a">（85/144 = 59%——</text>
    <text x="514" y="468" font-size="12.5" fill="#45703a">　关联容器周开篇）</text>

    <path d="M 24,506 Q 470,500 905,507 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 543)"/>
    <text x="46" y="532" font-size="15.5" font-weight="bold" fill="#9c5a22">什么时候选 map/set</text>
    <text x="46" y="560" font-size="12.5" fill="#3b3a36">需要有序遍历（字典序输出/范围查询）/需要按键的顺序统计/键值映射或去重集合——三场景选树族；只要快选哈希（明天）</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 86 unordered_map/set——哈希原理与性能对比实验（计划指定）</text>
