    <rect x="38" y="146" width="420" height="320" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./ms　（-Wall 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== map 三特性 ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c6">遍历：小刚(16) 小明(16) 小红(14)</text>
    <text x="54" y="242" font-size="11" fill="#9fb8a8">（插入乱序、遍历字典序 ✔）</text>
    <text x="54" y="264" font-size="11.5" fill="#cfe8c6">size = 3（小明 15→16 覆盖）</text>
    <text x="54" y="294" font-size="12" fill="#9fb8a8">== 查找 ==</text>
    <text x="54" y="316" font-size="11.5" fill="#cfe8c6">count(小明)=1 find(小红)→14 ✔</text>
    <text x="54" y="340" font-size="11.5" fill="#f0c9c0">operator[] 陷阱：查"小王"前 3 后 4</text>
    <text x="54" y="360" font-size="11" fill="#9fb8a8">（被插入了！）</text>
    <text x="54" y="390" font-size="12" fill="#9fb8a8">== set 去重 ==</text>
    <text x="54" y="412" font-size="11.5" fill="#cfe8c6">apple×2 → 第二次被拒 ✔</text>
    <text x="54" y="432" font-size="11.5" fill="#cfe8c6">遍历：apple banana cherry</text>
    <text x="54" y="460" font-size="12" fill="#9fb8a8">== 词频（计划指定） ==</text>
    <text x="54" y="482" font-size="11.5" fill="#cfe8c6">brown→dog→fox→lazy→quick</text>
    <text x="54" y="500" font-size="11.5" fill="#cfe8c6">→the×3（字典序 ✔）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,480 Q 712,485 490,480 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 291)"/>
