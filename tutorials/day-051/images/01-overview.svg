<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 51 全貌：析构与 RAII——自动收摊的艺术</text>
    <path d="M 310,60 Q 480,52 650,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划标注"本阶段最重要的一课"——昨天的构造拿资源，今天的析构放资源，从此忘了 cleanup 不可能发生</text>

    <path d="M 40,116 Q 290,110 540,116 Q 544,250 540,384 Q 290,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 290 250)"/>
    <text x="290" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">析构函数 ~ClassName()</text>
    <text x="64" y="180" font-size="13" fill="#3b3a36">①名字：类名前加波浪线 ~（读"析构"）</text>
    <text x="64" y="208" font-size="13" fill="#3b3a36">②无参数、无返回类型（不能重载）</text>
    <text x="64" y="236" font-size="13" fill="#3b3a36">③对象销毁时自动调用（与构造对称）</text>
    <text x="64" y="274" font-size="12.5" fill="#6b675e">销毁时机 = 作用域结束（出块/return）</text>
    <text x="64" y="296" font-size="12.5" fill="#6b675e">——昨天时刻表里的"逆序销毁"今天有了名字</text>
    <text x="64" y="334" font-size="12.5" fill="#45703a">实测：出块瞬间打印【析构】关闭——</text>
    <text x="64" y="356" font-size="12.5" fill="#45703a">没有一行显式的 close()</text>

    <path d="M 570,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 572,384 Q 567,250 570,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 737 250)"/>
    <text x="737" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">RAII：资源获取即初始化</text>
    <text x="594" y="182" font-size="12.5" fill="#3b3a36">Resource Acquisition Is Initialization</text>
    <text x="594" y="210" font-size="12.5" fill="#45703a">构造函数里拿资源（开文件/锁/内存）</text>
    <text x="594" y="232" font-size="12.5" fill="#45703a">析构函数里放资源（关/解锁/释放）</text>
    <text x="594" y="268" font-size="12.5" fill="#6b675e">为什么自动？销毁由作用域决定，</text>
    <text x="594" y="290" font-size="12.5" fill="#6b675e">作用域由花括号决定——</text>
    <text x="594" y="312" font-size="12.5" fill="#6b675e">程序员"忘记"这个动作没有入口</text>
    <text x="594" y="350" font-size="12" fill="#8a8578">（智能指针 = RAII 的巅峰，第 20 周见）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,494 Q 470,488 44,493 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 451)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">对照实测：手动 close 的多路径翻车</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">手动版三条 return 只有一条记得 close；RAII 版三条 return 全部自动收摊——资源安全从此不靠记性靠结构</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 49~50 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 51（今天）</text>
    <circle cx="640" cy="514" r="5" fill="#5b8db8"/>
    <text x="640" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 52 const/static</text>
    <circle cx="840" cy="514" r="5" fill="#e0955f"/>
    <text x="840" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 54 项目日</text>
  </g>
</svg>
