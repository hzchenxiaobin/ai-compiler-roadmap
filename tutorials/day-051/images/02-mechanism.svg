<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">RAII 的收摊时刻 vs 手动的 return 迷宫</text>
    <path d="M 290,58 Q 480,52 670,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 280,94 520,100 Q 524,230 520,360 Q 280,366 42,360 Q 36,230 40,100 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.3 280 230)"/>
    <text x="280" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">手动 close 的迷宫</text>
    <rect x="70" y="148" width="420" height="60" fill="#33413a"/>
    <text x="280" y="172" text-anchor="middle" font-size="11" fill="#9fb8a8">int manual_style(int mode) {</text>
    <text x="280" y="192" text-anchor="middle" font-size="11" fill="#ffd7d0">　打开 → if → if → 每条 return 都要记得 close</text>
    <text x="70" y="236" font-size="12.5" fill="#3b3a36">三条 return 路径，只有一条写了 close：</text>
    <text x="70" y="262" font-size="12.5" fill="#a33f2e">路径二 return 2 直接走人——</text>
    <text x="70" y="284" font-size="12.5" fill="#a33f2e">忘了 close——这次冲盘靠的是析构兜底</text>
    <text x="70" y="316" font-size="12.5" fill="#6b675e">真实函数有十几个 return 和深层 if——</text>
    <text x="70" y="338" font-size="12.5" fill="#6b675e">"记得关"靠的是记性：人的最不可靠属性</text>

    <path d="M 550,100 Q 740,94 930,100 Q 933,230 930,360 Q 740,366 552,360 Q 547,230 550,100 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 740 230)"/>
    <text x="740" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">RAII 的自动收摊</text>
    <rect x="580" y="148" width="320" height="60" fill="#33413a"/>
    <text x="740" y="172" text-anchor="middle" font-size="11" fill="#9fb8a8">int raii_style(int mode) {</text>
    <text x="740" y="192" text-anchor="middle" font-size="11" fill="#cfe8c6">　Guard g; → 随便 return，析构自动收摊</text>
    <text x="580" y="236" font-size="12.5" fill="#45703a">实测：mode=1（提前返回）和 mode=0</text>
    <text x="580" y="258" font-size="12.5" fill="#45703a">（正常）都打印【析构】已收摊——</text>
    <text x="580" y="286" font-size="12.5" fill="#3b3a36">收摊挂在"对象离开作用域"这个</text>
    <text x="580" y="308" font-size="12.5" fill="#3b3a36">语言机制上，不挂在任何 return 上</text>
    <text x="580" y="340" font-size="12" fill="#8a8578">（异常 throw 也一样收摊——进阶话题预告）</text>

    <path d="M 40,384 Q 470,378 905,385 L 901,576 Q 470,570 44,575 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 480)"/>
    <text x="472" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">嵌套守卫的进出栈（实测 guard_order）</text>
    <rect x="240" y="430" width="480" height="130" fill="#33413a"/>
    <text x="480" y="456" text-anchor="middle" font-size="12" fill="#cfe8c6">正常：+A +B +C　→　-C -B -A</text>
    <text x="480" y="480" text-anchor="middle" font-size="12" fill="#cfe8c6">提前返回：+A +B +C → "提前返回" → -C -B -A</text>
    <text x="480" y="510" text-anchor="middle" font-size="12" fill="#9fb8a8">两条铁律：构造按声明序、析构严格逆序</text>
    <text x="480" y="532" text-anchor="middle" font-size="12" fill="#9fb8a8">（栈的后进先出——资源依赖的正确拆法）</text>
  </g>
</svg>
