<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">FileGuard 实录、对照战报与进出栈</text>
    <path d="M 340,58 Q 480,52 620,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,240 470,380 Q 248,385 26,380 Q 20,240 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 241)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">实验 1：FileGuard（计划指定练习）</text>
    <rect x="38" y="146" width="420" height="220" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./fg</text>
    <text x="54" y="196" font-size="12.5" fill="#cfe8c6">【构造】打开 guard_log.txt 成功</text>
    <text x="54" y="218" font-size="12.5" fill="#9fb8a8">　块内工作……</text>
    <text x="54" y="240" font-size="12.5" fill="#cfe8c6">【析构】关闭 guard_log.txt</text>
    <text x="54" y="264" font-size="12.5" fill="#9fb8a8">块外验证：文件是否写好了？</text>
    <text x="54" y="286" font-size="12.5" fill="#cfe8c6">　读回：第一行：RAII 写入</text>
    <text x="54" y="306" font-size="12.5" fill="#cfe8c6">　读回：第二行：块还没结束</text>
    <text x="54" y="334" font-size="12" fill="#9fb8a8">出块自动关 + 内容完整读回——</text>
    <text x="54" y="354" font-size="12" fill="#9fb8a8">全程零 close() 调用</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,240 934,380 Q 712,385 490,380 Q 484,240 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 241)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">实验 2：手动 vs RAII</text>
    <rect x="502" y="146" width="420" height="220" rx="6" fill="#33413a"/>
    <text x="514" y="172" font-size="12" fill="#9fb8a8">手动版 mode=1（提前返回）：</text>
    <text x="514" y="194" font-size="12" fill="#f0c9c0">　（手动版无输出——但 manual.txt 已被析构冲盘）</text>
    <text x="514" y="222" font-size="12" fill="#9fb8a8">RAII 版 mode=1（提前返回）：</text>
    <text x="514" y="244" font-size="12" fill="#cfe8c6">　【构造】raii.txt → 【析构】已收摊</text>
    <text x="514" y="272" font-size="12" fill="#9fb8a8">RAII 版 mode=0（正常路径）：</text>
    <text x="514" y="294" font-size="12" fill="#cfe8c6">　【构造】raii.txt → 【析构】已收摊</text>
    <text x="514" y="320" font-size="12" fill="#9fb8a8">（manual.txt 内容其实是析构兜底冲的——把这当</text>
    <text x="514" y="340" font-size="12" fill="#9fb8a8">工程方案才是侥幸：崩溃路径（abort）或 C 式</text>
    <text x="514" y="356" font-size="12" fill="#9fb8a8">FILE* 都没有这层兜底）</text>

    <path d="M 24,406 Q 470,400 905,407 L 901,500 Q 470,494 26,499 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 453)"/>
    <text x="46" y="434" font-size="15.5" font-weight="bold" fill="#9c5a22">实验 3：嵌套守卫进出栈</text>
    <text x="46" y="464" font-size="12.5" fill="#3b3a36">正常与提前返回两场景：+A +B +C 后都是 -C -B -A——析构严格逆序，资源依赖拆得干干净净</text>
    <text x="46" y="488" font-size="12.5" fill="#6b675e">（"锁了 A 再锁 B"的释放顺序天然正确——这就是逆序销毁的工程价值）</text>

    <path d="M 24,520 Q 470,514 905,521 L 901,630 Q 470,624 26,629 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 575)"/>
    <text x="480" y="550" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#55606e">为什么这是"最重要的一课"？</text>
    <text x="480" y="580" text-anchor="middle" font-size="12.5" fill="#3b3a36">第 20 周的智能指针、进阶阶段的锁守卫、通讯录的存盘——全是 RAII 的变体；</text>
    <text x="480" y="604" text-anchor="middle" font-size="12.5" fill="#3b3a36">今天学会"构造拿、析构放"，后面十个专题都是在给这个思想换资源类型</text>
  </g>
</svg>
