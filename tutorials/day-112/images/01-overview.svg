<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 112 全貌：五法则完整版——三法则的 C++11 升级</text>
    <path d="M 300,60 Q 480,52 660,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"MyVector 完成五法则"——拷贝三件 + 移动两件 = 五；=default 要默认的、=delete 禁不该有的</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">五法则的完整名单</text>
    <rect x="64" y="164" width="200" height="42" fill="#d8ecce" stroke="#7aa663" stroke-width="1.8"/>
    <text x="164" y="190" font-size="10.5" fill="#45703a">①拷贝构造</text>
    <rect x="64" y="214" width="200" height="42" fill="#d8ecce" stroke="#7aa663" stroke-width="1.8"/>
    <text x="164" y="240" font-size="10.5" fill="#45703a">②拷贝赋值</text>
    <rect x="64" y="264" width="200" height="42" fill="#d8ecce" stroke="#7aa663" stroke-width="1.8"/>
    <text x="164" y="290" font-size="10.5" fill="#45703a">③析构</text>
    <rect x="284" y="164" width="200" height="42" fill="#f9d9b8" stroke="#e0955f" stroke-width="1.8"/>
    <text x="384" y="190" font-size="10.5" fill="#9c5a22">④移动构造（新）</text>
    <rect x="284" y="214" width="200" height="42" fill="#f9d9b8" stroke="#e0955f" stroke-width="1.8"/>
    <text x="384" y="240" font-size="10.5" fill="#9c5a22">⑤移动赋值（新）</text>
    <text x="284" y="278" font-size="10" fill="#8a8578">（Day 57 三法则 + 移动两件）</text>
    <text x="284" y="306" font-size="10.5" fill="#6b675e">（默认构造是第六件常备</text>
    <text x="284" y="324" font-size="10.5" fill="#6b675e">　——"五"指资源管理的五）</text>
    <text x="64" y="356" font-size="11.5" fill="#8a8578">（实测：MyVector 五件全触发——日志①~⑤）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">=default / =delete</text>
    <rect x="572" y="164" width="320" height="80" fill="#33413a"/>
    <text x="732" y="190" font-size="10.5" fill="#cfe8c6">NoCopy() = default;</text>
    <text x="732" y="212" font-size="10" fill="#9fb8a8">（显式要编译器的默认版）</text>
    <rect x="572" y="254" width="320" height="80" fill="#33413a"/>
    <text x="732" y="280" font-size="10.5" fill="#f0c9c0">NoCopy(const NoCopy&amp;) = delete;</text>
    <text x="732" y="302" font-size="10" fill="#ffd7d0">（禁掉！用了编译错——实测）</text>
    <text x="572" y="354" font-size="11.5" fill="#8a8578">（独占类型的标配：智能指针/线程/句柄）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">什么时候自动生成被抑制（规则核心）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">声明了析构/拷贝/移动任何一件 → 移动两件不自动生成（退回拷贝）｜声明了移动任何一件 → 拷贝两件被删除</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（所以"要就要全"——五件一起管，这正是"法则"的含义）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 109~111 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 112（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 113</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 114 项目日</text>
  </g>
</svg>
