<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 125：《Effective Modern C++》条款 1~14 重读</text>
    <path d="M 310,60 Q 480,52 650,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"重读笔记"——五个月的实践就是这 14 条的实验记录：今天的读法是"每条问教程哪天验证过它、当时的疑问解了吗"</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">条款 → 教程天数的映射</text>
    <text x="64" y="180" font-size="12" fill="#45703a">条款 1~6（推导/auto）：Day 103</text>
    <text x="64" y="202" font-size="11.5" fill="#8a8578">（条款 6 的 vector&lt;bool&gt; 原案例）</text>
    <text x="64" y="230" font-size="12" fill="#45703a">条款 7~10（转向现代）：Day 103~109</text>
    <text x="64" y="252" font-size="11.5" fill="#8a8578">（{} 初始化/nullptr——104/105）</text>
    <text x="64" y="280" font-size="12" fill="#45703a">条款 11~14（转移所有权）：Day 109~120</text>
    <text x="64" y="302" font-size="11.5" fill="#8a8578">（move/unique/shared——全链覆盖）</text>
    <text x="64" y="336" font-size="12.5" fill="#6b675e">14 条全有实验注脚——重读="又见"</text>
    <text x="64" y="364" font-size="11.5" fill="#8a8578">（每条的画面来自五个月的踩坑实录）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">今日验证三例（实测）</text>
    <text x="572" y="180" font-size="12" fill="#45703a">条款 14：make vs 裸 new</text>
    <text x="572" y="202" font-size="11.5" fill="#8a8578">（modern 零 delete ✔——实测）</text>
    <text x="572" y="230" font-size="12" fill="#45703a">条款 21：make 的异常安全</text>
    <text x="572" y="252" font-size="11.5" fill="#8a8578">（求值序坑的理论"又见"）</text>
    <text x="572" y="280" font-size="12" fill="#45703a">条款 19：shared 计数</text>
    <text x="572" y="302" font-size="11.5" fill="#8a8578">（1→2→1 的涨落 ✔）</text>
    <text x="572" y="336" font-size="12" fill="#6b675e">（三个代表——14 条的抽样验证）</text>
    <text x="572" y="366" font-size="11.5" fill="#8a8578">（其余条款的重跑是读者的今日练习）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">两遍读书论</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">第一遍（五个月穿插读）：跟着天数学——当天用啥读啥（contextual）；第二遍（今天）：带着伤疤读——每条都有画面、有"当时的疑问"和"现在的答案"</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（"读过的书"和"用过的书"是两本书——今天的笔记写的是后者）</text>

