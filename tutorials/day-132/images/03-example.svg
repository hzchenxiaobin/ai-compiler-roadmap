    <text x="54" y="310" font-size="12" fill="#9fb8a8">== 四错误 ==</text>
    <text x="54" y="332" font-size="11.5" fill="#f0c9c0">缺冒号 → 期望':'遇 string ✔</text>
    <text x="54" y="352" font-size="11.5" fill="#f0c9c0">缺闭括 → 期望'}'遇 EOF ✔</text>
    <text x="54" y="372" font-size="11.5" fill="#f0c9c0">尾逗号 → 此处应是值遇 ] ✔</text>
    <text x="54" y="392" font-size="11.5" fill="#f0c9c0">值后多余 → 多余内容(number) ✔</text>
