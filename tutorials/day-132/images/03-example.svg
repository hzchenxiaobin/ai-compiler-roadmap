    <text x="54" y="200" font-size="12" fill="#9fb8a8">== 六合法 ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c8">{} ✔ [] ✔ 简单对象 ✔</text>
    <text x="54" y="242" font-size="11.5" fill="#cfe8c8">嵌套（对象含数组含对象）✔</text>
    <text x="54" y="262" font-size="11.5" fill="#f0c9c0">[[[[1]]]] 四层深 ✔</text>
