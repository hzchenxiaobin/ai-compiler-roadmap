<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">四种锁的行为战报与四条红字</text>
    <path d="M 340,58 Q 480,52 620,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,210 470,320 Q 248,325 26,320 Q 20,210 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 211)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">实验 1：四种组合各就各位</text>
    <rect x="38" y="146" width="420" height="160" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="12" fill="#9fb8a8">$ ./const_four_ways</text>
    <text x="54" y="196" font-size="12.5" fill="#cfe8c6">a = 12（被 p1 改成 11，又被 p3 改成 12）</text>
    <text x="54" y="220" font-size="12.5" fill="#cfe8c6">p2 现在指向 b = 20</text>
    <text x="54" y="244" font-size="12.5" fill="#cfe8c6">p4 只读看着 a = 12</text>
    <text x="54" y="276" font-size="12" fill="#9fb8a8">四把锁的行为差异全在输出里：</text>
    <text x="54" y="294" font-size="12" fill="#9fb8a8">p1 随便改、p2 只换绑、p3 只改物、p4 纯围观</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,210 934,320 Q 712,325 490,320 Q 484,210 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 211)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">实验 2：const 引用与 constexpr</text>
    <rect x="502" y="146" width="420" height="160" rx="6" fill="#33413a"/>
    <text x="514" y="172" font-size="12" fill="#9fb8a8">$ ./const_ref_param</text>
    <text x="514" y="192" font-size="12.5" fill="#cfe8c6">【Hello, C++】（长度 10）</text>
    <text x="514" y="212" font-size="12.5" fill="#cfe8c6">【字面量也行】（长度 15）</text>
    <text x="514" y="238" font-size="12" fill="#9fb8a8">$ echo 42 | ./constexpr_demo</text>
    <text x="514" y="258" font-size="12.5" fill="#cfe8c6">const runtime_n = 42　constexpr compile_n = 25</text>
    <text x="514" y="278" font-size="12.5" fill="#cfe8c6">table[0] = 100（长度 25）</text>
    <text x="514" y="300" font-size="12" fill="#9fb8a8">const 收下运行期输入；constexpr 编译期就绪还能当数组长度</text>

    <path d="M 24,346 Q 470,340 905,347 L 901,540 Q 470,534 26,539 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 464 443)"/>
    <text x="46" y="376" font-size="15.5" font-weight="bold" fill="#a33f2e">四条红字（逐一实测的编译错误）</text>
    <rect x="38" y="390" width="850" height="140" rx="6" fill="#33413a"/>
    <text x="54" y="414" font-size="11.5" fill="#ffd7d0">*p2 = 30;　　→ error: read-only variable is not assignable</text>
    <text x="54" y="438" font-size="11.5" fill="#ffd7d0">p3 = &amp;b;　　 → error: cannot assign to variable 'p3' with const-qualified type 'int *const'</text>
    <text x="54" y="462" font-size="11.5" fill="#ffd7d0">constexpr int bad = input; → error: must be initialized by a constant expression</text>
    <text x="54" y="484" font-size="11.5" fill="#9fb8a8">　note: read of non-const variable 'input' is not allowed in a constant expression</text>
    <text x="54" y="508" font-size="11.5" fill="#ffd7d0">text = "改不了";（const 引用参数内）→ error: no viable overloaded '='</text>

    <path d="M 24,560 Q 470,554 905,561 L 901,630 Q 470,624 26,629 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.2" transform="rotate(0.2 464 595)"/>
    <text x="480" y="584" text-anchor="middle" font-size="12.5" fill="#55606e">工程习惯：参数能写 const 就写 const——把"承诺不改"写进签名，</text>
    <text x="480" y="606" text-anchor="middle" font-size="12.5" fill="#55606e">调用者不用读函数体就能放心；编译器也顺便获得优化空间</text>
  </g>
</svg>
