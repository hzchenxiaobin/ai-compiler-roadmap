<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 9 全貌：函数——给一段代码起个名字</text>
    <path d="M 320,60 Q 480,52 640,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">八天攒下的代码越写越长，今天学会"拆零件"——程序世界的乐高到货</text>

    <path d="M 40,130 Q 190,124 340,130 Q 344,180 340,230 Q 190,236 42,230 Q 36,180 40,130 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(-0.4 190 180)"/>
    <text x="100" y="158" font-size="13" fill="#8a8578">输入（参数）</text>
    <rect x="56" y="168" width="70" height="30" fill="#fffdf7" stroke="#9db8cf" stroke-width="2"/>
    <text x="91" y="188" text-anchor="middle" font-size="12.5" fill="#3b3a36">row=3</text>
    <path d="M 132,183 Q 156,183 180,183" fill="none" stroke="#3b3a36" stroke-width="2.6"/>
    <path d="M 172,175 Q 181,181 173,191" fill="none" stroke="#3b3a36" stroke-width="2.6"/>

    <path d="M 186,130 Q 336,124 486,130 Q 490,180 486,230 Q 336,236 188,230 Q 182,180 186,130 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(0.4 336 180)"/>
    <text x="336" y="158" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#45703a">机器（函数体）</text>
    <text x="336" y="186" text-anchor="middle" font-size="12.5" fill="#3b3a36">print_row(3)</text>
    <text x="336" y="208" text-anchor="middle" font-size="11.5" fill="#6b675e">固定的加工步骤</text>

    <path d="M 494,183 Q 518,183 542,183" fill="none" stroke="#3b3a36" stroke-width="2.6"/>
    <path d="M 534,175 Q 543,181 535,191" fill="none" stroke="#3b3a36" stroke-width="2.6"/>
    <text x="518" y="170" font-size="11.5" fill="#8a8578">返回</text>

    <path d="M 548,130 Q 698,124 848,130 Q 852,180 848,230 Q 698,236 550,230 Q 544,180 548,130 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="3" transform="rotate(-0.3 698 180)"/>
    <text x="698" y="158" text-anchor="middle" font-size="13" fill="#8a8578">输出（返回值）</text>
    <rect x="620" y="168" width="160" height="30" fill="#fffdf7" stroke="#e5b28c" stroke-width="2"/>
    <text x="700" y="188" text-anchor="middle" font-size="12.5" fill="#3b3a36">1×3=3  2×3=6 3×3=9</text>
    <text x="698" y="220" text-anchor="middle" font-size="11.5" fill="#8a8578">void 机器：不返回，只干活</text>

    <path d="M 40,270 Q 460,262 905,271 L 901,420 Q 460,412 44,419 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(-0.2 472 342)"/>
    <text x="472" y="300" text-anchor="middle" font-size="16" font-weight="bold" fill="#55606e">重构后的 main：从"什么都干"变成"总调度"</text>
    <rect x="80" y="322" width="240" height="70" fill="#eef5e8" stroke="#7aa663" stroke-width="2.4" transform="rotate(-0.5 200 357)"/>
    <text x="200" y="346" text-anchor="middle" font-size="12.5" fill="#3b3a36">print_mult_table(9);</text>
    <text x="200" y="368" text-anchor="middle" font-size="11.5" fill="#8a8578">9 行乘法表整包外包</text>
    <rect x="360" y="322" width="240" height="70" fill="#eef5e8" stroke="#7aa663" stroke-width="2.4" transform="rotate(0.4 480 357)"/>
    <text x="480" y="346" text-anchor="middle" font-size="12.5" fill="#3b3a36">print_progress_bar(9,144,36);</text>
    <text x="480" y="368" text-anchor="middle" font-size="11.5" fill="#8a8578">进度条也外包</text>
    <rect x="640" y="322" width="240" height="70" fill="#eef5e8" stroke="#7aa663" stroke-width="2.4" transform="rotate(-0.4 760 357)"/>
    <text x="760" y="346" text-anchor="middle" font-size="12.5" fill="#3b3a36">print_progress_bar(72,144,36);</text>
    <text x="760" y="368" text-anchor="middle" font-size="11.5" fill="#8a8578">同一台机器换参数用第二遍</text>

    <path d="M 60,452 Q 480,446 905,453" fill="none" stroke="#8a8578" stroke-width="3"/>
    <circle cx="150" cy="452" r="6" fill="#8a94a3"/>
    <text x="150" y="478" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 7~8 ✓</text>
    <circle cx="330" cy="453" r="13" fill="none" stroke="#c96a5a" stroke-width="2.2"/>
    <circle cx="330" cy="453" r="6" fill="#5b8db8"/>
    <text x="330" y="478" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c96a5a">Day 9（今天）</text>
    <circle cx="510" cy="452" r="6" fill="#5b8db8"/>
    <text x="510" y="478" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 10 重载</text>
    <circle cx="680" cy="453" r="6" fill="#5b8db8"/>
    <text x="680" y="478" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 12 项目日</text>
    <circle cx="860" cy="452" r="6" fill="#e0955f"/>
    <text x="860" y="478" text-anchor="middle" font-size="12.5" fill="#3b3a36">第 3 周 数组</text>

    <rect x="120" y="500" width="720" height="40" fill="#f7e8a0" opacity="0.5" transform="rotate(-0.3 480 520)"/>
    <text x="480" y="526" text-anchor="middle" font-size="13.5" fill="#8a6d1a">函数是后面一切的地基：重载（明天）、递归、类的方法、Lambda，全是今天的延伸</text>
