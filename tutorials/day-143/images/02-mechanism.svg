<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">技术文章的叙事弧与素材库的盘点</text>
    <path d="M 320,58 Q 480,52 640,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">文章的叙事弧（不是功能清单）</text>
    <rect x="110" y="146" width="740" height="170" fill="#33413a"/>
    <text x="480" y="172" font-size="10.5" fill="#9fb8a8">开头（为什么）：空虚的试金石 → 引共鸣</text>
    <text x="480" y="196" font-size="10.5" fill="#cfe8c8">发展（怎么做）：三模块设计 → 有结构的推进</text>
    <text x="480" y="220" font-size="10.5" fill="#f0c9c0">高潮（坑）：五个失败故事 → 最有料的章节</text>
    <text x="480" y="244" font-size="10.5" fill="#cfe8c8">验证（有多对）：283/283 + 两 San → 置信度</text>
    <text x="480" y="268" font-size="10.5" fill="#cfe8c8">收尾（给读者）：你也可以 → 行动的召唤</text>
    <text x="480" y="300" font-size="10" fill="#8a8578">（起承转合的工程版：空虚→设计→坑→证明→召唤）</text>
    <text x="472" y="334" font-size="11.5" fill="#8a8578">（"我卡了三小时"的位置在高潮段——读者的记忆锚点）</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">素材库：17 天的真实记录</text>
    <rect x="64" y="412" width="430" height="150" fill="#33413a"/>
    <text x="279" y="436" font-size="10.5" fill="#9fb8a8">坑的清单（5 个大坑 + 若干小）：</text>
    <text x="279" y="458" font-size="10" fill="#f0c9c0">转义地狱 / 数字文法 / 尾逗号回归</text>
    <text x="279" y="478" font-size="10" fill="#f0c9c0">百万层爆栈 / 剥层数配错</text>
    <text x="279" y="504" font-size="10.5" fill="#9fb8a8">数字的证据（全部实测）：</text>
    <text x="279" y="526" font-size="10" fill="#cfe8c8">1717 行 / 28 用例 / 283 满分 / 1.77x</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">诚实原则的清单</text>
    <rect x="572" y="412" width="320" height="150" fill="#33413a"/>
    <text x="732" y="436" font-size="10.5" fill="#9fb8a8">要承认的：</text>
    <text x="732" y="458" font-size="10" fill="#f0c9c0">double 的 2^53 / 深度 500 上限</text>
    <text x="732" y="478" font-size="10" fill="#f0c9c0">教学规模（非生产级）</text>
    <text x="732" y="504" font-size="10.5" fill="#cfe8c8">不夸大的：</text>
    <text x="732" y="526" font-size="10" fill="#8a8578">（"支持"≠"完整支持"——范围说清）</text>
    <text x="732" y="548" font-size="10" fill="#8a8578">（诚实的文章比完美的可信）</text>
  </g>
</svg>
