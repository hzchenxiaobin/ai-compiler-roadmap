<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 111 全貌：移动构造与赋值——偷资源的执行者</text>
    <path d="M 290,60 Q 480,52 670,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"给 MyString 补移动语义"——昨天签意向书今天搬家公司上门：偷指针 + 掏空源 + noexcept 的安全承诺</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">移动构造的三步偷</text>
    <rect x="64" y="164" width="440" height="90" fill="#33413a"/>
    <text x="284" y="190" font-size="11" fill="#9fb8a8">MyString(MyString&amp;&amp; o) noexcept :</text>
    <text x="284" y="212" font-size="11" fill="#cfe8c8">　data_(o.data_), size_(o.size_)　①偷成员</text>
    <text x="284" y="232" font-size="11" fill="#cfe8c8">　{ o.data_ = nullptr; … }　　②掏空源 ③完成</text>
    <text x="64" y="280" font-size="12.5" fill="#45703a">拷贝构造：new + memcpy（分配+逐字节）</text>
    <text x="64" y="302" font-size="12" fill="#8a8578">（实测 [拷贝构造]——新分配 + 抄）</text>
    <text x="64" y="330" font-size="12.5" fill="#45703a">移动构造：偷指针（零分配零拷贝！）</text>
    <text x="64" y="352" font-size="12" fill="#8a8578">（实测 [移动构造]——指针换个主人）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">vector 扩容的移动搬家（实测）</text>
    <rect x="572" y="164" width="320" height="90" fill="#33413a"/>
    <text x="732" y="190" font-size="10.5" fill="#9fb8a8">push 第 3 个（触发扩容）：</text>
    <text x="732" y="212" font-size="10.5" fill="#cfe8c8">[移动构造] ×5（全偷指针）</text>
    <text x="732" y="232" font-size="10" fill="#8a8578">（旧元素进新家 + 新元素就位）</text>
    <text x="572" y="282" font-size="12" fill="#45703a">Day 79 说"扩容用移动"——今天落地</text>
    <text x="572" y="310" font-size="12" fill="#6b675e">（拷贝版搬家 = 逐字节重抄全部；</text>
    <text x="572" y="330" font-size="12" fill="#6b675e">　移动版 = 指针改挂——快得多）</text>
    <text x="572" y="362" font-size="11" fill="#8a8578">（Day 114 项目日用毫秒量化差距）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">noexcept：移动的安全承诺</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">vector 用移动搬家的前提是移动不抛——搬一半抛了（新家半满+旧家已掏）数据就丢；没 noexcept 的移动会被降级为拷贝搬家</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（偷指针的操作天然不抛——所以移动构造几乎总能标 noexcept）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 109~110 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 111（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 112~113</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 114 项目日</text>
  </g>
</svg>
