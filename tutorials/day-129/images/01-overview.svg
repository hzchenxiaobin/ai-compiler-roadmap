<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 129 全貌：Tokenizer 完整版——切分与错误处理</text>
    <path d="M 300,60 Q 480,52 660,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"数字/字符串/符号的切分"——三形态数字、五转义、四类错误（全带行号）：错误收集不中断——一次报全方便一次改对</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">三类切分（实测）</text>
    <text x="64" y="180" font-size="12.5" fill="#45703a">符号：{} [] : ,（六种单字符）</text>
    <text x="64" y="208" font-size="12.5" fill="#45703a">数字：字符集扫描（负/小数/指数）</text>
    <text x="64" y="230" font-size="12" fill="#8a8578">（实测：0 -1 3.14 1e5 2.5E-3 42 全过）</text>
    <text x="64" y="260" font-size="12.5" fill="#45703a">字符串：引号包 + 转义解码</text>
    <text x="64" y="282" font-size="12" fill="#8a8578">（实测：\n\t\\" 简化五件——\u 明天）</text>
    <text x="64" y="316" font-size="12.5" fill="#6b675e">字面量：true/false/null 前缀比对</text>
    <text x="64" y="352" font-size="11.5" fill="#8a8578">（多行输入的行号跟踪 ✔——第N行报错锚点）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#a33f2e">四类错误（实测）</text>
    <text x="572" y="180" font-size="12" fill="#a33f2e">①意外字符：'@' 被拒</text>
    <text x="572" y="208" font-size="12" fill="#a33f2e">②非法转义：\x 被拒</text>
    <text x="572" y="236" font-size="12" fill="#a33f2e">③字符串未闭合（行尾/EOF）</text>
    <text x="572" y="264" font-size="12" fill="#a33f2e">④数字无数字字符："−."</text>
    <text x="572" y="296" font-size="12.5" fill="#45703a">策略：收集不中断</text>
    <text x="572" y="318" font-size="12" fill="#8a8578">（多个错一次报全——改一轮就完）</text>
    <text x="572" y="352" font-size="11.5" fill="#8a8578">（对照：遇错即停要改多轮）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">项目的三天进度</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">Tokenizer 原型（127）→ Value 结构（128）→ 今天完整版：数字/字符串/符号+四错——流水线第一段成品；明天 \u 转义补完、后天数字严格文法</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（"完整"是渐进的——每天补一块、每天都可跑）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 127~128 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 129（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 130~133</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 144 终点</text>
  </g>
</svg>
