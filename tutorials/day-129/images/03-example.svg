    <text x="514" y="400" font-size="11.5" fill="#8a8578">　"1.2.3" 这类拒收）</text>
    <text x="514" y="432" font-size="12.5" fill="#45703a">（129/144 = 89.6%）</text>
    <text x="514" y="462" font-size="11" fill="#9fb8a8">（Parser 骨架 Day 132——大后天）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">错误处理的用户观</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">"第3行：字符串未闭合"比"解析失败"友好一百倍——行号+原因让用户直达病灶；错误处理不是附庸是产品的脸面</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 130 字符串转义完整版——\n \" \\ \u 的处理（含 \uXXXX 十六进制）</text>
