<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 38 全貌：new / delete——堆的钥匙</text>
    <path d="M 330,60 Q 480,52 630,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">昨天认完楼层，今天拿到仓库的钥匙——大小运行期定、生命期自己管；自由的对价是配对纪律</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">堆 vs 栈（昨天楼层的对表）</text>
    <text x="64" y="180" font-size="12.5" fill="#3b3a36">大小：栈编译期定；堆运行期定（n 是变量也行）</text>
    <text x="64" y="204" font-size="12" fill="#8a8578">（实测：int n = 5; new int[n] ✔——栈数组做不到）</text>
    <text x="64" y="234" font-size="12.5" fill="#3b3a36">回收：栈自动（出块即走）；堆手动（delete）</text>
    <text x="64" y="264" font-size="12.5" fill="#3b3a36">地址：实测堆 0x1029e…（和昨天静态区同段）</text>
    <text x="64" y="296" font-size="12.5" fill="#45703a">初始化：new int（垃圾）→ new int(7) → new int{}</text>
    <text x="64" y="320" font-size="12" fill="#8a8578">（实测 {} 得 0——零初始化是最稳的默认）</text>
    <text x="64" y="356" font-size="12.5" fill="#6b675e">数组：new int[n]{} 全零 → delete[] 配对</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">配对纪律（三条铁律）</text>
    <text x="572" y="180" font-size="12.5" fill="#45703a">①new 必 delete——漏了就泄漏</text>
    <text x="572" y="202" font-size="12" fill="#8a8578">（实测：编译器不报错，静默 400 字节）</text>
    <text x="572" y="232" font-size="12.5" fill="#45703a">②new[] 必配 delete[]——错配是 UB</text>
    <text x="572" y="254" font-size="12" fill="#8a8578">（实测：-Wall 直接警告 -Wmismatched-）</text>
    <text x="572" y="284" font-size="12.5" fill="#45703a">③delete 后置空 p = nullptr</text>
    <text x="572" y="306" font-size="12" fill="#8a8578">（防悬空误用——if (p) 检查有依据）</text>
    <text x="572" y="344" font-size="12.5" fill="#6b675e">三条守住 = 堆用得比栈自由且不出事</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">悬空指针初见</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">delete 后指针本身的值没变（还存着旧地址）——但解引用是 UB；明天工具课 + Day 49 的智能指针根治它</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（今天先记三条纪律；"忘了配对怎么办"是明天的 ASan 课）</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 37 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 38（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 39~41</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 42 项目日</text>
  </g>
</svg>
