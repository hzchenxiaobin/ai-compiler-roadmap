<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">出生与销毁的时刻表（日志实测）</text>
    <path d="M 320,58 Q 480,52 640,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,290 Q 470,284 44,289 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 195)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">ctor_order 实测时间线（带日志的 Logger 类）</text>
    <rect x="80" y="146" width="330" height="130" fill="#33413a"/>
    <text x="100" y="172" font-size="11" fill="#9fb8a8">进入 main</text>
    <text x="100" y="192" font-size="11.5" fill="#cfe8c6">　【出生】栈对象a →【出生】栈对象b</text>
    <text x="100" y="212" font-size="11.5" fill="#9fb8a8">　块内工作……</text>
    <text x="100" y="232" font-size="11.5" fill="#f0c9c0">　【销毁】b →【销毁】a（逆序！）</text>
    <text x="100" y="252" font-size="11" fill="#9fb8a8">回到 main</text>
    <rect x="440" y="146" width="430" height="130" fill="#33413a"/>
    <text x="460" y="172" font-size="11" fill="#9fb8a8">数组初始化列表：</text>
    <text x="460" y="192" font-size="11.5" fill="#cfe8c6">　【出生】数组[0] →【出生】数组[1]</text>
    <text x="460" y="212" font-size="11.5" fill="#9fb8a8">main 结束前</text>
    <text x="460" y="232" font-size="11.5" fill="#f0c9c0">　【销毁】[1] →【销毁】[0]（仍逆序）</text>
    <text x="460" y="252" font-size="11" fill="#9fb8a8">（return 0 触发）</text>
    <text x="472" y="272" text-anchor="middle" font-size="12.5" fill="#45703a">两条规律：声明即出生；同块内先出生的后销毁（栈的后进先出）</text>

    <path d="M 40,314 Q 470,308 905,315 L 901,410 Q 470,404 44,409 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.2 472 362)"/>
    <text x="472" y="344" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">Date 三构造的调用选择（重载解析）</text>
    <text x="70" y="374" font-size="13" fill="#3b3a36">Date d1;　　　→ Date()（默认）　　　Date d2(2026,11,22); → Date(int,int,int)</text>
    <text x="70" y="400" font-size="13" fill="#3b3a36">Date d3(2026); → Date(int)（委托）　选谁由实参形状决定——Day 10 重载规则的构造版</text>

    <path d="M 40,434 Q 470,428 905,435 L 901,576 Q 470,570 44,575 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 505)"/>
    <text x="472" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">const 成员的执法现场（实测报错）</text>
    <rect x="180" y="480" width="600" height="76" fill="#33413a"/>
    <text x="480" y="506" text-anchor="middle" font-size="11.5" fill="#ffd7d0">error: constructor for 'WithConst' must explicitly</text>
    <text x="480" y="526" text-anchor="middle" font-size="11.5" fill="#ffd7d0">initialize the const member 'id_'</text>
    <text x="480" y="548" text-anchor="middle" font-size="11" fill="#9fb8a8">（构造体内赋值版被拦——const 只认初始化列表）</text>
  </g>
</svg>
