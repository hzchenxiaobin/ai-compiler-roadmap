<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">四种出生、一张时刻表与一条红线</text>
    <path d="M 350,58 Q 480,52 610,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,230 470,360 Q 248,365 26,360 Q 20,230 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 231)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">实验 1：Date 四种出生</text>
    <rect x="38" y="146" width="420" height="200" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./dc</text>
    <text x="54" y="196" font-size="12.5" fill="#cfe8c6">d1（默认）　：2026-1-1</text>
    <text x="54" y="218" font-size="12.5" fill="#cfe8c6">d2（三参）　：2026-11-22</text>
    <text x="54" y="240" font-size="12.5" fill="#cfe8c6">d3（委托）　：2026-1-1</text>
    <text x="54" y="262" font-size="12.5" fill="#f0c9c0">d4（非法）　：2026-1-1（13月99日被拦）</text>
    <text x="54" y="296" font-size="12" fill="#9fb8a8">非法日期退回安全默认——不变量从出生</text>
    <text x="54" y="316" font-size="12" fill="#9fb8a8">就保住（Day 37 的 set_size 校验搬进了</text>
    <text x="54" y="336" font-size="12" fill="#9fb8a8">产房）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,230 934,360 Q 712,365 490,360 Q 484,230 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 231)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">实验 2：出生销毁时刻表</text>
    <rect x="502" y="146" width="420" height="200" rx="6" fill="#33413a"/>
    <text x="514" y="172" font-size="11.5" fill="#9fb8a8">$ ./co（Logger 日志，节选）</text>
    <text x="514" y="194" font-size="12" fill="#cfe8c6">进入 main → 出生a → 出生b</text>
    <text x="514" y="216" font-size="12" fill="#f0c9c0">出块 → 销毁b → 销毁a（逆序）</text>
    <text x="514" y="238" font-size="12" fill="#cfe8c6">出生数组[0] → 出生数组[1]</text>
    <text x="514" y="260" font-size="12" fill="#f0c9c0">return 0 → 销毁[1] → 销毁[0]</text>
    <text x="514" y="292" font-size="12" fill="#9fb8a8">析构函数 ~Logger() 已出场客串——</text>
    <text x="514" y="312" font-size="12" fill="#9fb8a8">明天的主角今天先混脸熟</text>
    <text x="514" y="336" font-size="12" fill="#9fb8a8">（逆序销毁 = 栈的后进先出）</text>

    <path d="M 24,386 Q 470,380 905,387 L 901,490 Q 470,484 26,489 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 464 438)"/>
    <text x="46" y="414" font-size="15.5" font-weight="bold" fill="#a33f2e">实验 3：初始化列表的红线</text>
    <rect x="38" y="428" width="850" height="52" rx="6" fill="#33413a"/>
    <text x="54" y="450" font-size="11.5" fill="#9fb8a8">正确版（列表）→ id = 7，value = 100 ✔</text>
    <text x="54" y="470" font-size="11.5" fill="#ffd7d0">赋值版 → error: constructor … must explicitly initialize the const member 'id_'</text>

    <path d="M 24,510 Q 470,504 905,511 L 901,630 Q 470,624 26,629 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 570)"/>
    <text x="480" y="540" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#55606e">昨天问题的今日答卷</text>
    <text x="480" y="570" text-anchor="middle" font-size="12.5" fill="#3b3a36">Rectangle r; 之后忘了 set_size 就 area() 出垃圾？——给 Rectangle 加构造函数后</text>
    <text x="480" y="594" text-anchor="middle" font-size="12.5" fill="#3b3a36">"声明即就绪"，忘了初始化这件事从语言层面不存在了（明天的 RAII 把这招推向巅峰）</text>
  </g>
</svg>
