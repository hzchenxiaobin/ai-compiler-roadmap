<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">g++ 一条命令的背后：四个车站</text>
    <path d="M 316,58 Q 480,52 644,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <rect x="230" y="72" width="500" height="46" rx="8" fill="#33413a" stroke="#3b3a36" stroke-width="2.5" transform="rotate(0.2 480 95)"/>
    <text x="480" y="102" text-anchor="middle" font-size="17" fill="#d8e8d2">$ g++ -Wall hello.cpp -o hello</text>

    <path d="M 480,122 Q 487,146 480,158" fill="none" stroke="#3b3a36" stroke-width="2.8"/>
    <path d="M 474,152 Q 481,160 489,153" fill="none" stroke="#3b3a36" stroke-width="2.8"/>

    <path d="M 20,173 Q 120,168 222,173 Q 227,260 222,347 Q 120,352 22,347 Q 17,260 20,173 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(-0.4 121 260)"/>
    <circle cx="46" cy="199" r="14" fill="#fffdf7" stroke="#5b8db8" stroke-width="2.5"/>
    <text x="46" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c5a82">1</text>
    <text x="130" y="205" text-anchor="middle" font-size="19" font-weight="bold" fill="#2c5a82">预处理</text>
    <text x="121" y="236" text-anchor="middle" font-size="14" fill="#3b3a36">把 #include 的内容</text>
    <text x="121" y="257" text-anchor="middle" font-size="14" fill="#3b3a36">原样搬进来，删掉注释</text>
    <path d="M 42,290 Q 121,285 200,291 Q 203,323 200,348 Q 121,352 43,347 Q 40,318 42,290 Z" fill="#fffdf7" stroke="#9db8cf" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="121" y="313" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">hello.i</text>
    <text x="121" y="334" text-anchor="middle" font-size="12" fill="#6b675e">仍是文本，变长了</text>

    <path d="M 227,262 Q 243,254 259,262" fill="none" stroke="#3b3a36" stroke-width="2.6"/>
    <path d="M 252,255 Q 260,261 252,270" fill="none" stroke="#3b3a36" stroke-width="2.6"/>
    <text x="243" y="243" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a8578">-E</text>

    <path d="M 264,173 Q 364,168 466,173 Q 471,260 466,347 Q 364,352 266,347 Q 261,260 264,173 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(0.4 365 260)"/>
    <circle cx="290" cy="199" r="14" fill="#fffdf7" stroke="#7aa663" stroke-width="2.5"/>
    <text x="290" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#45703a">2</text>
    <text x="374" y="205" text-anchor="middle" font-size="19" font-weight="bold" fill="#45703a">编译</text>
    <text x="365" y="236" text-anchor="middle" font-size="14" fill="#3b3a36">C++ 翻译成汇编</text>
    <text x="365" y="257" text-anchor="middle" font-size="14" fill="#3b3a36">语法检查在这站报 error</text>
    <path d="M 286,290 Q 365,285 444,291 Q 447,323 444,348 Q 365,352 287,347 Q 284,318 286,290 Z" fill="#fffdf7" stroke="#a8c494" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="365" y="313" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">hello.s</text>
    <text x="365" y="334" text-anchor="middle" font-size="12" fill="#6b675e">汇编，人还能读</text>

    <path d="M 471,262 Q 487,254 503,262" fill="none" stroke="#3b3a36" stroke-width="2.6"/>
    <path d="M 496,255 Q 504,261 496,270" fill="none" stroke="#3b3a36" stroke-width="2.6"/>
    <text x="487" y="243" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a8578">-S</text>

    <path d="M 508,173 Q 608,168 710,173 Q 715,260 710,347 Q 608,352 510,347 Q 505,260 508,173 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="3" transform="rotate(-0.3 609 260)"/>
    <circle cx="534" cy="199" r="14" fill="#fffdf7" stroke="#e0955f" stroke-width="2.5"/>
    <text x="534" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#9c5a22">3</text>
    <text x="618" y="205" text-anchor="middle" font-size="19" font-weight="bold" fill="#9c5a22">汇编</text>
    <text x="609" y="236" text-anchor="middle" font-size="14" fill="#3b3a36">汇编翻译成机器码</text>
    <text x="609" y="257" text-anchor="middle" font-size="14" fill="#3b3a36">到这站语法问题已成过去</text>
    <path d="M 530,290 Q 609,285 688,291 Q 691,323 688,348 Q 609,352 531,347 Q 528,318 530,290 Z" fill="#fffdf7" stroke="#e5b28c" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="609" y="313" text-anchor="middle" font-size="15" font-weight="bold" fill="#9c5a22">hello.o</text>
    <text x="609" y="334" text-anchor="middle" font-size="12" fill="#6b675e">二进制，打开是乱码</text>

    <path d="M 715,262 Q 731,254 747,262" fill="none" stroke="#3b3a36" stroke-width="2.6"/>
    <path d="M 740,255 Q 748,261 740,270" fill="none" stroke="#3b3a36" stroke-width="2.6"/>
    <text x="731" y="243" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a8578">-c</text>

    <path d="M 752,173 Q 852,168 942,173 Q 946,260 942,347 Q 852,352 754,347 Q 749,260 752,173 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="3" transform="rotate(0.4 848 260)"/>
    <circle cx="778" cy="199" r="14" fill="#fffdf7" stroke="#c96a5a" stroke-width="2.5"/>
    <text x="778" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#a33f2e">4</text>
    <text x="858" y="205" text-anchor="middle" font-size="19" font-weight="bold" fill="#a33f2e">链接</text>
    <text x="848" y="236" text-anchor="middle" font-size="14" fill="#3b3a36">把 hello.o 和标准库</text>
    <text x="848" y="257" text-anchor="middle" font-size="14" fill="#3b3a36">拼起来，找到入口 main</text>
    <path d="M 774,290 Q 848,285 920,291 Q 923,323 920,348 Q 848,352 775,347 Q 772,318 774,290 Z" fill="#fffdf7" stroke="#dda79b" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="848" y="313" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">hello</text>
    <text x="848" y="334" text-anchor="middle" font-size="12" fill="#6b675e">可执行文件</text>

    <path d="M 60,398 Q 478,392 902,399 L 898,424 Q 478,418 64,423 Z" fill="#fffdf7" stroke="#3b3a36" stroke-width="2.5" transform="rotate(-0.2 480 410)"/>
    <rect x="300" y="398" width="360" height="22" fill="#f7e8a0" opacity="0.65" transform="rotate(-0.6 480 409)"/>
    <text x="480" y="414" text-anchor="middle" font-size="18" font-weight="bold" fill="#3b3a36">今天的 3 个错误，分别在哪站被抓住？</text>

    <path d="M 92,456 Q 160,452 228,456 Q 231,476 228,494 Q 160,498 93,494 Q 89,475 92,456 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.5" transform="rotate(-0.5 160 475)"/>
    <text x="160" y="481" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#a33f2e">漏分号</text>
    <path d="M 238,475 Q 258,469 278,475" fill="none" stroke="#3b3a36" stroke-width="2.4"/>
    <path d="M 271,468 Q 279,474 271,483" fill="none" stroke="#3b3a36" stroke-width="2.4"/>
    <text x="290" y="480" font-size="14" fill="#a33f2e">error: expected ';' after expression</text>
    <path d="M 792,462 Q 850,458 906,462 Q 908,475 906,488 Q 850,491 793,488 Q 790,475 792,462 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2"/>
    <text x="849" y="480" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#45703a">第 2 站</text>

    <path d="M 92,506 Q 160,502 228,506 Q 231,526 228,544 Q 160,548 93,544 Q 89,525 92,506 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.5" transform="rotate(0.5 160 525)"/>
    <text x="160" y="531" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#a33f2e">漏引号</text>
    <path d="M 238,525 Q 258,519 278,525" fill="none" stroke="#3b3a36" stroke-width="2.4"/>
    <path d="M 271,518 Q 279,524 271,533" fill="none" stroke="#3b3a36" stroke-width="2.4"/>
    <text x="290" y="530" font-size="14" fill="#a33f2e">missing terminating '"' 后连环报错</text>
    <path d="M 792,512 Q 850,508 906,512 Q 908,525 906,538 Q 850,541 793,538 Q 790,525 792,512 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2"/>
    <text x="849" y="530" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#45703a">第 2 站</text>

    <path d="M 92,556 Q 160,552 228,556 Q 231,576 228,594 Q 160,598 93,594 Q 89,575 92,556 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.5" transform="rotate(-0.4 160 575)"/>
    <text x="160" y="581" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#a33f2e">拼错 main</text>
    <path d="M 238,575 Q 258,569 278,575" fill="none" stroke="#3b3a36" stroke-width="2.4"/>
    <path d="M 271,568 Q 279,574 271,583" fill="none" stroke="#3b3a36" stroke-width="2.4"/>
    <text x="290" y="580" font-size="14" fill="#a33f2e">Undefined symbols: "_main"（链接错误）</text>
    <path d="M 792,562 Q 850,558 906,562 Q 908,575 906,588 Q 850,591 793,588 Q 790,575 792,562 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2"/>
    <text x="849" y="580" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a33f2e">第 4 站</text>

    <text x="480" y="634" text-anchor="middle" font-size="13.5" fill="#8a8578">语法错误在前段车站，链接错误在最后一站——看报错第一行，就能判断离终点还有多远</text>
  </g>
</svg>
