<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 1 全貌：一行代码如何变成一次运行</text>
    <path d="M 310,60 Q 480,52 650,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">先看清整条流水线，今天只做最左边这一段</text>

    <path d="M 30,121 Q 126,117 222,121 Q 227,174 222,227 Q 126,231 31,227 Q 26,174 30,121 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(-0.4 126 174)"/>
    <text x="126" y="149" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c5a82">① 源代码</text>
    <text x="126" y="174" text-anchor="middle" font-size="16" fill="#3b3a36">hello.cpp</text>
    <text x="126" y="196" text-anchor="middle" font-size="13.5" fill="#6b675e">人能读的普通文本</text>
    <path d="M 62,210 q 30,-3 58,0" fill="none" stroke="#9db8cf" stroke-width="2"/>
    <path d="M 68,220 q 24,-2 46,0" fill="none" stroke="#9db8cf" stroke-width="2"/>
    <path d="M 68,230 q 18,2 34,0" fill="none" stroke="#9db8cf" stroke-width="2"/>

    <path d="M 232,174 Q 262,166 292,174" fill="none" stroke="#3b3a36" stroke-width="2.8"/>
    <path d="M 284,166 Q 293,172 285,182" fill="none" stroke="#3b3a36" stroke-width="2.8"/>
    <text x="262" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">g++ 编译</text>

    <path d="M 298,133 Q 380,129 460,133 Q 464,174 460,215 Q 380,219 299,215 Q 295,174 298,133 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.5" transform="rotate(0.4 380 174)"/>
    <text x="380" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#55606e">中间产物</text>
    <text x="380" y="180" text-anchor="middle" font-size="13.5" fill="#3b3a36">hello.i / hello.s / hello.o</text>
    <text x="380" y="199" text-anchor="middle" font-size="12.5" fill="#6b675e">四步中的前三步产物</text>

    <path d="M 470,174 Q 500,166 530,174" fill="none" stroke="#3b3a36" stroke-width="2.8"/>
    <path d="M 522,166 Q 531,172 523,182" fill="none" stroke="#3b3a36" stroke-width="2.8"/>
    <text x="500" y="108" text-anchor="middle" font-size="14" fill="#55606e">生成可执行文件</text>

    <path d="M 534,121 Q 632,117 728,121 Q 733,174 728,227 Q 632,231 535,227 Q 530,174 534,121 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="3" transform="rotate(-0.3 632 174)"/>
    <text x="632" y="149" text-anchor="middle" font-size="18" font-weight="bold" fill="#9c5a22">② 可执行文件</text>
    <text x="632" y="174" text-anchor="middle" font-size="16" fill="#3b3a36">hello</text>
    <text x="632" y="196" text-anchor="middle" font-size="13.5" fill="#6b675e">机器指令，CPU 能直接执行</text>
    <path d="M 596,212 h 18 m 8,0 h 12 m 8,0 h 6" fill="none" stroke="#e5b28c" stroke-width="2.4"/>
    <path d="M 596,222 h 10 m 8,0 h 16 m 8,0 h 10" fill="none" stroke="#e5b28c" stroke-width="2.4"/>

    <path d="M 738,174 Q 762,166 786,174" fill="none" stroke="#3b3a36" stroke-width="2.8"/>
    <path d="M 778,166 Q 787,172 779,182" fill="none" stroke="#3b3a36" stroke-width="2.8"/>
    <text x="762" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">./hello 运行</text>

    <path d="M 790,121 Q 867,117 944,121 Q 948,174 944,227 Q 867,231 791,227 Q 786,174 790,121 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(0.5 867 174)"/>
    <text x="867" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#45703a">③ 终端输出</text>
    <rect x="794" y="156" width="146" height="58" rx="6" fill="#33413a"/>
    <text x="800" y="174" font-size="12" fill="#cfe8c6">$ ./hello</text>
    <text x="800" y="190" font-size="12" fill="#cfe8c6">Hello, C++!</text>
    <text x="800" y="206" font-size="12" fill="#cfe8c6">Today is Day 1 of 144.</text>

    <path d="M 32,248 Q 380,241 726,249" fill="none" stroke="#5b8db8" stroke-width="2.5"/>
    <text x="379" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">编译期：今天要练会的部分（写代码 → 得到可执行文件）</text>
    <path d="M 792,248 Q 867,242 942,249" fill="none" stroke="#7aa663" stroke-width="2.5"/>
    <text x="867" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#45703a">运行期</text>

    <text x="480" y="320" text-anchor="middle" font-size="18" font-weight="bold" fill="#3b3a36">这条流水线在未来 144 天里的位置</text>

    <rect x="52" y="336" width="128" height="28" fill="#f7e8a0" opacity="0.65" transform="rotate(-1.5 116 350)"/>
    <text x="116" y="357" text-anchor="middle" font-size="17" font-weight="bold" fill="#c96a5a">Day 1 你在这里！</text>
    <path d="M 110,370 Q 72,380 64,398" fill="none" stroke="#c96a5a" stroke-width="2.5"/>
    <path d="M 60,391 Q 65,399 74,397" fill="none" stroke="#c96a5a" stroke-width="2.5"/>

    <path d="M 45,414 Q 480,406 915,415" fill="none" stroke="#8a8578" stroke-width="3"/>

    <circle cx="64" cy="413" r="14" fill="none" stroke="#c96a5a" stroke-width="2.2"/>
    <circle cx="64" cy="413" r="7" fill="#5b8db8"/>
    <text x="64" y="443" text-anchor="middle" font-size="15" font-weight="bold" fill="#c96a5a">第 1 天</text>
    <text x="64" y="461" text-anchor="middle" font-size="12" fill="#6b675e">环境与第一个程序</text>

    <circle cx="205" cy="410" r="7" fill="#5b8db8"/>
    <text x="205" y="440" text-anchor="middle" font-size="14" fill="#3b3a36">第 6 周</text>
    <text x="205" y="458" text-anchor="middle" font-size="12" fill="#6b675e">通讯录项目</text>

    <circle cx="350" cy="412" r="7" fill="#5b8db8"/>
    <text x="350" y="442" text-anchor="middle" font-size="14" fill="#3b3a36">第 13 周</text>
    <text x="350" y="460" text-anchor="middle" font-size="12" fill="#6b675e">多态图形库</text>

    <circle cx="495" cy="414" r="7" fill="#7aa663"/>
    <text x="495" y="444" text-anchor="middle" font-size="14" fill="#3b3a36">第 17 周</text>
    <text x="495" y="462" text-anchor="middle" font-size="12" fill="#6b675e">模板与 LRU</text>

    <circle cx="640" cy="412" r="7" fill="#e0955f"/>
    <text x="640" y="442" text-anchor="middle" font-size="14" fill="#3b3a36">第 21 周</text>
    <text x="640" y="460" text-anchor="middle" font-size="12" fill="#6b675e">现代 C++</text>

    <circle cx="785" cy="410" r="7" fill="#c96a5a"/>
    <text x="785" y="440" text-anchor="middle" font-size="14" fill="#3b3a36">第 24 周</text>
    <text x="785" y="458" text-anchor="middle" font-size="12" fill="#6b675e">JSON 解析器</text>

    <circle cx="900" cy="413" r="7" fill="#8a94a3"/>
    <text x="900" y="443" text-anchor="middle" font-size="14" fill="#3b3a36">进阶方向</text>
    <text x="900" y="461" text-anchor="middle" font-size="12" fill="#6b675e">并发·网络·编译器</text>

    <text x="480" y="516" text-anchor="middle" font-size="13.5" fill="#8a8578">每个里程碑项目，最后都要靠今天的 g++ 把它变成能跑的程序</text>
  </g>
