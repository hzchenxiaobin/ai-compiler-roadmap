<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">\u4e2d 的三字节之旅与代理对的合成公式</text>
    <path d="M 260,58 Q 480,52 700,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">\u4e2d → "中"（0x4E2D → 3 字节）</text>
    <rect x="110" y="146" width="360" height="170" fill="#33413a"/>
    <text x="290" y="172" font-size="11" fill="#9fb8a8">码点：0x4E2D（0100 1110 0010 1101）</text>
    <text x="290" y="196" font-size="11" fill="#cfe8c8">判档：0x800 ≤ cp &lt; 0x10000 → 3 字节</text>
    <text x="290" y="222" font-size="11" fill="#cfe8c8">字节1：0xE0|(cp&gt;&gt;12) = 0xE4</text>
    <text x="290" y="242" font-size="11" fill="#cfe8c8">字节2：0x80|((cp&gt;&gt;6)&amp;0x3F) = 0xB8</text>
    <text x="290" y="262" font-size="11" fill="#cfe8c8">字节3：0x80|(cp&amp;0x3F) = 0xAD</text>
    <text x="290" y="292" font-size="10.5" fill="#f0c9c0">实测："中" = E4 B8 AD ✔（3 字节）</text>
    <rect x="520" y="146" width="330" height="170" fill="#33413a"/>
    <text x="685" y="172" font-size="11" fill="#9fb8a8">为什么 UTF-8 这么设计：</text>
    <text x="685" y="196" font-size="10.5" fill="#cfe8c8">前缀标长度（0/110/1110/11110）</text>
    <text x="685" y="216" font-size="10.5" fill="#cfe8c8">后续字节 10xxxxxx 标"续"</text>
    <text x="685" y="240" font-size="10.5" fill="#cfe8c8">（自同步：错位解码能发现错）</text>
    <text x="685" y="268" font-size="10.5" fill="#8a8578">（ASCII 兼容：&lt;0x80 一字节不变）</text>
    <text x="685" y="296" font-size="10" fill="#8a8578">（char 遍历 UTF-8 会拆字节</text>
    <text x="685" y="312" font-size="10" fill="#8a8578">　的根源——多字节字符）</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">代理对合成（😀 实测）</text>
    <rect x="64" y="412" width="430" height="150" fill="#33413a"/>
    <text x="279" y="436" font-size="10.5" fill="#9fb8a8">输入：\uD83D\uDE00（两个 \u）</text>
    <text x="279" y="458" font-size="10.5" fill="#9fb8a8">高代理 D83D ∈ [D800,DBFF] ✔</text>
    <text x="279" y="478" font-size="10.5" fill="#9fb8a8">低代理 DE00 ∈ [DC00,DFFF] ✔</text>
    <text x="279" y="500" font-size="10.5" fill="#cfe8c8">合成：0x10000+(D83D-D800)</text>
    <text x="279" y="518" font-size="10.5" fill="#cfe8c8">　×0x400+(DE00-DC00) = 0x1F600</text>
    <text x="279" y="540" font-size="10.5" fill="#f0c9c0">UTF-8 四档 → F0 9F 98 80（4B）✔</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">错误四闸（实测）</text>
    <rect x="572" y="412" width="320" height="150" fill="#33413a"/>
    <text x="732" y="436" font-size="10.5" fill="#f0c9c0">\x41 → 非法转义（不在八/u 集）</text>
    <text x="732" y="458" font-size="10.5" fill="#f0c9c0">\u12 → 不足四位十六进制</text>
    <text x="732" y="480" font-size="10.5" fill="#f0c9c0">\uD83D → 孤立高代理</text>
    <text x="732" y="502" font-size="10.5" fill="#f0c9c0">\uDE00 → 孤立低代理</text>
    <text x="732" y="530" font-size="10" fill="#8a8578">（代理必须成对——半对非法）</text>
  </g>
</svg>
