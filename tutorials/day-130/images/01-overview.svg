<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 130 全貌：字符串转义——从 \n 到 \u 代理对</text>
    <path d="M 310,60 Q 480,52 650,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定转义处理——八基础转义、\uXXXX 码点（BMP 三档 UTF-8）、代理对（emoji 的 4 字节档）：字符编码的深水区一次走完</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">三层转义的阶梯</text>
    <text x="64" y="180" font-size="12.5" fill="#45703a">第一层：八基础转义（n t r b f " \ /）</text>
    <text x="64" y="202" font-size="12" fill="#8a8578">（各 1 字节——实测 0x0a/0x09…）</text>
    <text x="64" y="232" font-size="12.5" fill="#45703a">第二层：\uXXXX（BMP 码点）</text>
    <text x="64" y="254" font-size="12" fill="#8a8578">（A 1B / é 2B / 中 3B——三档 UTF-8）</text>
    <text x="64" y="284" font-size="12.5" fill="#a33f2e">第三层：代理对（增补平面）</text>
    <text x="64" y="306" font-size="12" fill="#8a8578">（\uD83D\uDE00 → 😀 4B——两对合成一字）</text>
    <text x="64" y="344" font-size="12.5" fill="#6b675e">错误四类：非法转义/不足四位/</text>
    <text x="64" y="364" font-size="12.5" fill="#6b675e">　孤立高低代理（各配实测）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">UTF-8 的四档编码（手工实现）</text>
    <rect x="572" y="164" width="320" height="190" fill="#33413a"/>
    <text x="732" y="188" font-size="10.5" fill="#cfe8c8">0x00-0x7F → 1 字节（0xxxxxxx）</text>
    <text x="732" y="212" font-size="10.5" fill="#cfe8c8">0x80-0x7FF → 2 字节（110…10…）</text>
    <text x="732" y="236" font-size="10.5" fill="#cfe8c8">0x800-0xFFFF → 3 字节（1110…）</text>
    <text x="732" y="260" font-size="10.5" fill="#f0c9c0">0x10000+ → 4 字节（11110…）</text>
    <text x="732" y="290" font-size="10" fill="#8a8578">（append_utf8 一个函数管四档</text>
    <text x="732" y="308" font-size="10" fill="#8a8578">　——位运算的与/或/移位）</text>
    <text x="732" y="340" font-size="10" fill="#8a8578">（中 3B / é 2B / 😀 4B——实测对应档）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">代理对的来龙去脉</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">UTF-16 用两个 16 位代理（D800-DFFF）表示 0x10000+ 的字符——JSON 沿用此编码；解码公式：0x10000+(高-D800)×0x400+(低-DC00)——孤立的半对是非法</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（😀 = U+1F600 = \uD83D\uDE00——今天实测 4 字节 ✔）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 127~129 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 130（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 131~133</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 144 终点</text>
  </g>
</svg>
