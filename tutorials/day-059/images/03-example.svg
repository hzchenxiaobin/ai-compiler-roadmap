    <text x="54" y="434" font-size="11" fill="#9fb8a8">　加：逐元素和 ✔　标量：×10 ✔</text>
    <text x="54" y="456" font-size="11" fill="#9fb8a8">　乘：1·7+2·9+3·11=58 ✔ 139/64/154 ✔</text>

