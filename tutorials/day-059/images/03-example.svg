    <text x="54" y="198" font-size="11" fill="#9fb8a8">a = [ 1 2 3 ; 4 5 6]　（setw(4) 对齐）</text>
    <text x="54" y="216" font-size="12" fill="#cfe8c6">a[1][2] = 6　←链式下标读 ✔</text>
    <text x="54" y="244" font-size="11.5" fill="#cfe8c6">c = a + b = [ 2 4 6 ; 8 10 12] ✔</text>
    <text x="54" y="272" font-size="11.5" fill="#cfe8c6">d = a*10 = [10 20 30; 40 50 60] ✔</text>
