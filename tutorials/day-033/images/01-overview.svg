    <path d="M 40,110 Q 250,104 460,110 Q 464,200 460,290 Q 250,296 42,290 Q 36,200 40,110 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 250 200)"/>
