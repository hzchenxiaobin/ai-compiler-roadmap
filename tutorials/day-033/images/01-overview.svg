    <text x="64" y="378" font-size="12.5" fill="#3b3a36">考察：26 格频率表（Day 18 统计器）</text>
    <text x="64" y="404" font-size="12.5" fill="#6b675e">要点：a 计 +1、b 计 −1，一次循环两清</text>
    <text x="64" y="438" font-size="12.5" fill="#45703a">实测：listen/silent 是；rat/car 否</text>
    <text x="64" y="470" font-size="12" fill="#8a8578">（长度先卡一道：短路省工夫）</text>

    <path d="M 490,316 Q 700,310 910,316 Q 913,406 910,496 Q 700,502 492,496 Q 486,406 490,316 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(0.3 700 406)"/>
