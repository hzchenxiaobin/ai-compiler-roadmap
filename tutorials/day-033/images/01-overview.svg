    <text x="64" y="172" font-size="12.5" fill="#3b3a36">考察：嵌套循环（Day 7）+ 数组遍历</text>
    <text x="64" y="198" font-size="12.5" fill="#6b675e">要点：j 从 i+1 起步，不重复配对</text>
    <text x="64" y="232" font-size="12.5" fill="#45703a">实测：9 → 2+7；21 → 15+6</text>
    <text x="64" y="264" font-size="12" fill="#8a8578">（引用输出参数：Day 21 的 min_max 同款）</text>

    <path d="M 490,110 Q 700,104 910,110 Q 913,200 910,290 Q 700,296 492,290 Q 486,200 490,110 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 700 200)"/>
