    <text x="514" y="198" font-size="12.5" fill="#6b675e">要点：%15 判断必须排最前</text>
    <text x="514" y="232" font-size="12.5" fill="#45703a">实测：1 2 Fizz 4 Buzz … 14 FizzBuzz</text>
    <text x="514" y="264" font-size="12" fill="#8a8578">（to_string：数字转字符串小工具）</text>

    <path d="M 40,316 Q 250,310 460,316 Q 464,406 460,496 Q 250,502 42,496 Q 36,406 40,316 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.3 250 406)"/>
