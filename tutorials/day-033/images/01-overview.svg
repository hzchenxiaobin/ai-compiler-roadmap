    <text x="514" y="378" font-size="12.5" fill="#3b3a36">考察：string 下标比较 + substr（Day 16）</text>
    <text x="514" y="404" font-size="12.5" fill="#6b675e">要点：候选逐词截短，空了提前收工</text>
    <text x="514" y="438" font-size="12.5" fill="#45703a">实测：flower/flow/flight →「fl」</text>
    <text x="514" y="470" font-size="12" fill="#8a8578">（无公共前缀返回空串：边界自测过）</text>

