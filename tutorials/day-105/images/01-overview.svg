<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 105 全貌：四件套现代化——nullptr / enum class / using / constexpr</text>
    <path d="M 220,60 Q 480,52 740,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"全面替换旧写法"——NULL/enum{}/typedef/#define 四对旧写的现代替身：每件都是"类型更安全"或"编译期更早"</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">①②：类型安全双件</text>
    <text x="64" y="180" font-size="12.5" fill="#45703a">nullptr：指针类型的空（NULL 是整数）</text>
    <text x="64" y="202" font-size="12" fill="#8a8578">（重载选对的——take_ptr(nullptr) 走指针版）</text>
    <text x="64" y="232" font-size="12.5" fill="#45703a">enum class：作用域 + 强类型</text>
    <text x="64" y="254" font-size="12" fill="#8a8578">（Color::Red 和 Traffic::Red 共存不撞名）</text>
    <text x="64" y="284" font-size="12.5" fill="#a33f2e">不隐式转 int——int x = c 编译错！</text>
    <text x="64" y="306" font-size="12" fill="#8a8578">（旧式 enum 无保护——实测对照）</text>
    <text x="64" y="346" font-size="12" fill="#8a8578">（static_cast&lt;int&gt; 显式转换是唯一通道）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">③④：编译期双件</text>
    <text x="572" y="180" font-size="12.5" fill="#45703a">using 别名：typedef 的现代版</text>
    <text x="572" y="202" font-size="12" fill="#8a8578">（函数指针别名变可读；模板别名 typedef 做不到）</text>
    <text x="572" y="232" font-size="12.5" fill="#45703a">constexpr：编译期常量/函数</text>
    <text x="572" y="254" font-size="12" fill="#8a8578">（factorial(5)=120 进指令；运行期也能调）</text>
    <text x="572" y="284" font-size="12.5" fill="#45703a">编译期值能当数组大小！</text>
    <text x="572" y="306" font-size="12" fill="#8a8578">（int arr[factorial(4)] → 24 个——实测）</text>
    <text x="572" y="346" font-size="12" fill="#8a8578">（#define 的替身：有类型有作用域可调试）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">替换清单（计划指定）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">NULL→nullptr｜enum{…}→enum class｜typedef→using｜#define N→constexpr int N——四对替换，旧代码现代化的第一波</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（明天结构化绑定、后天 if constexpr——本周继续替换之旅）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 103~104 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 105（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 106~107</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 108 项目日</text>
  </g>
</svg>
