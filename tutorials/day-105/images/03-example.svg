    <rect x="502" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">nullptr：</text>
    <text x="514" y="196" font-size="11.5" fill="#cfe8c8">Day 19 起的指针判空 if (p) 不变——</text>
    <text x="514" y="216" font-size="11" fill="#9fb8a8">　变的只是"空"的写法</text>
    <text x="514" y="244" font-size="12" fill="#9fb8a8">enum class：</text>
    <text x="514" y="266" font-size="11.5" fill="#cfe8c8">Day 53 的三问清单（暴露面最小化）</text>
    <text x="514" y="286" font-size="11" fill="#9fb8a8">　在语言层的同款思想</text>
