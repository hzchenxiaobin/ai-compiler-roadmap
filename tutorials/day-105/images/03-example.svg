    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./mf　（-Wall 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== nullptr ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c8">nullptr → 指针重载 ✔</text>
    <text x="54" y="242" font-size="11.5" fill="#cfe8c8">0 → 整数重载 ✔</text>
    <text x="54" y="266" font-size="12" fill="#9fb8a8">== enum class ==</text>
    <text x="54" y="288" font-size="11.5" fill="#cfe8c8">Color::Red + Traffic::Red 共存 ✔</text>
    <text x="54" y="308" font-size="11.5" fill="#cfe8c8">static_cast(Green)=1 ✔</text>
    <text x="54" y="328" font-size="11" fill="#9fb8a8">执法：int x = c → 编译错！</text>
    <text x="54" y="352" font-size="12" fill="#9fb8a8">== using ==</text>
    <text x="54" y="374" font-size="11.5" fill="#cfe8c8">别名当类型用 ✔</text>
    <text x="54" y="398" font-size="12" fill="#9fb8a8">== constexpr ==</text>
    <text x="54" y="420" font-size="11.5" fill="#cfe8c8">编译期 120；运行期 720 ✔</text>
    <text x="54" y="442" font-size="11.5" fill="#f0c9c0">arr[factorial(4)] → 24 个 ✔</text>
    <text x="54" y="466" font-size="11" fill="#9fb8a8">（四对替换清单打印 ✔）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,490 Q 712,495 490,490 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 296)"/>
