    <text x="514" y="336" font-size="11.5" fill="#cfe8c8">Day 99 的非类型参数（MaxSize）</text>
    <text x="514" y="356" font-size="11" fill="#9fb8a8">　要求编译期常量——constexpr 供货</text>
    <text x="514" y="384" font-size="12" fill="#9fb8a8">using：</text>
    <text x="514" y="406" font-size="11.5" fill="#cfe8c8">Day 98 MyVector 的 using iterator = T*</text>
    <text x="514" y="426" font-size="11" fill="#9fb8a8">　（当时就在用——今天正名）</text>
    <text x="514" y="458" font-size="12.5" fill="#45703a">（105/144 = 72.9%）</text>
    <text x="514" y="488" font-size="11" fill="#9fb8a8">明天结构化绑定 → 后天 if constexpr</text>
    <text x="514" y="508" font-size="11" fill="#9fb8a8">　→ 周六项目日重写通讯录 v3</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">现代化的主线</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">"类型更安全"（nullptr/enum class 把歧义和隐式转换堵死）+"编译期更早"（constexpr 把计算提前）——四件套是同一场革命的四个侧翼</text>

