    <text x="54" y="442" font-size="11" fill="#9fb8a8">　shared_ptr&lt;Shape&gt;——Service 不是</text>
    <text x="54" y="460" font-size="11" fill="#9fb8a8">　Shape 编译错；改专用表后过）</text>

