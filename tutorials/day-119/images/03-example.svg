    <rect x="38" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./sp　（-Wall 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== 多态容器 ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c8">圆(2)：12.5664；矩(3×4)：12 ✔</text>
    <text x="54" y="242" font-size="11.5" fill="#cfe8c8">圆(1)：3.14159；总 27.708 ✔</text>
    <text x="54" y="266" font-size="12" fill="#9fb8a8">== 拷贝分野 ==</text>
    <text x="54" y="288" font-size="11.5" fill="#f0c9c0">unique 版拷贝 → 编译错 ✔</text>
    <text x="54" y="308" font-size="11.5" fill="#cfe8c8">shared 版拷贝 ✔ count=2</text>
    <text x="54" y="332" font-size="12" fill="#9fb8a8">== enable_shared_from_this ==</text>
    <text x="54" y="354" font-size="11.5" fill="#cfe8c8">注册前 1 → 注册后 2 ✔</text>
    <text x="54" y="374" font-size="11" fill="#9fb8a8">（svc 出块服务仍活——注册表持）</text>
    <text x="54" y="398" font-size="11.5" fill="#cfe8c8">registry 清 → 服务销毁 ✔</text>
