<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 119 全貌：智能指针 × 容器 × 多态——标准配合</text>
    <path d="M 290,60 Q 480,52 670,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">Day 76 的 vector&lt;unique_ptr&lt;Shape&gt;&gt; 今天正名：多态容器标准姿势 + 容器拷贝语义分野 + enable_shared_from_this</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">多态容器的标准姿势</text>
    <rect x="64" y="164" width="440" height="70" fill="#33413a"/>
    <text x="284" y="190" font-size="11" fill="#9fb8a8">vector&lt;unique_ptr&lt;Shape&gt;&gt; shapes;</text>
    <text x="284" y="212" font-size="11" fill="#cfe8c8">shapes.push_back(make_unique&lt;Circle&gt;(2));</text>
    <text x="64" y="260" font-size="12.5" fill="#45703a">虚析构保证派生正确销毁（Day 69）</text>
    <text x="64" y="288" font-size="12.5" fill="#45703a">多态调度：s->area() 各走各的（Day 73 虚表）</text>
    <text x="64" y="316" font-size="12" fill="#8a8578">（实测：圆/矩/圆 → 总面积 27.708）</text>
    <text x="64" y="352" font-size="12" fill="#8a8578">（三周知识的会师：容器+多态+智能指针）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">容器拷贝的语义分野</text>
    <text x="572" y="180" font-size="12" fill="#a33f2e">vector&lt;unique_ptr&gt; 拷贝 → 编译错！</text>
    <text x="572" y="202" font-size="11.5" fill="#8a8578">（独占语义正确传播——Day 115）</text>
    <text x="572" y="232" font-size="12" fill="#45703a">vector&lt;shared_ptr&gt; 拷贝 → ✔</text>
    <text x="572" y="254" font-size="11.5" fill="#8a8578">（实测 count 各 +1 = 2）</text>
    <text x="572" y="288" font-size="12" fill="#6b675e">选型：要拷贝容器的场景选 shared 版</text>
    <text x="572" y="310" font-size="11.5" fill="#8a8578">（unique 版只能 move——转移整个容器）</text>
    <text x="572" y="352" font-size="11.5" fill="#8a8578">（语义分野不是缺陷——是所有权设计的传播）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">enable_shared_from_this（了解）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">对象内部安全拿到"管理自己的 shared_ptr"——shared_from_this()；不能 shared_ptr&lt;T&gt;(this)（第二计数→双删）；典型用途：回调/异步保活</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（实测：注册后 count 1→2——注册表持了一份）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 115~118 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 119（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#e0955f"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 120 项目日</text>
    <circle cx="850" cy="514" r="5" fill="#5b8db8"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">第 21 周 异常</text>
  </g>
</svg>
