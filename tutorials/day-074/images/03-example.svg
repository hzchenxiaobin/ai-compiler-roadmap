<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">三种转换实测与两种设计对照</text>
    <path d="M 350,58 Q 480,52 610,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,230 470,360 Q 248,365 26,360 Q 20,230 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 231)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">实验 1：三种 cast</text>
    <rect x="38" y="146" width="420" height="200" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./ct</text>
    <text x="54" y="196" font-size="12" fill="#9fb8a8">== static_cast ==</text>
    <text x="54" y="214" font-size="12.5" fill="#cfe8c6">　（狗去捡球了）　←a1 真狗 ✔</text>
    <text x="54" y="240" font-size="12" fill="#9fb8a8">== dynamic_cast ==</text>
    <text x="54" y="258" font-size="12.5" fill="#cfe8c6">　a1 是狗：（狗去捡球了） ✔</text>
    <text x="54" y="278" font-size="12.5" fill="#f0c9c0">　a2 不是狗（返回 nullptr）✔</text>
    <text x="54" y="306" font-size="12" fill="#9fb8a8">== const_cast ==</text>
    <text x="54" y="326" font-size="12.5" fill="#cfe8c6">　original = 42（没敢写）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,230 934,360 Q 712,365 490,360 Q 484,230 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 231)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">实验 2：UB 的欺骗性</text>
    <rect x="502" y="146" width="420" height="200" rx="6" fill="#33413a"/>
    <text x="514" y="172" font-size="12" fill="#9fb8a8">static_cast&lt;Dog*&gt;(a2)（a2 是猫！）</text>
    <text x="514" y="196" font-size="12" fill="#9fb8a8">再调 fetch()：</text>
    <text x="514" y="222" font-size="12.5" fill="#f0c9c0">（狗去捡球了）×2　exit=0</text>
    <text x="514" y="252" font-size="12" fill="#9fb8a8">——居然"跑通"了！</text>
    <text x="514" y="280" font-size="12" fill="#9fb8a8">UB 的欺骗性：这次没崩是运气</text>
    <text x="514" y="300" font-size="12" fill="#9fb8a8">（Cat 内存里碰巧没踩雷）</text>
    <text x="514" y="330" font-size="12" fill="#9fb8a8">——"能跑"不等于"安全"</text>

    <path d="M 24,386 Q 470,380 905,387 L 901,510 Q 470,504 26,509 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 448)"/>
    <text x="46" y="414" font-size="15.5" font-weight="bold" fill="#9c5a22">实验 3：两种设计对照</text>
    <text x="46" y="444" font-size="12.5" fill="#3b3a36">继承版：code/debug/mentor/review 全通（一行不写白得基类）；组合版：mentor/review 转发执行（按需拼装）</text>
    <text x="46" y="468" font-size="12.5" fill="#6b675e">选型分析详见程序末尾的四行打印——is-a 稳定则继承，否则组合</text>

    <path d="M 24,530 Q 470,524 905,531 L 901,630 Q 470,624 26,629 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 580)"/>
    <text x="480" y="560" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#55606e">第 12 周收官 · 明天项目日</text>
    <text x="480" y="590" text-anchor="middle" font-size="12.5" fill="#3b3a36">Day 72：图形库 v3——5 种图形、多态计算面积/周长并排序输出（本周六天零件的总装大考）</text>
    <text x="480" y="612" text-anchor="middle" font-size="12.5" fill="#6b675e">（72/144 = 33%，第三个阶段过三分之一）</text>
  </g>
</svg>
