<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">猜数字：一轮循环的状态机与随机数种子</text>
    <path d="M 240,58 Q 480,52 720,59" fill="none" stroke="#7aa663" stroke-width="3"/>

    <path d="M 60,110 Q 260,104 460,110 Q 464,180 460,250 Q 260,256 62,250 Q 56,180 60,110 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 260 180)"/>
    <text x="260" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">随机数是怎么来的</text>
    <rect x="90" y="158" width="80" height="34" fill="#fdf6dd" stroke="#d9b23a" stroke-width="2.2"/>
    <text x="130" y="180" text-anchor="middle" font-size="12.5" fill="#8a6d1a">种子 42</text>
    <path d="M 178,175 Q 198,175 218,175" fill="none" stroke="#3b3a36" stroke-width="2.4"/>
    <path d="M 210,167 Q 219,173 211,183" fill="none" stroke="#3b3a36" stroke-width="2.4"/>
    <rect x="226" y="158" width="200" height="34" fill="#fffdf7" stroke="#9db8cf" stroke-width="2"/>
    <text x="326" y="180" text-anchor="middle" font-size="12" fill="#3b3a36">确定的数列 → …95…</text>
    <text x="260" y="216" text-anchor="middle" font-size="12" fill="#6b675e">srand(42) 后第一个 1~100 数，本机实测 95</text>
    <text x="260" y="238" text-anchor="middle" font-size="11.5" fill="#8a8578">固定种子 = 教学可复现；真玩换 time(0)</text>

    <path d="M 500,120 Q 620,114 740,120 Q 744,180 740,240 Q 620,246 502,240 Q 496,180 500,120 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(0.3 620 180)"/>
    <text x="620" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">while (true) 主循环</text>
    <text x="620" y="176" text-anchor="middle" font-size="12.5" fill="#3b3a36">读 guess → 三岔路口：</text>
    <text x="620" y="198" text-anchor="middle" font-size="12.5" fill="#3b3a36">太小 / 太大 / 猜中</text>
    <text x="620" y="226" text-anchor="middle" font-size="12" fill="#8a8578">tries 只在有效猜测时 +1</text>

    <path d="M 470,180 Q 486,180 496,180" fill="none" stroke="#3b3a36" stroke-width="2.6"/>
    <path d="M 489,172 Q 498,178 490,188" fill="none" stroke="#3b3a36" stroke-width="2.6"/>

    <path d="M 60,290 Q 200,284 340,290 Q 344,340 340,390 Q 200,396 62,390 Q 56,340 60,290 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.6" transform="rotate(-0.4 200 340)"/>
    <text x="200" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#a33f2e">读取失败（abc）</text>
    <text x="200" y="344" text-anchor="middle" font-size="12" fill="#3b3a36">clear + ignore 抢救</text>
    <text x="200" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c5a82">continue 回开头</text>

    <path d="M 380,290 Q 520,284 660,290 Q 664,340 660,390 Q 520,396 382,390 Q 376,340 380,290 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.6" transform="rotate(0.4 520 340)"/>
    <text x="520" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#45703a">太小 / 太大</text>
    <text x="520" y="344" text-anchor="middle" font-size="12" fill="#3b3a36">提示方向，tries 已 +1</text>
    <text x="520" y="368" text-anchor="middle" font-size="12.5" fill="#6b675e">自然流回循环开头</text>

    <path d="M 700,290 Q 830,284 930,290 Q 933,340 930,390 Q 830,396 702,390 Q 697,340 700,290 Z" fill="#fdf6dd" stroke="#d9b23a" stroke-width="2.6" transform="rotate(-0.4 815 340)"/>
    <text x="815" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1a">猜中（== secret）</text>
    <text x="815" y="344" text-anchor="middle" font-size="12" fill="#3b3a36">宣布答案和次数</text>
    <text x="815" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a33f2e">break 收场</text>

    <path d="M 60,430 Q 478,424 900,431 L 896,580 Q 478,574 64,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 480 505)"/>
    <text x="480" y="462" text-anchor="middle" font-size="16" font-weight="bold" fill="#9c5a22">真实事故档案：EOF 死循环（今天就发生在本机）</text>
    <text x="480" y="492" text-anchor="middle" font-size="13" fill="#3b3a36">第一次测试时，脚本喂的猜测全部没猜中；输入耗尽后 cin 到达 EOF（文件末尾）</text>
    <text x="480" y="516" text-anchor="middle" font-size="13" fill="#3b3a36">每次读取都立刻失败 → clear+ignore 后 continue → 无限刷"请输入 1~100 的整数。"</text>
    <text x="480" y="544" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a33f2e">修复：失败分支先问 cin.eof()，到尽头就体面退出（return 1）</text>
    <text x="480" y="570" text-anchor="middle" font-size="12.5" fill="#8a8578">教训：while(true) 循环必须有全部出口——break 是一个，EOF 是容易被遗忘的另一个</text>
  </g>
</svg>
