<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 139 全貌：性能优化三板斧——view、reserve、少拷贝</text>
    <path d="M 300,60 Q 480,52 660,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定的三板斧在 0.47MB×20 轮实测：string_view 1.53x + reserve 1.06x = 叠加 1.77x——正确之后求快（昨天满分今天提速）</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">四个版本的赛跑（实测）</text>
    <rect x="64" y="160" width="440" height="24" fill="#f9e9e5"/>
    <text x="440" y="177" font-size="9.5" fill="#a33f2e">A：9.01ms</text>
    <rect x="64" y="192" width="414" height="24" fill="#f9d9b8"/>
    <text x="416" y="209" font-size="9.5" fill="#9c5a22">A+：8.48ms（1.06x）</text>
    <rect x="64" y="224" width="287" height="24" fill="#d8ecce"/>
    <text x="290" y="241" font-size="9.5" fill="#45703a">B：5.87ms（1.53x）</text>
    <rect x="64" y="256" width="249" height="24" fill="#7aa663"/>
    <text x="252" y="273" font-size="9.5" fill="#ffffff">B+：5.09ms（1.77x）★</text>
    <text x="64" y="306" font-size="12.5" fill="#6b675e">贡献分解（A→B+ 省 3.91ms）：</text>
    <text x="64" y="330" font-size="12" fill="#8a8578">view 拷贝省 3.13ms（大头 80%）</text>
    <text x="64" y="354" font-size="12" fill="#8a8578">reserve 重分配省 0.52ms + 叠加增益</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">三板斧的机理</text>
    <text x="572" y="180" font-size="12" fill="#45703a">①string_view：词段零拷贝</text>
    <text x="572" y="202" font-size="12" fill="#8a8578">（substr 从"复制字节"变"记位置"）</text>
    <text x="572" y="230" font-size="12" fill="#45703a">②reserve：预留容量免重分配</text>
    <text x="572" y="252" font-size="12" fill="#8a8578">（vector 的翻倍增长是暗成本）</text>
    <text x="572" y="280" font-size="12" fill="#45703a">③减少拷贝：热路径的每次复制</text>
    <text x="572" y="302" font-size="12" fill="#8a8578">（审 substr/push_back/传参）</text>
    <text x="572" y="334" font-size="12.5" fill="#6b675e">适用面的诚实注（Day 122 三律）：</text>
    <text x="572" y="356" font-size="12" fill="#8a8578">（view 要原串活着——解析期内安全）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">测量的纪律（比结果更重要）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">预热再计时（缓存/分支预测就位）｜多轮取总（平均更稳）｜volatile sink（防编译器把"没用的结果"删掉）｜-O2 发布档（Debug 测的不是用户跑的）</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（数字会说谎——如果测错了地方；Day 114 的 chrono 方法论 + 今天的防优化）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 136~138 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 139（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 140~143</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 144 毕业</text>
  </g>
</svg>
