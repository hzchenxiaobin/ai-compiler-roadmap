<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 53 全貌：为复用而继承——经典反模式与重构</text>
    <path d="M 280,60 Q 480,52 680,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">BadStack 继承 vector 白得 push_back——但 Stack"只能顶端进出"的不变量被 40 多个继承来的接口冲垮</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,260 520,384 Q 280,390 42,384 Q 36,260 40,116 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#a33f2e">坏例：BadStack : vector</text>
    <text x="64" y="180" font-size="12.5" fill="#3b3a36">动机（貌似合理）：push_back 等功能白得——少写代码</text>
    <text x="64" y="212" font-size="12.5" fill="#a33f2e">问题 1：is-a 不成立——Stack 不是 vector</text>
    <text x="64" y="232" font-size="12" fill="#8a8578">（vector 有随机访问/中间插入——Stack 语义上禁止）</text>
    <text x="64" y="262" font-size="12.5" fill="#a33f2e">问题 2：不变量失守——实测绕过 Stack</text>
    <text x="64" y="282" font-size="12.5" fill="#a33f2e">　s.insert(begin, 99) 和 s[0]=42 都能编译执行</text>
    <text x="64" y="312" font-size="12.5" fill="#6b675e">后果：使用者可以不经 push/pop 直接改内容——</text>
    <text x="64" y="332" font-size="12.5" fill="#6b675e">　"后进先出"的承诺形同虚设</text>
    <text x="64" y="366" font-size="12" fill="#8a8578">（还有：vector 无虚析构——delete 基类指针的隐患）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,260 905,384 Q 740,390 552,384 Q 547,260 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">重构：GoodStack 有 vector</text>
    <text x="592" y="180" font-size="12.5" fill="#45703a">private vector&lt;T&gt; data_;（私用零件）</text>
    <text x="592" y="212" font-size="12.5" fill="#3b3a36">只暴露 Stack 该有的四个接口：</text>
    <text x="592" y="232" font-size="12.5" fill="#3b3a36">　push / pop / empty / size</text>
    <text x="592" y="262" font-size="12.5" fill="#45703a">实测：insert → 编译错误 ✔</text>
    <text x="592" y="282" font-size="12.5" fill="#45703a">　　　s[0] = 42 → 编译错误 ✔</text>
    <text x="592" y="312" font-size="12.5" fill="#6b675e">不变量"只能顶端进出"由类型系统锁死——</text>
    <text x="592" y="332" font-size="12.5" fill="#6b675e">　不是靠文档约定"请不要 insert"</text>
    <text x="592" y="366" font-size="12" fill="#8a8578">（代价：转发函数多写几行——灵活性的价格）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#fdf6dd" stroke="#d9b23a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d1a">重构判断清单（三问）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">① is-a 造句成立吗？（Stack 是 vector？——不成立 → 不能继承）② 全部继承接口都该暴露吗？（insert 不该 → 组合）</text>
    <text x="70" y="490" font-size="13" fill="#3b3a36">③ 基类有多态用途吗？（vector 无虚函数 → 继承无多态收益）——三问全否 → 组合</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 49~52 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 53（今天）</text>
    <circle cx="660" cy="514" r="5" fill="#e0955f"/>
    <text x="660" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 54 项目日</text>
    <circle cx="850" cy="514" r="5" fill="#5b8db8"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">第 10 周 OOP 收尾</text>
  </g>
</svg>
