<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 47 全貌：三种转换与一个设计抉择</text>
    <path d="M 310,60 Q 480,52 650,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">第 8 周收官前的最后一课：向下转型的安全姿势 + 组合 vs 继承的最终对表</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">三种 cast 的分工</text>
    <text x="64" y="180" font-size="12.5" fill="#45703a">static_cast：编译期——"我担保它是狗"</text>
    <text x="64" y="202" font-size="12" fill="#8a8578">（担保错了不报错，直接 UB——实测打了两次捡球）</text>
    <text x="64" y="234" font-size="12.5" fill="#45703a">dynamic_cast：运行期——"先验货再进门"</text>
    <text x="64" y="256" font-size="12" fill="#8a8578">（不是狗 → 返回 nullptr；实测 a2 被正确识别）</text>
    <text x="64" y="288" font-size="12.5" fill="#a33f2e">const_cast：摘 const——合法场景极少</text>
    <text x="64" y="310" font-size="12" fill="#8a8578">（const 对象本来就不许改；今天只演示不写）</text>
    <text x="64" y="344" font-size="12.5" fill="#6b675e">reinterpret_cast：比特级重解释——</text>
    <text x="64" y="366" font-size="12.5" fill="#6b675e">进阶阶段再碰（本周不涉及）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">组合 vs 继承：最终对表</text>
    <text x="572" y="180" font-size="12.5" fill="#3b3a36">继承（is-a）：Senior 是 Programmer</text>
    <text x="572" y="202" font-size="12" fill="#6b675e">＋复用强（code/debug 白得）</text>
    <text x="572" y="222" font-size="12" fill="#a33f2e">－绑死血缘（改基类牵全身）</text>
    <text x="572" y="254" font-size="12.5" fill="#3b3a36">组合（has-a）：Senior 有导师能力</text>
    <text x="572" y="276" font-size="12" fill="#6b675e">＋按需拼装（能力可增可减）</text>
    <text x="572" y="296" font-size="12" fill="#a33f2e">－转发样板（每个能力写一遍）</text>
    <text x="572" y="330" font-size="12.5" fill="#45703a">判断法：能说"X 是一个 Y"且稳定 → 继承</text>
    <text x="572" y="352" font-size="12.5" fill="#45703a">　　　　否则 → 组合（默认首选）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">dynamic_cast 的使用铁则</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">结果必须判空（if (Dog* d = dynamic_cast&lt;Dog*&gt;(p)) 一举两得）；频繁 dynamic_cast = 设计有味道（该多态的地方没用多态）</text>
    <text x="70" y="492" font-size="12.5" fill="#6b675e">（要求基类有多态——至少一个虚函数；否则编译错误）</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 43~46 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 47（今天）</text>
    <circle cx="660" cy="514" r="5" fill="#e0955f"/>
    <text x="660" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 48 项目日</text>
    <circle cx="850" cy="514" r="5" fill="#5b8db8"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">第 9 周 拷贝控制</text>
  </g>
</svg>
