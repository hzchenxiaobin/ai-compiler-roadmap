<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">倍增的摊还魔法与两种策略的阶梯图</text>
    <path d="M 290,58 Q 480,52 670,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,320 Q 470,314 44,319 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 210)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">push 100 个的扩容阶梯（实测）</text>
    <rect x="80" y="146" width="80" height="26" fill="#d8ecce" stroke="#7aa663" stroke-width="1.6"/>
    <text x="120" y="164" font-size="9" fill="#45703a">4</text>
    <rect x="165" y="146" width="100" height="26" fill="#d8ecce" stroke="#7aa663" stroke-width="1.6"/>
    <text x="215" y="164" font-size="9" fill="#45703a">8</text>
    <rect x="270" y="146" width="130" height="26" fill="#d8ecce" stroke="#7aa663" stroke-width="1.6"/>
    <text x="335" y="164" font-size="9" fill="#45703a">16</text>
    <rect x="405" y="146" width="160" height="26" fill="#d8ecce" stroke="#7aa663" stroke-width="1.6"/>
    <text x="485" y="164" font-size="9" fill="#45703a">32</text>
    <rect x="570" y="146" width="180" height="26" fill="#d8ecce" stroke="#7aa663" stroke-width="1.6"/>
    <text x="660" y="164" font-size="9" fill="#45703a">64</text>
    <rect x="755" y="146" width="130" height="26" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="820" y="164" font-size="9" fill="#9c5a22">128</text>
    <text x="472" y="200" font-size="11.5" fill="#3b3a36">每级搬运 = 旧容量的全部元素（4→8 搬 4 个、8→16 搬 8 个…）</text>
    <text x="472" y="228" font-size="12" fill="#45703a">总搬运 = 4+8+16+32+64 = 124 ＜ 100（N 个 push！）</text>
    <text x="472" y="254" font-size="12" fill="#6b675e">摊还分析：偶发的"大搬迁"被平常的"廉价 push"摊平——</text>
    <text x="472" y="276" font-size="12" fill="#6b675e">　平均每次 push 只花 O(1)（均摊成本）</text>
    <text x="472" y="304" font-size="11" fill="#8a8578">（128 格只住 100——浪费 28 格是买"不频繁搬家"的价）</text>

    <path d="M 40,344 Q 280,338 520,344 Q 524,460 520,576 Q 280,582 42,576 Q 36,460 40,344 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 460)"/>
    <text x="280" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">对比：精确加一的阶梯</text>
    <text x="64" y="408" font-size="12.5" fill="#3b3a36">每次满了只多要 1 间：</text>
    <text x="64" y="432" font-size="12.5" fill="#a33f2e">　4→5→6→…→100（96 次搬家）</text>
    <text x="64" y="460" font-size="12.5" fill="#a33f2e">　总搬运 1+2+…+99 = 4950</text>
    <text x="64" y="492" font-size="12.5" fill="#6b675e">内存零浪费 vs 搬到怀疑人生——</text>
    <text x="64" y="514" font-size="12.5" fill="#6b675e">　39.9 倍的搬运差距</text>
    <text x="64" y="548" font-size="12" fill="#8a8578">（工程取折中：倍增——浪费可控、成本摊平）</text>

    <path d="M 550,344 Q 730,338 905,344 Q 908,460 905,576 Q 730,582 552,576 Q 547,460 550,344 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 460)"/>
    <text x="727" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">std::vector 同款设计</text>
    <text x="572" y="408" font-size="12.5" fill="#3b3a36">今天的 IntArray 就是手写 vector：</text>
    <text x="572" y="430" font-size="12" fill="#8a8578">push_back / reserve / size / capacity</text>
    <text x="572" y="458" font-size="12.5" fill="#45703a">第 11 周用真 vector 时对照回忆——</text>
    <text x="572" y="480" font-size="12.5" fill="#45703a">　行为完全同款（倍增+摊还）</text>
    <text x="572" y="512" font-size="12" fill="#8a8578">（v1→v2 的升级路径也是 vector 的</text>
    <text x="572" y="532" font-size="12" fill="#8a8578">　历史路线——先能用再优化）</text>
  </g>
</svg>
