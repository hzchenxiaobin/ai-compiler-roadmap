<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">倍增阶梯、reserve 对照与边界复验战报</text>
    <path d="M 320,58 Q 480,52 640,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21；-Wall 零警告）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,480 Q 248,485 26,480 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 291)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出</text>
    <rect x="38" y="146" width="420" height="320" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./iv</text>
    <text x="54" y="198" font-size="12" fill="#9fb8a8">== 倍增：逐个 push 100 ==</text>
    <text x="54" y="220" font-size="11.5" fill="#cfe8c6">[扩容 1] 4 → 8</text>
    <text x="54" y="236" font-size="11.5" fill="#cfe8c6">[扩容 2] 8 → 16</text>
    <text x="54" y="252" font-size="11.5" fill="#cfe8c6">…（共 5 级阶梯）</text>
    <text x="54" y="268" font-size="11.5" fill="#cfe8c6">[扩容 5] 64 → 128</text>
    <text x="54" y="290" font-size="11.5" fill="#f0c9c0">size=100，capacity=128</text>
    <text x="54" y="308" font-size="11.5" fill="#9fb8a8">（倍增 5 次连登）</text>
    <text x="54" y="338" font-size="12" fill="#9fb8a8">== reserve：一次到位 ==</text>
    <text x="54" y="360" font-size="11.5" fill="#cfe8c6">[reserve 1] 直接扩到 128</text>
    <text x="54" y="380" font-size="11.5" fill="#9fb8a8">（push 100 个全程无扩容日志！）</text>
    <text x="54" y="410" font-size="12" fill="#9fb8a8">== size/capacity 边界 ==</text>
    <text x="54" y="432" font-size="11.5" fill="#cfe8c6">push 1 个：size=1，capacity=4</text>
    <text x="54" y="454" font-size="11.5" fill="#f0c9c0">at(1)：[越界] 1 &gt;= 1（只认 size）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,480 Q 712,485 490,480 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 291)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">v1 → v2 的升级清单</text>
    <rect x="502" y="146" width="420" height="320" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">v1（Day 42）：</text>
    <text x="514" y="196" font-size="11.5" fill="#cfe8c6">构造/析构/push_back/size/at</text>
    <text x="514" y="216" font-size="11" fill="#9fb8a8">（倍增已埋——只差讲透）</text>
    <text x="514" y="248" font-size="12" fill="#9fb8a8">v2（今天）新增：</text>
    <text x="514" y="270" font-size="11.5" fill="#cfe8c6">①reserve（先手扩容）</text>
    <text x="514" y="290" font-size="11.5" fill="#cfe8c6">②capacity() 查询</text>
    <text x="514" y="310" font-size="11.5" fill="#cfe8c6">③扩容账本（grow_count 计数）</text>
    <text x="514" y="344" font-size="12" fill="#9fb8a8">认知升级：</text>
    <text x="514" y="366" font-size="11.5" fill="#cfe8c6">摊还分析（O(N²)→O(N) 的魔法）</text>
    <text x="514" y="386" font-size="11.5" fill="#cfe8c6">39.9 倍的量化对比</text>
    <text x="514" y="420" font-size="12" fill="#9fb8a8">明天自测日的素材：</text>
    <text x="514" y="442" font-size="11.5" fill="#cfe8c6">本周全部 + ASan 扫旧项目</text>

    <path d="M 24,506 Q 470,500 905,507 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 543)"/>
    <text x="46" y="532" font-size="15.5" font-weight="bold" fill="#9c5a22">阶段二收官倒计时</text>
    <text x="46" y="560" font-size="12.5" fill="#3b3a36">明天 Day 48 自测日：白板讲清"栈和堆的区别"+ ASan 扫描自己全部项目零报错——八周成果的期末验收</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 48 自测日——白板讲栈堆 + ASan 全项目扫描（阶段二毕业验收）</text>
  </g>
</svg>
