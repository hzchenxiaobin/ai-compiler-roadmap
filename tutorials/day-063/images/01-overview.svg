<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 63 全貌：容器族运算符——[] () -&gt;</text>
    <path d="M 320,60 Q 480,52 640,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">数组感（[]）、函数感（()）、指针感（-&gt;）——三个运算符让对象分别像三种老朋友</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">[]：数组感</text>
    <rect x="64" y="164" width="440" height="56" fill="#33413a"/>
    <text x="284" y="188" font-size="11.5" fill="#cfe8c6">int&amp; operator[](std::size_t i)　　　←可写</text>
    <text x="284" y="208" font-size="11.5" fill="#9fb8a8">const int&amp; operator[](size_t) const　←只读</text>
    <text x="64" y="248" font-size="12.5" fill="#3b3a36">读写双版：非 const 版返回可改引用、</text>
    <text x="64" y="268" font-size="12.5" fill="#3b3a36">　const 版让 const 对象也能下标</text>
    <text x="64" y="300" font-size="12" fill="#8a8578">（Day 66 MyString v2 将复用双版）</text>
    <text x="64" y="330" font-size="12.5" fill="#6b675e">实测：box[0]=10、box[4]=50 写入；</text>
    <text x="64" y="350" font-size="12.5" fill="#6b675e">　循环读全 5 格（零初始化 { }）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">()：函数感（仿函数）</text>
    <rect x="572" y="164" width="320" height="56" fill="#33413a"/>
    <text x="656" y="188" font-size="11.5" fill="#cfe8c6">double operator()(double x) const {</text>
    <text x="656" y="208" font-size="11.5" fill="#9fb8a8">　return x * factor_;</text>
    <text x="727" y="248" font-size="12.5" fill="#3b3a36">对象携带状态（factor_）+</text>
    <text x="727" y="268" font-size="12.5" fill="#3b3a36">　像函数一样被调用</text>
    <text x="727" y="300" font-size="12" fill="#45703a">实测：triple(7)=21、(2.5)=7.5</text>
    <text x="727" y="332" font-size="12.5" fill="#6b675e">普通函数不带状态；仿函数带——</text>
    <text x="727" y="352" font-size="12.5" fill="#6b675e">　STL 算法的钥匙（第 16 周预告）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#fdf6dd" stroke="#d9b23a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d1a">-&gt; 和 *：指针感（智能指针的底层）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">T* operator-&gt;() 把成员访问转发给内部指针；T&amp; operator*() 解引用——cfg-&gt;port() 和 (*cfg).port() 实测等价</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（unique_ptr/shared_ptr 的日常用法就是这两个运算符——Day 71 正课）</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 61~62 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 63（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 64~65</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 66 项目日</text>
  </g>
</svg>
