<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 104 全貌：统一初始化 {}——一种语法通吃五种场景</text>
    <path d="M 290,60 Q 480,52 670,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"观察窄化转换报错"——{} 的最大福利：丢信息的转换直接编译错（= 的静默截断对照）；外加 vector 的 ()/{ } 之坑</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">{} 的五种用法（实测）</text>
    <text x="64" y="180" font-size="12" fill="#45703a">int a{42};——基本类型</text>
    <text x="64" y="202" font-size="12" fill="#45703a">int arr[]{1,2,3};——数组</text>
    <text x="64" y="224" font-size="12" fill="#45703a">Point p{10,20};——类（调构造）</text>
    <text x="64" y="246" font-size="12" fill="#45703a">vector&lt;int&gt; v{1,2,3,4};——容器</text>
    <text x="64" y="268" font-size="12" fill="#45703a">Point q{};——默认构造（防歧义）</text>
    <text x="64" y="306" font-size="12.5" fill="#6b675e">"统一"的含义：之前 = / () / {} </text>
    <text x="64" y="326" font-size="12.5" fill="#6b675e">　三种初始化各管一段——现在一种通吃</text>
    <text x="64" y="366" font-size="11.5" fill="#8a8578">（附赠：防 most vexing parse——</text>
    <text x="64" y="386" font-size="11.5" fill="#8a8578">　Point q() 会被当函数声明！）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">计划指定：窄化报错对照</text>
    <rect x="572" y="164" width="320" height="80" fill="#33413a"/>
    <text x="732" y="190" font-size="11" fill="#f0c9c0">int x1 = src;（= 版）</text>
    <text x="732" y="212" font-size="11" fill="#9fb8a8">→ 静默截断成 3（不吭声）</text>
    <rect x="572" y="252" width="320" height="80" fill="#33413a"/>
    <text x="732" y="278" font-size="11" fill="#f0c9c0">int x2{3.14};（{} 版）</text>
    <text x="732" y="300" font-size="11" fill="#ffd7d0">→ error: cannot be narrowed!</text>
    <text x="572" y="356" font-size="12" fill="#45703a">（{} 的红线：丢信息的转换直接拒收）</text>
    <text x="572" y="378" font-size="11.5" fill="#8a8578">（double→int、float→int 等丢信息的中招；int{42} 安全）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">vector 的 ()/{} 之坑（实测）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">vector&lt;int&gt; v1(3) → size=3（三个 0——"大小"构造）｜v2{3} → size=1（一个 3——列表构造）——一个字符两种语义</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（{} 优先匹配 initializer_list 构造——vector 的特殊行为要记）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 103 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 104（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 105~107</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 108 项目日</text>
  </g>
</svg>
