<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">delete 的完整拆解图</text>
    <path d="M 380,58 Q 480,52 580,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,300 Q 470,294 44,299 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 200)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">delete p; 时编译器做了什么（p 是 Base*）</text>
    <rect x="80" y="146" width="380" height="60" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.2"/>
    <text x="270" y="170" text-anchor="middle" font-size="11.5" fill="#a33f2e">非虚析构：调 Base::~Base() 就完事</text>
    <text x="270" y="192" text-anchor="middle" font-size="11" fill="#8a8578">（静态绑定——看指针类型）</text>
    <rect x="490" y="146" width="380" height="60" fill="#eef5e8" stroke="#7aa663" stroke-width="2.2"/>
    <text x="680" y="170" text-anchor="middle" font-size="11.5" fill="#45703a">虚析构：查虚表找 ~VDerived() → 逆序链</text>
    <text x="680" y="192" text-anchor="middle" font-size="11" fill="#8a8578">（动态绑定——看实际对象）</text>
    <text x="472" y="240" text-anchor="middle" font-size="12.5" fill="#3b3a36">——规则和 Day 44 的虚函数完全一致：析构也是一种"经基类指针调用的函数"</text>
    <text x="472" y="268" text-anchor="middle" font-size="12.5" fill="#6b675e">（漏标 virtual 的后果不是崩溃而是静默泄漏——更隐蔽更危险）</text>

    <path d="M 40,324 Q 470,318 905,325 L 901,576 Q 470,570 44,575 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(0.2 472 450)"/>
    <text x="472" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">泄漏的账本（leak_demo 实测）</text>
    <rect x="150" y="370" width="660" height="110" fill="#33413a"/>
    <text x="480" y="398" text-anchor="middle" font-size="12" fill="#cfe8c6">[Buffer 构造] → [BigBuffer 构造] 拿了 1000 字节</text>
    <text x="480" y="422" text-anchor="middle" font-size="12" fill="#f0c9c0">delete p; → [Buffer 析构]　← 1000 字节没人释放！</text>
    <text x="480" y="446" font-size="12" text-anchor="middle" fill="#9fb8a8">（[BigBuffer 析构] 缺席——delete[] data_ 永远不会执行）</text>
    <text x="472" y="510" text-anchor="middle" font-size="12.5" fill="#3b3a36">诚实记录：macOS 的 ASan 不支持 LeakSanitizer（detect_leaks 不可用）——</text>
    <text x="472" y="534" text-anchor="middle" font-size="12.5" fill="#6b675e">放大 100 倍的版本（100 次×1000 字节）在本机也未被报告——这正是"静默泄漏"的可怕之处</text>
    <text x="472" y="558" text-anchor="middle" font-size="12.5" fill="#6b675e">（Linux 上开 -fsanitize=address 能抓到；macOS 靠日志观察析构缺席——今天的两套日志就是证据）</text>
  </g>
</svg>
