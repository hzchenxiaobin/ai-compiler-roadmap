<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">范围 for 的展开原理与三种元素形态</text>
    <path d="M 300,58 Q 480,52 660,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,320 Q 470,314 44,319 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 210)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">for (int x : v) 背后是什么</text>
    <rect x="90" y="146" width="780" height="150" fill="#33413a"/>
    <text x="480" y="176" text-anchor="middle" font-size="12" fill="#cfe8c6">for (int x : v) { cout &lt;&lt; x; }</text>
    <text x="480" y="202" text-anchor="middle" font-size="10.5" fill="#9fb8a8">≈ 编译器展开为：</text>
    <text x="480" y="226" text-anchor="middle" font-size="11" fill="#9fb8a8">for (auto it = v.begin(); it != v.end(); ++it) {</text>
    <text x="480" y="248" text-anchor="middle" font-size="11" fill="#cfe8c6">　int x = *it;　　　　　　← 逐元素拷贝</text>
    <text x="480" y="270" text-anchor="middle" font-size="11" fill="#9fb8a8">　cout &lt;&lt; x; }</text>
    <text x="480" y="290" text-anchor="middle" font-size="12" fill="#9fb8a8">（范围 for = 迭代器循环的语法糖——语义没变、只是不用手写三件套）</text>

    <path d="M 40,344 Q 280,338 520,344 Q 524,460 520,576 Q 280,582 42,576 Q 36,460 40,344 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 460)"/>
    <text x="280" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">三种元素形态（选对很关键）</text>
    <rect x="64" y="392" width="430" height="52" fill="#fffdf7" stroke="#7aa663" stroke-width="2"/>
    <text x="279" y="414" text-anchor="middle" font-size="11" fill="#45703a">for (int x : v)　　→ 拷贝（只读小类型）</text>
    <text x="279" y="432" text-anchor="middle" font-size="10" fill="#8a8578">（实测：遍历后原值不变）</text>
    <rect x="64" y="452" width="430" height="52" fill="#fffdf7" stroke="#e0955f" stroke-width="2"/>
    <text x="279" y="474" text-anchor="middle" font-size="11" fill="#9c5a22">for (auto&amp; x : v)　→ 引用（要改元素！）</text>
    <text x="279" y="492" text-anchor="middle" font-size="10" fill="#8a8578">（实测：double_all 翻倍成功 ✔）</text>
    <rect x="64" y="512" width="430" height="52" fill="#fffdf7" stroke="#5b8db8" stroke-width="2"/>
    <text x="279" y="534" text-anchor="middle" font-size="11" fill="#2c5a82">for (const auto&amp; x : v) → 只读省拷贝</text>
    <text x="279" y="552" text-anchor="middle" font-size="10" fill="#8a8578">（string/vector 等大对象的只读标配）</text>

    <path d="M 550,344 Q 730,338 905,344 Q 908,460 905,576 Q 730,582 552,576 Q 547,460 550,344 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 460)"/>
    <text x="727" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">auto 的边界（三条纪律）</text>
    <text x="572" y="410" font-size="12.5" fill="#3b3a36">①类型要能从右边推出来</text>
    <text x="572" y="432" font-size="12" fill="#8a8578">（auto x; 单独声明不行——没 initializer）</text>
    <text x="572" y="464" font-size="12.5" fill="#3b3a36">②可读性优先：类型显眼时手写</text>
    <text x="572" y="486" font-size="12" fill="#8a8578">（int/double 直接写；长迭代器才 auto）</text>
    <text x="572" y="518" font-size="12.5" fill="#3b3a36">③接口处少用（.h 里的签名要自说明）</text>
    <text x="572" y="540" font-size="12" fill="#8a8578">（实现里的局部变量是 auto 主场）</text>
  </g>
</svg>
