<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 46 全貌：auto 与范围 for——现代写法的减法</text>
    <path d="M 320,60 Q 480,52 640,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定练习：用新写法重写第 4 周旧代码——同样的遍历，旧版五行新版一行：少写的是类型，不变的是语义</text>

    <path d="M 40,116 Q 470,110 905,117 L 901,330 Q 470,324 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 223)"/>
    <text x="472" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">同一遍历的新旧对照（实测同输出）</text>
    <rect x="70" y="162" width="390" height="150" fill="#33413a"/>
    <text x="265" y="190" font-size="10.5" fill="#9fb8a8">旧（迭代器版，第 4 周写法）：</text>
    <text x="265" y="212" font-size="10.5" fill="#cfe8c6">for (std::vector&lt;int&gt;::</text>
    <text x="265" y="230" font-size="10.5" fill="#cfe8c6">　 const_iterator it = v.begin();</text>
    <text x="265" y="248" font-size="10.5" fill="#cfe8c6">　 it != v.end(); ++it)</text>
    <text x="265" y="270" font-size="10.5" fill="#cfe8c6">　 cout &lt;&lt; *it;</text>
    <text x="265" y="296" font-size="10" fill="#8a8578">（三行类型声明 + 解引用）</text>
    <rect x="490" y="162" width="390" height="150" fill="#33413a"/>
    <text x="685" y="190" font-size="10.5" fill="#9fb8a8">新（范围 for，今天）：</text>
    <text x="685" y="216" font-size="11" fill="#cfe8c6">for (int x : v)</text>
    <text x="685" y="236" font-size="11" fill="#cfe8c6">　cout &lt;&lt; x;</text>
    <text x="685" y="270" font-size="10" fill="#8a8578">（一行说清"每个元素"）</text>
    <text x="685" y="296" font-size="10" fill="#45703a">（实测输出完全相同）</text>
    <text x="472" y="340" font-size="0" fill="none">.</text>

    <path d="M 40,354 Q 470,348 905,355 L 901,500 Q 470,494 44,499 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.2 472 427)"/>
    <text x="472" y="384" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">auto 的判断规则（编译器替你推）</text>
    <text x="70" y="416" font-size="13" fill="#3b3a36">auto x = expr; → 用 expr 的类型初始化 x（实测：42→int、3.14→double、string→24 字节对象）</text>
    <text x="70" y="444" font-size="13" fill="#3b3a36">auto&amp; x = expr; → 引用（可写通道——Day 63 的写入通道）；const auto&amp; → 只读省拷贝（参数标配）</text>
    <text x="70" y="472" font-size="12.5" fill="#6b675e">（auto 不是弱类型——类型在编译期定死，只是"让编译器写"）</text>
    <text x="70" y="494" font-size="12.5" fill="#6b675e">（拿不准类型时可作探针：auto x = expr; 看 sizeof——今天实验同款）</text>

    <path d="M 60,514 Q 480,508 905,515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 37~45 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 46（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#5b8db8"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 47 v2</text>
    <circle cx="850" cy="514" r="5" fill="#e0955f"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 48 自测日</text>
  </g>
</svg>
