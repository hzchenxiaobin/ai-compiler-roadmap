<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">insert 判重的绑定拆包与前缀查找的定位图</text>
    <path d="M 240,58 Q 480,52 720,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,340 Q 470,334 44,329 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 220)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">add 的判重流程（Day 106 绑定的实战）</text>
    <rect x="150" y="148" width="660" height="60" fill="#33413a"/>
    <text x="480" y="174" font-size="11" fill="#9fb8a8">bool add(name, phone) {</text>
    <text x="480" y="196" font-size="11" fill="#cfe8c6">　auto [it, inserted] = by_name_.insert({name, phone});　return inserted;</text>
    <rect x="180" y="222" width="280" height="56" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="320" y="246" font-size="10.5" fill="#45703a">新名字：inserted = true ✔</text>
    <text x="320" y="264" font-size="9.5" fill="#8a8578">（直接插入）</text>
    <rect x="500" y="222" width="280" height="56" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2"/>
    <text x="640" y="246" font-size="10.5" fill="#a33f2e">重名：inserted = false ✘</text>
    <text x="640" y="264" font-size="9.5" fill="#8a8578">（拒绝——不需要 count 预查！）</text>
    <text x="472" y="310" font-size="11.5" fill="#8a8578">（实测：四条新名全 true、再添加小明 false——一步判重）</text>

    <path d="M 40,364 Q 280,358 520,364 Q 524,480 520,576 Q 280,582 42,576 Q 36,480 40,364 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 470)"/>
    <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">前缀查找的定位</text>
    <rect x="64" y="412" width="430" height="140" fill="#33413a"/>
    <text x="279" y="438" font-size="10.5" fill="#9fb8a8">排序视图：小刚 小明 小红 小鹏</text>
    <text x="279" y="462" font-size="10.5" fill="#cfe8c6">lower_bound("小") → 小刚</text>
    <text x="279" y="482" font-size="10.5" fill="#cfe8c6">　（第一个 >= "小" 的——前缀起点）</text>
    <text x="279" y="508" font-size="10" fill="#8a8578">（compare(0, len, prefix) 验前缀匹配）</text>

    <path d="M 550,364 Q 730,358 905,364 Q 908,480 905,576 Q 730,582 552,576 Q 547,480 550,364 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 470)"/>
    <text x="727" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">前缀删除的接力</text>
    <rect x="572" y="412" width="320" height="140" fill="#33413a"/>
    <text x="732" y="438" font-size="10.5" fill="#9fb8a8">while (前缀匹配) {</text>
    <text x="732" y="460" font-size="10.5" fill="#cfe8c6">　first = erase(first);　// Day 81 接力</text>
    <text x="732" y="482" font-size="10.5" fill="#9fb8a8">}</text>
    <text x="732" y="508" font-size="10" fill="#8a8578">（erase 返回下一个有效——不跳不越界）</text>
    <text x="732" y="532" font-size="10" fill="#cfe8c6">实测：删 小鹏* → 1 条 ✔</text>
  </g>
</svg>
