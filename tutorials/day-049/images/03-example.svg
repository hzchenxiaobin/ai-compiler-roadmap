<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">类初体验、this 三用法与执法现场</text>
    <path d="M 340,58 Q 480,52 620,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,220 470,340 Q 248,345 26,340 Q 20,220 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 221)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">实验 1：Rectangle 初体验</text>
    <rect x="38" y="146" width="420" height="180" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./rect</text>
    <text x="54" y="196" font-size="12.5" fill="#cfe8c6">3×4 矩形：面积 = 12，周长 = 14</text>
    <text x="54" y="218" font-size="12.5" fill="#cfe8c6">2×5 矩形：面积 = 10，周长 = 14</text>
    <text x="54" y="246" font-size="12" fill="#9fb8a8">r.set_size → r.area()：数据和它的</text>
    <text x="54" y="266" font-size="12" fill="#9fb8a8">算法住进了同一个类型——这就是类</text>
    <text x="54" y="294" font-size="12" fill="#9fb8a8">对比：第 5 周是 struct 数据 + 全局函数</text>
    <text x="54" y="314" font-size="12" fill="#9fb8a8">分离两处；今天它们合租一室</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,220 934,340 Q 712,345 490,340 Q 484,220 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 221)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">实验 2：this 三用法</text>
    <rect x="502" y="146" width="420" height="180" rx="6" fill="#33413a"/>
    <text x="514" y="170" font-size="11.5" fill="#9fb8a8">$ ./td</text>
    <text x="514" y="190" font-size="12.5" fill="#cfe8c6">我是对象 #1，this = 0x16b43ed78</text>
    <text x="514" y="210" font-size="12.5" fill="#cfe8c6">我是对象 #2，this = 0x16b43ed74</text>
    <text x="514" y="232" font-size="12.5" fill="#cfe8c6">a 和 a 是同一个对象吗？是</text>
    <text x="514" y="252" font-size="12.5" fill="#cfe8c6">a 和 b 是同一个对象吗？否</text>
    <text x="514" y="276" font-size="12.5" fill="#f0c9c0">a.scale(10).scale(3) 后 id = 30</text>
    <text x="514" y="298" font-size="12" fill="#9fb8a8">两对象地址只差 4；同一份函数码</text>
    <text x="514" y="316" font-size="12" fill="#9fb8a8">靠 this 区分"在算谁的面积"</text>

    <path d="M 24,366 Q 248,360 470,366 Q 474,470 470,570 Q 248,575 26,570 Q 20,470 24,366 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="3" transform="rotate(-0.3 247 468)"/>
    <text x="46" y="394" font-size="15.5" font-weight="bold" fill="#a33f2e">实验 3：private 执法</text>
    <rect x="38" y="408" width="420" height="150" rx="6" fill="#33413a"/>
    <text x="54" y="432" font-size="11.5" fill="#9fb8a8">$ ./ad（不变量保护）</text>
    <text x="54" y="454" font-size="12.5" fill="#cfe8c6">初始面积 = 12</text>
    <text x="54" y="476" font-size="12.5" fill="#cfe8c6">set_size(-1, 5) 返回 失败，面积仍是 12</text>
    <text x="54" y="504" font-size="11.5" fill="#9fb8a8">私访 r.width_ →</text>
    <text x="54" y="524" font-size="11" fill="#ffd7d0">error: 'width_' is a private member</text>
    <text x="54" y="542" font-size="11" fill="#ffd7d0">of 'SafeRect'（编译期拦截）</text>

    <path d="M 488,366 Q 712,360 934,366 Q 938,470 934,570 Q 712,575 490,570 Q 484,470 488,366 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 711 468)"/>
    <text x="510" y="394" font-size="15.5" font-weight="bold" fill="#55606e">搬家预告（明天动工）</text>
    <text x="510" y="426" font-size="12.5" fill="#3b3a36">今天的 Rectangle 有个小尴尬：</text>
    <text x="510" y="448" font-size="12.5" fill="#6b675e">Rectangle r; 之后 width_/height_ 是垃圾值——</text>
    <text x="510" y="470" font-size="12.5" fill="#6b675e">忘了 set_size 就 area() 是 UB</text>
    <text x="510" y="502" font-size="12.5" fill="#45703a">明天：构造函数——对象出生那一刻</text>
    <text x="510" y="524" font-size="12.5" fill="#45703a">就初始化，忘不了也错不了</text>
    <text x="510" y="556" font-size="12" fill="#8a8578">（Date 类的多种构造方式是明天练习）</text>
  </g>
</svg>
