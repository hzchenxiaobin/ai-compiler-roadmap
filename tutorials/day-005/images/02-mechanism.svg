<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">if 链像瀑布：从上往下试，命中即跳离</text>
    <path d="M 290,58 Q 480,52 670,59" fill="none" stroke="#5b8db8" stroke-width="3"/>

    <path d="M 60,110 L 300,180 L 60,250 Z" fill="#fdf6dd" stroke="#d9b23a" stroke-width="3" transform="rotate(-1 180 180)"/>
    <text x="118" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1a">score ≥ 90 ?</text>
    <text x="118" y="196" text-anchor="middle" font-size="12" fill="#8a6d1a">（95 → 真）</text>
    <path d="M 302,178 Q 312,174 322,178" fill="none" stroke="#7aa663" stroke-width="2.6"/>
    <path d="M 314,170 Q 323,176 315,186" fill="none" stroke="#7aa663" stroke-width="2.6"/>
    <text x="300" y="164" font-size="12" fill="#45703a">真</text>

    <path d="M 330,150 Q 425,144 520,150 Q 523,187 520,224 Q 425,230 332,224 Q 327,187 330,150 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.5"/>
    <text x="425" y="178" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#45703a">cout 等级 A</text>
    <text x="425" y="204" text-anchor="middle" font-size="12" fill="#6b675e">执行完直接跳到链尾</text>

    <path d="M 130,252 Q 150,278 162,314" fill="none" stroke="#c96a5a" stroke-width="2.4"/>
    <path d="M 155,309 Q 164,314 171,305" fill="none" stroke="#c96a5a" stroke-width="2.4"/>
    <text x="96" y="278" font-size="12" fill="#a33f2e">假↓</text>

    <path d="M 60,300 L 300,370 L 60,440 Z" fill="#fdf6dd" stroke="#d9b23a" stroke-width="3" transform="rotate(-1 180 370)"/>
    <text x="118" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1a">score ≥ 80 ?</text>
    <text x="118" y="386" text-anchor="middle" font-size="12" fill="#8a6d1a">（75 → 假）</text>

    <path d="M 130,442 Q 148,466 160,496" fill="none" stroke="#c96a5a" stroke-width="2.4"/>
    <path d="M 153,491 Q 162,496 169,487" fill="none" stroke="#c96a5a" stroke-width="2.4"/>
    <text x="96" y="464" font-size="12" fill="#a33f2e">假↓</text>

    <path d="M 60,486 L 300,530 L 60,574 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(-0.8 180 530)"/>
    <text x="116" y="526" text-anchor="middle" font-size="13" font-weight="bold" fill="#55606e">score ≥ 70 ?</text>
    <text x="116" y="546" text-anchor="middle" font-size="12" fill="#55606e">（75 → 真）</text>

    <path d="M 302,528 Q 312,524 322,528" fill="none" stroke="#7aa663" stroke-width="2.6"/>
    <path d="M 314,520 Q 323,526 315,536" fill="none" stroke="#7aa663" stroke-width="2.6"/>
    <text x="300" y="514" font-size="12" fill="#45703a">真</text>
    <path d="M 330,494 Q 425,488 520,494 Q 523,531 520,568 Q 425,574 332,568 Q 327,531 330,494 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.5"/>
    <text x="425" y="522" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#45703a">cout 等级 C</text>
    <text x="425" y="546" text-anchor="middle" font-size="12" fill="#6b675e">（else 继续往下都同理）</text>

    <path d="M 540,110 Q 740,104 930,110 Q 934,300 930,460 Q 740,466 544,460 Q 538,300 540,110 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 735 285)"/>
    <text x="735" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c5a82">比较与逻辑：结果是 bool</text>
    <text x="560" y="178" font-size="13.5" fill="#3b3a36">(3 &gt; 2)　→ 1　成立</text>
    <text x="560" y="204" font-size="13.5" fill="#3b3a36">(3 == 2)　→ 0　不成立</text>
    <text x="560" y="230" font-size="13.5" fill="#3b3a36">打印 bool 显示 1 / 0（Day 2 见过）</text>

    <path d="M 560,254 Q 735,248 910,255 L 907,388 Q 735,382 563,387 Z" fill="#fffdf7" stroke="#9db8cf" stroke-width="2" transform="rotate(-0.2 735 320)"/>
    <text x="576" y="282" font-size="13" font-weight="bold" fill="#2c5a82">&amp;&amp;（并且）：两边都真才是 1</text>
    <text x="576" y="306" font-size="12.5" fill="#3b3a36">today &gt;= 1 &amp;&amp; today &lt;= 6 → 1（工作日）</text>
    <text x="576" y="332" font-size="13" font-weight="bold" fill="#2c5a82">||（或者）：一边真就是 1</text>
    <text x="576" y="356" font-size="12.5" fill="#3b3a36">score &lt; 0 || score &gt; 100 → 越界拦截</text>
    <text x="576" y="380" font-size="13" font-weight="bold" fill="#2c5a82">！（取反）：1 变 0，0 变 1</text>

    <path d="M 560,410 Q 735,404 910,411 L 907,444 Q 735,438 563,443 Z" fill="#fdf6dd" stroke="#d9b23a" stroke-width="2" transform="rotate(0.2 735 426)"/>
    <text x="576" y="432" font-size="12.5" fill="#8a6d1a">短路求值：&amp;&amp; 左边为假时右边直接不算（效率+安全）</text>

    <text x="735" y="490" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5a82">switch 的地盘：按单点值分发</text>
    <text x="735" y="516" text-anchor="middle" font-size="12.5" fill="#6b675e">等级字母、菜单编号这类"一个个的值"</text>
    <text x="735" y="540" text-anchor="middle" font-size="12.5" fill="#6b675e">范围判断（≥90）请交给 if 链</text>
    <text x="735" y="572" text-anchor="middle" font-size="12.5" fill="#a33f2e">case 不写 break 会"漏到下一个"——今天的事故主角</text>
  </g>
</svg>
