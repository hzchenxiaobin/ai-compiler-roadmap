<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="552" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">Day 113 全貌：完美转发——怎么来的就怎么传</text>
    <path d="M 310,60 Q 480,52 650,61" fill="none" stroke="#5b8db8" stroke-width="3"/>
    <text x="480" y="84" text-anchor="middle" font-size="16" fill="#8a8578">计划指定"emplace_back 简化版"——万能引用（T&amp;&amp;+推导）收两种来路、std::forward 原样转出：中间层不丢类别</text>

    <path d="M 40,116 Q 280,110 520,116 Q 524,250 520,384 Q 280,390 42,384 Q 36,250 40,116 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.3 280 250)"/>
    <text x="280" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c5a82">万能引用与引用折叠</text>
    <text x="64" y="180" font-size="12.5" fill="#45703a">T&amp;&amp; 在模板推导语境 = 万能引用</text>
    <text x="64" y="202" font-size="12" fill="#8a8578">（左值右值都收——不是普通右值引用！）</text>
    <rect x="64" y="226" width="440" height="90" fill="#33413a"/>
    <text x="284" y="252" font-size="11" fill="#9fb8a8">左值来：T=string&amp; → string&amp; &amp;&amp; 折叠 → string&amp;</text>
    <text x="284" y="274" font-size="11" fill="#cfe8c8">右值来：T=string → string&amp;&amp; 保持</text>
    <text x="284" y="296" font-size="10" fill="#8a8578">（折叠口诀：有 &amp; 就 &amp;——&amp;&amp;+&amp;&amp; 才 &amp;&amp;）</text>
    <text x="64" y="344" font-size="12" fill="#8a8578">（auto&amp;&amp; 同理——万能引用的两个形态）</text>

    <path d="M 550,116 Q 740,110 905,116 Q 908,250 905,384 Q 740,390 552,384 Q 547,250 550,116 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(0.3 727 250)"/>
    <text x="727" y="146" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#45703a">forward vs 不转发</text>
    <text x="572" y="180" font-size="12" fill="#a33f2e">不转发：process(arg)——arg 有名字</text>
    <text x="572" y="202" font-size="12" fill="#8a8578">（永远是左值——右值也走 &amp; 版 ✘）</text>
    <text x="572" y="232" font-size="12" fill="#45703a">forward：process(forward&lt;T&gt;(arg))</text>
    <text x="572" y="254" font-size="12" fill="#8a8578">（左值来传左值、右值来传右值 ✔）</text>
    <text x="572" y="290" font-size="11.5" fill="#6b675e">（move 是"变右值"；forward 是"保持"）</text>
    <text x="572" y="330" font-size="11.5" fill="#8a8578">（Day 110 named rvalue 坑的正式解法）</text>

    <path d="M 40,408 Q 470,402 905,409 L 901,500 Q 470,494 44,499 Z" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2.8" transform="rotate(-0.2 472 454)"/>
    <text x="472" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33f2e">emplace_back 的核心（计划指定实测）</text>
    <text x="70" y="468" font-size="13" fill="#3b3a36">emplace_back(左值) → const&amp; 构造（拷贝路径）｜emplace_back(move(x)) → &amp;&amp; 构造（移动路径！）——Day 92 vector::emplace_back 快的原理</text>
    <text x="70" y="490" font-size="12.5" fill="#6b675e">（容器收原料、转发给构造函数——参数原样直达）</text>

    <path d="M 60,514 Q 480,508 905 515" fill="none" stroke="#8a8578" stroke-width="2.6"/>
    <circle cx="250" cy="514" r="5" fill="#8a94a3"/>
    <text x="250" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 109~112 ✓</text>
    <circle cx="440" cy="514" r="11" fill="none" stroke="#c96a5a" stroke-width="2"/>
    <circle cx="440" cy="514" r="5" fill="#5b8db8"/>
    <text x="440" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#c96a5a">Day 113（今天）</text>
    <circle cx="650" cy="514" r="5" fill="#e0955f"/>
    <text x="650" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">Day 114 项目日</text>
    <circle cx="850" cy="514" r="5" fill="#5b8db8"/>
    <text x="850" y="534" text-anchor="middle" font-size="12" fill="#3b3a36">第 20 周 智能指针</text>
  </g>
</svg>
