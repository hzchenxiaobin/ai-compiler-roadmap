<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="652" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">万能收发、类别保持与 emplace 战报</text>
    <path d="M 340,58 Q 480,52 620,59" fill="none" stroke="#7aa663" stroke-width="3"/>
    <text x="480" y="82" text-anchor="middle" font-size="15.5" fill="#8a8578">以下输出全部来自本机真实运行（macOS arm64 + Apple clang 21 -std=c++17；-Wall 零警告 + ASan 零报错）</text>

    <path d="M 24,102 Q 248,97 470,102 Q 474,290 470,490 Q 248,495 26,490 Q 20,290 24,102 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="3" transform="rotate(-0.3 247 296)"/>
    <text x="46" y="132" font-size="16" font-weight="bold" fill="#45703a">完整输出</text>
    <rect x="38" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="54" y="172" font-size="11.5" fill="#9fb8a8">$ ./fe　（-Wall 零警告）</text>
    <text x="54" y="200" font-size="12" fill="#9fb8a8">== 万能引用 ==</text>
    <text x="54" y="222" font-size="11.5" fill="#cfe8c8">relay(s) → [process&amp;] 左值 ✔</text>
    <text x="54" y="242" font-size="11.5" fill="#f0c9c0">relay(临时) → [process&amp;&amp;] 右值 ✔</text>
    <text x="54" y="264" font-size="11" fill="#9fb8a8">（同一个 T&amp;&amp; 两种来路都收）</text>
    <text x="54" y="290" font-size="12" fill="#9fb8a8">== 不转发的坑 ==</text>
    <text x="54" y="312" font-size="11.5" fill="#f0c9c0">relay_wrong(右值)→也走 &amp; 版 ✘</text>
    <text x="54" y="332" font-size="11" fill="#9fb8a8">（类别丢失——Day 110 坑）</text>
    <text x="54" y="358" font-size="12" fill="#9fb8a8">== emplace_back 简化版（计划指定） ==</text>
    <text x="54" y="380" font-size="11.5" fill="#cfe8c8">emplace(左值) → const&amp; 拷贝路径 ✔</text>
    <text x="54" y="400" font-size="11.5" fill="#f0c9c0">emplace(move(x)) → &amp;&amp; 移动路径 ✔</text>
    <text x="54" y="422" font-size="11" fill="#9fb8a8">（Day 79 emplace 快的原理）</text>
    <text x="54" y="448" font-size="12" fill="#9fb8a8">== 折叠速查 ==</text>
    <text x="54" y="470" font-size="11" fill="#9fb8a8">（T&amp;&amp; 两种折叠 + auto&amp;&amp; 同理 ✔）</text>

    <path d="M 488,102 Q 712,97 934,102 Q 938,290 934,490 Q 712,495 490,490 Q 484,290 488,102 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="3" transform="rotate(0.3 711 296)"/>
    <text x="510" y="132" font-size="16" font-weight="bold" fill="#2c5a82">移动语义周收官</text>
    <rect x="502" y="146" width="420" height="330" rx="6" fill="#33413a"/>
    <text x="514" y="174" font-size="12" fill="#9fb8a8">第 19 周（移动语义）六天：</text>
    <text x="514" y="198" font-size="11.5" fill="#cfe8c8">109 值类别（认将亡者）</text>
    <text x="514" y="218" font-size="11.5" fill="#cfe8c8">110 move 本质（贴标签）</text>
    <text x="514" y="238" font-size="11.5" fill="#cfe8c8">111 移动构造（偷资源）</text>
    <text x="514" y="258" font-size="11.5" fill="#cfe8c8">112 五法则（完整清单）</text>
    <text x="514" y="278" font-size="11.5" fill="#cfe8c8">113 完美转发（今天）✔</text>
    <text x="514" y="298" font-size="11.5" fill="#cfe8c8">114 项目日：移动 vs 拷贝基准</text>
    <text x="514" y="330" font-size="12" fill="#9fb8a8">一周的知识链：</text>
    <text x="514" y="352" font-size="11.5" fill="#cfe8c8">认 → 标 → 偷 → 管 → 传</text>
    <text x="514" y="384" font-size="12.5" fill="#45703a">（113/144 = 78.5%）</text>
    <text x="514" y="414" font-size="11" fill="#9fb8a8">（Effective 同步：条款 23/24</text>
    <text x="514" y="432" font-size="11" fill="#9fb8a8">　——move/forward 与万能引用）</text>
    <text x="514" y="462" font-size="11" fill="#9fb8a8">（明天 114 项目日：&lt;chrono&gt; 计时</text>
    <text x="514" y="480" font-size="11" fill="#9fb8a8">　量化移动 vs 拷贝的毫秒差）</text>

    <path d="M 24,516 Q 470,510 905,517 L 901,580 Q 470,574 26,579 Z" fill="#fcefe4" stroke="#e0955f" stroke-width="2.8" transform="rotate(-0.2 464 548)"/>
    <text x="46" y="542" font-size="15.5" font-weight="bold" fill="#9c5a22">转发的哲学</text>
    <text x="46" y="568" font-size="12.5" fill="#3b3a36">中间层应该像玻璃——透光（参数原样过）不改变颜色（类别不变）；万能引用收进来、forward 送出去——这是泛型代码的礼貌</text>

    <path d="M 24,596 Q 470,590 905,597 L 901,650 Q 470,644 26,649 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.2 464 623)"/>
    <text x="480" y="627" text-anchor="middle" font-size="12.5" fill="#55606e">明天预告：Day 114（项目日）——移动 vs 拷贝性能基准测试（&lt;chrono&gt; 计时——计划指定收官）</text>
  </g>
</svg>
