<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Kaiti SC','KaiTi','Comic Sans MS',cursive">
  <rect x="4" y="4" width="952" height="612" rx="14" fill="#fffdf7"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="480" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#3b3a36">三种底层结构的内存图（结构决定能力）</text>
    <path d="M 280,58 Q 480,52 680,59" fill="none" stroke="#e0955f" stroke-width="3"/>

    <path d="M 40,100 Q 470,94 905,101 L 901,320 Q 470,314 44,319 Z" fill="#eaf2fa" stroke="#5b8db8" stroke-width="2.8" transform="rotate(-0.2 472 210)"/>
    <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5a82">vector：一整块（连续）</text>
    <rect x="100" y="146" width="560" height="40" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="380" y="171" font-size="11" fill="#45703a">[1][2][3][4][5][空位……]（一整块——data_+size+cap）</text>
    <text x="720" y="160" font-size="10.5" fill="#6b675e">随机访问：地址直接算</text>
    <text x="720" y="178" font-size="10.5" fill="#6b675e">（base + i×4）→ O(1)</text>
    <text x="472" y="216" font-size="11.5" fill="#a33f2e">中插 99：3 4 5 全部后移 → O(n)（搬全家）</text>
    <text x="472" y="244" font-size="11.5" fill="#45703a">缓存友好（连续——预取器爱吃）→ 遍历最快</text>
    <text x="472" y="272" font-size="11.5" fill="#6b675e">扩容搬家（Day 81 事故一的来源）</text>
    <text x="472" y="304" font-size="11" fill="#8a8578">（sizeof=24：三个机器字）</text>

    <path d="M 40,344 Q 280,338 520,344 Q 524,460 520,576 Q 280,582 42,576 Q 36,460 40,344 Z" fill="#eef5e8" stroke="#7aa663" stroke-width="2.8" transform="rotate(-0.3 280 460)"/>
    <text x="280" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#45703a">list：链表（节点独立）</text>
    <rect x="70" y="392" width="90" height="36" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="115" y="414" font-size="9.5" fill="#9c5a22">[1|→]</text>
    <rect x="170" y="392" width="90" height="36" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="215" y="414" font-size="9.5" fill="#9c5a22">[2|→]</text>
    <rect x="270" y="392" width="90" height="36" fill="#d8ecce" stroke="#7aa663" stroke-width="2.4"/>
    <text x="315" y="414" font-size="9.5" fill="#45703a">[99|→]</text>
    <rect x="370" y="392" width="90" height="36" fill="#f9d9b8" stroke="#e0955f" stroke-width="2"/>
    <text x="415" y="414" font-size="9.5" fill="#9c5a22">[3|→]</text>
    <path d="M 160,410 Q 165,410 168,410" fill="none" stroke="#45703a" stroke-width="2.4"/>
    <path d="M 260,410 Q 265,410 268,410" fill="none" stroke="#45703a" stroke-width="2.4"/>
    <text x="280" y="452" font-size="11" fill="#45703a">中插 99：改两个箭头 → O(1)！（实测同结果）</text>
    <text x="280" y="480" font-size="11" fill="#a33f2e">访问 [2]：只能从头走 → O(n)</text>
    <text x="280" y="508" font-size="11" fill="#6b675e">删除只摘节点——只有它失效（Day 81 的优势）</text>
    <text x="280" y="536" font-size="11" fill="#6b675e">每节点带前后两个指针——空间开销大</text>
    <text x="280" y="562" font-size="10.5" fill="#8a8578">（forward_list：去掉“←”只留“→”——省一半）</text>

    <path d="M 550,344 Q 730,338 905,344 Q 908,460 905,576 Q 730,582 552,576 Q 547,460 550,344 Z" fill="#f1f4f7" stroke="#8a94a3" stroke-width="2.8" transform="rotate(0.3 727 460)"/>
    <text x="727" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#55606e">deque：分段 + 中控</text>
    <rect x="572" y="396" width="120" height="30" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="632" y="415" font-size="9.5" fill="#45703a">段0：[1][2][3]</text>
    <rect x="712" y="396" width="120" height="30" fill="#d8ecce" stroke="#7aa663" stroke-width="2"/>
    <text x="772" y="415" font-size="9.5" fill="#45703a">段1：[4][5][…]</text>
    <rect x="642" y="440" width="120" height="26" fill="#f9e9e5" stroke="#c96a5a" stroke-width="2"/>
    <text x="702" y="458" font-size="9.5" fill="#a33f2e">中控表：[→段0][→段1]</text>
    <path d="M 632,428 Q 660,436 690,440" fill="none" stroke="#c96a5a" stroke-width="1.8"/>
    <path d="M 772,428 Q 745,436 715,440" fill="none" stroke="#c96a5a" stroke-width="1.8"/>
    <text x="727" y="490" font-size="11" fill="#45703a">两端增删 O(1)（头尾各留空间）</text>
    <text x="727" y="514" font-size="11" fill="#6b675e">随机访问 O(1)（两跳定位）</text>
    <text x="727" y="538" font-size="11" fill="#6b675e">sizeof=48（中控最胖——结构换双端）</text>
    <text x="727" y="564" font-size="10.5" fill="#8a8578">（array 不画了：就是裸数组——20 字节本体）</text>
  </g>
</svg>
